<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Üretim Onayı · Rota SMI</title>
<link rel="icon" href="/icons/icon-192-v2.png">
<style>
:root{--navy:#0c1320;--blue:#1d4ed8;--slate:#475569;--slate3:#cbd5e1;--line:#e2e8f0;--green:#16a34a;--amber:#b45309;--red:#b91c1c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,Segoe UI,system-ui,sans-serif;background:#f1f5f9;color:#0f172a;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:18px 14px 60px}
.brand{text-align:center;padding:18px 0 10px}
.brand img{height:62px;width:auto;object-fit:contain}
.brand .sub{margin-top:9px;font-size:15.5px;letter-spacing:.4px;color:var(--navy);font-weight:800;text-transform:uppercase}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 18px rgba(15,23,42,.06);overflow:hidden;margin-top:14px}
.card-hd{background:var(--navy);color:#fff;padding:16px 18px}
.card-hd h1{font-size:17px;font-weight:700}
.card-hd .no{font-size:12.5px;opacity:.8;margin-top:3px}
.card-bd{padding:16px 18px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.row:last-child{border-bottom:none}
.row .k{color:var(--slate);font-weight:500}
.row .v{font-weight:700;text-align:right}
.sec-t{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--slate);margin:6px 0 6px;display:flex;align-items:center;gap:7px}
.sec-t::before{content:"";width:14px;height:2px;background:var(--blue);border-radius:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--slate);font-weight:700;padding:7px 6px;border-bottom:2px solid var(--line)}
th.n,td.n{text-align:right}
td{padding:9px 6px;border-bottom:1px solid #f1f5f9;font-weight:600}
td .code{font-weight:700}
.deliv{background:#eff6ff;border:1px solid #dbeafe;border-radius:10px;padding:13px 15px;margin-top:14px}
.deliv .dl-d{font-size:12px;color:#1e40af;font-weight:600;margin-bottom:2px}
.deliv .dl-v{font-size:20px;font-weight:800;color:#1e3a8a}
.deliv .dl-x{font-size:12.5px;color:var(--slate);margin-top:5px}
.ask{margin-top:18px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:15px}
.ask .at{font-size:14px;font-weight:800;color:var(--navy);margin-bottom:3px}
.ask .ah{font-size:12.5px;color:var(--slate);margin-bottom:13px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.names button{border:1.5px solid #c7d2fe;background:#eef2ff;color:#1e3a8a;border-radius:10px;padding:14px 10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:.12s}
.names button:active{transform:translateY(1px)}
.names button:hover{background:#e0e7ff;border-color:#a5b4fc}
.freebox{display:flex;gap:9px;margin-top:4px}
.freebox input{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:13px;font-size:15px;font-family:inherit}
.freebox button{border:none;background:var(--green);color:#fff;border-radius:10px;padding:13px 18px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
.note{font-size:11.5px;color:var(--slate);text-align:center;margin-top:14px;line-height:1.6}
.state{text-align:center;padding:46px 22px}
.state .ic{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:38px}
.state h2{font-size:20px;font-weight:800;margin-bottom:7px}
.state p{font-size:14px;color:var(--slate);max-width:330px;margin:0 auto;line-height:1.6}
.spin{width:40px;height:40px;border:4px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;margin:60px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.ftr{text-align:center;font-size:12px;color:var(--slate);margin-top:30px;letter-spacing:.3px;font-weight:500}
</style>
<script>window.__PA_MOD='siparis';</script>
<script type="module" src="/portal-auth.js"></script>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img src="/rota-smi.png" alt="Rota SMI" onerror="this.style.display='none'">
    <div class="sub">Üretim Onayı</div>
  </div>
  <div id="app"><div class="spin"></div></div>
  <div class="ftr">© Rota SMI Tarım · Üretim onay sayfası</div>
</div>

<script type="module">
import { initializeApp } from "/vendor/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "/vendor/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "/vendor/firebasejs/10.12.0/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyB-eY1jv-HYfrNxzrhWS9sywLBFQarpLD8",authDomain:"rota-yem.firebaseapp.com",projectId:"rota-yem",storageBucket:"rota-yem.firebasestorage.app",messagingSenderId:"186408871052",appId:"1:186408871052:web:65791c132b2c1b525307a9"};
const app=initializeApp(firebaseConfig), db=getFirestore(app);
const __pAuth=getAuth();
await new Promise(r=>{const un=onAuthStateChanged(__pAuth,u=>{un();r(u);});}); // oturum yüklenmeden Firestore'a istek atma (kurallar için)
const FABREF=doc(db,'apps','fabrikaonay');

const KADEME={fabrika:'Fabrika Teslim',yakin:'Yakın Bayi Satış',uzak:'Uzak Bayi Satış'};
const AYTR=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const GUNTR=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const APP=document.getElementById('app');
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtN(n){n=+n||0;return n.toLocaleString('tr-TR',{maximumFractionDigits:2})}
function fmtDate(iso){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||''));return m?(m[3]+'.'+m[2]+'.'+m[1]):'—'}
function tdLong(iso){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||''));if(!m)return '—';const dt=new Date(+m[1],+m[2]-1,+m[3]);return (+m[3])+' '+AYTR[+m[2]-1]+' '+m[1]+' '+GUNTR[dt.getDay()];}
function qs(k){return new URLSearchParams(location.search).get(k)||''}
function stateView(ic,bg,col,title,msg){APP.innerHTML=`<div class="card"><div class="state"><div class="ic" style="background:${bg};color:${col}">${ic}</div><h2>${esc(title)}</h2><p>${msg}</p></div></div>`;}

let ORDER=null, META={};
function tgSend(text){(async function(){try{var idt=window.PortalAuth?await PortalAuth.token():null;if(!idt)return;await fetch('https://us-central1-rota-yem.cloudfunctions.net/tgGonder',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+idt},body:JSON.stringify({text:text})});}catch(e){}})();}

async function load(){
  const t=qs('t');
  if(!t){stateView('!','#fef3c7','#b45309','Geçersiz Bağlantı','Onay bağlantısı eksik. Lütfen Telegram mesajındaki butonu kullanın.');return;}
  let data;
  try{const snap=await getDoc(doc(db,'apps','siparis'));data=snap.exists()?snap.data().data:null;}
  catch(e){stateView('⚠','#fee2e2','#b91c1c','Bağlantı Hatası','Sipariş bilgilerine ulaşılamadı. Birkaç dakika sonra tekrar deneyin.');return;}
  let DBO=null; try{DBO=JSON.parse((data&&data['rota_so_v1'])||'null');}catch(e){}
  META=(DBO&&DBO.meta)||{};
  const o=DBO&&Array.isArray(DBO.orders)?DBO.orders.find(x=>x.onayToken===t):null;
  if(!o){stateView('?','#fef3c7','#b45309','Sipariş Bulunamadı','Bu bağlantıya ait sipariş bulunamadı.');return;}
  ORDER=o;
  let prev=null;
  try{const fs=await getDoc(FABREF);if(fs.exists())prev=(fs.data()||{})[o.id]||null;}catch(e){}
  if((o.fabrikaOnay&&o.fabrikaOnay.by)||(prev&&prev.by)){
    const who=(o.fabrikaOnay&&o.fabrikaOnay.by)||(prev&&prev.by)||'';
    stateView('✅','#dcfce7','#16a34a','Zaten Onaylandı',('Bu sipariş <b>'+esc(who)+'</b> tarafından üretim için onaylanmış. Tekrar onaya gerek yok.'));return;
  }
  render(o,(DBO&&DBO.opts&&DBO.opts.fabrikaCalisan)||[]);
}

function render(o,kisiler){
  const rows=(o.lines||[]).map(l=>`<tr><td><span class="code">${esc(l.code)}</span></td><td class="n" style="font-size:15px;color:#1e3a8a">${fmtN(l.qty)}</td></tr>`).join('');
  const namesHtml = kisiler.length
    ? `<div class="names">${kisiler.map(n=>`<button onclick="window.__pick(${JSON.stringify(esc(n))})">${esc(n)}</button>`).join('')}</div>`
    : `<div class="freebox"><input id="freeName" placeholder="Adınızı yazın" autocomplete="off"><button onclick="window.__pickFree()">Onayla</button></div>`;
  APP.innerHTML=`
  <div class="card">
    <div class="card-hd">
      <h1>${esc(o.customer||'Sipariş')}</h1>
      <div class="no">Sipariş No #${esc(o.no||'')} · ${fmtDate(o.date)}</div>
    </div>
    <div class="card-bd">
      <div class="sec-t">Üretilecek Ürünler</div>
      <table><thead><tr><th>Ürün</th><th class="n">Miktar (çuval)</th></tr></thead><tbody>${rows||'<tr><td colspan="2">—</td></tr>'}</tbody></table>
      <div class="deliv">
        <div class="dl-d">Teslim Tarihi</div>
        <div class="dl-v">${tdLong(o.teslimTarihi)}</div>
        <div class="dl-x">${esc(KADEME[o.fiyatKademe]||'Teslim')}${o.kargo?(' · '+esc(o.kargo)):''}</div>
      </div>
      ${o.onayNot?`<div class="row" style="margin-top:8px;color:#b45309"><span class="k">Önemli Not</span><span class="v">${esc(o.onayNot)}</span></div>`:''}
      <div class="ask">
        <div class="at">Bu siparişin üretimini onaylıyorsunuz</div>
        <div class="ah">Lütfen onaylayan kişiyi seçin (kim onaylıyor?):</div>
        ${namesHtml}
      </div>
      <div class="note">Onayınızla siparişin durumu “Onaylandı”ya geçer ve Telegram grubuna bilgi düşer.</div>
    </div>
  </div>`;
}

window.__pickFree=function(){const el=document.getElementById('freeName');const v=el?el.value.trim():'';if(!v){alert('Lütfen adınızı yazın.');return;}submit(v);};
window.__pick=function(name){submit(name);};

async function submit(by){
  const o=ORDER;if(!o)return;
  if(!confirm(by+' olarak bu siparişin üretimini onaylıyorsunuz.\n\nOnaylıyor musunuz?'))return;
  APP.innerHTML='<div class="spin"></div>';
  try{
    await setDoc(FABREF,{[o.id]:{by:by,ts:new Date().toISOString(),no:o.no||''}},{merge:true});
  }catch(e){
    stateView('⚠','#fee2e2','#b91c1c','Gönderilemedi','Onay kaydedilemedi. İnternet bağlantınızı kontrol edip tekrar deneyin.');return;
  }
  const cust=null;
  const lines=(o.lines||[]).map(l=>'• '+l.code+': '+fmtN(l.qty)+' çuval').join('\n');
  tgSend('✅ FABRİKA ONAYI — ÜRETİME BAŞLANSIN\n\n🧾 Sipariş: #'+(o.no||'')+'\n👤 Müşteri: '+(o.customer||'—')+'\n📅 Teslim: '+(o.teslimTarihi?tdLong(o.teslimTarihi):'—')+'\n\nÜrünler:\n'+lines+'\n\n🏭 Onaylayan: '+by);
  stateView('✅','#dcfce7','#16a34a','Onaylandı!','Sipariş üretim için onaylandı. Durumu “Onaylandı”ya geçti, ekip bilgilendirildi. Teşekkürler '+esc(by)+'.');
}

load();
</script>
</body>
</html>
