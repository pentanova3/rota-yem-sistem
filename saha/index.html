<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#0c2340"><link rel="apple-touch-icon" href="/icons/apple-touch-icon-v2.png"><link rel="icon" type="image/png" href="/icons/icon-192-v2.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Rota SMI">
<title>Bayi & Teknik Danışman · Rota</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue-900:#0C2340;--blue-800:#103561;--blue-700:#174B82;--blue-600:#1D62A8;--blue-500:#2878C8;--blue-400:#4A9AE5;--blue-300:#8DC2F2;--blue-200:#C1DEF7;--blue-100:#E8F1FB;--blue-50:#F3F8FD;
  --slate-900:#0F172A;--slate-800:#1E293B;--slate-700:#334155;--slate-600:#475569;--slate-500:#64748B;--slate-400:#94A3B8;--slate-300:#CBD5E1;--slate-200:#E2E8F0;--slate-100:#F1F5F9;--slate-50:#F8FAFC;
  --green-600:#16A34A;--green-100:#DCFCE7;--green-700:#15803D;
  --amber-500:#F59E0B;--amber-100:#FEF3C7;--amber-700:#B45309;
  --red-500:#EF4444;--red-100:#FEE2E2;--red-700:#B91C1C;
  --purple:#7C3AED;
  --font:'Inter',system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--font);background:var(--slate-100);color:var(--slate-800);line-height:1.4}
.hidden{display:none!important}
button,input,select{font-family:inherit}
.num{font-variant-numeric:tabular-nums}
/* topbar */
.topbar{background:#fff;border-bottom:1px solid var(--slate-200);padding:12px 22px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.topbar .brand{display:flex;align-items:center;gap:11px;margin-right:auto}
.topbar .brand img{height:34px}
.topbar .brand .t1{font-size:15px;font-weight:700;color:var(--slate-900);line-height:1.1}
.topbar .brand .t2{font-size:11px;color:var(--slate-500)}
.back-link{font-size:12px;color:var(--slate-500);text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.back-link:hover{color:var(--blue-600)}
.btn{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--slate-300);background:#fff;color:var(--slate-700);display:inline-flex;align-items:center;gap:6px;transition:.12s}
.btn:hover{background:var(--slate-50)}
.btn-pri{background:var(--blue-600);color:#fff;border-color:var(--blue-600)}
.btn-pri:hover{background:var(--blue-700)}
.btn-sm{padding:5px 10px;font-size:12px}
/* tabs */
.tabs{background:#fff;border-bottom:1px solid var(--slate-200);padding:0 22px;display:flex;gap:4px;position:sticky;top:59px;z-index:19;overflow-x:auto}
.tab{padding:12px 16px;font-size:13.5px;font-weight:600;color:var(--slate-500);border-bottom:2.5px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:7px;background:none;border-top:none;border-left:none;border-right:none;white-space:nowrap}
.tab:hover{color:var(--slate-700)}
.tab.active{color:var(--blue-700);border-bottom-color:var(--blue-600)}
.wrap{max-width:1320px;margin:0 auto;padding:18px 22px 60px}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--slate-200);border-radius:10px;padding:13px 16px;border-top:3px solid var(--blue-600)}
.kpi .kl{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--slate-500);margin-bottom:6px}
.kpi .kv{font-size:20px;font-weight:700;color:var(--slate-900);line-height:1}
.kpi .ks{font-size:11px;color:var(--slate-500);margin-top:5px}
.kpi.g{border-top-color:var(--green-600)}.kpi.p{border-top-color:var(--purple)}.kpi.a{border-top-color:var(--amber-500)}
/* card */
.card{background:#fff;border:1px solid var(--slate-200);border-radius:11px;margin-bottom:18px;overflow:hidden}
.card-hd{padding:13px 18px;border-bottom:1px solid var(--slate-100);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-hd h3{font-size:14px;font-weight:700;color:var(--slate-800)}
.card-hd .hint{font-size:11px;color:var(--slate-400)}
/* map */
.maplayout{display:grid;grid-template-columns:1fr 330px;gap:18px;align-items:start}
@media(max-width:980px){.maplayout{grid-template-columns:1fr}}
.mapbox{background:#fff;border:1px solid var(--slate-200);border-radius:11px;padding:10px}
.mapwrap{position:relative;width:100%}
svg.trmap{width:100%;height:auto;display:block}
svg.trmap .il{fill:#E2E8F0;stroke:#fff;stroke-width:.6;transition:fill .15s,transform .12s;cursor:pointer}
svg.trmap .il:hover{fill:#CBD5E1}
svg.trmap .il.has{fill:#5B9BD5}
svg.trmap .il.has.t2{fill:#2878C8}svg.trmap .il.has.t3{fill:#1D62A8}svg.trmap .il.has.t4{fill:#103561}
svg.trmap .il.sel{fill:#0C2340!important}
svg.trmap .il:hover{transform:scale(1.05);transform-box:fill-box;transform-origin:center;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
svg.trmap .mk{pointer-events:none}
svg.trmap .mk circle{fill:#0C2340;stroke:#fff;stroke-width:1.2}
svg.trmap .mk text{fill:#fff;font:700 11px Inter,sans-serif;text-anchor:middle;dominant-baseline:central}
.maptip{position:absolute;background:var(--slate-900);color:#fff;font-size:12px;font-weight:600;padding:5px 10px;border-radius:7px;pointer-events:none;opacity:0;transition:opacity .1s;white-space:nowrap;z-index:5;transform:translate(-50%,-130%)}
.maptip.on{opacity:1}
.maptip .c{color:var(--blue-300);font-weight:700}
.maplegend{display:flex;gap:14px;flex-wrap:wrap;padding:8px 6px 2px;font-size:11.5px;color:var(--slate-500);align-items:center}
.maplegend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
/* detay panel */
.detail{background:#fff;border:1px solid var(--slate-200);border-radius:11px;position:sticky;top:120px;overflow:hidden}
.detail-hd{padding:14px 16px;background:var(--blue-900);color:#fff;display:flex;align-items:center;gap:10px}
.detail-hd .dt{font-size:15px;font-weight:700}
.detail-hd .dc{margin-left:auto;font-size:12px;background:rgba(255,255,255,.15);padding:3px 9px;border-radius:20px;font-weight:700}
.detail-bd{max-height:440px;overflow-y:auto}
.dealer{padding:12px 16px;border-bottom:1px solid var(--slate-100)}
.dealer:last-child{border-bottom:none}
.dealer .dn{font-size:13.5px;font-weight:700;color:var(--slate-900)}
.dealer .dm{font-size:11.5px;color:var(--slate-500);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.detail-empty{padding:40px 20px;text-align:center;color:var(--slate-400);font-size:13px}
.detail-empty svg{width:40px;height:40px;margin-bottom:10px;color:var(--slate-300)}
/* tablo */
.tbl-scroll{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;min-width:760px;font-size:12.5px}
table.t th,table.t td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--slate-100)}
table.t thead th{background:var(--slate-50);font-size:11px;font-weight:700;color:var(--slate-600);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
table.t tbody tr:hover{background:var(--blue-50)}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.tag-bayi{background:var(--blue-100);color:var(--blue-800)}.tag-dan{background:#EDE9FE;color:var(--purple)}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.b-on{background:var(--green-100);color:var(--green-700)}.b-off{background:var(--slate-200);color:var(--slate-500)}
.rate{font-weight:700;color:var(--slate-800)}
.lock-note{font-size:11.5px;color:var(--amber-700);background:var(--amber-100);border:1px solid #fde68a;border-radius:8px;padding:8px 12px;margin-bottom:14px;display:flex;align-items:center;gap:7px}
.empty{padding:30px;text-align:center;color:var(--slate-400);font-size:13px}
.iconbtn{border:none;background:transparent;cursor:pointer;color:var(--slate-400);padding:3px;border-radius:5px;line-height:0}
.iconbtn:hover{background:var(--slate-100);color:var(--slate-700)}
.iconbtn.del:hover{color:var(--red-700)}
.rowact{display:flex;gap:4px;opacity:0;transition:.1s}
table.t tbody tr:hover .rowact{opacity:1}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 18px;overflow-y:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:520px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5)}
.modal-hd{padding:16px 22px;border-bottom:1px solid var(--slate-100);display:flex;align-items:center;justify-content:space-between}
.modal-hd h3{font-size:16px;font-weight:700}
.modal-bd{padding:18px 22px}.modal-ft{padding:14px 22px;border-top:1px solid var(--slate-100);display:flex;justify-content:flex-end;gap:10px}
.fld{margin-bottom:14px}.fld label{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--slate-500);margin-bottom:5px}
.fld input,.fld select{width:100%;padding:9px 12px;border:1px solid var(--slate-300);border-radius:8px;font-size:13.5px;color:var(--slate-800)}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--blue-500);box-shadow:0 0 0 3px var(--blue-100)}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.xbtn{border:none;background:transparent;font-size:22px;color:var(--slate-400);cursor:pointer}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--slate-900);color:#fff;padding:10px 18px;border-radius:9px;font-size:13px;z-index:200;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}

function byPlate(){
  const m={};let unmatched=[];
  bayiList().forEach(b=>{const p=cityToPlate(b.city);if(p){(m[p]=m[p]||[]).push(b);}else if(b.active!==false){unmatched.push(b);}});
  return {m,unmatched};
}

// ---- sekme ----
function setTab(t){
  tab=t;selPlate=null;
  ['harita','musteri','firsat','liste','sozlesme'].forEach(x=>document.getElementById('tab-'+x).classList.toggle('active',t===x));
  document.getElementById('newBtn').style.display='none';
  render();
}
function icerikYaz(h){
  var el=document.getElementById('content');
  el.innerHTML=h;
  try{if(window.tabloArac)tabloArac.bagla(el,{view:'saha-'+(tab||'x')});}catch(e){}
}
function render(){
  if(MUSTERILER===null&&(tab==='musteri'||tab==='firsat')){icerikYaz('<div class="empty">Sipariş Takip\'ten müşteri verileri yükleniyor…</div>');return;}
  if(tab==='harita')return renderHarita();
  if(tab==='musteri')return renderMusteriHarita();
  if(tab==='firsat')return renderFirsat();
  if(tab==='liste')return renderListe();
  if(tab==='sozlesme')return renderSozlesme();
}

// ====== HARİTA ======
function renderHarita(){
  const {m,unmatched}=byPlate();
  const ilSayisi=Object.keys(m).length;
  const bayiToplam=bayiList().length;
  const danToplam=(BAYILER||[]).filter(k=>k.type==='danisman').length;
  let h=`<div class="kpis">
    <div class="kpi"><div class="kl">Toplam Bayi</div><div class="kv">${bayiToplam}</div><div class="ks">${ilSayisi} ilde</div></div>
    <div class="kpi p"><div class="kl">Teknik Danışman</div><div class="kv">${danToplam}</div><div class="ks">kayıtlı</div></div>
    <div class="kpi g"><div class="kl">Kapsanan İl</div><div class="kv">${ilSayisi}<span style="font-size:13px;color:var(--slate-400)"> / 81</span></div><div class="ks">bayi olan il</div></div>
    <div class="kpi a"><div class="kl">Eşleşmeyen</div><div class="kv">${unmatched.length}</div><div class="ks">şehri belirsiz</div></div>
  </div>`;
  h+=`<div class="maplayout"><div class="mapbox"><div class="mapwrap" id="mapwrap">${buildSvg(m)}<div class="maptip" id="maptip"></div></div>
    <div class="maplegend"><span><i style="background:#E2E8F0"></i>Bayi yok</span><span><i style="background:#5B9BD5"></i>1</span><span><i style="background:#2878C8"></i>2</span><span><i style="background:#1D62A8"></i>3-4</span><span><i style="background:#103561"></i>5+</span><span style="margin-left:auto;color:var(--slate-400)">İl üzerine gel · tıkla → bayileri gör</span></div>
  </div>
  <div id="detail">${detailHtml(selPlate,m)}</div></div>`;
  if(unmatched.length)h+=`<div class="card"><div class="card-hd"><h3>Şehri Eşleşmeyen Bayiler</h3><span class="hint">Sipariş Takip'te şehir alanını düzeltin</span></div><div style="padding:10px 16px;font-size:12.5px;color:var(--slate-600)">${unmatched.map(b=>`${esc(b.name)} <span style="color:var(--slate-400)">(${esc(b.city||'şehir yok')})</span>`).join(' · ')}</div></div>`;
  icerikYaz(h);
  wireMap(renderHarita,el=>{const n=+el.dataset.n;return esc(el.dataset.ad)+(n?` · <span class="c">${n} bayi</span>`:' · bayi yok');});
}
function tier(n){return n>=5?'t4':n>=3?'t3':n>=2?'t2':''}
function buildSvg(m){
  let paths='',marks='';
  Object.keys(PROV).forEach(p=>{
    const pr=PROV[p];const n=(m[p]||[]).length;
    const cls='il'+(n?' has '+tier(n):'')+(p===selPlate?' sel':'');
    paths+=`<path class="${cls}" data-plate="${p}" data-ad="${esc(pr.ad)}" data-n="${n}" d="${pr.path}"></path>`;
    if(n){const r=n>=5?11:n>=2?9.5:8.5;marks+=`<g class="mk"><circle cx="${pr.cx}" cy="${pr.cy}" r="${r}"></circle><text x="${pr.cx}" y="${pr.cy}">${n}</text></g>`;}
  });
  return `<svg class="trmap" viewBox="0 0 1000 422" xmlns="http://www.w3.org/2000/svg">${paths}${marks}</svg>`;
}
function wireMap(rerender,tipFn){
  const tip=document.getElementById('maptip');const wrap=document.getElementById('mapwrap');
  wrap.querySelectorAll('path.il').forEach(el=>{
    el.addEventListener('mousemove',e=>{const r=wrap.getBoundingClientRect();tip.style.left=(e.clientX-r.left)+'px';tip.style.top=(e.clientY-r.top)+'px';tip.innerHTML=tipFn(el);tip.classList.add('on');el.parentNode.appendChild(el);});
    el.addEventListener('mouseleave',()=>tip.classList.remove('on'));
    el.addEventListener('click',()=>{selPlate=el.dataset.plate;rerender();});
  });
}
function detailHtml(plate,m){
  if(!plate||!m[plate]||!m[plate].length){
    return `<div class="detail"><div class="detail-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg><div>Haritadan bir il seçin,<br>oradaki bayileri görün.</div></div></div>`;
  }
  const list=m[plate];
  return `<div class="detail"><div class="detail-hd"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg><span class="dt">${esc(PROV[plate].ad)}</span><span class="dc">${list.length} bayi</span></div>
    <div class="detail-bd">${list.map(b=>`<div class="dealer"><div class="dn">${esc(b.name)}</div><div class="dm">
      <span class="tag tag-bayi">BAYİ</span>
      ${(+b.ozelIskonto>0&&+b.rate>0)?`<span class="rate">%${esc(b.ozelIskonto)} özel + %${esc(b.rate)} iskonto</span>`:(b.ozelIskonto?`<span class="rate">%${esc(b.ozelIskonto)} özel iskonto</span>`:(b.rate?`<span class="rate">%${esc(b.rate)} iskonto</span>`:''))}
      ${b.city?`<span>📍 ${esc(b.city)}</span>`:''}
      ${b.phone?`<a href="tel:${esc(String(b.phone).replace(/\s/g,''))}" style="color:#174B82;text-decoration:none;font-weight:700">📞 ${esc(b.phone)}</a>`:''}
      <span class="badge ${b.active!==false?'b-on':'b-off'}">${b.active!==false?'Aktif':'Pasif'}</span>
    </div>${(function(){const adr=b.adres||(b.sz&&b.sz.adres)||'';return adr?`<div class="dm" style="margin-top:4px"><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(adr+' '+(b.city||''))}" target="_blank" rel="noopener" title="Google Haritalar'da aç" style="color:#475569;text-decoration:underline dotted">📍 ${esc(adr)}</a></div>`:'';})()}</div>`).join('')}</div></div>`;
}

// ====== MÜŞTERİ HARİTASI (Görev 2) ======
function musteriList(){return (MUSTERILER||[]);}
function musteriByPlate(){const m={};let unmatched=[];musteriList().forEach(c=>{const p=cityToPlate(c.city);if(p){(m[p]=m[p]||[]).push(c);}else unmatched.push(c);});return {m,unmatched};}
function musteriFill(n){return n>=5?'#14532D':n>=3?'#16A34A':n>=2?'#4ADE80':n>=1?'#86EFAC':'#E2E8F0';}
function buildSvgC(plateData,opt){
  let paths='',marks='';
  Object.keys(PROV).forEach(p=>{
    const pr=PROV[p];const n=plateData[p]||0;const fill=opt.fill(n,p);const selCls=(p===selPlate)?' sel':'';
    paths+=`<path class="il${selCls}" data-plate="${p}" data-ad="${esc(pr.ad)}" data-n="${n}" style="fill:${fill}" d="${pr.path}"></path>`;
    if(opt.markerShow(n,p)){const r=n>=5?11:n>=2?9.5:8.5;marks+=`<g class="mk"><circle cx="${pr.cx}" cy="${pr.cy}" r="${r}" style="fill:${opt.markerFill(p)}"></circle><text x="${pr.cx}" y="${pr.cy}">${n}</text></g>`;}
  });
  return `<svg class="trmap" viewBox="0 0 1000 422" xmlns="http://www.w3.org/2000/svg">${paths}${marks}</svg>`;
}
function renderMusteriHarita(){
  const {m,unmatched}=musteriByPlate();
  const ilSayisi=Object.keys(m).length;const toplam=musteriList().length;
  const toplamSiparis=musteriList().reduce((s,c)=>s+(+c.orderCount||0),0);
  const counts={};Object.keys(m).forEach(p=>counts[p]=m[p].length);
  let h=`<div class="kpis">
    <div class="kpi g"><div class="kl">Toplam Müşteri</div><div class="kv">${toplam}</div><div class="ks">${ilSayisi} ilde</div></div>
    <div class="kpi"><div class="kl">Kapsanan İl</div><div class="kv">${ilSayisi}<span style="font-size:13px;color:var(--slate-400)"> / 81</span></div><div class="ks">müşteri olan il</div></div>
    <div class="kpi p"><div class="kl">Toplam Sipariş</div><div class="kv">${toplamSiparis}</div><div class="ks">tüm müşteriler</div></div>
    <div class="kpi a"><div class="kl">İli Eşleşmeyen</div><div class="kv">${unmatched.length}</div><div class="ks">il seçilmemiş</div></div>
  </div>`;
  h+=`<div class="maplayout"><div class="mapbox"><div class="mapwrap" id="mapwrap">${buildSvgC(counts,{fill:musteriFill,markerFill:()=>'#14532D',markerShow:n=>n>0})}<div class="maptip" id="maptip"></div></div>
    <div class="maplegend"><span><i style="background:#E2E8F0"></i>Müşteri yok</span><span><i style="background:#86EFAC"></i>1</span><span><i style="background:#4ADE80"></i>2</span><span><i style="background:#16A34A"></i>3-4</span><span><i style="background:#14532D"></i>5+</span><span style="margin-left:auto;color:var(--slate-400)">İl üzerine gel · tıkla → müşterileri gör</span></div>
  </div>
  <div id="detail">${musteriDetailHtml(selPlate,m)}</div></div>`;
  if(unmatched.length)h+=`<div class="card"><div class="card-hd"><h3>İli Eşleşmeyen Müşteriler</h3><span class="hint">Sipariş Takip → Müşteriler'de il seçin</span></div><div style="padding:10px 16px;font-size:12.5px;color:var(--slate-600)">${unmatched.slice(0,80).map(c=>`${esc(c.name)} <span style="color:var(--slate-400)">(${esc(c.city||'il yok')})</span>`).join(' · ')}${unmatched.length>80?' …':''}</div></div>`;
  icerikYaz(h);
  wireMap(renderMusteriHarita,el=>{const n=+el.dataset.n;return esc(el.dataset.ad)+(n?` · <span class="c">${n} müşteri</span>`:' · müşteri yok');});
}
function musteriDetailHtml(plate,m){
  const PIN='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>';
  if(!plate||!m[plate]||!m[plate].length){
    return `<div class="detail"><div class="detail-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg><div>Haritadan bir il seçin,<br>oradaki müşterileri görün.</div></div></div>`;
  }
  const list=[...m[plate]].sort((a,b)=>(+b.orderCount||0)-(+a.orderCount||0));
  return `<div class="detail"><div class="detail-hd" style="background:#14532D">${PIN}<span class="dt">${esc(PROV[plate].ad)}</span><span class="dc">${list.length} müşteri</span></div>
    <div class="detail-bd">${list.map(c=>`<div class="dealer"><div class="dn">${esc(c.name)}</div><div class="dm">
      ${c.firma?`<span class="tag tag-bayi">${esc(c.firma)}</span>`:''}
      ${c.orderCount?`<span class="rate">${c.orderCount} sipariş</span>`:''}
      ${c.city?`<span>📍 ${esc(c.city)}</span>`:''}
      ${c.phone?`<a href="tel:${esc(String(c.phone).replace(/\s/g,''))}" style="color:#174B82;text-decoration:none;font-weight:700">📞 ${esc(c.phone)}</a>`:''}
    </div>${c.adres?`<div class="dm" style="margin-top:4px"><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.adres+' '+(c.city||''))}" target="_blank" rel="noopener" title="Google Haritalar'da aç" style="color:#475569;text-decoration:underline dotted">📍 ${esc(c.adres)}</a></div>`:''}</div>`).join('')}</div></div>`;
}

// ====== BAYİ FIRSATI (Görev 3 — bayi yok, müşteri var) ======
function firsatFill(n){return n>=5?'#7C2D12':n>=3?'#C2410C':n>=2?'#EA580C':'#FB923C';}
function firsatData(){
  const bayi=byPlate().m;const mus=musteriByPlate().m;const rows=[];
  Object.keys(mus).forEach(p=>{
    if(((bayi[p]||[]).length)===0){const list=mus[p];rows.push({plate:p,ad:PROV[p].ad,adet:list.length,vol:list.reduce((s,c)=>s+(+c.orderCount||0),0),list});}
  });
  const maxA=Math.max(1,...rows.map(r=>r.adet)),maxV=Math.max(1,...rows.map(r=>r.vol));
  rows.forEach(r=>{r.skor=Math.round((r.adet/maxA)*60+(r.vol/maxV)*40);});
  rows.sort((a,b)=>b.skor-a.skor||b.adet-a.adet||b.vol-a.vol);
  return rows;
}
function renderFirsat(){
  const rows=firsatData();
  const toplamMus=rows.reduce((s,r)=>s+r.adet,0),toplamVol=rows.reduce((s,r)=>s+r.vol,0),top=rows[0];
  const bayiSet={};Object.keys(byPlate().m).forEach(p=>bayiSet[p]=1);
  const oppCount={};rows.forEach(r=>oppCount[r.plate]=r.adet);
  const musMap=musteriByPlate().m;
  let h=`<div class="kpis">
    <div class="kpi a"><div class="kl">Fırsat İli</div><div class="kv">${rows.length}</div><div class="ks">bayi yok · müşteri var</div></div>
    <div class="kpi g"><div class="kl">Fırsat Müşterisi</div><div class="kv">${toplamMus}</div><div class="ks">bayisiz illerde</div></div>
    <div class="kpi p"><div class="kl">Sipariş Hacmi</div><div class="kv">${toplamVol}</div><div class="ks">bu illerde toplam</div></div>
    <div class="kpi"><div class="kl">En Yüksek Fırsat</div><div class="kv" style="font-size:16px">${top?esc(top.ad):'—'}</div><div class="ks">${top?top.adet+' müşteri':'veri yok'}</div></div>
  </div>`;
  h+=`<div class="card" style="background:linear-gradient(135deg,#0C2340,#174B82);border:none;color:#fff"><div style="padding:17px 22px">
    <div style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#9fc0e6">Bayi Açma Fırsatı — Yönetim Kurulu Özeti</div>
    <div style="font-size:13.5px;line-height:1.6;margin-top:8px"><b>${rows.length} ilde</b> bayimiz yok ancak <b>${toplamMus} müşteri</b> ve <b>${toplamVol} sipariş</b> mevcut.${top?` En yüksek fırsat <b style="color:#f1cd86">${esc(top.ad)}</b> — ${top.adet} müşteri, ${top.vol} sipariş, fırsat skoru <b>${top.skor}/100</b>.`:''} İller müşteri yoğunluğu (%60) ve sipariş hacmine (%40) göre önceliklendirildi.</div>
  </div></div>`;
  h+=`<div class="maplayout"><div class="mapbox"><div class="mapwrap" id="mapwrap">${buildSvgC(oppCount,{fill:(n,p)=>oppCount[p]?firsatFill(oppCount[p]):(bayiSet[p]?'#C7D2DE':'#EEF2F6'),markerFill:()=>'#7C2D12',markerShow:(n,p)=>!!oppCount[p]})}<div class="maptip" id="maptip"></div></div>
    <div class="maplegend"><span><i style="background:#C7D2DE"></i>Bayi var (kapsanmış)</span><span><i style="background:#FB923C"></i>Fırsat 1</span><span><i style="background:#EA580C"></i>2</span><span><i style="background:#C2410C"></i>3-4</span><span><i style="background:#7C2D12"></i>5+</span><span style="margin-left:auto;color:var(--slate-400)">Turuncu = bayi yok, müşteri var</span></div>
  </div><div id="detail">${musteriDetailHtml(selPlate,musMap)}</div></div>`;
  h+=`<div class="card"><div class="card-hd"><h3>Bayi Açma Önceliği</h3><span class="hint">müşteri yoğunluğuna göre sıralı</span></div>`;
  if(!rows.length){h+=`<div class="empty">Bayisi olmayan ama müşterisi olan il bulunamadı. (Müşteri illeri eksikse Sipariş Takip → Müşteriler'den girin.)</div></div>`;}
  else{
    h+=`<div class="tbl-scroll"><table class="t"><thead><tr><th>#</th><th>İl</th><th class="num">Müşteri</th><th class="num">Sipariş Hacmi</th><th>Fırsat Skoru</th><th>Öncelik</th></tr></thead><tbody>`;
    rows.forEach((r,i)=>{const onc=r.skor>=66?['Yüksek','#B91C1C','#FEE2E2']:r.skor>=33?['Orta','#B45309','#FEF3C7']:['Düşük','#475569','#E2E8F0'];
      h+=`<tr style="cursor:pointer" onclick="selPlate='${r.plate}';renderFirsat()"><td class="num" style="color:var(--slate-400)">${i+1}</td><td><b>${esc(r.ad)}</b></td><td class="num"><b>${r.adet}</b></td><td class="num">${r.vol}</td><td><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;min-width:70px;height:7px;background:var(--slate-100);border-radius:5px;overflow:hidden"><i style="display:block;height:100%;width:${r.skor}%;background:#EA580C"></i></div><b style="font-size:11.5px;color:var(--slate-700)">${r.skor}</b></div></td><td><span class="badge" style="background:${onc[2]};color:${onc[1]}">${onc[0]}</span></td></tr>`;});
    h+=`</tbody></table></div></div>`;
  }
  icerikYaz(h);
  wireMap(renderFirsat,el=>{const p=el.dataset.plate;const o=oppCount[p];return esc(el.dataset.ad)+(o?` · <span class="c">${o} müşteri · BAYİ YOK</span>`:(bayiSet[p]?' · bayi var':' · müşteri yok'));});
}


// ====== BAYİ & DANIŞMAN LİSTESİ (salt-okunur, senkron) ======
function renderListe(){
  // Önce bayiler, sonra danışmanlar; her grup kendi içinde Türkçe alfabetik
  const arr=[...(BAYILER||[])].sort((a,b)=>
    (a.type===b.type?0:(a.type==='bayi'?-1:1))
    || String(a.name||'').localeCompare(String(b.name||''),'tr',{sensitivity:'base'}));
  const bayi=arr.filter(k=>k.type==='bayi'),dan=arr.filter(k=>k.type==='danisman');
  let h=`<div class="lock-note"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Bayi & danışmanlar <b>buradan</b> yönetilir. Eklediğin/değiştirdiğin kayıtlar Sipariş Takip'te otomatik görünür.</div>`;
  h+=`<div class="card"><div class="card-hd"><h3>Bayi &amp; Danışman Listesi</h3><div style="display:flex;gap:8px;align-items:center"><span class="hint">${bayi.length} bayi · ${dan.length} danışman</span><button class="btn btn-pri btn-sm" onclick="openKom('bayi')">+ Bayi</button><button class="btn btn-sm" style="background:#7C3AED;color:#fff" onclick="openKom('danisman')">+ Danışman</button></div></div>
    <div class="tbl-scroll"><table class="t"><thead><tr><th>Ad</th><th>Tip</th><th>Şehir</th><th>Danışman</th><th>Plasiyer</th><th>Oran</th><th>Telefon</th><th>Durum</th><th></th></tr></thead><tbody>`;
  if(!arr.length)h+=`<tr><td colspan="9" class="empty">Kayıt yok — + Bayi / + Danışman ile ekleyin.</td></tr>`;
  arr.forEach(k=>{h+=`<tr>
    <td onclick="openKom(null,'${k.id}')" style="cursor:pointer" title="Düzenle / danışman ata"><b style="color:#1d4ed8;border-bottom:1px dashed #93c5fd">${esc(k.name)}</b></td>
    <td><span class="tag ${k.type==='bayi'?'tag-bayi':'tag-dan'}">${k.type==='bayi'?'BAYİ':'DANIŞMAN'}</span></td>
    <td>${esc(k.city||'—')}</td>
    <td>${k.type==='bayi'&&k.danismanId?(function(){var d=(DB.komisyoncular||[]).find(x=>x.id===k.danismanId);return d?`<span class="tag tag-dan" style="font-size:10px">${esc(d.name)}</span>`:'<span style="color:var(--slate-400)">—</span>';})():'<span style="color:var(--slate-300)">—</span>'}</td>
    <td>${k.type==='bayi'&&k.plasiyerId?(function(){var p=plasAdi(k.plasiyerId);return p?`<span class="tag" style="font-size:10px;background:#ECFEFF;color:#0E7490;border:1px solid #A5F3FC">${esc(p)}</span>`:'<span style="color:var(--slate-400)">—</span>';})():'<span style="color:var(--slate-400)">—</span>'}</td>
    <td>${(+k.ozelIskonto>0&&+k.rate>0)?`<span class="rate">%${esc(k.ozelIskonto)} özel + %${esc(k.rate)}</span>`:(k.ozelIskonto?`<span class="rate">%${esc(k.ozelIskonto)} özel</span>`:(k.rate?`<span class="rate">%${esc(k.rate)} iskonto</span>`:'<span style="color:var(--slate-400)">—</span>'))}</td>
    <td>${esc(k.phone||'—')}</td>

function bayiPortalDurum(id){const b=window.BAYI_PORTAL[id];if(!b||b.aktif===false)return {acik:false,rec:b||null};return {acik:true,rec:b};}

function bayiSifreGecerli(p){return typeof p==='string'&&p.length>=8&&/[A-Za-zÇĞİÖŞÜçğıöşü]/.test(p)&&/[0-9]/.test(p);}
function komPortalPayload(id){var k=(DB.komisyoncular||[]).find(x=>x.id===id);var rol=(k&&k.type==='danisman')?'danisman':'bayi';var p={rol};p[rol==='danisman'?'danismanId':'bayiId']=id;return p;}

async function bayiPortalKaydet(id,mevcutAcik){
  const err=document.getElementById('bp-err');
  const pass=(document.getElementById('bp-pass').value||'').trim();
  if(!bayiSifreGecerli(pass)){err.textContent='Geçici şifre en az 8 karakter, harf ve rakam içermeli.';return;}
  const payload=komPortalPayload(id);payload.gecici=pass;
  if(mevcutAcik){payload.islem='sifirla';}
  else{const u=(document.getElementById('bp-user').value||'').trim().toLowerCase();
    if(!/^[a-z0-9._-]{3,30}$/.test(u)){err.textContent='Kullanıcı adı 3-30 karakter; harf, rakam, . _ - olabilir.';return;}
    payload.islem='ac';payload.username=u;}
  err.textContent='Kaydediliyor…';
  try{const j=await window.__bayiYonetim(payload);
    if(!j||!j.ok){err.textContent='Hata: '+((j&&j.hata)||'bilinmiyor');return;}
    closeModal();
    alert('Portal erişimi '+(mevcutAcik?'sıfırlandı':'açıldı')+'.\n\nİlgiliye iletin:\nGiriş: '+BAYI_SITE_URL+'\nKullanıcı adı: '+(j.username||payload.username)+'\nGeçici şifre: '+pass+'\n\nİlk girişte kendi şifresini kuracak (sen göremezsin).');
  }catch(e){err.textContent='Hata: '+e.message;}
}
async function bayiPortalKapat(id){
  if(!confirm('Bu kişinin portal erişimi kapatılsın mı? Giriş yapamaz (kayıt silinmez, sonra tekrar açabilirsin).'))return;
  try{var payload=komPortalPayload(id);payload.islem='kapat';const j=await window.__bayiYonetim(payload);
    if(!j||!j.ok){alert('Hata: '+((j&&j.hata)||'bilinmiyor'));return;}
    closeModal();
  }catch(e){alert('Hata: '+e.message);}
}

function flushKomForm(){
  const o=editKom; if(!o)return false;
  const V=id=>{var e=document.getElementById(id);return e?(e.value||'').trim():'';};
  o.name=V('k_name');

  o.type=document.getElementById('k_type').value;
  o.city=V('k_city');
  o.phone=V('k_phone');
  o.adres=V('k_adres');
  o.rate=parseFloat(document.getElementById('k_rate').value)||0;
  var _oz=document.getElementById('k_ozel');o.ozelIskonto=(o.type==='bayi'&&_oz)?(parseFloat(_oz.value)||0):0;
  var _ot=document.getElementById('k_odemeTipi');
  o.odemeTipi=(_ot&&['dbs','imece'].indexOf(_ot.value)>=0)?_ot.value:'';
  o.note=V('k_note');

  var _pe=document.getElementById('k_plasiyer');o.plasiyerId=(o.type==='bayi'&&_pe)?_pe.value:'';
  const sz={};

    sz.adres=V('s_adres');sz.vergiDairesi=V('s_vd');sz.vergiNo=V('s_vn');sz.ticaretSicil=V('s_ts');sz.mersis=V('s_mersis');
    sz.isTel=V('s_istel');sz.faks=V('s_faks');sz.gsm2=V('s_gsm2');sz.eposta=eposta;sz.iban=V('s_iban');
    sz.teminat=V('s_teminat');sz.odemeSatis=V('s_odeme');sz.yetkili=V('s_yetkili');sz.dusunceler=V('s_dus');
    sz.sozTarih=V('s_tarih');

  return true;
}

  try{

    DB.komisyoncular=DB.komisyoncular||[];

    ex.sz=o.sz; if(o.belgeler)ex.belgeler=o.belgeler;
    BAYILER=DB.komisyoncular; saveSaha(); closeModal(); render();
    // YENİ kayıt: anlaşma yapılır yapılmaz sözleşme paketi hazır olsun (firma isteği 08.08).
    // Düzenlemede sorulmaz — her küçük değişiklikte sözleşme açmak gürültü olurdu.
    if(_yeniKayit&&confirm(ex.name+' kaydı oluşturuldu.\n\nSözleşme paketini şimdi hazırlayalım mı?'))sozlesmePdf(id);
  }catch(e){ alert('Kaydedilemedi: '+(e.message||e)+'\n(Bayi/danışman yönetimi yalnız saha yöneticisi/portal yöneticisi yetkisiyle yapılır.)'); }
}
async function delKom(id){

// SÖZLEŞME PAKETİ — firmanın antetli kağıdına PDF
// Metin saha/sozlesme-metin.js'ten gelir (kaynak: sozlesme-sablonlari/*.docx).
// Kayıtta boş olan alan SİLİNMEZ, noktalı çizgi basılır — belge elle doldurulabilsin.
// ══════════════════════════════════════════════════════════════════════════
function sozBelgeler(type){
  return type==='bayi'
    ? [['bayiSozlesme','BAYİLİK SÖZLEŞMESİ'],['bayiAtama','EK-A'],['kvkk','EK-B']]
    : [['danismanSozlesme','TEKNİK DANIŞMANLIK SÖZLEŞMESİ'],['kvkk','EK']];
}
// Sözleşmenin doldurulması gereken alanları — eksikse kullanıcı UYARILIR, üretim engellenmez.
function sozZorunlu(type){
  return type==='bayi'
    ? [['name','Ünvan / Şirket adı'],['sz.adres','Adres'],['sz.vergiDairesi','Vergi dairesi'],['sz.vergiNo','Vergi no'],
       ['sz.ticaretSicil','Ticaret sicil no'],['sz.yetkili','İmza yetkilisi'],['phone','Telefon'],['sz.eposta','E-posta']]
    : [['name','Ad soyad'],['sz.tcKimlik','T.C. kimlik no'],['sz.adres','Adres'],['phone','Telefon'],
       ['sz.eposta','E-posta'],['sz.iban','IBAN']];
}
function sozAlan(o,yol){var p=yol.split('.');var v=(p.length>1)?((o[p[0]]||{})[p[1]]):o[p[0]];return String(v==null?'':v).trim();}
function sozEksikler(o){return sozZorunlu(o.type).filter(function(z){return !sozAlan(o,z[0]);}).map(function(z){return z[1];});}
function sozVeri(o){
  var sz=o.sz||{}, vdNo=[sz.vergiDairesi,sz.vergiNo].filter(Boolean).join(' / ');
  var yy=sz.yetkililer||[], y1=yy[0]||{}, y2=yy[1]||{};
  return {unvan:o.name,sirketAdi:o.name,adSoyad:o.name,adres:sz.adres||o.adres||'',
    vergiDaireNo:vdNo,vergiDairesi:sz.vergiDairesi||'',vergiNo:sz.vergiNo||'',
    ticaretSicil:sz.ticaretSicil||'',mersis:sz.mersis||'',yetkili:sz.yetkili||'',
    telefon:o.phone||'',gsm1:o.phone||'',gsm2:sz.gsm2||'',isTel:sz.isTel||'',faks:sz.faks||'',
    eposta:sz.eposta||'',iban:sz.iban||'',tcKimlik:sz.tcKimlik||'',
    teminat:sz.teminat||'',odemeSatis:sz.odemeSatis||'',dusunceler:sz.dusunceler||'',
    y1ad:y1.ad||'',y1tc:y1.tc||'',y1gorev:y1.gorev||'',y1tel:y1.tel||'',
    y2ad:y2.ad||'',y2tc:y2.tc||'',y2gorev:y2.gorev||'',y2tel:y2.tel||''};
}
// Yer tutucu doldurma: metin ÖNCE kaçırılır, sonra {alan} yerine kaçırılmış değer konur.
// Boş değer noktalı çizgi olur — sözleşmede boşluk kalması, yanlış değer basmaktan iyidir.
function sozDoldur(metin,V){
  return esc(metin).replace(/\{([a-zA-Z0-9_]+)\}/g,function(m,k){
    var v=V[k];
    return (v==null||v==='') ? '<span class="bosluk">............................</span>' : esc(v);
  });
}
// Madde 1'deki taraf boşluğu: "[…………………..]" → kayıttaki ünvan/ad.
// Ayraç sınıfı YALNIZ nokta/üç-nokta: "[…./…./………]" (tarih) bu desene TAKILMAZ,
// yoksa tarih girilmemiş sözleşmede tarih yerine bayi adı basılırdı.
function sozTarafDoldur(html,ad){
  if(!ad)return html;
  return html.replace(/\[[…\.]{5,}\]/g,'<b>'+esc(ad)+'</b>');
}
// Tarih boşlukları ("....../....../.........." ve "[…./…./………]") — tarih girildiyse doldurulur.
function sozTarihDoldur(html,t){
  if(!t)return html;
  var d=new Date(t+'T00:00:00'); if(isNaN(d))return html;
  var g=('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear();
  return html.replace(/\.{3,}\s*\/\s*\.{3,}\s*\/\s*\.{3,}/g,g)
             .replace(/…\.\s*\/\s*…\.\s*\/\s*…+/g,g);
}
function sozBlokHTML(b,V){
  switch(b.t){
    case 'ust':return '<div class="usty">'+sozDoldur(b.x,V)+'</div>';
    case 'h1': return '<div class="h1">'+sozDoldur(b.x,V)+'</div>';
    case 'h2': return '<div class="h2">'+sozDoldur(b.x,V)+'</div>';
    case 'h3': return '<div class="h3">'+sozDoldur(b.x,V)+'</div>';
    case 'li': return '<div class="li">'+sozDoldur(b.x,V)+'</div>';
    case 'p':  return '<div class="p">'+sozDoldur(b.x,V)+'</div>';
    case 'kv': return '<div class="kv"><b>'+sozDoldur(b.k,V)+'</b><span>'+sozDoldur(b.v,V)+'</span></div>';
    case 'bos':return '<div class="ara"></div>';
    case 'tbl':{
      // Word tablosunda satırların hücre sayısı değişebiliyor (2 / 4 / tek hücre). Eksik
      // hücreleri colspan ile tamamla — yoksa sütunlar kayıyor, tek hücreli ara başlıklar
      // ("B) BAYİLERE ÖZEL VERİLER") tablonun soluna sıkışıyordu.
      var en=b.rows.reduce(function(m,r){return Math.max(m,r.length);},0);
      var gov=b.rows.map(function(r,ri){
        return '<tr'+((r.length===1&&en>1)?' class="ara-satir"':'')+'>'+r.map(function(c,ci){
          var span=(ci===r.length-1&&r.length<en)?' colspan="'+(en-r.length+1)+'"':'';
          return '<td'+span+'>'+sozDoldur(c,V).replace(/\n/g,'<br>')+'</td>';}).join('')+'</tr>';});
      // Başlıklı tabloda ilk satır <thead> → uzun tablo sayfaya bölününce başlık TEKRARLAR.
      return '<table'+(b.bas?' class="bas"':'')+'>'+
        (b.bas?('<thead>'+gov[0]+'</thead><tbody>'+gov.slice(1).join('')+'</tbody>'):('<tbody>'+gov.join('')+'</tbody>'))+'</table>';
    }
    case 'imza':return '<div class="imzalar">'+[b.sol,b.sag].map(function(kol){
      return '<div><div class="ust">'+sozDoldur(kol[0],V)+'</div>'+
        kol.slice(1).map(function(x){return '<div class="sat">'+sozDoldur(x,V)+'</div>';}).join('')+
        '<div class="cizgi"><span>İmza / Kaşe</span></div></div>';}).join('')+'</div>';
    default: return '';
  }
}
function sozTelWa(tel){
  var d=String(tel||'').replace(/\D/g,'');
  if(!d)return '';
  if(d.indexOf('90')===0&&d.length>=12)return d;
  if(d.charAt(0)==='0')d=d.slice(1);
  if(d.length===10)d='90'+d;
  return d;
}
function sozEpostaOk(e){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(e||'').trim());}
function sozKomKayit(id){
  // Modal açıksa formdaki güncel e-posta/telefon gönderimde kullanılsın (Kaydet'e basılmamış olsa da).
  if(editKom&&editKom.id===id&&document.getElementById('k_name')){

    var local=(DB.komisyoncular||[]).find(function(k){return k.id===id;})||{};

    if(local.id){local.phone=m.phone;local.sz=m.sz;}

function sozlesmeKanalAc(id,kanal){

    window.open('mailto:'+encodeURIComponent(ep)+'?subject='+encodeURIComponent(msg.konu)+'&body='+encodeURIComponent(msg.gov),'_blank');

function sozlesmeIndir(id){return sozlesmePdf(id);}   // liste «Sözleşme» düğmesi
function sozlesmeGonder(id,kanal){

function sozlesmePdf(id,opt){

    +(waOk?'<button class="bx" style="background:#25D366" onclick="window.opener&&window.opener.sozlesmeKanalAc&&window.opener.sozlesmeKanalAc(\''+id+'\',\'wa\')">WA ile gönder</button>':'')
    +'<button class="bc" onclick="window.close()">Kapat</button>';
  var html=window.antetBelge({duz:true,govde:parcalar.join(''),

    imzaSol:'Rota SMI Tarım ve Hayvancılık San. Tic. A.Ş.',
    imzaSag:'Belge tarihi: '+new Date().toLocaleDateString('tr-TR'),
    araclar:araclar,
    otoYazdir:opt.otoYazdir===false?undefined:(opt.otoYazdir||700)});
  if(!window.antetBelgeAc(html)){alert('Açılır pencere engellendi — tarayıcı ayarından bu site için izin verin.');return false;}
  return true;
}

async function belgeYukle(komId,key,inp){
  var file=inp.files&&inp.files[0]; if(!file)return;
  if(file.size>25*1024*1024){alert('Dosya boyutu 25 MB sınırını aşıyor.');inp.value='';return;}
  if(typeof window.__sahaUpload!=='function'){alert('Yükleme servisi hazır değil. Firebase Storage kurulumu gerekiyor olabilir.');return;}
  var o=(DB.komisyoncular||[]).find(function(k){return k.id===komId;}); if(!o)return;
  var btn=inp.parentNode&&inp.parentNode.querySelector('button.bdoc'); if(btn){btn.textContent='…';btn.disabled=true;}
  try{
    var res=await window.__sahaUpload(komId,key,file);
    o.belgeler=o.belgeler||{};
    o.belgeler[key]={url:res.url,path:res.path,name:res.name,ts:new Date().toISOString()};
    saveSaha(); render();
  }catch(e){console.error('upload',e); alert('Yükleme hatası: '+(e&&(e.code||e.message)||e)); render();}
}
async function belgeSil(komId,key){

  var path=o.belgeler[key].path;
  delete o.belgeler[key]; saveSaha(); render();
  if(path&&typeof window.__sahaDeleteBelge==='function'){try{await window.__sahaDeleteBelge(path);}catch(e){}}
}

// dış katmanlardan çağrılır
window.__setSiparis=function(o){
  MUSTERILER=(o&&o.musteriler)||[];
  PLASIYERLER=(o&&o.plasiyerler)||[];   // plasiyer listesi Sipariş Takip'te yönetilir (salt-okunur)
  var komRaw=(o&&o.komRaw)||[];
  DB.komisyoncular=DB.komisyoncular||[];
  // GÜVENLİK (E): boş/hatalı snapshot (çevrimdışı açılış getDoc reject, parse hatası → komRaw:[]) yerel listeyi
  // (sz PII + belgeler) ASLA silmesin — yalnız GERÇEK dolu snapshot'ta uzlaştır. (apps/siparis'te bayi hiç 0 olmaz.)
  if(!komRaw.length){ BAYILER=DB.komisyoncular; render(); return; }
  // TEK KAYNAK (bayi tek-kaynak): bayi/danışman ÇEKİRDEĞİ artık apps/siparis (komRaw) esas alınır. Saha yerelde yalnız
  // sz (sözleşme) + belgeler overlay'ini tutar. Master'daki her kaydın çekirdeğini yerele uygula; yoksa ekle.
  var yerel={}; DB.komisyoncular.forEach(function(k){if(k&&k.id)yerel[k.id]=k;});
  var masterId={};
  komRaw.forEach(function(m){ masterId[m.id]=1; var ex=yerel[m.id];
    if(ex){ ['name','type','city','phone','adres','note','rate','active','danismanId','plasiyerId','odemeTipi'].forEach(function(f){ex[f]=m[f];}); }   // odemeTipi ŞART: yoksa sunucudaki güncel DBS bayrağı yerelde ESKİ değerde diriliyor
    else { DB.komisyoncular.push(Object.assign({sz:{},belgeler:{}},m)); }
  });
  // Master'da OLMAYAN yerel kayıtlar: göç edilmemişse (eski Saha bayileri) uca gönder; göç sonrasında master'da yoksa (silinmiş) yerelden kaldır.
  var orphan=DB.komisyoncular.filter(function(k){return k&&k.id&&!masterId[k.id];});
  if(orphan.length){
    if(!DB.komMigrated&&!window.__komGocBusy){ komOrphanGoc(orphan); }
    else if(DB.komMigrated){ DB.komisyoncular=DB.komisyoncular.filter(function(k){return k&&k.id&&masterId[k.id];}); }
  }
  BAYILER=DB.komisyoncular; saveSaha(); render();
};
// GÖÇ: apps/saha'da kalmış (apps/siparis'te olmayan) eski bayileri, id'lerini koruyarak ana listeye (apps/siparis) taşı — tek sefer.
async function komOrphanGoc(list){
  window.__komGocBusy=true; var hepOk=true;
  try{
    for(var i=0;i<list.length;i++){ var k=list[i];
      try{ await window.__komYonet({islem:'kaydet',kom:{id:k.id,name:k.name,type:k.type,city:k.city||'',phone:k.phone||'',adres:k.adres||'',note:k.note||'',rate:+k.rate||0,ozelIskonto:+k.ozelIskonto||0,active:k.active!==false,danismanId:k.danismanId||'',plasiyerId:k.plasiyerId||'',odemeTipi:k.odemeTipi||''}}); }
      catch(e){ hepOk=false; console.warn('kom göç',k.id,e); }
    }
    if(hepOk){ DB.komMigrated=true; saveSaha(); }   // hepsi başarılı → göç tamam; değilse (ör. saha-kullan yetkisi) sonraki yüklemede tekrar dene
  }finally{ window.__komGocBusy=false; }
}
window.__reloadSaha=function(){const t=tab;loadSaha();tab=t;render();};
loadSaha();render();
</script>

function collectLocal(){const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(isKey(k))o[k]=localStorage.getItem(k);}return o;}

  }catch(e){console.warn('saha push',e);}}

(async function(){
