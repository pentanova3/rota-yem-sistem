<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Sevk / Teslimat · Rota SMI</title>
<link rel="icon" href="/icons/icon-192-v2.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Rota SMI">
<meta property="og:title" content="Sevk / Teslimat Bilgisi · Rota SMI">
<meta property="og:description" content="Siparişinizin sevkiyat ve teslimat bilgileri için dokunun.">
<meta property="og:image" content="https://rota-yem.web.app/og/bilgi.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://rota-yem.web.app/bilgi/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://rota-yem.web.app/og/bilgi.png">
<style>
:root{--navy:#0c1320;--blue:#1d4ed8;--slate:#475569;--slate3:#cbd5e1;--line:#e2e8f0;--green:#16a34a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,Segoe UI,system-ui,sans-serif;background:#f1f5f9;color:#0f172a;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:18px 14px 60px}
.brand{text-align:center;padding:18px 0 10px}
.brand img{height:62px;width:auto;object-fit:contain}
.brand .sub{margin-top:9px;font-size:15.5px;letter-spacing:.4px;color:var(--navy);font-weight:800;text-transform:uppercase}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 18px rgba(15,23,42,.06);overflow:hidden;margin-top:14px}
.card-hd{background:var(--navy);color:#fff;padding:16px 18px}
.card-hd h1{font-size:17px;font-weight:700}
.card-hd .no{font-size:12.5px;opacity:.8;margin-top:3px}
.card-bd{padding:16px 18px}
.lead{background:#eff6ff;border:1px solid #dbeafe;border-radius:10px;padding:14px 16px;margin-bottom:16px}
.lead .lt{font-size:18px;font-weight:800;color:#1e3a8a}
.lead .lx{font-size:13px;color:var(--slate);margin-top:3px}
.sec-t{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--slate);margin:16px 0 6px;display:flex;align-items:center;gap:7px}
.sec-t::before{content:"";width:14px;height:2px;background:var(--blue);border-radius:2px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.row:last-child{border-bottom:none}
.row .k{color:var(--slate);font-weight:500}
.row .v{font-weight:700;text-align:right}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--slate);font-weight:700;padding:7px 6px;border-bottom:2px solid var(--line)}
th.n,td.n{text-align:right}
td{padding:9px 6px;border-bottom:1px solid #f1f5f9;font-weight:600}
.note{font-size:11.5px;color:var(--slate);text-align:center;margin-top:14px;line-height:1.6}
.state{text-align:center;padding:46px 22px}
.state h2{font-size:20px;font-weight:800;margin-bottom:7px}
.state p{font-size:14px;color:var(--slate);max-width:330px;margin:0 auto;line-height:1.6}
.spin{width:40px;height:40px;border:4px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;margin:60px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.ftr{text-align:center;font-size:12px;color:var(--slate);margin-top:30px;letter-spacing:.3px;font-weight:500}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img src="/rota-smi.png" alt="Rota SMI" onerror="this.style.display='none'">
    <div class="sub">Sevk / Teslimat Bilgisi</div>
  </div>
  <div id="app"><div class="spin"></div></div>
  <div class="ftr">© Rota SMI Tarım · Bu bağlantı yalnızca size özeldir.</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyB-eY1jv-HYfrNxzrhWS9sywLBFQarpLD8",authDomain:"rota-yem.firebaseapp.com",projectId:"rota-yem",storageBucket:"rota-yem.firebasestorage.app",messagingSenderId:"186408871052",appId:"1:186408871052:web:65791c132b2c1b525307a9"};
const app=initializeApp(firebaseConfig), db=getFirestore(app);
const KADEME={fabrika:'Fabrika Teslim',yakin:'Yakın Bayi Satış',uzak:'Uzak Bayi Satış',bayi:'Bayi Satış'};
const AYTR=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const GUNTR=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const APP=document.getElementById('app');
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtN(n){n=+n||0;return n.toLocaleString('tr-TR',{maximumFractionDigits:2})}
function fmtDate(iso){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||''));return m?(m[3]+'.'+m[2]+'.'+m[1]):'—'}
function tdLong(iso){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||''));if(!m)return '—';const dt=new Date(+m[1],+m[2]-1,+m[3]);return (+m[3])+' '+AYTR[+m[2]-1]+' '+m[1]+' '+GUNTR[dt.getDay()];}
function qs(k){return new URLSearchParams(location.search).get(k)||''}
function row(k,v){return v?`<div class="row"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`:'';}
function stateView(t,m){APP.innerHTML=`<div class="card"><div class="state"><h2>${esc(t)}</h2><p>${m}</p></div></div>`;}

async function load(){
  const t=qs('t');
  if(!t){stateView('Geçersiz Bağlantı','Bağlantı eksik görünüyor. Lütfen size gönderilen mesajdaki bağlantıyı kullanın.');return;}
  let data;
  try{const snap=await getDoc(doc(db,'apps','siparis'));data=snap.exists()?snap.data().data:null;}
  catch(e){stateView('Bağlantı Hatası','Bilgilere ulaşılamadı. Lütfen birkaç dakika sonra tekrar deneyin.');return;}
  let DBO=null; try{DBO=JSON.parse((data&&data['rota_so_v1'])||'null');}catch(e){}
  const o=DBO&&Array.isArray(DBO.orders)?DBO.orders.find(x=>x.onayToken===t):null;
  if(!o){stateView('Sipariş Bulunamadı','Bu bağlantıya ait sipariş bulunamadı.');return;}
  render(o);
}

function render(o){
  const lines=(o.lines||[]).map(l=>`<tr><td>${esc(l.code)}</td><td class="n">${fmtN(l.qty)}</td></tr>`).join('');
  const urunler=`<div class="sec-t">Ürünler</div><table><thead><tr><th>Ürün</th><th class="n">Miktar (çuval)</th></tr></thead><tbody>${lines||'<tr><td colspan="2">—</td></tr>'}</tbody></table>`;
  let leadT, leadX, info='';
  if(o.status==='sevk'){
    leadT='Siparişiniz yola çıkmıştır'; leadX='Sevkiyat bilgileri aşağıdadır.';
    const htar=o.hareketTarihi||o.sevkTarih;
    info=`<div class="sec-t">Sevkiyat</div>`
      +row('Araç Plaka',o.plaka)
      +row('Şoför',o.sofor)
      +row('Şoför İrtibat',o.soforTel)
      +row('Fabrikadan Hareket Tarihi',htar?fmtDate(htar):'')
      +row('Fabrikadan Hareket Saati',o.hareketSaati)
      +row('Sevkiyat Tipi',o.kargo)
      +row('Palet',o.palet)
      +(o.strec?row('Streç','Evet'):'')
      +(o.nakliyeMusteri?row('Nakliye Ücreti','Tarafınıza aittir'):'')
      +(o.not&&String(o.not).trim()?row('Not',o.not):'');
  } else if(o.status==='teslim'){
    leadT='Siparişiniz teslim edilmiştir'; leadX='Teslimat bilgileri aşağıdadır.';
    const ttar=o.teslimEdildiTarih||o.teslimTarihi;
    info=`<div class="sec-t">Teslimat</div>`
      +row('Teslim Tarihi',ttar?fmtDate(ttar):'')
      +row('Teslim Alan',o.customer);
  } else {
    leadT='Sipariş Bilgisi'; leadX='Siparişinizin güncel bilgileri aşağıdadır.';
  }
  APP.innerHTML=`
  <div class="card">
    <div class="card-hd"><h1>Sayın ${esc(o.customer||'')}</h1><div class="no">Sipariş No #${esc(o.no||'')} · ${fmtDate(o.date)}</div></div>
    <div class="card-bd">
      <div class="lead"><div class="lt">${esc(leadT)}</div><div class="lx">${esc(leadX)}</div></div>
      ${urunler}
      <div class="row" style="margin-top:14px"><span class="k">Teslim Tarihi</span><span class="v">${tdLong(o.teslimTarihi)}</span></div>
      <div class="row"><span class="k">Teslim Noktası</span><span class="v">${esc(KADEME[o.fiyatKademe]||'—')}</span></div>
      ${info}
      <div class="note">Bilgilerde bir hata görürseniz lütfen bizimle iletişime geçin.<br>Rota SMI Tarım ve Hayvancılık</div>
    </div>
  </div>`;
}
load();
</script>
</body>
</html>
