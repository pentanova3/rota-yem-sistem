function orderLineRow(l,i,ro){
  const items=DB.products.filter(p=>p.active!==false);
  const bilinmeyen=l.code&&!DB.products.some(p=>p.code===l.code);   // çapraz siparişte katalogda olmayan kod boş görünmesin
  const opts=(bilinmeyen?`<option value="${esc(l.code)}" selected>${esc(l.code)} · katalog dışı</option>`:'')+items.map(p=>`<option value="${esc(p.code)}" ${l.code===p.code?'selected':''}>${esc(p.code)}</option>`).join('');
  const showPrice=canSeePrice();
  return `<tr>
    <td><select ${ro?'disabled':''} onchange="setLine(${i},'code',this.value)"><option value="">— Ürün —</option>${opts}</select></td>
    <td><input type="number" min="0" value="${l.qty??''}" ${ro?'disabled':''} onchange="setLine(${i},'qty',this.value)" placeholder="çuval"></td>
    ${showPrice?`<td class="num" style="white-space:nowrap;color:var(--slate-500)">${(l.liste!=null&&l.liste!=='')?fmtTL2(l.liste):'—'}</td>
    <td><input type="number" step="0.01" value="${l.price??''}" ${ro?'disabled':''} onchange="setLine(${i},'price',this.value)" placeholder="₺/çuval" title="Liste × (1−iskonto) otomatik; elle değişirse kilitlenir"></td>
    <td class="num" style="white-space:nowrap">${fmtTL2((+l.qty||0)*(+l.price||0))}</td>`:''}
    <td>${ro?'':`<button class="btn-ic" onclick="delLine(${i})" style="color:var(--red-700);font-weight:800">✕</button>`}</td>
  </tr>`;
}
function setLine(i,f,v){
  const l=editOrder.lines[i];if(!l)return;
  // Fiyat BOŞALTILIRSA kilit de kalkmalı — yoksa satır kalıcı 0 kalır ve tarifeye geri dönemez
  // (uyarıda "fiyat alanını boşaltın" deniyor, o yol çalışmak zorunda).
  if(f==='price'){l.price=v;l._locked=(v!==''&&v!=null);if(!l._locked)applyPricesToLines();}
  else{
    l[f]=v;
    if(f==='code'){
      const c=custById(editOrder.customerId);
      const liste=listeFiyatFor(prodByCode(l.code),c,editOrder);
      l.liste=(liste!=null)?liste:'';
      if(!l._locked){const net=netBirim(liste,iskCtxFrom(editOrder,editOrder.vade,imeceAliciAktif(editOrder)));l.price=(net!=null)?net:'';}
    }
  }
  renderOrderModal();
}
function addLine(){editOrder.lines.push({code:'',qty:'',liste:'',price:''});renderOrderModal()}
function delLine(i){editOrder.lines.splice(i,1);if(!editOrder.lines.length)editOrder.lines.push({code:'',qty:'',liste:'',price:''});renderOrderModal()}

function onChangeOrderDate(v){
  const o=editOrder;o.date=v;
  if(o.vade){const vd=VADELER.find(x=>x.k===o.vade);o.odeme=addDaysISO(v,vd?vd.gun:0);}
  else if(isISODate(o.odeme)&&o.odeme<v)o.odeme=v;
  renderOrderModal();
}
function onChangeOdeme(v){const o=editOrder;if(v&&o.date&&v<o.date){toast('Ödeme tarihi sipariş tarihinden önce olamaz');renderOrderModal();return}o.odeme=v}

function pickSofor(v){   // kayıtlı şoför seçilince plaka/şoför/telefon dolar
  const o=editOrder;if(!o)return;
  const s=(DB.soforler||[]).find(x=>x.id===v);
  if(s){o.plaka=(s.plaka||'').toUpperCase();o.sofor=s.ad||'';o.soforTel=s.tel||'';}
  renderOrderModal();
}
function soforKaydet(){   // formdaki plaka/şoför/telefonu kayıtlı şoförlere ekler (aynı plaka+ad varsa günceller)
  const o=editOrder;if(!o||!canEdit())return;
  const plaka=(o.plaka||'').trim().toUpperCase(), ad=titleTr(o.sofor||'');let _t=(o.soforTel||'').trim();   // _t YENİDEN ATANIYOR → const olamaz (geçersiz telefonda TypeError atıyordu)
  if(_t&&!telGecerli(_t)){toast('Şoför telefonu eksik/hatalı — kaydedilmedi');_t='';}
  const tel=_t?telNorm(_t):'';o.soforTel=tel;
  if(!plaka&&!ad){toast('Önce plaka veya şoför adı girin');return}
  DB.soforler=DB.soforler||[];
  let s=DB.soforler.find(x=>String(x.plaka||'').toUpperCase()===plaka&&titleTr(x.ad||'')===ad);
  if(s){s.plaka=plaka;s.ad=ad;s.tel=tel;}else{DB.soforler.push({id:uid('sf'),plaka,ad,tel});}
  saveDB();toast('Şoför kaydedildi');renderOrderModal();
}

function ozetLines(o){return (o.lines||[]).filter(l=>l.code&&+l.qty>0).map(l=>l.code+': '+fmtN(l.qty)+' çuval').join(', ')}
function saveOrder(){
  const o=editOrder;if(!o)return;
  if(!canEdit()){toast('Yetkiniz yok');return}
  if(!o.customerId){toast('Müşteri seçiniz (zorunlu)');return}
  if(!o.teslimTarihi){toast('Teslim tarihi seçiniz (zorunlu)');return}
  if(!o.odeme){toast('Ödeme tarihi seçiniz (zorunlu)');return}
  if(o.date&&o.teslimTarihi<o.date){toast('Teslim tarihi, sipariş tarihinden önce olamaz');return}
  if(o.odeme&&o.date&&o.odeme<o.date){toast('Ödeme tarihi sipariş tarihinden önce olamaz');return}
  // Boş satırları AT. DİKKAT: bundan sonraki her erken return, modalı YENİDEN ÇİZMELİ —
  // yoksa ekranda eski satırlar durur, dizi kısalmıştır ve sonraki düzenleme YANLIŞ SATIRA yazar.
  o.lines=(o.lines||[]).filter(l=>l.code&&(+l.qty>0));
  if(!o.lines.length){toast('En az bir ürün ekleyin');return}
  o.lines.forEach(l=>{l.qty=+l.qty;l.price=(l.price===''||l.price==null)?0:+l.price;
    l.liste=(l.liste===''||l.liste==null)?l.price:+l.liste;
    if(l.kg==null||l.kg===''){const p=prodByCode(l.code);l.kg=(p&&+p.kg)||0;}});   // çuval kg damgası (TMR ile aynı — tonaj/nakliye geçmişi kaymasın)   // _locked KORUNUR (elle girilen fiyat vade değişiminde ezilmesin)   // liste boşsa net=liste (iskonto 0)
  // KAYIT ARAMA + ÜRETİM KAPISI, DAMGALAMADAN ÖNCE. Kapı damgalamadan SONRA return ederse
  // odemeDamgala açık formu (editOrder klonunu) çoktan mutasyona uğratmış olur; bozuk damga

window.__MUHASEBEONAY=window.__MUHASEBEONAY||{};   // apps/muhasebeonay (yalnız SUNUCU yazar) — muhasebe onayının GÜVENİLİR kaynağı; blob'a güvenilmez

// ---- ONAY DAMGASI (functions/index.js AYNASI — test/odeme.test.js birebir eşliği denetler) ----
// Onay butonuna eklenir; sipariş sonradan değişirse ESKİ mesajın butonu sunucuda REDDEDİLİR.
// İKİ KOPYA SAPMAZ: sapınca bayat onay koruması sessizce devre dışı kalır.
const ICERIK_ALAN = ["customerId", "bayiId", "aliciBayi", "aliciMusteri", "portalMusteri",
  "teslimTarihi", "fiyatKademe", "priceListId", "nakliye", "faturaManuel",
  "imeceSecili", "imeceAy", "imeceKartTutar", "odeme", "vade", "nakliyeBirim", "nakliyeTipi", "hammaliyeBirim",
  "iskontoOran", "iskontoTL", "ozelListeId", "araciId", "araciKomisyon"];
function siparisImza(o) {
  if (!o) return "";
  const L = (Array.isArray(o.lines) ? o.lines : []).filter((l) => l && l.code)
    .map((l) => String(l.code) + "|" + (+l.qty || 0) + "|" + (l.price === "" || l.price == null ? "" : (+l.price || 0)))
    .sort().join(";");
  const F = ICERIK_ALAN.map((k) => {
    const v = o[k];
    if (v == null || v === "") return "";
    if (typeof v === "boolean") return v ? "1" : "0";
    // GÜVENLİ ÇEVİRİM: blob istemciden gelir; {toString:null} gibi bir nesne String(v)'de TypeError atar
    // ve tüm tespit bloğunu düşürürdü (sevk kilidi + onay düşürme baypası).
    if (typeof v === "object") { try { return JSON.stringify(v); } catch (e) { return "[nesne]"; } }
    return String(v);
  }).join("~");
  return F + "~~" + L;
}
function imzaHash(s) {
  let h = 5381;
  const t = String(s || "");
  for (let i = 0; i < t.length; i++) { h = (((h << 5) + h) ^ t.charCodeAt(i)) >>> 0; }
  return h.toString(36).slice(0, 7);
}
function onayDamga(o){try{return imzaHash(siparisImza(o));}catch(e){return '';}}
// BİLGİ HATTI (firma kararı 29.07): Yem modülünde açılan ve TMR'den çapraz düşen YEM siparişleri
// onaya SUNULMAZ — Telegram'a yalnız bilgi düşer, sevk/teslim kapısı yoktur.
// İSTİSNA: bayi/danışman PORTALINDAN gelen yem siparişleri (dışarıdan, fiyatsız) eski akışta kalır.
// Sunucudaki yemBilgiHatti() ile AYNI kuraldır — biri değişirse diğeri de değişmeli.
function bilgiHattiMi(o){var k=(o&&o.kaynak)||'';return k!=='bayi-portal'&&k!=='danisman-portal';}

    '📞 Telefon: '+((c&&c.phone)||'—')+'\n'+

// Tek giriş noktası: hangi mesajın gideceğine kaynak karar verir (çağıran yerlerde dallanma OLMASIN)
function sendYemSiparisBildirim(o){if(bilgiHattiMi(o))sendYemSiparisBilgi(o);else sendMuhasebeSiparisOnay(o);}
function tekrarMuhasebeOnay(id){var o=DB.orders.find(function(x){return x.id===id});if(!o)return;
  if(bilgiHattiMi(o)){sendYemSiparisBilgi(o);pushHist(o,'gonderildi','Bilgi mesajı yeniden gönderildi');saveDB();toast('Bilgi mesajı yeniden gönderildi');return;}
  sendMuhasebeSiparisOnay(o);pushHist(o,'gonderildi','Muhasebe onay mesajı yeniden gönderildi');saveDB();toast('Muhasebe onay mesajı yeniden gönderildi');}
window.__applyMuhasebeOnay=function(map){
  var _bosHarita=!map||Object.keys(map).length===0;   // boş harita = arıza; toptan onay düşürmeyi engeller
  window.__MUHASEBEONAY=map||{};   // kilitli belgenin tamamı — muhasebe rozeti için güvenilir kaynak. Yem hattında statüyü BU onay ilerletir.
  if(!map||typeof DB==='undefined'||!DB||!Array.isArray(DB.orders))return;
  var chg=0;
  Object.keys(map).forEach(function(oid){
    var rec=map[oid];if(!rec||!rec.by)return;
    var o=DB.orders.find(function(x){return x.id===oid});if(!o)return;
    if(!o.muhasebeOnay||o.muhasebeOnay.ts!==rec.ts){
      o.muhasebeOnay={by:rec.by,ts:rec.ts||new Date().toISOString()};o.muhasebeOnayGerek=false;
      // YEM HATTI TEK KAPILI: ayrı üretim onayı gelmeyeceği için statüyü BU onay ilerletir.
      // Eski akış kaydında (yemOnayGerek dolu) statüyü hâlâ üretim onayı çeker — geriye uyum.
      if(!o.yemOnayGerek&&o.status==='beklemede')o.status='onay';
      pushHist(o,'muhasebe','Muhasebe onayı: '+rec.by,'Telegram');chg++;
    }
  });
  // ONAY İPTALİ: sipariş içeriği değişince sunucu (yaz) kaydı SİLER. Yalnız ekleme yapılsaydı yerel
  // bayrak "onaylı" kalır, kaydetme kapısı açılırdı → değişmiş sipariş onaysız üretime geçebilirdi.
  DB.orders.forEach(function(o){
    if(_bosHarita)return;
    if(!o||!o.id||!o.muhasebeOnay)return;
    if(map[o.id]&&map[o.id].by)return;
    // BİLGİ HATTI: onay hiç istenmiyor → bayrağı diriltme (kimse onaylamayacağı için kutu asılı kalırdı).
    // Sunucudaki onayDusur ile AYNI kural.
    var _b=bilgiHattiMi(o);
    delete o.muhasebeOnay;o.muhasebeOnayGerek=!_b;
    pushHist(o,'muhasebe',_b?'Sipariş içeriği değişti — bilgi mesajı gönderildi (onay istenmez)'
      :'Sipariş içeriği değişti — muhasebe onayı DÜŞTÜ, yeniden onay gerekiyor','Sistem');
    chg++;
  });
  if(chg){try{logAct('Muhasebe onayı güncellendi ('+chg+')');saveDB();}catch(e){}try{if(typeof render==='function')render();}catch(e){}}
};

function buildYemShipMsg(o){
  const lines=(o.lines||[]).map(l=>`• ${l.code}: ${fmtN(l.qty)} çuval`).join('\n');
  const htar=o.hareketTarihi||o.sevkTarih||todayISO();

  msg+=`\nAraç Plaka: ${o.plaka||'—'}`;

  if(o.soforTel&&String(o.soforTel).trim())msg+=`\nŞoför İrtibat: ${o.soforTel}`;
  msg+=`\nHareket Tarihi: ${fmtDate(htar)}`;

  if(o.not&&String(o.not).trim())msg+=`\nNot: ${o.not}`;

  return msg;

function buildYemDeliveredMsg(o){

// ---------- ÜRÜNLER & FİYAT ----------
let editProd=null;
// ---------- TOPLU FİYAT GÜNCELLEME (Excel'den yapıştır) ----------
// Hedef: 'cuval' | 'birim' | 'ozel:<listeId>'. Excel kopyası TAB ayraçlı gelir; ';' ve 2+ boşluk da desteklenir.
// Ürün kodları boşluk içerebildiği için (GERDAN - G) TEK boşlukla BÖLÜNMEZ.
let topluFiyat=null;
function _trSayi(x){   // Türkçe sayı: nokta=binlik, virgül=ondalık → 1.001,50 → 1001.5 · 916,75 → 916.75
  if(x==null)return null;
  const t=String(x).replace(/[^\d.,-]/g,'').replace(/\./g,'').replace(',','.');
  if(t===''||t==='-')return null;
  const n=parseFloat(t);return isFinite(n)?round2(n):null;
}
function topluHedefAlan(h){return h==='kanatli'?'cuval':h;}
// Özel listede de kredi kartı fiyatı tanımlanabilmeli: yoksa İMECE tabanı peşine düşer ve
// vade farkı olduğundan DÜŞÜK çıkar (eksik faturalama).   // kanatlı fiyatları cuval alanında saklanır
function topluHedefAd(h){
  if(h==='cuval')return 'Çuvallı Liste (₺/çuval)';
  if(h==='birim')return 'Birim Liste (₺/kg)';
  if(h==='kanatli')return 'Kanatlı Yemleri (₺/çuval · Peşin/15/30/45/60)';
  const l=ozelListeById(String(h).slice(5));return l?('Özel Liste — '+l.ad):'—';
}
function topluHedefVadeleri(h){
  if(h==='cuval')return CUV_V;
  if(h==='birim')return BIR_V;
  if(h==='kanatli')return KANATLI_V;
  const l=ozelListeById(String(h).slice(5));return l?ozelListeVadeleri(l):['std'];
}
function topluFiyatAc(hedef){
  if(!isAdmin())return;
  topluFiyat={hedef:hedef,metin:'',satirlar:null};
  renderTopluModal();
}
function topluFiyatKapat(){topluFiyat=null;document.getElementById('modalRoot').innerHTML='';}
function topluFiyatCoz(){
  const t=topluFiyat;if(!t)return;
  const vs=topluHedefVadeleri(t.hedef), ozel=String(t.hedef).indexOf('ozel:')===0;
  const liste=ozel?ozelListeById(String(t.hedef).slice(5)):null;
  t.satirlar=String(t.metin||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(function(line){
    const parts=line.split(/\t|;|\s{2,}/).map(x=>x.trim()).filter(x=>x!=='');
    const code=parts[0]||'';
    const yeni=vs.map((v,i)=>_trSayi(parts[i+1]));
    const prod=(DB.products||[]).find(p=>trNorm(p.code)===trNorm(code));
    let eski=null,durum='',ok=false;
    if(!code){durum='satır boş';}
    else if(ozel){
      const sr=(liste.satirlar||[]).find(x=>trNorm(x.code)===trNorm(code));
      if(sr){eski=vs.map(v=>sr.fiyatlar&&sr.fiyatlar[v]!=null?round2(sr.fiyatlar[v]):null);durum='güncellenecek';ok=true;}
      else if(prod){eski=vs.map(()=>null);durum='listeye EKLENECEK';ok=true;}
      else durum='ürün bulunamadı';
    }else{
      const kindOk=prod&&(t.hedef==='kanatli'?prod.kanatli:!prod.kanatli);
      if(prod&&kindOk){const src=prod[topluHedefAlan(t.hedef)]||{};eski=vs.map(v=>src[v]!=null?round2(src[v]):null);durum='güncellenecek';ok=true;}
      else if(prod)durum=(t.hedef==='kanatli')?'kanatlı değil — atlanır':'kanatlı ürün — Toplu: Kanatlı kullanın';
      else durum='ürün bulunamadı';
    }
    if(ok&&yeni.every(x=>x==null)){durum='fiyat okunamadı';ok=false;}
    return {code:code,yeni:yeni,eski:eski,durum:durum,ok:ok,prodCode:prod?prod.code:null};
  });
  renderTopluModal();
}
function topluFiyatUygula(){
  const t=topluFiyat;if(!t||!t.satirlar)return;
  const vs=topluHedefVadeleri(t.hedef), ozel=String(t.hedef).indexOf('ozel:')===0;
  const liste=ozel?ozelListeById(String(t.hedef).slice(5)):null;
  const uyg=t.satirlar.filter(x=>x.ok);
  if(!uyg.length){toast('Uygulanacak satır yok');return;}
  if(!confirm(uyg.length+' satır güncellenecek — '+topluHedefAd(t.hedef)+'\n\nDevam edilsin mi?'))return;
  let n=0;
  uyg.forEach(function(x){
    if(ozel){
      let sr=(liste.satirlar||[]).find(y=>trNorm(y.code)===trNorm(x.code));
      if(!sr){sr={code:x.prodCode||x.code,fiyatlar:{}};liste.satirlar=liste.satirlar||[];liste.satirlar.push(sr);}
      sr.fiyatlar=sr.fiyatlar||{};
      vs.forEach((v,i)=>{if(x.yeni[i]!=null)sr.fiyatlar[v]=x.yeni[i];});
      liste.tarih=todayISO();
    }else{
      const prod=(DB.products||[]).find(p=>trNorm(p.code)===trNorm(x.code));if(!prod)return;
      if(t.hedef==='kanatli'?!prod.kanatli:prod.kanatli)return;   // yanlış kategori: çuvallı paste kanatlıyı bozmasın (45 vade kaybı)
      const fld=topluHedefAlan(t.hedef);prod[fld]=prod[fld]||{};
      vs.forEach((v,i)=>{if(x.yeni[i]!=null)prod[fld][v]=x.yeni[i];});
    }
    n++;
  });
  if(t.hedef==='kanatli')DB.meta.kanatliFiyatTarihi=todayISO();else if(!ozel)DB.meta.fiyatTarihi=todayISO();
  logAct('Toplu fiyat güncelleme: '+topluHedefAd(t.hedef)+' — '+n+' ürün');
  saveDB();topluFiyatKapat();render();
  toast(n+' ürünün fiyatı güncellendi');
}

// Bir özel listenin gerçek vade sütunları (satırlardaki anahtarlardan türetilir; sıra: peşin/15/30/45/60/90, sonra std)
function ozelListeVadeleri(l){
  const set=new Set();
  (l.satirlar||[]).forEach(s=>Object.keys(s.fiyatlar||{}).forEach(k=>set.add(k)));
  const sira=['pesin','15','30','45','60','90'];
  const out=sira.filter(v=>set.has(v));
  if(set.has('std'))out.push('std');
  // Kredi kartı sütunu HER ZAMAN sunulur: yoksa özel listeli müşteriye kk fiyatı hiç girilemez
  // ve İMECE tabanı peşine düşüp vade farkı eksik hesaplanır.
  if(out.indexOf('kk')<0)out.push('kk');
  return out;
}

function saveProd(){
  const o=editProd;if(!o.code.trim()){toast('Ürün adı giriniz');return}
  if(DB.products.some(p=>p.code===o.code&&p.id!==o.id)){toast('Bu ürün adı zaten var');return}
  const _eski=o.id?DB.products.find(x=>x.id===o.id):null;
  const _fiyatDegisti=!_eski||JSON.stringify(_eski.cuval||{})!==JSON.stringify(o.cuval||{})||JSON.stringify(_eski.birim||{})!==JSON.stringify(o.birim||{});
  if(o.id){const i=DB.products.findIndex(x=>x.id===o.id);DB.products[i]=o;}else{o.id=uid('yp');DB.products.push(o);}
  if(_fiyatDegisti){if(o.kanatli)DB.meta.kanatliFiyatTarihi=todayISO();else DB.meta.fiyatTarihi=todayISO();}   // fiyat güncellendiyse ilgili tablonun tarihini bugüne çek
  logAct('Yem ürün kaydı: '+o.code);saveDB();closeModal();toast('Ürün kaydedildi');render();
}
function delProd(id){
  const p=DB.products.find(x=>x.id===id);if(!p)return;
  if(!confirm(p.code+' silinsin mi? (Geçmiş siparişler etkilenmez)'))return;
  DB.products=DB.products.filter(x=>x.id!==id);logAct('Yem ürün silindi: '+p.code);saveDB();closeModal();toast('Silindi');render();
}

// ===== MÜŞTERİ RAPORU: kim, ne kadar ton, ne kazandık, ne kadar iskonto/nakliye/hammaliye =====
// ══ SATIŞ KURALI (firma kararı 07.08 — TMR ile AYNI): teslim edilmeyen sipariş satış
// değildir; raporlar yalnız teslim edileni, fiilen teslim edildiği yıl ile sayar.
// (Denetim 12.08: Yem raporları kuralın DIŞINDA kalmıştı — bekleyenler ciro sayılıyordu.)
function satisMi(o){return !!o&&o.status==='teslim';}
function satisTarihi(o){return satisMi(o)?String((o.teslimEdildiTarih||o.teslimTarihi||o.date)||''):'';}
function musteriRaporData(yil){
  const arr=visibleOrders().filter(o=>satisMi(o)&&satisTarihi(o).slice(0,4)===yil);
  const M={};
  arr.forEach(o=>{
    const id=o.customerId||('_'+o.customer);
    const m=M[id]||(M[id]={id:o.customerId,ad:o.customer||'—',adet:0,cuval:0,kg:0,
      brut:0,iskonto:0,net:0,dbs:0,nakliye:0,hammaliye:0,araciKom:0,fatura:0,imece:0,urun:{},siparisler:[]});
    m.adet++;m.cuval+=orderCuval(o);m.kg+=orderKg(o);
    m.brut+=orderBrut(o);m.iskonto+=orderIskonto(o);m.net+=orderUrunNet(o);m.dbs+=dbsIskonto(o);
    m.nakliye+=orderNakliye(o);m.hammaliye+=orderHammaliye(o);m.araciKom+=orderAraciKomisyon(o);m.fatura+=orderTotal(o);m.imece+=imeceFark(o);
    m.siparisler.push(o);
    (o.lines||[]).forEach(l=>{
      if(!l.code)return;
      const _dk=+((l&&l.kg)||0);const p=prodByCode(l.code),kg=(+l.qty||0)*(_dk>0?_dk:((p&&p.kg)||0));   // kg damgası öncelikli
      const li=(l.liste!=null&&l.liste!=='')?+l.liste:(+l.price||0);
      const u=m.urun[l.code]||(m.urun[l.code]={cuval:0,kg:0,brut:0,iskonto:0,net:0});
      u.cuval+=(+l.qty||0);u.kg+=kg;u.brut+=(+l.qty||0)*li;
      u.net+=(+l.qty||0)*(+l.price||0);u.iskonto+=(+l.qty||0)*Math.max(0,li-(+l.price||0));
    });
  });
  return Object.values(M).sort((a,b)=>b.fatura-a.fatura);
}

// ===== PLASİYER RAPORU (yönetici): her plasiyer ne kadar sattı — ton, tutar, müşteri =====
function plasiyerRaporData(yil){
  const arr=visibleOrders().filter(o=>satisMi(o)&&satisTarihi(o).slice(0,4)===yil);   // satış kuralı
  const P={};
  arr.forEach(o=>{
    const pl=ordPlasiyer(o);const id=pl?pl.id:'_merkez';
    const p=P[id]||(P[id]={id:pl?pl.id:'',ad:pl?pl.name:'Plasiyersiz (merkez)',merkez:!pl,
      adet:0,cuval:0,kg:0,brut:0,iskonto:0,net:0,nakliye:0,hammaliye:0,fatura:0,mus:new Set(),siparisler:[]});
    p.adet++;p.cuval+=orderCuval(o);p.kg+=orderKg(o);p.brut+=orderBrut(o);p.iskonto+=orderIskonto(o);
    p.net+=orderUrunNet(o);p.nakliye+=orderNakliye(o);p.hammaliye+=orderHammaliye(o);p.fatura+=orderTotal(o);
    if(o.customerId)p.mus.add(o.customerId);p.siparisler.push(o);
  });
  return Object.values(P).map(p=>{p.musSayisi=p.mus.size;return p;}).sort((a,b)=>b.fatura-a.fatura||b.kg-a.kg);
}

  ${rows.length?rows.map(p=>{const val=showPrice?p.fatura:p.kg;const pct=Math.round(val/enBuyuk*100);const pay=T.fatura>0?(p.fatura/T.fatura*100):(T.kg>0?p.kg/T.kg*100:0);
    return `<tr onclick="plasiyerDetay('${esc(p.id)}','${yil}')" style="cursor:pointer">
    <td>${p.merkez?`<b style="color:var(--slate-400)">${esc(p.ad)}</b>`:`<b>${esc(p.ad)}</b>`}</td>

    ${showPrice?`<td class="num" style="color:#B45309">${p.iskonto?'−'+fmtTL(p.iskonto):'—'}</td>

  </tr>`}).join(''):`<tr><td colspan="${colsp}" class="tbl-empty">${yil} yılında sipariş yok</td></tr>`}
  </tbody>
  ${rows.length&&showPrice?`<tfoot><tr style="background:var(--blue-50);font-weight:700">
    <td>TOPLAM</td><td class="num">—</td><td class="num">${T.adet}</td><td class="num">${fmtN(T.cuval)}</td><td class="num">${fmtN(round2(T.kg/1000))}</td>

function plasiyerDetay(id,yil){

  const CM={};

    m.adet++;m.cuval+=orderCuval(o);m.kg+=orderKg(o);m.net+=orderUrunNet(o);m.iskonto+=orderIskonto(o);m.fatura+=orderTotal(o);});

      ${showPrice?`<div class="kpi"><div class="kpi-n">${fmtTL(p.net)}</div><div class="kpi-l">Ürün Net</div></div>
      <div class="kpi"><div class="kpi-n">${fmtTL(p.iskonto)}</div><div class="kpi-l">İskonto</div></div>

    ${musteriler.map(m=>`<tr><td><b>${esc(m.ad)}</b></td><td class="num">${m.adet}</td><td class="num">${fmtN(m.cuval)}</td><td class="num">${fmtN(round2(m.kg/1000))}</td>

function renderGenelRapor(c){
  const arr=visibleOrders().filter(o=>satisMi(o));   // satış kuralı: yalnız teslim edilen
  const yillar=orderYears();
  const yil=repYil||yillar[0]||String(new Date().getFullYear());
  const yilOrders=arr.filter(o=>satisTarihi(o).slice(0,4)===yil);
  const showPrice=canSeePrice();
  // aylık kırılım
  const aylik=Array.from({length:12},(_,i)=>{
    const mv=String(i+1).padStart(2,'0');
    const os=yilOrders.filter(o=>satisTarihi(o).slice(5,7)===mv);   // yıl filtresiyle AYNI eksen (teslim ayı) — yıl=teslim/ay=sipariş karışımı raporu kaydırıyordu
    return {ay:AYLAR_TR[i],adet:os.length,cuval:os.reduce((s,o)=>s+orderCuval(o),0),kg:os.reduce((s,o)=>s+orderKg(o),0),ciro:os.reduce((s,o)=>s+orderTotal(o),0)};
  });
  // ürün kırılımı
  const urun={};yilOrders.forEach(o=>(o.lines||[]).forEach(l=>{if(!l.code)return;urun[l.code]=urun[l.code]||{cuval:0,tutar:0};urun[l.code].cuval+=(+l.qty||0);urun[l.code].tutar+=(+l.qty||0)*(+l.price||0);}));
  const urunArr=Object.entries(urun).sort((a,b)=>b[1].cuval-a[1].cuval);
  // müşteri kırılımı

  const musArr=Object.entries(mus).sort((a,b)=>b[1].tutar-a[1].tutar).slice(0,15);

  const toplam={adet:yilOrders.length,cuval:yilOrders.reduce((s,o)=>s+orderCuval(o),0),kg:yilOrders.reduce((s,o)=>s+orderKg(o),0),ciro:yilOrders.reduce((s,o)=>s+orderTotal(o),0)};
  c.innerHTML=repSekmeler()+`<div class="filters"><select onchange="repYil=this.value;render()">${(yillar.length?yillar:[yil]).map(y=>`<option value="${y}" ${y===yil?'selected':''}>${y}</option>`).join('')}</select></div>
  <div class="kpis">

    ${showPrice?`<div class="kpi"><div class="kpi-n">${fmtTL(toplam.ciro)}</div><div class="kpi-l">Ciro</div></div>`:''}
  </div>
  <div class="card"><div class="card-hd"><h3>${yil} · Aylık Çuval</h3></div><div class="card-bd" style="padding:16px"><div class="chart-cv" style="height:220px"><canvas id="repChart"></canvas></div></div></div>
  <div class="report-grid">
    <div class="card"><div class="card-hd"><h3>Aylık Özet</h3></div><div class="card-bd"><table class="tbl"><thead><tr><th>Ay</th><th class="num">Sipariş</th><th class="num">Çuval</th><th class="num">Ton</th>${showPrice?'<th class="num">Ciro</th>':''}</tr></thead><tbody>
      ${aylik.map(a=>`<tr><td>${a.ay}</td><td class="num">${a.adet||'—'}</td><td class="num">${a.cuval?fmtN(a.cuval):'—'}</td><td class="num">${a.kg?fmtN(round2(a.kg/1000)):'—'}</td>${showPrice?`<td class="num">${a.ciro?fmtTL(a.ciro):'—'}</td>`:''}</tr>`).join('')}
    </tbody></table></div></div>
    <div class="card"><div class="card-hd"><h3>Ürün Kırılımı</h3></div><div class="card-bd"><table class="tbl"><thead><tr><th>Ürün</th><th class="num">Çuval</th>${showPrice?'<th class="num">Tutar</th>':''}</tr></thead><tbody>

      tx.set(cref,{q:{[qid]:{claimedBy:claimer||'?',claimedAt:new Date().toISOString()}}},{merge:true});
      return true;
    });
  }catch(e){console.warn('cross claim',e);return false;}
};
