<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Sipariş Onayı · Rota SMI</title>
<link rel="icon" href="/icons/icon-192-v2.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Rota SMI">
<meta property="og:title" content="Sipariş Onayı · Rota SMI">
<meta property="og:description" content="Siparişinizi görüntüleyip onaylamak için dokunun.">
<meta property="og:image" content="https://rotasmi-bilgi.web.app/og/onay.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://rotasmi-bilgi.web.app/onay/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://rotasmi-bilgi.web.app/og/onay.png">
<style>
:root{--navy:#0c1320;--blue:#1d4ed8;--blue7:#1d4ed8;--slate:#475569;--slate3:#cbd5e1;--line:#e2e8f0;--green:#16a34a;--amber:#b45309;--red:#b91c1c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,Segoe UI,system-ui,sans-serif;background:#f1f5f9;color:#0f172a;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:18px 14px 60px}
.brand{text-align:center;padding:18px 0 10px}
.brand img{height:62px;width:auto;object-fit:contain}
.brand .sub{margin-top:9px;font-size:15.5px;letter-spacing:.4px;color:var(--navy);font-weight:800;text-transform:uppercase}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 18px rgba(15,23,42,.06);overflow:hidden;margin-top:14px}
.card-hd{background:var(--navy);color:#fff;padding:16px 18px}
.card-hd h1{font-size:17px;font-weight:700;letter-spacing:.2px}
.card-hd .no{font-size:12.5px;opacity:.8;margin-top:3px}
.card-bd{padding:16px 18px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.row:last-child{border-bottom:none}
.row .k{color:var(--slate);font-weight:500}
.row .v{font-weight:700;text-align:right}
.row .v.hi{color:var(--blue)}
.sec-t{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--slate);margin:16px 0 6px;display:flex;align-items:center;gap:7px}
.sec-t::before{content:"";width:14px;height:2px;background:var(--blue);border-radius:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--slate);font-weight:700;padding:7px 6px;border-bottom:2px solid var(--line)}
th.n,td.n{text-align:right}
td{padding:9px 6px;border-bottom:1px solid #f1f5f9;font-weight:600}
td .code{font-weight:700}
tfoot td{border-top:2px solid var(--line);border-bottom:none;font-size:14px;font-weight:800;padding-top:11px}
.deliv{background:#eff6ff;border:1px solid #dbeafe;border-radius:10px;padding:13px 15px;margin-top:14px}
.deliv .dl-d{font-size:12px;color:#1e40af;font-weight:600;margin-bottom:2px}
.deliv .dl-v{font-size:20px;font-weight:800;color:#1e3a8a;letter-spacing:.3px}
.deliv .dl-x{font-size:12.5px;color:var(--slate);margin-top:5px}
.onaynot{background:#fffbeb;border:1.5px solid #fde68a;border-radius:11px;padding:13px 15px;margin-top:16px}
.onaynot .on-t{font-size:12px;font-weight:800;color:#b45309;margin-bottom:4px;letter-spacing:.2px}
.onaynot .on-v{font-size:14.5px;font-weight:600;color:#7c2d12;line-height:1.45;white-space:pre-wrap}
.confirm{margin-top:16px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:14px 15px}
.chk{display:flex;align-items:flex-start;gap:11px;cursor:pointer;user-select:none}
.chk input{width:22px;height:22px;margin-top:1px;accent-color:var(--green);flex:none;cursor:pointer}
.chk span{font-size:13.5px;color:#1e293b;font-weight:600}
.btns{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.btn{display:block;width:100%;border:none;border-radius:11px;padding:15px;font-size:15.5px;font-weight:800;letter-spacing:.3px;cursor:pointer;transition:.15s;font-family:inherit}
.btn-ok{background:var(--green);color:#fff;box-shadow:0 4px 14px rgba(22,163,74,.3)}
.btn-ok:disabled{background:#cbd5e1;box-shadow:none;cursor:not-allowed;color:#fff}
.btn-ok:not(:disabled):active{transform:translateY(1px)}
.btn-err{background:#fff;color:var(--red);border:1.5px solid #fecaca;font-size:13px;font-weight:700;padding:12px}
.note{font-size:11.5px;color:var(--slate);text-align:center;margin-top:14px;line-height:1.6}
.state{text-align:center;padding:46px 22px}
.state .ic{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:38px}
.state h2{font-size:20px;font-weight:800;margin-bottom:7px}
.state p{font-size:14px;color:var(--slate);max-width:330px;margin:0 auto;line-height:1.6}
.spin{width:40px;height:40px;border:4px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;margin:60px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.ftr{text-align:center;font-size:12px;color:var(--slate);margin-top:30px;letter-spacing:.3px;font-weight:500}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img src="/rota-smi.png" alt="Rota SMI" onerror="this.style.display='none'">
    <div class="sub">Sipariş Onay Sayfası</div>
  </div>
  <div id="app"><div class="spin"></div></div>
  <div class="ftr">© Rota SMI Tarım · Bu bağlantı yalnızca size özeldir.</div>
</div>

<script>
// Veri, güvenli sunucu ucundan gelir: yalnızca bu bağlantıya ait sipariş döner;
// onay/itiraz sunucuda kaydedilir, Telegram bildirimi sunucudan gönderilir.
const UC='https://musteri-gdzmodep5q-uc.a.run.app';
const KADEME={fabrika:'Fabrika Teslim',yakin:'Yakın Bayi Satış',uzak:'Uzak Bayi Satış',bayi:'Bayi Satış'};
const APP=document.getElementById('app');
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtN(n){n=+n||0;return n.toLocaleString('tr-TR',{maximumFractionDigits:2})}
function fmtTL(n){return '₺'+fmtN(n)}
function fmtDate(iso){if(!iso)return '—';const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso));return m?(m[3]+'.'+m[2]+'.'+m[1]):esc(iso)}
function qs(k){return new URLSearchParams(location.search).get(k)||''}
function lineTotal(l){return (+l.qty||0)*(+l.price||0)}
function urunToplam(o){return (o.lines||[]).reduce((s,l)=>s+lineTotal(l),0)}
// FATURA TUTARI sunucudan gelen DONMUŞ değerdir (o.total). Satırları kendimiz toplarsak DBS indirimi
// ve firmayla anlaşılan manuel fatura tutarı GÖRÜNMEZ → müşteri, kesilen faturadan FARKLI bir tutarı
// onaylamış olur. o.total yoksa (eski kayıt) satır toplamına düşeriz.
// DİKKAT: eski/gömülü kayıtlarda 'total' alanı LİRA DEĞİL KİLOGRAM tutuyor (555 arşiv siparişi:
// total = çuval × 25). Bu yüzden o.total'a YALNIZ satır fiyatları da doluysa güveniriz; fiyatsız
// siparişte hiç tutar göstermeyiz (yanlış tutarı onaylatmaktansa hiç göstermemek doğrudur).
function orderTotal(o){const u=urunToplam(o),t=+o.total;return (u>0&&isFinite(t)&&t>0)?t:u}
function stateView(ic,bg,col,title,msg){
  APP.innerHTML=`<div class="card"><div class="state"><div class="ic" style="background:${bg};color:${col}">${ic}</div><h2>${esc(title)}</h2><p>${msg}</p></div></div>`;
}
let ORDER=null, TOKEN='';

async function load(){
  const t=qs('t');TOKEN=t;
  if(!t){stateView('!','#fef3c7','#b45309','Geçersiz Bağlantı','Onay bağlantısı eksik görünüyor. Lütfen size gönderilen mesajdaki bağlantıyı kullanın.');return;}
  let veri=null;
  try{
    const r=await fetch(UC+'?t='+encodeURIComponent(t));
    if(r.status===404){stateView('?','#fef3c7','#b45309','Sipariş Bulunamadı','Bu bağlantıya ait sipariş bulunamadı. Bağlantı yenilenmiş olabilir; lütfen bizimle iletişime geçin.');return;}
    if(!r.ok)throw new Error('sunucu');
    veri=await r.json();
  }catch(e){stateView('⚠','#fee2e2','#b91c1c','Bağlantı Hatası','Sipariş bilgilerine ulaşılamadı. Lütfen birkaç dakika sonra tekrar deneyin.');return;}
  const o=veri.siparis;ORDER=o;
  if((o.musteriOnay==='onaylandi')||(veri.onay&&veri.onay.onay==='onaylandi')){
    stateView('✓','#dcfce7','#16a34a','Sipariş Onaylandı','Bu siparişi daha önce onayladınız. Teşekkür ederiz.');return;
  }
  renderOrder(o);
}

function renderOrder(o){
  const urun=urunToplam(o), total=orderTotal(o), showPrice=urun>0;
  // Ara toplam ile fatura arasındaki fark = DBS indirimi ve/veya firmayla anlaşılan ek indirim.
  // Farkı dbsOran'dan HESAPLAMAK yerine iki tutarın FARKINDAN türetiyoruz: manuel pazarlık tutarı
  // girildiğinde de doğru çıkar. İMECE vade farkı ayrı satırda gösterilir (2. fatura).
  const indirim=Math.round((urun-total)*100)/100;
  // DBS payını orandan hesapla, KALAN farkı ayrı 'ilave indirim' olarak göster — tek satırda
  // birleştirilirse yüzde ile tutar tutmaz ve müşteri itirazında belge tutarsız görünür.
  // DBS satırı GERÇEK oran hesabını gösterir; indirimle KIRPILIRSA yüzde ile tutar tutmaz
  // (%3 yazıp 2.000 ₺ göstermek gibi) ve müşteri haklı olarak itiraz eder. Kalan fark ayrı satır:
  // pozitifse ilave indirim, negatifse (manuel tutar hesaplanandan yüksek) fiyat farkı.
  const dbsTutar=(+o.dbsOran>0)?Math.round(urun*(+o.dbsOran)/100*100)/100:0;
  const kalan=Math.round((indirim-dbsTutar)*100)/100;
  const digerInd=Math.max(0,kalan), fiyatFarki=Math.max(0,-kalan);
  const vadeFarki=Math.round((+o.imeceFark||0)*100)/100;
  const genel=Math.round((total+vadeFarki)*100)/100;
  const rows=(o.lines||[]).map(l=>`<tr>
      <td><span class="code">${esc(l.code)}</span></td>
      <td class="n">${fmtN(l.qty)}</td>
      ${showPrice?`<td class="n">${fmtTL(+l.price||0)}</td><td class="n">${fmtTL(lineTotal(l))}</td>`:''}
    </tr>`).join('');
  APP.innerHTML=`
  <div class="card">
    <div class="card-hd">
      <h1>Sayın ${esc(o.customer||'')}</h1>
    </div>
    <div class="card-bd">
      <div class="sec-t">Sipariş Kalemleri</div>
      <table>
        <thead><tr><th>Ürün</th><th class="n">Miktar (çuval)</th>${showPrice?'<th class="n">Birim</th><th class="n">Tutar</th>':''}</tr></thead>
        <tbody>${rows||'<tr><td colspan="4">—</td></tr>'}</tbody>
        ${showPrice?`<tfoot>
          ${Math.abs(indirim)>0.004||vadeFarki>0.004?`<tr><td>Ara Toplam</td><td class="n"></td><td class="n"></td><td class="n">${fmtTL(urun)}</td></tr>`:''}
          ${dbsTutar>0.004?`<tr><td>− DBS İndirimi (%${fmtN(+o.dbsOran)})</td><td class="n"></td><td class="n"></td><td class="n">− ${fmtTL(dbsTutar)}</td></tr>`:''}
          ${digerInd>0.004?`<tr><td>− İlave İndirim</td><td class="n"></td><td class="n"></td><td class="n">− ${fmtTL(digerInd)}</td></tr>`:''}
          ${fiyatFarki>0.004?`<tr><td>+ Fiyat Farkı</td><td class="n"></td><td class="n"></td><td class="n">+ ${fmtTL(fiyatFarki)}</td></tr>`:''}
          <tr><td>${vadeFarki>0.004?'1. Fatura — Normal Ederi':'Genel Toplam'}</td><td class="n"></td><td class="n"></td><td class="n">${fmtTL(total)}</td></tr>
          ${vadeFarki>0.004?`<tr><td>2. Fatura — Vade Farkı${+o.imeceAy>0?' ('+fmtN(+o.imeceAy)+' ay)':''}</td><td class="n"></td><td class="n"></td><td class="n">+ ${fmtTL(vadeFarki)}</td></tr>
          <tr><td><b>Toplam Ödeme</b></td><td class="n"></td><td class="n"></td><td class="n"><b>${fmtTL(genel)}</b></td></tr>`:''}
        </tfoot>`:''}
      </table>

      <div class="deliv">
        <div class="dl-d">Teslim Noktası</div>
        <div class="dl-v" style="font-size:18px">${esc(KADEME[o.fiyatKademe]||'Teslim')}</div>
        <div class="dl-x">${o.kargo?esc(o.kargo):''}</div>
      </div>

      <div class="sec-t" style="margin-top:18px">Sipariş Bilgileri</div>
      <div class="row"><span class="k">Sipariş Tarihi</span><span class="v">${fmtDate(o.date)}</span></div>
      ${o.kargo?`<div class="row"><span class="k">Sevkiyat</span><span class="v">${esc(o.kargo)}</span></div>`:''}
      ${o.odeme?`<div class="row"><span class="k">Ödeme Tarihi</span><span class="v">${/^\d{4}-\d{2}-\d{2}/.test(o.odeme)?fmtDate(o.odeme):esc(o.odeme)}</span></div>`:''}

      ${o.onayNot?`<div class="onaynot"><div class="on-t">ÖNEMLİ NOT</div><div class="on-v">${esc(o.onayNot)}</div></div>`:''}
      <div class="confirm">
        <label class="chk"><input type="checkbox" id="ack"><span>Yukarıdaki ürün, miktar ve ${showPrice?'tutar ':''}bilgilerini kontrol ettim; sipariş doğrudur.</span></label>
        ${o.onayNot?`<label class="chk" style="margin-top:12px;border-top:1px dashed var(--line);padding-top:12px"><input type="checkbox" id="ackNot"><span><b>Yukarıdaki notu okudum</b> ve kabul ediyorum.</span></label>`:''}
      </div>
      <div class="btns">
        <button class="btn btn-ok" id="okBtn" disabled>Siparişimi Onaylıyorum</button>
        <button class="btn btn-err" id="errBtn">Bilgilerde hata var / itiraz ediyorum</button>
      </div>
      <div class="note">Onayınız, siparişinizin hazırlanmasına başlanması için Rota SMI ekibine bildirilir.<br>Bir hata görürseniz onaylamadan bizimle iletişime geçin.</div>
    </div>
  </div>`;
  const ack=document.getElementById('ack'), ackNot=document.getElementById('ackNot'), ok=document.getElementById('okBtn');
  const sync=()=>{ok.disabled=!(ack.checked&&(!ackNot||ackNot.checked));};
  ack.onchange=sync; if(ackNot)ackNot.onchange=sync;
  ok.onclick=()=>submit('onaylandi');
  document.getElementById('errBtn').onclick=()=>{
    const sebep=prompt('Lütfen siparişteki hatayı / itirazınızı kısaca yazın\n(örn: 30 çuval istedim, 20 çuval görünüyor):','');
    if(sebep==null)return;
    if(!sebep.trim()){alert('Lütfen hatanın ne olduğunu yazın.');return;}
    submit('itiraz', sebep.trim());
  };
}

async function submit(kind, sebep){
  const o=ORDER;if(!o)return;
  const ok=document.getElementById('okBtn'), err=document.getElementById('errBtn'), ackNot=document.getElementById('ackNot');
  if(ok)ok.disabled=true; if(err)err.disabled=true;
  if(ok&&kind==='onaylandi')ok.textContent='Gönderiliyor...';
  try{
    const r=await fetch(UC,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({t:TOKEN,islem:kind,sebep:sebep||'',notOkundu:!!(kind==='onaylandi'&&ackNot&&ackNot.checked)})});
    if(!r.ok)throw new Error('sunucu');
  }catch(e){
    stateView('⚠','#fee2e2','#b91c1c','Gönderilemedi','Onayınız kaydedilemedi. Lütfen internet bağlantınızı kontrol edip tekrar deneyin.');return;
  }
  if(kind==='onaylandi')
    stateView('✓','#dcfce7','#16a34a','Teşekkürler!','Siparişiniz onaylandı ve Rota SMI ekibine iletildi. Hazırlık süreci başlatılacaktır.');
  else
    stateView('!','#fef3c7','#b45309','İtirazınız Alındı','Sipariş bilgilerine itirazınız ekibimize iletildi. En kısa sürede sizinle iletişime geçeceğiz.');
}

load();
</script>
</body>
</html>
