let _planAvId=null,_planRows=[];
function avansPlanDuzenle(avId){const a=DB.avanslar.find(x=>x.id===avId);if(!a)return;_planAvId=avId;
  _planRows=avansKesintiList(a).map(k=>({ay:k.ay,tutar:+k.tutar||0}));
  if(!_planRows.length)_planRows=[{ay:a.baslangicAy||ymAdd(curYM(),1),tutar:+a.tutar||0}];
  renderPlanEditor();}
function planToplamMetni(a){const top=_planRows.reduce((s,r)=>s+(+r.tutar||0),0);const fark=top-(+a.tutar||0);
  return {html:`Plan toplamı: ${fmtTL(top)} / Avans: ${fmtTL(a.tutar)}${fark?` · fark ${fmtTL(fark)}`:' ✓'}`,renk:fark?'var(--red-700)':'var(--green-700)'};}
function renderPlanEditor(){const a=DB.avanslar.find(x=>x.id===_planAvId);if(!a)return;
  const trash='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>';
  const rows=_planRows.map((r,i)=>`<div style="display:flex;gap:8px;align-items:flex-end;margin-bottom:6px">
    <div class="fld" style="margin:0;flex:1"><label>Ay</label><input type="month" value="${esc(r.ay||'')}" onchange="_planRows[${i}].ay=this.value;planRowSync()"></div>
    <div class="fld" style="margin:0;flex:1"><label>Kesinti (TL)</label><div class="para"><input type="number" value="${r.tutar||0}" oninput="_planRows[${i}].tutar=+this.value||0;planRowSync()"></div></div>
    <button class="iconbtn del" style="flex:0 0 auto;margin-bottom:5px" title="Bu ayı kaldır" onclick="_planRows.splice(${i},1);renderPlanEditor()">${trash}</button>
  </div>`).join('')||'<div style="color:var(--slate-400);font-size:13px;padding:6px 0">Satır yok — "+ Ay Ekle" ile başlayın.</div>';
  const t=planToplamMetni(a);
  document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)avansDetay('${a.personelId}')"><div class="modal">
    <div class="modal-hd"><h3>Kesinti Planı — ${fmtTL(a.tutar)} Avans</h3><button class="xbtn" onclick="avansDetay('${a.personelId}')">×</button></div>
    <div class="modal-bd">
      <div class="helptext" style="margin-bottom:10px">Her ay kesilecek tutarı elle girin. Kesmediğiniz ayı <b>silebilir</b>, taksitten <b>farklı tutar</b> yazabilir, yeni <b>ay ekleyebilirsiniz</b>.</div>
      <div id="planRows">${rows}</div>
      <div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-sm" onclick="planAyEkle()">+ Ay Ekle</button><button class="btn btn-sm" onclick="planEsitBol()">Eşit Taksitlere Böl</button></div>
      <div id="planToplam" style="margin-top:12px;font-size:13px;font-weight:600;color:${t.renk}">${t.html}</div>
    </div>
    <div class="modal-ft"><button class="btn" onclick="avansDetay('${a.personelId}')">Vazgeç</button><button class="btn btn-pri" onclick="planKaydet()">Kaydet</button></div>
  </div></div>`;}
function planRowSync(){const a=DB.avanslar.find(x=>x.id===_planAvId);if(!a)return;const el=document.getElementById('planToplam');if(!el)return;const t=planToplamMetni(a);el.style.color=t.renk;el.innerHTML=t.html;}
function planAyEkle(){const last=_planRows.length?_planRows[_planRows.length-1].ay:curYM();_planRows.push({ay:ymAdd(last,1),tutar:0});renderPlanEditor();}
function planEsitBol(){const a=DB.avanslar.find(x=>x.id===_planAvId);if(!a)return;_planRows=esitTaksitPlani(a.tutar,a.taksit,a.baslangicAy||ymAdd(curYM(),1));renderPlanEditor();}
function planKaydet(){const a=DB.avanslar.find(x=>x.id===_planAvId);if(!a)return;a.kesintiler=_planRows.filter(r=>r.ay).map(r=>({ay:r.ay,tutar:+r.tutar||0}));saveDB();render();avansDetay(a.personelId);toast('Kesinti planı kaydedildi');}

function trafikBase(t){return +t.odemeTutari||+t.cezaTutari||0;} // personelden tahsil edilecek esas (ödenen tutar)
function trafikKesintiList(t){return Array.isArray(t.kesintiler)?t.kesintiler.filter(k=>k&&k.ay).map(k=>({ay:k.ay,tutar:+k.tutar||0})).sort((a,b)=>String(a.ay).localeCompare(String(b.ay))):[];}
function trafikTahsil(t,ref){ref=ref||curYM();return trafikKesintiList(t).filter(k=>String(k.ay)<=ref).reduce((s,k)=>s+k.tutar,0);}
function trafikTahsilKalan(t){return Math.max(0,trafikBase(t)-trafikTahsil(t));}

Rota SMI Tarım

function trafikWaDeger(t){
  const p=DB.personeller.find(x=>x.id===t.personelId)||{};
  const plan=trafikKesintiList(t);
  const toplamTak=plan.reduce((s,k)=>s+k.tutar,0);
  const taksit=plan.length?`${plan.length} taksit${plan.length>1?' hâlinde':''} (toplam ${fmtTL(toplamTak)})`:'—';
  const baslangic=plan.length?fmtYM(plan[0].ay):'—';
  const indirim=t.odemeTarihi
    ? (t.indirimli?`İndirimli (%25 erken ödeme) ödendi — ${fmtTL(t.odemeTutari)}`:`İndirimsiz ödendi — ${fmtTL(t.odemeTutari)}`)
    : (t.indirimli?'İndirimli (%25) ödenecek':'Henüz ödenmedi');
  return {ad_soyad:titleCaseTr(p.ad||''),tarih:t.cezaTarihi?fmtDate(t.cezaTarihi):'—',plaka:t.plaka||'—',konum:t.konum||'—',tutar:fmtTL(t.cezaTutari),indirim,taksit,baslangic};
}

}

// ═══ TRAFİK — CEZA YERLERİ RAPORU (şoför uyarısı için lokasyon veritabanı) ═══
function trafikYerRapor(ym){
  ym=(ym===undefined)?'':ym;
  const hepsi=(DB.trafikCezalari||[]).filter(t=>(t.konum||'').trim());
  const kayitlar=hepsi.filter(t=>!ym||String(t.cezaTarihi||'').slice(0,7)===ym);
  const konumsuz=(DB.trafikCezalari||[]).length-hepsi.length;
  const grup={};
  kayitlar.forEach(t=>{const k=t.konum.trim();if(!grup[k])grup[k]={say:0,tutar:0,madde:{}};grup[k].say++;grup[k].tutar+=(+t.cezaTutari||0);const m=(t.madde||'—').trim()||'—';grup[k].madde[m]=(grup[k].madde[m]||0)+1;});
  const satir=Object.entries(grup).sort((a,b)=>b[1].say-a[1].say||b[1].tutar-a[1].tutar);
  const ayInput=`<input type="month" value="${ym}" onchange="trafikYerRapor(this.value)" style="padding:6px 9px;border:1px solid var(--slate-300);border-radius:8px">`;
  const tumBtn=ym?`<button class="btn btn-sm" onclick="trafikYerRapor('')">Tüm zamanlar</button>`:`<span style="font-size:12px;color:var(--slate-500)">Tüm zamanlar</span>`;
  const rows=satir.length?satir.map(([k,v])=>{const md=Object.entries(v.madde).sort((a,b)=>b[1]-a[1]).map(([m,n])=>`${esc(m)}${n>1?' ×'+n:''}`).join(', ');
    return `<tr><td style="font-weight:600">${esc(k)}</td><td class="num">${v.say}</td><td class="num">${fmtTL(v.tutar)}</td><td style="font-size:12px;color:var(--slate-600)">${md}</td></tr>`;}).join('')
    :`<tr><td colspan="4" style="text-align:center;color:var(--slate-400);padding:20px">${ym?'Bu ayda konumlu ceza kaydı yok.':'Konum girilmiş ceza kaydı yok.'}</td></tr>`;
  document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal lg" style="max-width:720px">
    <div class="modal-hd"><h3>Ceza Yerleri Raporu</h3><button class="xbtn" onclick="closeModal()">×</button></div>
    <div class="modal-bd">
      <div class="helptext" style="margin-bottom:10px">Cezaların hangi lokasyonlarda kesildiğini gösterir — şoförleri bu noktalarda uyarmak için. ${konumsuz?`<b>${konumsuz}</b> kayıtta konum boş (rapora girmez).`:''}</div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">Ay: ${ayInput} ${tumBtn}<span style="margin-left:auto;font-size:12px;color:var(--slate-500)">${satir.length} lokasyon · ${kayitlar.length} ceza</span></div>
      <div class="tbl-scroll"><table class="t"><thead><tr><th>Ceza Yeri</th><th class="num">Kez</th><th class="num">Toplam</th><th>Maddeler</th></tr></thead><tbody>${rows}</tbody></table></div>
    </div>
    <div class="modal-ft"><button class="btn" onclick="closeModal()">Kapat</button>${satir.length?`<button class="btn btn-wa" onclick="trafikYerWa('${ym}')">Şoför Uyarı Metni</button>`:''}</div>
  </div></div>`;
}
// Şoförlere gönderilecek "dikkat, buralarda ceza kesiliyor" uyarı metni
function trafikYerWa(ym){
  const hepsi=(DB.trafikCezalari||[]).filter(t=>(t.konum||'').trim()&&(!ym||String(t.cezaTarihi||'').slice(0,7)===ym));
  const grup={};hepsi.forEach(t=>{const k=t.konum.trim();if(!grup[k])grup[k]={say:0,madde:{}};grup[k].say++;const m=(t.madde||'').trim();if(m)grup[k].madde[m]=(grup[k].madde[m]||0)+1;});
  const satir=Object.entries(grup).sort((a,b)=>b[1].say-a[1].say);
  const donem=ym?fmtYM(ym):'son dönem';
  let msg=`Trafik Cezası Uyarısı — ${donem}\n\nDeğerli arkadaşlar,\nAşağıdaki noktalarda ceza kesildiği tespit edilmiştir. Lütfen bu bölgelerde kurallara ve hız limitlerine ekstra dikkat edelim:\n\n`;
  satir.forEach(([k,v])=>{const md=Object.keys(v.madde).slice(0,3).join(', ');msg+=`${k}${v.say>1?` (${v.say} ceza)`:''}${md?` — ${md}`:''}\n`;});
  msg+=`\nGüvenli sürüşleriniz için teşekkür ederiz.\n\nRota SMI Tarım`;
  document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div class="modal-hd"><h3>Şoför Uyarı Metni</h3><button class="xbtn" onclick="closeModal()">×</button></div>

      <textarea id="tyer_msg" class="code" style="min-height:300px">${esc(msg)}</textarea></div>
    <div class="modal-ft"><button class="btn" onclick="trafikYerRapor('${ym}')">‹ Rapora Dön</button><button class="btn" onclick="(function(){var e=document.getElementById('tyer_msg');e.select();try{document.execCommand('copy')}catch(x){};toast('Kopyalandı')})()">Kopyala</button><button class="btn btn-wa" onclick="window.open('https://wa.me/?text='+encodeURIComponent(document.getElementById('tyer_msg').value),'_blank')">WhatsApp'ta Aç</button></div>
  </div></div>`;
}

  let h=`<p class="intro">Araç trafik cezalarını takip edin: tutanak, ceza maddesi (numara girince içerik otomatik gelir), devlete ödeme (indirimli/normal) ve personelden maaş kesintisi (taksitli olabilir). Her kayıttan antetli <b>Trafik Cezası Tebliğ Tutanağı</b> yazdırabilirsiniz.</p>`;
  h+=`<div class="kpis">
    <div class="kpi r"><div class="kl">Toplam Ceza</div><div class="kv">${fmtTL(toplamCeza)}</div><div class="ks">${list.length} kayıt</div></div>
    <div class="kpi a"><div class="kl">Devlete Ödenen</div><div class="kv">${fmtTL(odenen)}</div><div class="ks">indirimli + normal</div></div>

          <div class="fld" style="margin:0;width:140px"><label>İlk Ay</label><input type="month" id="tplan_basay" value="${_tplanRows[0]?_tplanRows[0].ay:ymAdd(curYM(),1)}"></div>

    </div>

  const css=`@page{size:A4;margin:8mm 12mm}*{box-sizing:border-box}html,body{margin:0;font-family:Calibri,Carlito,'Segoe UI',sans-serif;color:#111;font-size:11pt;line-height:1.5}

// ============ RAPORLAR ============
// ---- Veri yardımcıları (tarihler ISO 'YYYY-MM-DD', sözlüksel karşılaştırma) ----
function rpAktif(){return DB.personeller.filter(p=>p.durum!=='ayrildi'&&!p.sarkuteri);} // şarküteri fabrika raporlarına dahil değil
function rpAd(pid){const p=DB.personeller.find(x=>x.id===pid);return p?p.ad:'—';}
function rpGirenler(s,e){return DB.personeller.filter(p=>p.iseGiris&&p.iseGiris>=s&&p.iseGiris<=e);}
function rpCikanlar(s,e){return DB.personeller.filter(p=>p.ayrilisTarihi&&p.ayrilisTarihi>=s&&p.ayrilisTarihi<=e);}
function isoGunEkle(iso,n){const d=parseISO(iso);if(!d)return iso;d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
// Belirli bir TARİHTE aktif olan personel (şarküteri hariç — fabrika raporu mantığı, rpAktif ile aynı).
// as-of: refISO tarihinde işe girmiş VE (ayrılmamış ya da ayrılışı reften SONRA). Tarihsiz ayrılanlar sayılmaz.
function rpAktifAsOf(refISO){return DB.personeller.filter(p=>{
  if(p.sarkuteri)return false;
  const gir=(p.iseGiris||'').slice(0,10);if(gir&&gir>refISO)return false;
  const cik=(p.ayrilisTarihi||'').slice(0,10);if(cik)return cik>refISO;
  return p.durum!=='ayrildi';});}
// ÇALIŞILAN BÖLÜM bazlı sayım (departman değil): p.bolum → yoksa görev → yoksa departman → 'Belirtilmemiş'.
function rpBolumSayimAsOf(refISO){const m={};rpAktifAsOf(refISO).forEach(p=>{
  let b=(p.bolum||'').trim()||(p.gorev||'').trim()||(p.departman||'').trim()||'Belirtilmemiş';
  b=titleCaseTr(b);m[b]=(m[b]||0)+1;});return m;}
// Raporda satır satır gösterilecek bölümler (kullanıcı seçimi, 18 Tem 2026). Buraya ekle/çıkar → rapor daralır/genişler.
// Listelenmeyen bölümler tek "Diğer Bölümler" satırında toplanır; TOPLAM ve başlık HER ZAMAN tüm personeli kapsar.
const RP_BOLUM_LISTE=['Beyaz Peynir Paketleme','Beyaz Peynir Üretim','Kaşar Peyniri Üretim','Kaşar Peyniri Paketleme','Kalite Bölümü','Tereyağı Üretim','Depo/sevkiyat','Lor Üretim'];
// 3. bölüm — SEÇİLİ çalışılan bölüm sayıları + önceki dönem kıyası (sayı ve %). Toplam tüm personel.
function rpBolumKiyasSec(curMap,prevMap,prevLabel){
  const curTop=Object.values(curMap).reduce((a,b)=>a+b,0),prevTop=Object.values(prevMap).reduce((a,b)=>a+b,0);
  const fark=(c,p)=>{const d=c-p,renk=d>0?'#15803d':d<0?'#b91c1c':'#888';return `<span style="display:block;text-align:right;color:${renk};font-weight:600">${d>0?'+':''}${d}</span>`;};
  const yuzde=(c,p)=>{if(p===0)return c>0?'<span style="display:block;text-align:right;color:#15803d;font-weight:600">yeni</span>':'<span style="display:block;text-align:right;color:#888">—</span>';
    const y=Math.round((c-p)/p*100),renk=y>0?'#15803d':y<0?'#b91c1c':'#888';return `<span style="display:block;text-align:right;color:${renk}">${y>0?'+':y<0?'−':''}%${Math.abs(y)}</span>`;};
  // Seçili bölümleri kullanıcının verdiği sırada göster (titleCaseTr ile depo anahtarına eşleştir).
  const secili=RP_BOLUM_LISTE.map(titleCaseTr);const seciliSet=new Set(secili);
  let selCur=0,selPrev=0;
  const rows=secili.map(k=>{const c=curMap[k]||0,p=prevMap[k]||0;selCur+=c;selPrev+=p;return [esc(k),p,c,fark(c,p),yuzde(c,p)];});
  // Listelenmeyen tüm bölümler → tek "Diğer Bölümler" satırı (toplam tüm personeli tutsun diye)
  const digCur=curTop-selCur,digPrev=prevTop-selPrev;
  if(digCur>0||digPrev>0)rows.push(['<span style="color:#888">Diğer Bölümler</span>',digPrev,digCur,fark(digCur,digPrev),yuzde(digCur,digPrev)]);
  rows.push(['<b>TOPLAM (tüm personel)</b>',prevTop,curTop,fark(curTop,prevTop),yuzde(curTop,prevTop)]);
  const dTop=curTop-prevTop;
  const bas=`3. Bölüm Bazlı Personel Sayısı (Toplam Aktif: ${curTop} · ${prevLabel.toLocaleLowerCase('tr')}: ${prevTop} · ${dTop>0?'+':''}${dTop})`;
  return rpSec(bas,rpTablo(['Bölüm',prevLabel,'Şu An','Değişim','%'],rows));
}
function rpIhbar(){return rpAktif().filter(p=>p.durum==='ihbar'&&p.iseGiris&&p.ihbarBaslangic).map(p=>({p,bitis:ihbarHesapla(p.iseGiris,p.ihbarBaslangic,ihbarKesintiGun(p,p.ihbarBaslangic),haftaTatiliGunleri(p)).bitis}));}
function rpIzin(s,e){return DB.izinler.filter(z=>z.tur==='yillik'&&z.baslangic&&z.baslangic<=e&&(z.bitis||z.baslangic)>=s).map(z=>({ad:rpAd(z.personelId),bas:z.baslangic,bit:z.bitis||z.baslangic,gun:z.gun}));}
function rpKaza(s,e){return DB.isKazalari.filter(k=>k.tarih&&k.tarih>=s&&k.tarih<=e).sort((a,b)=>(b.tarih||'').localeCompare(a.tarih||''));}
// Maaş artışları — Maaş Artışı modülünden (net, elle). Eski otomatik brüt izi (DB.maasGecmisi) artık rapora girmez.
function rpMaasArtis(s,e){return (DB.maasArtis||[]).filter(m=>m.tarih&&m.tarih>=s&&m.tarih<=e).map(m=>{const c=maasArtisHesap(m);return {ad:rpAd(m.personelId),onceki:c.onceki,yeni:c.yeni,artim:c.artim,yuzde:c.yuzde,tarih:m.tarih};});}
function rpTazminat(s,e){return DB.tazminatOdeme.filter(o=>o.tarih&&o.tarih>=s&&o.tarih<=e).map(o=>({ad:rpAd(o.personelId),kidem:+o.kidem||0,ihbar:+o.ihbar||0,tarih:o.tarih}));}
function rpAvans(s,e){return DB.avanslar.filter(a=>a.tarih&&a.tarih>=s&&a.tarih<=e).map(a=>({ad:rpAd(a.personelId),tutar:+a.tutar||0,tarih:a.tarih}));}
function rpTrafik(s,e){return DB.trafikCezalari.filter(t=>t.cezaTarihi&&t.cezaTarihi>=s&&t.cezaTarihi<=e).map(t=>({ad:rpAd(t.personelId),tutar:+t.cezaTutari||0,tarih:t.cezaTarihi,plaka:t.plaka}));}
function rpAydanAralik(ym){const a=String(ym).split('-').map(Number);const son=new Date(a[0],a[1],0).getDate();return {s:ym+'-01',e:ym+'-'+String(son).padStart(2,'0')};}
function rpHaftaThis(){const d=new Date();const g=d.getDay()||7;const mon=new Date(d);mon.setDate(d.getDate()-g+1);const sun=new Date(mon);sun.setDate(mon.getDate()+6);
  const iso=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');return {s:iso(mon),e:iso(sun)};}
function rpTablo(bas,sat){if(!sat.length)return '<div class="bos">Kayıt yok.</div>';return `<table><thead><tr>${bas.map(b=>`<th>${b}</th>`).join('')}</tr></thead><tbody>${sat.map(r=>`<tr>${r.map((c,i)=>`<td data-label="${esc(bas[i]||'')}"${i>0&&typeof c==='number'?' class="num"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;}

// İSG kaza türü (şekli) kategorileri — analiz için gruplama.
const KAZA_TURLERI=['Kesik / Kesici alet','Düşme (yüksekten)','Kayma / Takılma / Aynı seviye','Sıkışma / Ezilme','Çarpma / Çarpışma','Yanık (sıcak/buhar/kimyasal)','Elektrik çarpması','Kaldırma / Zorlanma (kas-iskelet)','Makine / Ekipman kazası','Kimyasal maruziyet','Göze cisim/sıvı kaçması','Trafik / Araç kazası','Diğer'];
// Kaza türü grubu: elle seçilen (k.turu) öncelikli; yoksa serbest metinden (sebep/sonrası) anahtar kelimeyle tahmin.
function kazaTurGrup(k){if(k.turu)return k.turu;
  const s=((k.sebep||'')+' '+(k.sonrasi||'')).toLocaleLowerCase('tr');
  const kur=[[/kes(ti|ik|erek|me)|bıçak|jilet|testere|cam kır|dilim/,'Kesik / Kesici alet'],
    [/yan(dı|ık|ma|ığı)|haşlan|buhar|sıcak su|kaynar|kızgın/,'Yanık (sıcak/buhar/kimyasal)'],
    [/elektri|akım|çarpıl/,'Elektrik çarpması'],
    [/sıkış|ezil|ezdi|preslen|arasına|kaptır/,'Sıkışma / Ezilme'],
    [/makine|mikser|konveyör|bant|dişli|motor|çark|değirmen/,'Makine / Ekipman kazası'],
    [/göz(ün|e|üne)| göze /,'Göze cisim/sıvı kaçması'],
    [/kimyasal|asit|baz |deterjan|amonyak|klor/,'Kimyasal maruziyet'],
    [/kaldır|zorlan|bel(ini|i |ine)|fıtık|incin|burkul|kas /,'Kaldırma / Zorlanma (kas-iskelet)'],
    [/yüksek|merdiven|iskele|kattan|platform|çatı/,'Düşme (yüksekten)'],
    [/kay(dı|arak|ma)|takıl|ıslak|zemin|düş(tü|me|erek)/,'Kayma / Takılma / Aynı seviye'],
    [/çarp|vurdu|çarptı|toslad/,'Çarpma / Çarpışma'],
    [/araç|trafik|forklift|kamyon|tır |servis/,'Trafik / Araç kazası']];
  for(const [re,t] of kur)if(re.test(s))return t;return 'Diğer';}

// ---- İŞ KAZASI ANALİZİ — bölüm & tür bazında dağılım, kayıp gün, trend (önlem önceliği) ----
function kazaAnalizVeri(){const yilSel=kazaAnalizYil;const all=DB.isKazalari||[];
  const kz=yilSel?all.filter(k=>(k.tarih||'').slice(0,4)===yilSel):all;

  // Trend

// İşten çıkanın tazminat/izin özeti — TUTARLAR çıkış evraklarındaki KESİN tutardan (DB.tazminatOdeme kaynak:'cikis')
// gelir, yoksa hesaplanan. İhbar yönü koda göre: kod.ihbar → işveren ödedi; istifa (kod.onel + taraf 'isci', ör. 03)
// → işçiden kesildi (önel çalışılmadıysa). Kod yoksa (elle ayrıldı) alanlar '—'.
function cikisTazBilgi(p){
  const kod=p.cikisKodu?sgkKod(p.cikisKodu):null;
  const ref=p.ayrilisTarihi||todayISO();
  const od=DB.tazminatOdeme.find(o=>o.personelId===p.id&&o.kaynak==='cikis'&&o.tarih===ref);
  const h=tazminatHesap(p,ref);
  const kalan=izinStat(p,+String(ref).slice(0,4)).kalan;
  const izinUcret=kalan>0?Math.round((h.brut/30)*kalan):0;
  const kidem=(kod&&kod.kidem)?(od&&od.kidem>0?od.kidem:(h.kidemHak?Math.round(h.kidemNet):0)):0;
  let ihbarYon='yok',ihbar=0;
  if(kod&&kod.ihbar){ihbarYon='ode';ihbar=od&&od.ihbar>0?od.ihbar:Math.round(h.ihbarNet);}
  else if(kod&&kod.onel&&kod.taraf==='isci'){ihbarYon='kes';ihbar=od&&od.ihbar>0?od.ihbar:Math.round(h.ihbarNet);}
  const izin=od&&od.izin>0?od.izin:izinUcret;
  return {kod,kidemVar:!!(kod&&kod.kidem),kidemHak:h.kidemHak,kidem,ihbarYon,ihbar,izin,kalan};
}

  else if(/KAZASI/.test(baslik))
    govde=`Firmamızda meydana gelen iş kazalarına ilişkin *İş Kazası Raporu* (${ust}) hazırlanmıştır. Kazaların detayları ile aylık ve yıllık istatistiklere aşağıdaki bağlantıdan ulaşabilirsiniz:\n\n${url}`;
  else if(/AYLIK/.test(baslik))

// ============ PERSONEL ANALİZİ — yıllık fazla mesai (270) takibi + kişi bazlı yönetim raporu ============
// FM1 = fazla çalışma (4857 m.41 — YILDA AZAMİ 270 SAAT; hafta tatili çalışması Yargıtay içtihadıyla dahildir).
// FM2 = genel tatil (UBGT) mesaisi (m.47) — AYRI ücret kalemidir, 270 sınırına GİRMEZ; bilgi olarak gösterilir.
const FM_YASAL=270;
let analizTab='yillik', analizYil=new Date().getFullYear(), analizPid='', analizQ='', anlzRows=null, anlzDolu={};
function anlzVeriVar(pid,ym){const d=DB.puantaj&&DB.puantaj[ym];return !!(d&&d.rows&&d.rows[pid]);}
// Ay DÜZEYİNDE "PDKS/elle saat girilmiş mi" — satır VARLIĞI yetmez (Puantaj ekranını açmak bile boş satır
// yaratır); tahmin tabanına yalnız gerçekten saat verisi olan aylar girsin diye herhangi bir satırda saat aranır.
function anlzAyDolu(ym){if(ym in anlzDolu)return anlzDolu[ym];
  const d=DB.puantaj&&DB.puantaj[ym];let dolu=false;
  if(d&&d.rows)for(const k in d.rows){const r=d.rows[k]||{};
    if((r.saat&&Object.keys(r.saat).length)||(r.msaat&&Object.keys(r.msaat).length)){dolu=true;break;}}
  return anlzDolu[ym]=dolu;}
// O ay bordroda görünür mü — pzAyPersonel ile AYNI kural (girişten önce / ayrılıştan sonra ay yok sayılır)
function anlzIste(p,info){const ym=info.y+'-'+String(info.m).padStart(2,'0');
  const ayBas=ym+'-01',aySon=ym+'-'+String(info.gun).padStart(2,'0');
  const gir=(p.iseGiris||'').slice(0,10),cik=(p.ayrilisTarihi||'').slice(0,10);
  if(gir&&gir>aySon)return false;
  return cik?cik>=ayBas:(p.durum!=='ayrildi');}
// Hafif yıllık FM — liste sekmesi. Puantaj satırı olmayan ayda saat de FM de OLUŞAMAZ (kart/elle saat ve
// boyama hepsi o satırda durur) → boş aylar hesaplanmaz, ~190 kişide liste hızlı kalır.
function anlzFmYil(p,yil){const simdi=curYM();let fm1=0,fm2=0,ayVeri=0,fm1Tam=0,nTam=0;const ay=[];
  for(let m=1;m<=12;m++){const ym=yil+'-'+String(m).padStart(2,'0');
    const onceki=m===1?(yil-1)+'-12':yil+'-'+String(m-1).padStart(2,'0');
    const veri=anlzVeriVar(p.id,ym);
    // Önceki ayın kuyruğu (AHSX) sınır haftasıyla BU AYA FM taşıyabilir — bu ay boş olsa bile.
    // O yüzden atlama, önceki ayda da veri yoksa yapılır.
    const f=(veri||anlzVeriVar(p.id,onceki))?asFmKisi(p,ym):{fm1:0,fm2:0};
    fm1+=f.fm1;fm2+=f.fm2;if(veri)ayVeri++;
    // Tahmin tabanı: yalnız TAMAMLANMIŞ + saat verisi girilmiş + kişinin çalıştığı aylar.
    // İçinde bulunulan (kısmi) ay tabana girmez — girerse tahmin sistematik düşük çıkar.
    if(ym<simdi&&anlzAyDolu(ym)&&anlzIste(p,pzAyBilgi(ym))){nTam++;fm1Tam+=f.fm1;}
    ay.push({ym,fm1:f.fm1,fm2:f.fm2,veri});}
  const r2=v=>Math.round(v*100)/100;
  return {fm1:r2(fm1),fm2:r2(fm2),ayVeri,ay,fm1Tam:r2(fm1Tam),nTam};}
// O yıl en az bir ay bordroda görünen HERKES (yıl içinde ayrılanlar dahil) — pzAyPersonel birleşimi
function anlzYilKisiler(yil){const ids=new Set(),out=[];
  for(let m=1;m<=12;m++){pzAyPersonel(pzAyBilgi(yil+'-'+String(m).padStart(2,'0'))).forEach(p=>{if(!ids.has(p.id)){ids.add(p.id);out.push(p);}});}
  return out;}
// Tam kişi+ay analiz verisi — detay sekmesi. SALT OKUNUR: asPzRow kullanılır (pzRow satır YARATIR, kullanma).
function anlzKisiAy(p,ym){const info=pzAyBilgi(ym),r=asPzRow(p.id,ym),restSet=haftaTatiliGunleri(p),
    izinMap=pzIzinGunleri(p.id,info),pasif=pzPasifSet(p,info),iste=anlzIste(p,info);
  return {info,iste,fm:pzFM(p,restSet,info,r,izinMap,pasif),c:pzSayim(r,info,restSet,izinMap,pasif),
    veri:anlzVeriVar(p.id,ym),prim:(!iste||p.devamPrimYok)?{tutar:0,kaynak:'yok'}:pzDevamPrim(p,info,r),
    avans:pzAvansAy(p.id,ym),trafik:pzTrafikAy(p.id,ym)};}
function anlzDetayYil(p,yil){const simdi=curYM();const t={fm1:0,fm2:0,gs:0,cs:0,d:0,r:0,rk:0,yi:0,ui:0,maz:0,prim:0,avans:0,trafik:0,ayVeri:0};const aylik=[];
  for(let m=1;m<=12;m++){const ym=yil+'-'+String(m).padStart(2,'0');const k=anlzKisiAy(p,ym);k.ym=ym;k.gelecek=ym>simdi;
    // Toplamlar tabloda GÖRÜNENLE tutarlı: gelecek aylar "—" gösterildiği için saat/gün/prim toplanmaz;
    // avans ve trafik kesintisi ise planlı taksit olarak gösterildiğinden tüm yıl toplanır.
    if(!k.gelecek){t.fm1+=k.fm.fm1;t.fm2+=k.fm.fm2;t.gs+=k.fm.gs;t.cs+=k.fm.cs;
      t.d+=k.c['D']||0;t.r+=k.c['R']||0;t.rk+=k.c['RK']||0;t.yi+=k.c['Yİ']||0;t.ui+=k.c['Üİ']||0;t.maz+=k.c['M']||0;
      t.prim+=k.prim.tutar||0;}
    t.avans+=k.avans;t.trafik+=k.trafik;if(k.veri)t.ayVeri++;aylik.push(k);}
  ['fm1','fm2','gs','cs'].forEach(x=>t[x]=Math.round(t[x]*100)/100);
  return {t,aylik};}
// Avans VERİLEN (a.tarih yılına göre) — puantajdaki kesinti taksitlerinden (pzAvansAy) FARKLI kavram
function anlzAvansVerilen(pid,yil){return DB.avanslar.filter(a=>a.personelId===pid&&String(a.tarih||'').slice(0,4)===String(yil)).reduce((s,a)=>s+(+a.tutar||0),0);}
// Trafik CEZASI (cezaTarihi yılına göre) — maaş kesintisi (pzTrafikAy) FARKLI kavram, taksit sonraki yıla sarkabilir
function anlzTrafikCeza(pid,yil){return (DB.trafikCezalari||[]).filter(t=>t.personelId===pid&&String(t.cezaTarihi||'').slice(0,4)===String(yil)).reduce((s,t)=>s+(+t.cezaTutari||0),0);}
function anlzDurum(p,fm1){if(p.fmYok)return '<span class="badge b-off">FM verilmez</span>';
  if(fm1>=FM_YASAL)return '<span class="badge" style="background:var(--red-100);color:var(--red-700)">Sınır aşıldı</span>';
  if(fm1>=FM_YASAL*0.8)return '<span class="badge" style="background:var(--amber-100);color:var(--amber-700)">Riskli</span>';
  return '<span class="badge b-on">Normal</span>';}
function anlzBar(oran){const w=Math.min(100,Math.round(oran*100));
  const renk=oran>=1?'var(--red-500)':oran>=.8?'var(--amber-500)':'var(--green-600)';
  return `<div style="display:flex;align-items:center;gap:8px"><div style="flex:1;min-width:70px;height:7px;background:var(--slate-200);border-radius:20px;overflow:hidden"><div style="width:${w}%;height:100%;background:${renk}"></div></div><span class="num" style="font-size:11px;color:var(--slate-600)">%${Math.round(oran*100)}</span></div>`;}
function renderAnaliz(){
  anlzDolu={}; // ay-doluluk önbelleği her çizimde tazelenir (PDKS aktarımı sonrası bayat kalmasın)
  if(analizPid&&!DB.personeller.find(x=>x.id===analizPid))analizPid='';
  let h=`<p class="intro">Yıllık <b>fazla mesai (FM1)</b> takibi — 4857 sayılı İş Kanunu m.41 gereği fazla çalışma <b>yılda ${FM_YASAL} saati geçemez</b>. FM2 (genel tatil mesaisi) ayrı ücret kalemidir, bu sınıra girmez. <b>Personel Detay Raporu</b> sekmesinde kişi bazlı, antetli/yazdırılabilir yönetim raporu vardır.</p>`;
  h+=`<div class="ptabs">
    <button class="ptab${analizTab==='yillik'?' on':''}" onclick="analizTab='yillik';render()">Yıllık Fazla Mesai (${FM_YASAL} Saat)</button>
    <button class="ptab${analizTab==='detay'?' on':''}" onclick="analizTab='detay';render()">Personel Detay Raporu</button>
    <button class="ptab${analizTab==='sgk'?' on':''}" onclick="analizTab='sgk';render()">Aylık SGK &amp; Maaş</button>
    <button class="ptab${analizTab==='mali'?' on':''}" onclick="analizTab='mali';render()">Mali Analiz</button></div>`;
  h+=analizTab==='yillik'?anlzYillikHtml():analizTab==='sgk'?anlzSgkHtml():analizTab==='mali'?anlzMaliHtml():anlzDetayHtml();
  document.getElementById('content').innerHTML=h;
  if(analizTab==='yillik')anlzListYaz();
}
function anlzYillikHtml(){
  anlzRows=anlzYilKisiler(analizYil).map(p=>({p,y:anlzFmYil(p,analizYil)})).sort((a,b)=>b.y.fm1-a.y.fm1);
  const izlenen=anlzRows.filter(r=>!r.p.fmYok);
  const topF1=Math.round(izlenen.reduce((s,r)=>s+r.y.fm1,0)*100)/100;
  const asan=izlenen.filter(r=>r.y.fm1>=FM_YASAL),risk=izlenen.filter(r=>r.y.fm1>=FM_YASAL*.8&&r.y.fm1<FM_YASAL);
  let h=`<div class="kpis">
    <div class="kpi"><div class="kl">İzlenen Personel</div><div class="kv">${izlenen.length}</div><div class="ks">${analizYil} yılında çalışan${anlzRows.length-izlenen.length?' · '+(anlzRows.length-izlenen.length)+' kişi FM verilmez':''}</div></div>
    <div class="kpi"><div class="kl">Toplam FM1</div><div class="kv">${asSaat(topF1)}</div><div class="ks">saat — tüm personel</div></div>
    <div class="kpi" style="${asan.length?'border-top-color:#dc2626;background:#fef2f2':''}"><div class="kl">Sınırı Aşan (≥${FM_YASAL})</div><div class="kv">${asan.length}</div><div class="ks">kişi</div></div>
    <div class="kpi" style="${risk.length?'border-top-color:#F59E0B;background:#fffbeb':''}"><div class="kl">Riskli (≥%80)</div><div class="kv">${risk.length}</div><div class="ks">${asSaat(FM_YASAL*.8)} saat ve üzeri</div></div>
  </div>`;
  if(asan.length||risk.length)h+=`<details class="ik-uyari" open><summary>${FM_YASAL} saat sınırı — takip gereken personel<span class="uyari-say">${asan.length+risk.length} kişi</span></summary><div class="uyari-govde">${asan.map(r=>`<div><b>${esc(r.p.ad)}</b> — ${asSaat(r.y.fm1)} saat (sınır AŞILDI, +${asSaat(r.y.fm1-FM_YASAL)})</div>`).join('')}${risk.map(r=>`<div>${esc(r.p.ad)} — ${asSaat(r.y.fm1)} saat (kalan ${asSaat(FM_YASAL-r.y.fm1)})</div>`).join('')}<div style="margin-top:6px;font-size:11.5px">Fazla çalışma planlamasında bu kişilere öncelik verin — m.41 sınırı aşılırsa idari yaptırım riski doğar.</div></div></details>`;
  h+=`<div class="card"><div class="card-hd"><h3>${analizYil} — Yıllık Fazla Mesai Sıralaması</h3><span class="hint">FM1 çoktan aza · satıra tıklayınca detay raporu açılır</span></div>
    <div class="ptoolbar" style="padding:10px 14px 0;border:none"><div class="psearch"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="anlzQ" placeholder="Personel ara…" value="${esc(analizQ)}" oninput="analizQ=this.value;anlzListYaz()"></div></div>

// ============ MALİ ANALİZ — Aylık SGK & Maaş + puantaj bağlamından yönetici raporu (grafik + tablo) ============
function fmtKisa(n){n=+n||0;const a=Math.abs(n);if(a>=1e6)return (n/1e6).toLocaleString('tr-TR',{maximumFractionDigits:1})+' M';if(a>=1e3)return Math.round(n/1e3)+' B';return String(Math.round(n));}
// Çubuk grafik (gruplu ya da yığılı). cats: dilim etiketleri, series:[{name,color,vals[]}].
function svgBars(cats,series,opts){opts=opts||{};const W=opts.w||760,H=opts.h||212,pl=opts.l||54,pad={l:pl,r:14,t:12,b:26};
  const iw=W-pad.l-pad.r,ih=H-pad.t-pad.b,stacked=!!opts.stacked;
  const maxV=Math.max(1,...(stacked?cats.map((c,ci)=>series.reduce((s,se)=>s+(+se.vals[ci]||0),0)):series.flatMap(s=>s.vals.map(v=>+v||0))));
  const n=cats.length||1,gw=iw/n;const fx=opts.fmt||(v=>Math.round(v));
  let grid='';for(let i=0;i<=4;i++){const v=maxV*i/4,y=pad.t+ih-(v/maxV)*ih;grid+=`<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${(W-pad.r).toFixed(1)}" y2="${y.toFixed(1)}" stroke="#eef2f7"/><text x="${(pad.l-6).toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#94a3b8">${fx(v)}</text>`;}
  let bars='';cats.forEach((c,ci)=>{const cx=pad.l+ci*gw+gw/2;
    if(stacked){const bw=Math.min(34,gw*0.5);let acc=0;series.forEach(se=>{const v=+se.vals[ci]||0;if(v<=0)return;const bh=(v/maxV)*ih,y=pad.t+ih-(acc+v)/maxV*ih;acc+=v;bars+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${se.color}"><title>${esc(c)} · ${esc(se.name)}: ${fx(v)}</title></rect>`;});}
    else{const bw=(gw*0.64)/series.length,x0=cx-(bw*series.length)/2;series.forEach((se,si)=>{const v=+se.vals[ci]||0;if(v<=0)return;const bh=(v/maxV)*ih,x=x0+si*bw,y=pad.t+ih-bh;bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1,bw-1.5).toFixed(1)}" height="${bh.toFixed(1)}" rx="1.5" fill="${se.color}"><title>${esc(c)} · ${esc(se.name)}: ${fx(v)}</title></rect>`;});}
    bars+=`<text x="${cx.toFixed(1)}" y="${(H-9).toFixed(1)}" text-anchor="middle" font-size="9.5" fill="#64748b">${esc(c)}</text>`;});
  const leg=series.length>1?series.map(se=>`<span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#475569;margin:0 14px 4px 0"><span style="width:11px;height:11px;border-radius:2px;background:${se.color}"></span>${esc(se.name)}</span>`).join(''):'';
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:340px;display:block">${grid}${bars}</svg></div>${leg?`<div style="display:flex;flex-wrap:wrap;padding:6px 2px 0">${leg}</div>`:''}`;}
// Alan/çizgi grafik (personel gibi tek seri).
function svgArea(cats,vals,opts){opts=opts||{};const W=opts.w||760,H=opts.h||190,pl=opts.l||44,pad={l:pl,r:14,t:12,b:26};
  const iw=W-pad.l-pad.r,ih=H-pad.t-pad.b,col=opts.color||'#1E3E90';const pos=vals.filter(v=>+v>0);
  const maxV=Math.max(1,...vals.map(v=>+v||0)),lo=opts.zero||!pos.length?0:Math.max(0,Math.min(...pos)-(maxV-Math.min(...pos))*0.25),rng=Math.max(1,maxV-lo);
  const fx=opts.fmt||(v=>Math.round(v));const N=cats.length;
  const pts=cats.map((c,i)=>({x:pad.l+(N===1?iw/2:i*iw/(N-1)),y:pad.t+ih-(((+vals[i]||0)-lo)/rng)*ih,v:+vals[i]||0,c}));
  let grid='';for(let i=0;i<=3;i++){const v=lo+rng*i/3,y=pad.t+ih-((v-lo)/rng)*ih;grid+=`<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${(W-pad.r).toFixed(1)}" y2="${y.toFixed(1)}" stroke="#eef2f7"/><text x="${(pad.l-6).toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#94a3b8">${fx(v)}</text>`;}
  const line=pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
  const area=`M${pts[0].x.toFixed(1)} ${(pad.t+ih).toFixed(1)} `+pts.map(p=>'L'+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ')+` L${pts[N-1].x.toFixed(1)} ${(pad.t+ih).toFixed(1)} Z`;
  const dots=pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.6" fill="${col}"><title>${esc(p.c)}: ${fx(p.v)}</title></circle><text x="${p.x.toFixed(1)}" y="${(p.y-6).toFixed(1)}" text-anchor="middle" font-size="8.5" fill="#475569">${fx(p.v)}</text>`).join('');
  const labels=cats.map((c,i)=>`<text x="${pts[i].x.toFixed(1)}" y="${(H-9).toFixed(1)}" text-anchor="middle" font-size="9.5" fill="#64748b">${esc(c)}</text>`).join('');
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:340px;display:block"><path d="${area}" fill="${col}" opacity="0.1"/>${grid}<path d="${line}" fill="none" stroke="${col}" stroke-width="2.2"/>${dots}${labels}</svg></div>`;}
function anlzMaliVeri(yil){const cur=curYM();const aylar=[];

  for(let m=1;m<=12;m++){const ym=yil+'-'+String(m).padStart(2,'0'),gelecek=ym>cur,info=pzAyBilgi(ym);
    const o=aozKayit(ym),b=gelecek?null:anlzAyBaglam(ym),met=(b&&b.veriVar)?rpMetropolTop(ym):0;

  t.kbMaliyet=(t.giris&&t.ortPers)?Math.round(t.maliyet/t.giris/t.ortPers):0;

  return {aylar,t};}

// metni sadeleştir: küçük harf, apostrof ekleri at, noktalama temizle
function asN(s){return String(s||'').toLocaleLowerCase('tr').replace(/[`´’']/g,"'").replace(/'[a-zçğıöşü]*/g,'').replace(/[^a-zçğıöşü0-9\s]/g,' ').replace(/\s+/g,' ').trim();}
// Kişi eşleme — Türkçe karakter katlamalı (culha→Çulha), önek destekli, çoklu eşleşmede belirsizlik listesi.
// Yaygın soru kelimeleri isim sanılmasın diye eleme listesi (ASCII-katlanmış hali).
const AS_DUR=new Set(('BU AY YIL GUN HAFTA GECEN SIMDI SU AN NE ZAMAN KADAR KAC KIM KIMLER KIMIN VAR MI MU YOK EN COK FAZLA AZ YUKSEK DUSUK TOPLAM LISTE LISTESI OLANLAR ALANLAR YAPANLAR IZIN IZINDE IZINLI IZNI TATIL MESAI MESAISI CEZA CEZALARI CEZASI TRAFIK AVANS BORCU BORC TAZMINAT TAZMINATI KIDEM KIDEMI IHBAR SURESI RAPOR RAPORLU DEVAMSIZ DEVAMSIZLIK UCRETSIZ MAAS MAASI UCRET UCRETI PRIM PRIMI DEVAM DOGUM GUNU YAS YASINDA TELEFON NUMARASI PERSONEL KISI STAJYER KAZA KAZALARI VARDIYA GECE KADIN ERKEK ENGELLI BOLUM BOLUMU BOLUMUNDE DEPARTMAN URETIM IDARI PAZARLAMA SOFOR DIGER ISE GIREN GIRENLER CIKAN CIKANLAR GIRDI CIKTI CALISIYOR CALISTI CALISANLAR DONECEK DONUS ISBASI YILDONUMU YUKU YUK KALDI KALAN NELER SORABILIRIM YARDIM HAKKINDA DURUMU DURUM OCAK SUBAT MART NISAN MAYIS HAZIRAN TEMMUZ AGUSTOS EYLUL EKIM KASIM ARALIK KELEMENCE ALDI ATAN YIYEN YIYENLER').split(' '));
function asKisiBul(qn){
  const toks=pzAsciiUp(qn).split(' ').filter(t=>t.length>=2&&!AS_DUR.has(t));
  if(!toks.length)return null;
  let best=[],bestSc=0;
  DB.personeller.forEach(p=>{
    const ws=pzAsciiUp(p.ad).split(' ');let sc=0;
    ws.forEach(w=>{if(toks.includes(w))sc+=2;else if(toks.some(t=>t.length>=3&&w.startsWith(t)))sc+=1;});
    if(!sc)return;
    if(sc>bestSc){bestSc=sc;best=[p];}else if(sc===bestSc)best.push(p);
  });
  if(!bestSc)return null;
  if(best.length===1)return {p:best[0],sc:bestSc};
  const tam=best.filter(p=>pzAsciiUp(p.ad).split(' ').every(w=>toks.includes(w)));
  if(tam.length===1)return {p:tam[0],sc:bestSc};
  return {coklu:best.slice(0,8),sc:bestSc};
}
function asDonem(qn){const ym4=qn.match(/\b(20\d\d)\b/);const yil=ym4?+ym4[1]:new Date().getFullYear();
  for(let i=0;i<12;i++)if(qn.includes(AS_AYLAR[i])){const ym=yil+'-'+String(i+1).padStart(2,'0');const r=rpAydanAralik(ym);return {s:r.s,e:r.e,etiket:AS_AYLAR[i].charAt(0).toLocaleUpperCase('tr')+AS_AYLAR[i].slice(1)+' '+yil};}
  if(/geçen ay/.test(qn)){const ym=ymAdd(curYM(),-1);const r=rpAydanAralik(ym);return {s:r.s,e:r.e,etiket:fmtYM(ym)};}
  if(/bu ay|içinde bulundu/.test(qn)){const r=rpAydanAralik(curYM());return {s:r.s,e:r.e,etiket:fmtYM(curYM())};}
  if(/bu yıl|bu sene/.test(qn)){const y=new Date().getFullYear();return {s:y+'-01-01',e:y+'-12-31',etiket:y+' yılı'};}
  if(/bugün|bu gün|şu an|şuan|şimdi|halen|hala/.test(qn))return {s:todayISO(),e:todayISO(),etiket:'bugün',bugun:true};
  return null;}

function asistanCevap(q){
  const qn=asN(q);if(!qn)return asKart('','Bir soru yazın ya da bir personel adı girin. Örnek: <i>"'+AS_ORNEKLER[1]+'"</i>');
  const cogul=/kimler|herkes|listele|sırala|liste|olanlar|yapanlar|alanlar|yiyenler|girenler|çıkanlar|kaç (kişi|personel|kadın|erkek|stajyer)|personel sayısı|en (çok|az|fazla|yüksek|düşük|kıdemli)|toplam|dağılım/.test(qn);

  // ---- YARDIM / KATALOG ----
  if(has(/neler sorabilirim|ne sorabilirim|yardım|nasıl kullan/))return asKatalogKart('Sorabileceğiniz konular — örneğe tıklayın:');
  // ---- FAZLA MESAİ ----
  if(has(/mesai/)){

    if(has(/\byıl\b|yıllık|270/)){
      anlzDolu={}; // tahmin önbelleği taze olsun
      const y4=qn.match(/\b(20\d\d)\b/);

      if(p){const y=anlzFmYil(p,yil);

          +asListe(['FM1 (Yıl)','Sınıra Oran','Kalan','FM2'],[[asSaat(y.fm1),'%'+Math.round(y.fm1/FM_YASAL*100),(y.fm1<FM_YASAL?asSaat(FM_YASAL-y.fm1):'<b style="color:var(--red-700)">+'+asSaat(y.fm1-FM_YASAL)+' AŞIM</b>'),asSaat(y.fm2)]])
          +`<div style="margin-top:8px"><button class="btn btn-sm" onclick="analizYil=${yil};anlzKisiAc('${p.id}')">Personel Analizi'nde aç</button></div>`;}
      const rows=anlzYilKisiler(yil).filter(x=>!x.fmYok).map(x=>({x,y:anlzFmYil(x,yil)})).filter(r=>r.y.fm1>0).sort((a,b)=>b.y.fm1-a.y.fm1);
      if(!rows.length)return asKart('hayir',`<b>${yil}</b> yılında fazla mesai görünmüyor (PDKS verisi aktarılmamış olabilir).`);

          ['Kullanılmamış Yıllık İzin',h.izinGun+' gün',fmtTL2(h.izinBrut),fmtTL2(h.izinNet)],
          ['<b>Toplam</b>','','<b>'+fmtTL2(h.kidemBrut+h.ihbarBrut+h.izinBrut)+'</b>','<b>'+fmtTL2(h.kidemNet+h.ihbarNet+h.izinNet)+'</b>']])
        +((od.kidem||od.ihbar)?`<div style="margin-top:6px;font-size:12.5px;color:var(--slate-500)">Daha önce ödenen: kıdem ${fmtTL(od.kidem)} · ihbar ${fmtTL(od.ihbar)}.</div>`:'');}
    const aktif=DB.personeller.filter(x=>x.durum!=='ayrildi');
    const rows=aktif.map(x=>{const h=tazminatHesap(x,ref);return {x,h,net:h.kidemNet+h.ihbarNet+h.izinNet,brut:h.kidemBrut+h.ihbarBrut+h.izinBrut};});
    const eksik=rows.filter(r=>!(r.h.ciplakBrut>0)).length;
    const eksikNot=eksik?`<div style="margin-top:6px;font-size:12.5px;color:var(--amber-700,#b45309)">${eksik} kişinin ücreti eksik/net — hesaba 0 olarak girdi.</div>`:'';
    if(has(/en (yüksek|çok|fazla)/)){
      const top=rows.filter(r=>r.net>0).sort((a,b)=>b.net-a.net).slice(0,15);
      return asKart('','En yüksek tazminat yükümlülükleri (net · bugün itibarıyla · ilk 15):')
        +asListe(['Personel','Bölüm','Kıdem','Net Toplam'],top.map(r=>[esc(r.x.ad),esc(r.x.bolum||'—'),sureMetni(r.h.toplamGun),'<b>'+fmtTL(r.net)+'</b>']))+eksikNot;}
    return asKart('',`Bugün itibarıyla <b>${aktif.length}</b> personel için toplam tazminat yükümlülüğü (kıdem + ihbar + kullanılmamış izin): net <b>${fmtTL(rows.reduce((s,r)=>s+r.net,0))}</b> · brüt <b>${fmtTL(rows.reduce((s,r)=>s+r.brut,0))}</b>. Detay için Kıdem & İhbar Tazminatı ekranına bakın.`)+eksikNot;
  }
  // ---- İHBAR ----
  if(has(/ihbar/)){
    if(p){
      if(p.durum==='ihbar'){const r=ihbarHesapla(p.iseGiris,p.ihbarBaslangic,ihbarKesintiGun(p,p.ihbarBaslangic),haftaTatiliGunleri(p));
        return asKart('uyari',`${adB} ihbar sürecinde — başlangıç ${fmtDate(p.ihbarBaslangic)}, iş akdi sona erme <b>${fmtDate(r.bitis)}</b> (${r.hafta} hafta) · iş arama izni (toplu): <b>${r.topluGun} gün</b>, son çalışma <b>${fmtDate(r.sonCalismaToplu)}</b>.`);}
      const r=ihbarHesapla(p.iseGiris,todayISO(),ihbarKesintiGun(p,todayISO()),haftaTatiliGunleri(p));
      if(r.deneme)return asKart('',`${adB} deneme süresinde — ihbar süresi doğmaz (aynı gün ayrılış).`);
      return asKart('',`${adB} — kıdemi <b>${r.kidem}</b>; bugün fesih bildirilse ihbar süresi <b>${r.hafta} hafta</b> (${r.ihbarGun} gün) olur, iş akdi <b>${fmtDate(r.bitis)}</b> tarihinde sona erer. İş arama izni (toplu): <b>${r.topluGun} gün</b>. <span style="color:var(--slate-500);font-size:12.5px">4857/17: 6 aydan az 2 · 6 ay–1,5 yıl 4 · 1,5–3 yıl 6 · 3 yıl+ 8 hafta.</span>`);}
    const l=DB.personeller.filter(x=>x.durum==='ihbar');
    if(!l.length)return asKart('hayir','Şu anda ihbar sürecinde personel yok.');
    return asKart('uyari',`İhbar sürecinde <b>${l.length}</b> kişi:`)+asListe(['Personel','Bölüm','Başlangıç','İş Akdi Sonu'],l.map(x=>{const r=ihbarHesapla(x.iseGiris,x.ihbarBaslangic,ihbarKesintiGun(x,x.ihbarBaslangic),haftaTatiliGunleri(x));return [esc(x.ad),esc(x.bolum||'—'),fmtDate(x.ihbarBaslangic),fmtDate(r.bitis)+' ('+r.hafta+' hf)'];}));
  }
  // ---- KIDEM YILDÖNÜMÜ ----
  if(has(/yıl ?dönümü/)){
    const {ym,etiket}=asAyYM(qn);const m=+ym.slice(5,7),yy=+ym.slice(0,4);
    const l=rpAktif().filter(x=>x.iseGiris&&+String(x.iseGiris).slice(5,7)===m).map(x=>({x,yil:yy-(+String(x.iseGiris).slice(0,4))})).filter(r=>r.yil>=1).sort((a,b)=>b.yil-a.yil);
    if(!l.length)return asKart('hayir',`<b>${etiket}</b> ayında kıdem yıldönümü olan yok.`);
    return asKart('',`<b>${etiket}</b> ayında kıdem yıldönümü olanlar — <b>${l.length}</b> kişi:`)+asListe(['Personel','Bölüm','İşe Giriş','Yıl'],l.map(r=>[esc(r.x.ad),esc(r.x.bolum||'—'),fmtDate(r.x.iseGiris),r.yil+'. yıl']));
  }
  // ---- KIDEM ----
  if(has(/kıdem/)){
    if(p){const b=izinBaslangicISO(p);const ksB=kidemSureBilgi(p);return asKart('',`${adB} — kıdem hakediş başlangıcı: <b>${ksB.basISO?fmtDate(ksB.basISO):'—'}</b>${ksB.manuel?' (manuel)':''} · kıdem süresi: <b>${sureMetni(ksB.toplamGun)}</b>${ksB.fasila&&ksB.oncekiGun?' (fasıladan +'+sureMetni(ksB.oncekiGun)+')':''}${ksB.kesinti?' · kesinti '+ksB.kesinti+' gün':''} — yıllık izin başlangıcı: <b>${b?fmtDate(b):'—'}</b>${p.izinBasManuel?' (manuel)':''}`);}
    const rows=rpAktif().filter(depFiltre).map(x=>({x,g:kidemSureBilgi(x).toplamGun})).sort((a,b)=>b.g-a.g);
    const nY=qn.match(/(\d+)\s*yıl/);
    if(nY&&has(/fazla|üzeri|üstü|aşan|geçen/)){const l=rows.filter(r=>r.g>=+nY[1]*365);
      if(!l.length)return asKart('hayir',`${depEt}kıdemi ${nY[1]} yıl ve üzeri personel yok.`);
      return asKart('',`${depEt}kıdemi <b>${nY[1]} yıl ve üzeri</b> olanlar — <b>${l.length}</b> kişi:`)+asListe(['Personel','Bölüm','İşe Giriş','Kıdem'],l.map(r=>[esc(r.x.ad),esc(r.x.bolum||'—'),r.x.iseGiris?fmtDate(r.x.iseGiris):'—',sureMetni(r.g)]));}
    const n=(qn.match(/en kıdemli (\d{1,2})/)||[])[1]||10;
    return asKart('',`En kıdemli <b>${n}</b> kişi:`)+asListe(['Personel','Bölüm','İşe Giriş','Kıdem'],rows.slice(0,+n).map(r=>[esc(r.x.ad),esc(r.x.bolum||'—'),r.x.iseGiris?fmtDate(r.x.iseGiris):'—',sureMetni(r.g)]));
  }
  // ---- MAAŞ / ÜCRET ----
  if(has(/maaş|ücret(?!siz)/)){
    if(p){const rows=[['Ücret',(+p.ucret>0)?fmtTL2(p.ucret)+' <span style="color:var(--slate-500)">('+ucretTipiEtiket(p)+')</span>':'<span style="color:var(--red-700,#b91c1c)">girilmemiş</span>'],
        ['Aile Yardımı',(+p.aileYardim>0)?fmtTL2(p.aileYardim):'—'],['Çocuk Yardımı',(+p.cocukYardim>0)?fmtTL2(p.cocukYardim):'—'],
        ['Prim',(+p.prim>0)?fmtTL2(p.prim):'—'],['Yol Yardımı',(+p.yolYardim>0)?fmtTL2(p.yolYardim):'—'],
        [esc(pzAyniAd()),pzAyniHak(p)?fmtTL2(+p.ayniYardim||0):'hakkı yok'],
        ['Kıdem Primi',p.kidemPrimYok?'verilmez':'otomatik (yıl tablosu)'],['Devam Primi',p.devamPrimYok?'verilmez':'otomatik / sabit']];
      return asKart('',`${adB} — ücret ve yardımlar (kart):`)+asListe(['Kalem','Değer'],rows)+`<div style="margin-top:6px;font-size:12.5px;color:var(--slate-500)">Aile/çocuk/prim puantajda çalışılan güne orantılanır; kart tutarı 30 günlük tam ay içindir.</div>`;}
    if(has(/eksik|girilmemiş|olmayan|boş/)){const l=rpAktif().filter(x=>!(+x.ucret>0));
      if(!l.length)return asKart('evet','Ücreti eksik personel yok — herkesin ücreti girilmiş.');
      return asKart('uyari',`Ücreti girilmemiş <b>${l.length}</b> kişi:`)+asListe(['Personel','Bölüm','İşe Giriş'],l.map(x=>[esc(x.ad),esc(x.bolum||'—'),x.iseGiris?fmtDate(x.iseGiris):'—']));}
    const rows=rpAktif().filter(depFiltre).filter(x=>+x.ucret>0).sort((a,b)=>+b.ucret-+a.ucret).slice(0,20);
    return asKart('',`${depEt}en yüksek ücretler (karttaki tutar · ilk 20) — <span style="color:var(--slate-500);font-size:12.5px">tipler farklı olabilir, sütuna bakın</span>:`)
      +asListe(['Personel','Bölüm','Ücret','Tip'],rows.map(x=>[esc(x.ad),esc(x.bolum||'—'),fmtTL2(x.ucret),ucretTipiEtiket(x)]));
  }
  // ---- PUANTAJ DURUM (raporlu / devamsız / ücretsiz — ay bazlı, canlı puantajdan) ----
  if(has(/raporlu|devamsız|ücretsiz iz/)||(p&&has(/kaç gün|puantaj/))){
    const {ym,etiket}=asAyYM(qn);const info=pzAyBilgi(ym);
    const say=x=>pzSayim(asPzRow(x.id,ym),info,haftaTatiliGunleri(x),pzIzinGunleri(x.id,info),pzPasifSet(x,info));
    if(p){const c=say(p);const fm=asFmKisi(p,ym);
      return asKart('',`${adB} — <b>${etiket}</b> puantaj özeti:`)
        +asListe(['Çalışılan','Yıllık İzin','Raporlu','Ücretsiz','Mazeret','Devamsız','Hafta Tatili','Genel Tatil'],
          [[fm.calGun+' g',(c['Yİ']||0)+' g',((c['R']||0)+(c['RK']||0))+' g'+((c['RK']||0)?` (${c['RK']} iş kazası)`:''),(c['Üİ']||0)+' g',(c['M']||0)+' g',(c['D']||0)+' g',((c['HT']||0)+(c['HÇ']||0))+' g',((c['GT']||0)+(c['TM']||0))+' g']]);}
    const key=has(/raporlu/)?'R':(has(/devamsız/)?'D':'Üİ');
    const ad={R:'raporlu',D:'devamsız','Üİ':'ücretsiz izinli'}[key];
    // raporlu sorusunda iş kazası raporları (RK) da sayılır — toplam rapor günü
    const sayKod=x=>{const s=say(x);return key==='R'?((s['R']||0)+(s['RK']||0)):(s[key]||0);};
    const rows=rpAktif().filter(depFiltre).map(x=>({x,n:sayKod(x)})).filter(r=>r.n>0).sort((a,b)=>b.n-a.n);
    if(!rows.length)return asKart('hayir',`${depEt}<b>${etiket}</b> ayında ${ad} personel görünmüyor.`);
    return asKart('',`${depEt}<b>${etiket}</b> ayında ${ad} olanlar — <b>${rows.length}</b> kişi:`)+asListe(['Personel','Bölüm','Gün'],rows.map(r=>[esc(r.x.ad),esc(r.x.bolum||'—'),r.n+' gün']));
  }
  // ---- HAFTA TATİLİ (kişi) — izin bloğundan ÖNCE ("tatil" kelimesi izin bloğunu tetikler) ----
  if(p&&has(/hafta tatili/))return asKart('',`${adB} — hafta tatili: <b>${esc(p.haftaTatili||'Pazar (varsayılan)')}</b>`);
  // ---- İZİN ----
  const donusGuc=/dönüş|dönecek|geri (dön|gel)|işbaşı|ne zaman (dön|gel|işbaş)|dönecek mi|geri ne zaman/.test(qn);
  if(has(/iz[iı]?n|tatil/)||(p&&donusGuc)){
    const wS=d?d.s:todayISO(),wE=d?d.e:todayISO();const etiket=d?d.etiket:'bugün';
    const izYil=+String((d&&d.s)||todayISO()).slice(0,4);
    const izindeMiSoru=has(/izinde mi|izinli mi|tatilde mi|izinde$/);
    const donusSoru=has(/ne zaman|dönüş|işbaşı|işe baş|geri (dön|gel)|dönecek|gelecek/);
    const kalanSoru=has(/ne kadar|kaç gün|kal(dı|an)|bakiye|hak ediş|izin hakkı|izin durum|en (çok|az|fazla)/);
    const izindeMiYaz=z=>{const t=izinTur(z.tur);return `Evet ✓ — ${adB}, <b>${etiket}</b> itibarıyla izinde.<br>${t.l}: ${fmtDate(z.baslangic)} – ${fmtDate(z.bitis||z.baslangic)}${z.gun?' ('+z.gun+' gün)':''}${z.donus?' · işbaşı <b>'+fmtDate(z.donus)+'</b>':''}`;};
    if(p){
      if(donusSoru&&!izindeMiSoru){
        const bug=asKisiIzinleri(p.id,todayISO(),todayISO())[0];
        if(bug)return asKart('evet',`${adB} şu anda izinde — <b>${fmtDate(bug.donus||bug.bitis||bug.baslangic)}</b> tarihinde işbaşı yapacak.<br>${izinTur(bug.tur).l}: ${fmtDate(bug.baslangic)} – ${fmtDate(bug.bitis||bug.baslangic)}`);
        const sonraki=DB.izinler.filter(z=>z.personelId===p.id&&z.baslangic>todayISO()).sort((a,b)=>String(a.baslangic).localeCompare(String(b.baslangic)))[0];
        if(sonraki)return asKart('',`${adB} şu anda izinde değil. Planlı sonraki izni: <b>${fmtDate(sonraki.baslangic)} – ${fmtDate(sonraki.bitis||sonraki.baslangic)}</b> (${izinTur(sonraki.tur).l}).`);
        return asKart('hayir',`${adB} şu anda izinde değil ve planlı izni görünmüyor.`);
      }
      if(kalanSoru&&!izindeMiSoru){
        const st=izinStat(p,izYil);
        return asKart('',`${adB} — <b>${izYil}</b> yıllık izin durumu: kalan <b>${st.kalan} gün</b>`)+asListe(['Devir','Hak Ediş','Kullanılan','Kalan'],[[st.devir+' g',st.hak+' g',st.yillikKullanilan+' g',st.kalan+' g']]);
      }
      const izs=asKisiIzinleri(p.id,wS,wE);
      if(izs.length)return asKart('evet',izindeMiYaz(izs[0]));
      return asKart('hayir',`Hayır ✗ — ${adB} ${etiket} itibarıyla izinde değil.`);
    }
    if(kalanSoru){
      const rows=rpAktif().filter(depFiltre).map(x=>({ad:x.ad,bolum:x.bolum,kalan:izinStat(x,izYil).kalan})).sort((a,b)=>b.kalan-a.kalan);
      if(!rows.length)return asKart('hayir',`${depEt||''}personel yok.`);
      const goster=dep?rows:rows.slice(0,30);
      return asKart('',`${depEt}${izYil} yılı kalan yıllık izinler (en çok → en az${dep?'':' · ilk 30'}, ${rows.length} kişi):`)+asListe(['Personel','Bölüm','Kalan İzin'],goster.map(r=>[esc(r.ad),esc(r.bolum||'—'),r.kalan+' g']));
    }
    const izinde=DB.izinler.filter(z=>z.baslangic&&z.baslangic<=wE&&(z.bitis||z.baslangic)>=wS)
      .filter(z=>{const x=DB.personeller.find(pp=>pp.id===z.personelId);return x&&depFiltre(x);})
      .map(z=>[esc(rpAd(z.personelId)),izinTur(z.tur).l,fmtDate(z.baslangic)+' – '+fmtDate(z.bitis||z.baslangic)+(z.donus?' · işbaşı '+fmtDate(z.donus):'')]);
    if(!izinde.length)return asKart('hayir',`${depEt}${etiket} itibarıyla izinde personel yok.`);
    return asKart('',`${depEt}${etiket} itibarıyla <b>${izinde.length}</b> kişi izinde:`)+asListe(['Personel','İzin Türü','Tarihler / İşbaşı'],izinde);
  }
  // ---- TRAFİK CEZASI ----
  if(has(/trafik|ceza/)){
    let kayit=DB.trafikCezalari.slice();if(p)kayit=kayit.filter(t=>t.personelId===p.id);if(d)kayit=kayit.filter(t=>t.cezaTarihi&&t.cezaTarihi>=d.s&&t.cezaTarihi<=d.e);
    if(!p&&has(/en (çok|fazla)/)){
      const grup={};kayit.forEach(t=>{const g=grup[t.personelId]=grup[t.personelId]||{n:0,top:0};g.n++;g.top+=(+t.cezaTutari||0);});
      const rows=Object.entries(grup).sort((a,b)=>b[1].n-a[1].n||b[1].top-a[1].top).slice(0,10);
      if(!rows.length)return asKart('hayir',`${d?d.etiket+' — ':''}trafik cezası kaydı yok.`);
      return asKart('',`${d?'<b>'+d.etiket+'</b> — ':''}en çok trafik cezası olanlar (ilk 10):`)+asListe(['Personel','Adet','Toplam Tutar'],rows.map(([pid,g])=>[esc(rpAd(pid)),g.n,fmtTL(g.top)]));}
    kayit.sort((a,b)=>(b.cezaTarihi||'').localeCompare(a.cezaTarihi||''));
    const bsl=(p?adB+' için ':'')+(d?d.etiket+' ':'')+'trafik cezaları';
    if(!kayit.length)return asKart('hayir',`${bsl.charAt(0).toLocaleUpperCase('tr')+bsl.slice(1)}: kayıt yok.`);
    const top=kayit.reduce((a,t)=>a+(+t.cezaTutari||0),0);
    return asKart('',`${bsl.charAt(0).toLocaleUpperCase('tr')+bsl.slice(1)} — <b>${kayit.length}</b> kayıt, toplam <b>${fmtTL(top)}</b>:`)+asListe(['Personel','Tarih','Plaka','Konum','Madde','Tutar'],kayit.map(t=>[esc(rpAd(t.personelId)),fmtDate(t.cezaTarihi),esc(t.plaka||'—'),esc(t.konum||'—'),esc(t.madde||'—'),fmtTL(t.cezaTutari)+(t.indirimli?' <span style="color:var(--slate-400);font-size:11px">indirimli</span>':'')]));
  }
  // ---- AVANS ----
  if(has(/avans/)){
    if(has(/borc|borç|bakiye|kalan/)){
      if(p){const ks=DB.avanslar.filter(a=>a.personelId===p.id&&avansKalan(a)>0);
        const top=ks.reduce((s,a)=>s+avansKalan(a),0);
        if(!top)return asKart('evet',`${adB} — açık avans borcu yok.`);
        return asKart('uyari',`${adB} — açık avans borcu: <b>${fmtTL2(top)}</b> (${ks.length} kayıt):`)+asListe(['Tarih','Tutar','Taksit','Kalan'],ks.map(a=>[fmtDate(a.tarih),fmtTL2(a.tutar),(a.taksit||1)+' ay',fmtTL2(avansKalan(a))]));}
      const grup={};DB.avanslar.forEach(a=>{const k=avansKalan(a);if(k>0)grup[a.personelId]=(grup[a.personelId]||0)+k;});
      const rows=Object.entries(grup).sort((a,b)=>b[1]-a[1]);
      if(!rows.length)return asKart('evet','Açık avans borcu olan personel yok.');
      const top=rows.reduce((s,r)=>s+r[1],0);
      return asKart('',`Açık avans borcu olanlar — <b>${rows.length}</b> kişi, toplam <b>${fmtTL(top)}</b>:`)+asListe(['Personel','Kalan Borç'],rows.map(([pid,k])=>[esc(rpAd(pid)),fmtTL2(k)]));}
    let kayit=DB.avanslar.slice();if(p)kayit=kayit.filter(a=>a.personelId===p.id);if(d)kayit=kayit.filter(a=>a.tarih&&a.tarih>=d.s&&a.tarih<=d.e);
    kayit.sort((a,b)=>(b.tarih||'').localeCompare(a.tarih||''));
    if(!kayit.length)return asKart('hayir',`${(d?d.etiket:'')} ${p?adB:''} avans kaydı yok.`.replace(/\s+/g,' ').trim());
    const top=kayit.reduce((a,x)=>a+(+x.tutar||0),0);
    return asKart('',`${d?'<b>'+d.etiket+'</b> ':''}avans alanlar — <b>${kayit.length}</b> kayıt, toplam <b>${fmtTL(top)}</b>:`)+asListe(['Personel','Tutar','Taksit','Tarih'],kayit.map(a=>[esc(rpAd(a.personelId)),fmtTL(a.tutar),(a.taksit||1)+' ay',fmtDate(a.tarih)]));
  }
  // ---- İŞ KAZASI ----
  if(has(/kaza/)){
    let kayit=DB.isKazalari.slice();if(p)kayit=kayit.filter(k=>k.personelId===p.id);if(d)kayit=kayit.filter(k=>k.tarih&&k.tarih>=d.s&&k.tarih<=d.e);
    kayit.sort((a,b)=>(b.tarih||'').localeCompare(a.tarih||''));
    if(!kayit.length)return asKart('hayir',`${d?'<b>'+d.etiket+'</b> ':''}${p?adB+' ':''}iş kazası kaydı yok.`);
    return asKart('uyari',`${d?'<b>'+d.etiket+'</b> ':''}iş kazaları — <b>${kayit.length}</b> kayıt:`)+asListe(['Personel','Tarih','Bölüm','Sebep','Durum'],kayit.map(k=>[esc(rpAd(k.personelId)),fmtDate(k.tarih),esc(k.bolum||'—'),esc(k.sebep||'—'),esc(k.durum||'—')]));
  }
  // ---- İŞE GİRİŞ / ÇIKIŞ (dönemli, kişisiz) ----
  if(!p&&d&&has(/işe gir|giren|işe al/)){const g=rpGirenler(d.s,d.e);if(!g.length)return asKart('hayir',`<b>${d.etiket}</b> döneminde işe giren yok.`);return asKart('',`<b>${d.etiket}</b> döneminde <b>${g.length}</b> kişi işe girdi:`)+asListe(['Personel','Bölüm','Departman','İşe Giriş'],g.map(x=>[esc(x.ad),esc(x.bolum||'—'),esc(x.departman||'—'),fmtDate(x.iseGiris)]));}

  if(dep&&has(/kaç|sayı|kişi|adet|var/)){const n=rpAktif().filter(x=>(x.departman||'Diğer')===dep).length;return asKart('',`<b>${dep}</b> departmanında <b>${n}</b> aktif personel var.`);}

  // ---- KİŞİYE ÖZEL ALANLAR + PROFİL ----
  if(p){
    if(has(/telefon|numara|cep/))return asKart('',`${adB} — telefon: <b>${esc(p.telefon||'kayıtlı değil')}</b>`);
    if(has(/işe gir|giriş tarih|ne zaman.*(gir|başla)/))return asKart('',`${adB} <b>${p.iseGiris?fmtDate(p.iseGiris):'—'}</b> tarihinde işe girdi.`);

    // Profil — kişi bulundu, net niyet yok: tüm modüllerden özet
    const yilNow=new Date().getFullYear();
    const bugIz=asKisiIzinleri(p.id,todayISO(),todayISO())[0];
    const st=izinStat(p,yilNow);const ks=kidemSureBilgi(p);
    const avB=DB.avanslar.filter(a=>a.personelId===p.id).reduce((s,a)=>s+avansKalan(a),0);
    const cz=DB.trafikCezalari.filter(t=>t.personelId===p.id);
    const fm=asFmKisi(p,curYM());
    const th=tazminatHesap(p,todayISO());const tazNet=th.kidemNet+th.ihbarNet+th.izinNet;
    return asKart('',`${adB} — genel profil <button class="btn btn-sm" style="margin-left:8px" onclick="openPersonel('${p.id}')">Personel kartını aç</button>`)

        ['Bölüm / Görev',esc((p.bolum||'—')+' / '+(p.gorev||'—'))],
        ['Departman',esc(p.departman||'—')],

        ['Telefon',esc(p.telefon||'—')],

        ['Şu An İzinde mi?',bugIz?'Evet — işbaşı '+fmtDate(bugIz.donus||bugIz.bitis||bugIz.baslangic):'Hayır'],
        ['Kalan Yıllık İzin ('+yilNow+')',st.kalan+' gün'],

        ['Tazminat (bugün, net)',(th.ciplakBrut>0)?fmtTL(tazNet)+' (kıdem+ihbar+izin)':'ücret eksik — hesaplanamadı']])
      +`<div style="margin-top:6px;font-size:12.5px;color:var(--slate-500)">Detay için: "${esc(p.ad)} tazminatı" · "${esc(p.ad)} maaşı" · "${esc(p.ad)} bu ay kaç gün çalıştı" · "${esc(p.ad)} avans borcu" gibi sorabilirsiniz.</div>`;
  }
  return asKatalogKart('Sorunuzu tam anlayamadım. Sorabileceğiniz konular:');
}

// ============ KIDEM & İHBAR TAZMİNATI ============
// Tazminat için aylık giydirilmiş brüt ücret: önce manuel tazminatBrut, yoksa karttaki ücretten tipe göre türetilir.
// Net girildiyse brüte çevrilemez (0 döner → ✎ ile manuel brüt istenir). Eski kayıtlar aylık/brüt varsayılır → p.ucret ile birebir.
function tazAylikBrut(p){
  const manuel=+p.tazminatBrut||0; if(manuel>0)return manuel;
  const u=+p.ucret||0; if(!u)return 0;
  if((p.netBrut||'brut')==='net')return 0; // net→brüt çevrilemez
  const tip=p.ucretTipi||'aylik';
  if(tip==='gunluk')return u*30;
  if(tip==='saatlik')return u*((DB.puantajAyar&&DB.puantajAyar.gunlukSaat||7.5)*30);
  return u; // aylık brüt
}
// Sözleşme baskısında {{PERSONEL_UCRET_TIPI}} için okunur etiket (ör. "aylık brüt", "günlük net")
function ucretTipiEtiket(p){
  const tip={aylik:'aylık',gunluk:'günlük',saatlik:'saatlik'}[(p&&p.ucretTipi)||'aylik']||'aylık';
  const nb=((p&&p.netBrut)||'brut')==='net'?'net':'brüt';
  return `${tip} ${nb}`;
}
// {{PERSONEL_UCRET_TUTAR}} — biçimli ücret (ör. "25.000,00 TL"); ücret yoksa boş.
// Tazminat hesabıyla tutarlı olması için ücret aynen +p.ucret (JS sayı) gibi okunur.
function ucretTutarMetin(p){
  const n=+((p&&p.ucret)||0);
  if(!isFinite(n)||n<=0)return '';
  return n.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' TL';
}
// SÜREKLİ MENFAATLERİN YILLIK TOPLAMI (giydirilmiş brüt için) — Yargıtay: ikramiye/devamlılık arz eden prim/yol/
// sosyal yardımlar giydirilmişe girer. Güncel aylık seviyeler × 12; devam primi yıllık döngü toplamı. Çıplak ücret yoksa 0.
function tazMenfaatYillik(p,ref){
  const refY=+String(ref).slice(0,4);
  const ky=(()=>{const b=izinBaslangicISO(p,ref);return b?Math.max(0,yilFark(b,ref)):0;})();
  const kidemPrimiAy=p.kidemPrimYok?0:(+pzKidemPrim(ky)||0);
  const ayni=pzAyniHak(p)?(+p.ayniYardim||0):0;
  const aylik=(+p.aileYardim||0)+(+p.cocukYardim||0)+(+p.prim||0)+(+p.yolYardim||0)+ayni+kidemPrimiAy;   // aile+çocuk+prim+yol+ayni+kıdem primi
  const sabitDev=sabitDevamAy(p,String(ref).slice(0,7));
  const yillikDevam=p.devamPrimYok?0:(sabitDev>0?sabitDev*12:(pzDevamAnchorAbs(p)!=null?4*(2*devamPrimTutar(refY,'ay')+devamPrimTutar(refY,'blok')):0));  // devam primi: sabit×12 veya döngü (4 blok/yıl)
  return {aylik,yillikDevam,toplam:aylik*12+yillikDevam,kidemPrimiAy,ayni};
}
function tazminatHesap(p,refISO){
  const ay=DB.tazminatAyar;const ref=refISO||todayISO();const refY=+String(ref).slice(0,4);
  const ciplakBrut=tazAylikBrut(p);const ciplakGunluk=ciplakBrut/30;                          // ÇIPLAK (temel) — yıllık izin bunun üzerinden
  // GİYDİRİLMİŞ günlük brüt = çıplak günlük + (son 12 ay sürekli menfaatler ÷ 365) — kıdem & ihbar bunun üzerinden
  const mf=tazMenfaatYillik(p,ref);
  const gunlukMenfaat=ciplakBrut>0?mf.toplam/365:0;
  const giyGunluk=ciplakGunluk+gunlukMenfaat;const giyAylik=giyGunluk*30;                      // giydirilmiş 30 günlük brüt (kıdem tavanı buna)
  // Kıdem süresi: fasılalı (kıdemde sayılan önceki dönemler) + son dönem − kesintiler
  const ks=kidemSureBilgi(p,ref);const toplamGun=ks.toplamGun;const yilKesir=toplamGun/365;
  const kidemHak=ks.basISO?yilFark(ks.basISO,ref)>=1:false;
  let kidemBrut=0,tavanU=false;
  if(kidemHak){let a=giyAylik;if(a>ay.kidemTavan){a=ay.kidemTavan;tavanU=true;}kidemBrut=a*yilKesir;}
  const kidemDamga=kidemBrut*ay.damgaOran;const kidemNet=kidemBrut-kidemDamga;
  // İhbar: son giriş bazlı, GİYDİRİLMİŞ günlük × önel günü
  const ih=ihbarHesapla(p.iseGiris,ref,ks.kesinti,haftaTatiliGunleri(p));
  const ihbarBrut=giyGunluk*ih.ihbarGun;const ihbarGelir=ihbarBrut*ay.gelirVergisiOran;const ihbarDamga=ihbarBrut*ay.damgaOran;const ihbarNet=ihbarBrut-ihbarGelir-ihbarDamga;
  // KULLANILMAMIŞ YILLIK İZİN: kalan gün × ÇIPLAK günlük brüt (Yargıtay: prim/sosyal yardım katılmaz)
  const izinGun=Math.max(0,(izinStat(p,refY).kalan)||0);
  const izinBrut=izinGun*ciplakGunluk;const izinGelir=izinBrut*ay.gelirVergisiOran;const izinDamga=izinBrut*ay.damgaOran;const izinNet=izinBrut-izinGelir-izinDamga;
  return {brut:giyAylik,ciplakBrut,ciplakGunluk,gunluk:giyGunluk,giyGunluk,giyAylik,mf,gunlukMenfaat,
    toplamGun,yilKesir,ks,kidemBrut,kidemDamga,kidemNet,tavanU,kidemHak,
    ihbarHafta:ih.hafta,ihbarGun:ih.ihbarGun,ihbarBrut,ihbarGelir,ihbarDamga,ihbarNet,
    izinGun,izinBrut,izinNet,izinGelir,izinDamga,
    toplamBrut:kidemBrut+ihbarBrut+izinBrut,toplamNet:kidemNet+ihbarNet+izinNet,kidemMetin:sureMetni(toplamGun)};
}
function tazOdenen(pid){return DB.tazminatOdeme.filter(o=>o.personelId===pid).reduce((s,o)=>({kidem:s.kidem+(+o.kidem||0),ihbar:s.ihbar+(+o.ihbar||0)}),{kidem:0,ihbar:0});}
function renderTazminat(){
  const ref=tazminatTarih||todayISO();
  const aktif=DB.personeller.filter(p=>p.durum!=='ayrildi');
  const rows=aktif.map(p=>({p,h:tazminatHesap(p,ref),od:tazOdenen(p.id)}));
  const sum=(f)=>rows.reduce((s,r)=>s+f(r),0);
  const kidemBrut=sum(r=>r.h.kidemBrut),ihbarBrut=sum(r=>r.h.ihbarBrut),izinBrut=sum(r=>r.h.izinBrut);
  const kidemNet=sum(r=>r.h.kidemNet),ihbarNet=sum(r=>r.h.ihbarNet),izinNet=sum(r=>r.h.izinNet);
  const izinGunTop=sum(r=>r.h.izinGun),genelNet=kidemNet+ihbarNet+izinNet,genelBrut=kidemBrut+ihbarBrut+izinBrut;
  const eksikUcret=rows.filter(r=>!(r.h.ciplakBrut>0)).length;
  let h=`<div class="intro" style="line-height:1.65">Bugün itibarıyla, <b>maaşlar dışında</b> personele olan toplam yükümlülük: <b>kıdem + ihbar tazminatı + kullanılmamış yıllık izin</b>. Üç kalem üç ayrı matrah üzerinden hesaplanır:
    <div style="margin-top:9px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px">
      <div style="background:var(--blue-50);border:1px solid var(--blue-100);border-radius:9px;padding:9px 12px"><b style="color:var(--blue-800)">Kıdem & İhbar → GİYDİRİLMİŞ brüt</b><br><span style="font-size:12.5px;color:var(--slate-600)">Çıplak maaş + süreklilik gösteren tüm menfaatler: aile/çocuk yardımı, prim, kıdem primi, devam primi, ayni yardım (kelemençe), yol. Yöntem: <b>menfaatlerin yıllık toplamı ÷ 365</b> = günlük menfaat, çıplak günlüğe eklenir (tutar her ay değişse de süreklilik esastır — Yargıtay). Kıdem: giydirilmiş 30 günlük × yıl (<b>tavan</b> uygulanır). İhbar: giydirilmiş günlük × önel (3 yıl+ = 8 hafta).</span></div>

    </div>

    <div><div style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#9fc0e6">Toplam Tazminat Yükümlülüğü (${fmtDate(ref)})</div>
    <div style="font-size:30px;font-weight:800;margin-top:5px">${fmtTL(genelNet)} <span style="font-size:14px;font-weight:600;color:#9fc0e6">net</span></div>
    <div style="font-size:13px;color:#cdddf0;margin-top:3px">Kıdem + İhbar + Kullanılmamış Yıllık İzin · Brüt: ${fmtTL(genelBrut)} · ${aktif.length} aktif personel</div></div>
  </div></div>`;

    <div class="kpi a"><div class="kl">İhbar Tazminatı</div><div class="kv">${fmtTL(ihbarNet)}</div><div class="ks">net · brüt ${fmtTL(ihbarBrut)}</div></div>
