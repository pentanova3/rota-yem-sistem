<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0c2340"><link rel="icon" type="image/png" href="../rota-smi.png">
<title>İnsan Kaynakları · Rota SMI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="personel-data.js"></script>
<script src="sozlesme-data.js?v=7"></script>
<script src="antet-data.js"></script>
<script src="kidem-data.js"></script>
<script src="kidem-izin-2026.js"></script>
<style>
:root{
  --blue-900:#0C2340;--blue-800:#14295C;--blue-700:#182F73;--blue-600:#1E3E90;--blue-500:#3D5CB8;--blue-400:#7189D1;--blue-300:#A6B5E4;--blue-200:#CBD5F0;--blue-100:#E6EDFB;--blue-50:#EFF6FF;
  --slate-900:#0F172A;--slate-800:#1E293B;--slate-700:#334155;--slate-600:#475569;--slate-500:#64748B;--slate-400:#94A3B8;--slate-300:#CBD5E1;--slate-200:#E2E8F0;--slate-100:#F1F5F9;--slate-50:#F8FAFC;
  --green-600:#16A34A;--green-100:#DCFCE7;--green-700:#15803D;--green-50:#F0FDF4;
  --amber-500:#F59E0B;--amber-100:#FEF3C7;--amber-700:#B45309;--amber-50:#FFFBEB;
  --red-500:#EF4444;--red-100:#FEE2E2;--red-700:#B91C1C;--red-50:#FEF2F2;
  --purple:#7C3AED;--wa:#25D366;--wa-d:#128C7E;
  --sb:236px;--font:'Inter',system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--font);background:var(--slate-100);color:var(--slate-800);line-height:1.4}
.hidden{display:none!important}
button,input,select,textarea{font-family:inherit}
.num{font-variant-numeric:tabular-nums}
/* sidebar */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sb);background:#fff;color:var(--blue-700);display:flex;flex-direction:column;z-index:30;transition:transform .25s;border-right:1px solid #f0d4d8}
.sb-brand{padding:18px 18px;display:flex;align-items:center;gap:11px;border-bottom:1px solid #E6EDFB}
.sb-brand .plate{background:transparent;border-radius:0;padding:0;display:inline-flex}
.sb-brand .plate img{height:34px;display:block}
.sb-brand .bt{font-size:13px;font-weight:800;color:var(--blue-700);line-height:1.15}
.sb-brand .bs{font-size:10px;color:#b8838a}
.sb-nav{flex:1;overflow-y:auto;padding:10px 10px 20px}
.sb-sec{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:none;cursor:pointer;font-family:inherit;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#c98e96;padding:13px 12px 5px;text-align:left}
.sb-sec:hover{color:#a86a72}
.sb-chev{transition:transform .15s;opacity:.7;transform:rotate(-90deg)}
.sb-chev.on{transform:rotate(0deg)}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--blue-600);cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:.12s}
.sb-item:hover{background:var(--blue-50);color:var(--blue-800)}
.sb-item.active{background:var(--blue-600);color:#fff;font-weight:600}
.sb-item svg{width:17px;height:17px;flex:none;opacity:.9}
.sb-item .badge{margin-left:auto;font-size:10px;font-weight:700;background:var(--blue-100);color:var(--blue-700);padding:1px 7px;border-radius:20px}
.sb-item.active .badge{background:rgba(255,255,255,.2);color:#fff}
.sb-back{padding:12px 18px;border-top:1px solid #E6EDFB;font-size:12px;color:#b8838a;text-decoration:none;display:flex;align-items:center;gap:6px}
.sb-back:hover{color:var(--blue-700)}
/* ——— DAR (rail) MENÜ — yalnız ikonlar ———
   --sb tek değişkeni hem .sidebar genişliğini hem .main margin'ini besliyor, başka yere dokunmaya gerek yok.
   DİKKAT: .main'e veya atalarına transform/will-change EKLENMEYECEK — yeni stacking context yaratır ve
   tablonun sticky başlığı ile sticky isim sütunu HATA VERMEDEN ölür. Genişlik animasyonu da bu yüzden yok. */
body.nav-dar{--sb:56px}
body.nav-dar .sb-brand{padding:14px 0;justify-content:center;gap:0}
body.nav-dar .sb-brand>:not(.plate){display:none}   /* yalnız metin bloğu gizlensin, logo kalsın */
body.nav-dar .sb-brand .plate img{height:26px}
body.nav-dar .sb-nav{padding:8px 6px 16px}
body.nav-dar .sb-sec{display:none}
/* padding 8px: 20 bölüm + 6 ayraç + marka + alt bağlantı 900px ekrana kaydırmasız sığsın */
body.nav-dar .sb-item{justify-content:center;padding:8px 0;gap:0}
body.nav-dar .sb-item>span:not(.badge){display:none}
body.nav-dar .sb-item svg{width:19px;height:19px}
/* Rozet rail'de GİZLİ: 19px ikonun üstünde "163" okunmuyor, ikonu tamamen kapatıyordu.
   Sayı kaybolmuyor — düğmenin title'ında duruyor ("Personeller (163)"). */
body.nav-dar .sb-item .badge{display:none}
/* Grup başlıkları gizlendiği için grupları ince çizgi ayırsın */
.sb-sep{display:none}
body.nav-dar .sb-sep{display:block;height:1px;background:#E6EDFB;margin:5px 8px}
/* Başlıksız grup (Akıllı Arama) ile ilk başlık arasında geniş modda ince ayraç */
.sb-sep-w{height:1px;background:#E6EDFB;margin:8px 10px 2px}
body.nav-dar .sb-sep-w{display:none}
body.nav-dar .sb-back{padding:12px 0;justify-content:center}
body.nav-dar .sb-back span{display:none}
.navdar{display:inline-flex;background:none;border:none;cursor:pointer;color:var(--slate-400);padding:5px;border-radius:7px;transition:.12s}
.navdar:hover{background:var(--slate-100);color:var(--slate-700)}
@media(max-width:880px){
  /* Mobilde sidebar zaten kayan çekmece — rail devre dışı, yoksa içerik boş rail kadar sağa kayar */
  body.nav-dar{--sb:236px}
  .navdar{display:none}
}
/* main */
.main{margin-left:var(--sb);min-height:100vh}
.topbar{background:#fff;border-bottom:1px solid var(--slate-200);padding:13px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
.topbar .ttl{font-size:18px;font-weight:800;color:var(--slate-900)}
.topbar .sub{font-size:12px;color:var(--slate-500)}
.hamb{display:none;background:none;border:none;cursor:pointer;color:var(--slate-700)}
.spacer{margin-left:auto}
.btn{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--slate-300);background:#fff;color:var(--slate-700);display:inline-flex;align-items:center;gap:6px;transition:.12s}
.btn:hover{background:var(--slate-50)}
.btn-pri{background:var(--blue-600);color:#fff;border-color:var(--blue-600)}.btn-pri:hover{background:var(--blue-700)}
.btn-wa{background:var(--wa);color:#fff;border-color:var(--wa)}.btn-wa:hover{background:var(--wa-d)}
.btn-sm{padding:5px 10px;font-size:12px}
.wrap{padding:22px 24px 60px;max-width:1200px}
/* Puantaj tablosu 3812px — 1200px okunabilirlik tavanı orada engel, kaldır. Tavan diğer 18 bölümde
   BİLEREK duruyor (metin satırları 1600px+ olursa okunmuyor), o yüzden global değil sınıfa bağlı.
   Sınıf render() içinde her bölüm geçişinde koşulsuz yeniden atanır → başka ekrana sızamaz. */
.wrap#content.pz-genis{max-width:none}
/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--slate-200);border-radius:10px;padding:14px 16px;border-top:3px solid var(--blue-600)}
.kpi .kl{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--slate-500);margin-bottom:7px}
.kpi .kv{font-size:21px;font-weight:700;color:var(--slate-900);line-height:1}
.kpi .ks{font-size:11px;color:var(--slate-500);margin-top:5px}
.kpi.g{border-top-color:var(--green-600)}.kpi.a{border-top-color:var(--amber-500)}.kpi.p{border-top-color:var(--purple)}
/* card */
.card{background:#fff;border:1px solid var(--slate-200);border-radius:11px;margin-bottom:18px;overflow:hidden}
.card-hd{padding:13px 18px;border-bottom:1px solid var(--slate-100);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-hd h3{font-size:14px;font-weight:700;color:var(--slate-800)}
.card-hd .hint{font-size:11.5px;color:var(--slate-400)}
.intro{font-size:12.5px;color:var(--slate-500);margin:-4px 0 14px;line-height:1.55}
/* table */
.tbl-scroll{overflow-x:auto}
/* Uzun liste tablolarında dikey scroll + yapışkan başlık (puantajdaki .pz-scroll kalıbı). Kısa tablolar
   max-height'e ulaşmaz → scroll çıkmaz, davranış değişmez. */
.tbl-scroll.tall{max-height:calc(100vh - 128px);overflow:auto}
table.t{border-collapse:collapse;width:100%;min-width:680px;font-size:12.5px}
table.t th,table.t td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--slate-100);vertical-align:middle}
table.t thead th{background:var(--slate-50);font-size:11px;font-weight:700;color:var(--slate-600);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;position:sticky;top:0;z-index:3;box-shadow:0 1px 0 var(--slate-200)}
table.t thead th.sortable{cursor:pointer;user-select:none}
table.t thead th.sortable:hover{color:var(--slate-900);background:var(--slate-100)}
.sort-ar{font-size:9px;margin-left:5px;color:var(--slate-300);vertical-align:middle}
.sort-ar.on{color:var(--blue-600)}
table.t tbody tr:hover{background:var(--blue-50)}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.t-ure{background:#FEF3C7;color:#B45309}.t-ida{background:var(--blue-100);color:var(--blue-800)}.t-paz{background:#EDE9FE;color:var(--purple)}.t-sof{background:#CFFAFE;color:#0E7490}.t-dig{background:var(--slate-200);color:var(--slate-600)}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.b-on{background:var(--green-100);color:var(--green-700)}.b-off{background:var(--slate-200);color:var(--slate-500)}.b-ihbar{background:var(--amber-100);color:var(--amber-700)}
.b-kaza{background:#CFFAFE;color:#155E75}   /* iş kazası raporu — puantajdaki RK camgöbeğiyle aynı aile */
/* Deneme süresi — canlı türetilir, süre dolunca kendiliğinden Aktif'e döner */
.b-deneme{background:#E0E7FF;color:#3730A3}
.b-deneme-acil{background:#FEF3C7;color:#92400E;box-shadow:inset 0 0 0 1px #FCD34D}
/* Personel kartında Durum alanının üstündeki canlı deneme kutusu */
.deneme-kut{background:#EEF2FF;border:1px solid #C7D2FE;color:#3730A3;border-radius:8px;padding:6px 9px;margin-bottom:6px;font-size:11.5px;line-height:1.45}
.deneme-kut>div{color:#4F46E5;font-size:10.5px;margin-top:1px}
/* Deneme performans takibi uyarı paneli (Personeller ekranı) */
details.ik-uyari{border:1px solid #FCD34D;background:#FFFBEB;border-radius:10px;margin-bottom:14px;overflow:hidden}
details.ik-uyari>summary{cursor:pointer;list-style:none;padding:10px 14px;font-size:13px;font-weight:700;color:#92400E;display:flex;align-items:center;gap:8px}
details.ik-uyari>summary::-webkit-details-marker{display:none}
details.ik-uyari>summary::before{content:'▸';transition:transform .15s;font-size:11px}
details.ik-uyari[open]>summary::before{transform:rotate(90deg)}
details.ik-uyari .uyari-say{margin-left:auto;font-size:11px;font-weight:800;padding:1px 8px;border-radius:20px;background:#FDE68A;color:#92400E}
details.ik-uyari .uyari-govde{padding:0 14px 12px}
/* personel sekme + araç çubuğu */
.ptabs{display:flex;gap:4px;flex-wrap:wrap;padding:10px 14px 0}
.ptab{border:1px solid var(--slate-200);background:#fff;color:var(--slate-600);font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:8px 8px 0 0;border-bottom:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ptab:hover{background:var(--slate-50)}
.ptab.on{background:var(--blue-600);color:#fff;border-color:var(--blue-600)}
.ptab-c{font-size:10.5px;font-weight:700;background:var(--slate-100);color:var(--slate-600);padding:1px 7px;border-radius:20px}
.ptab.on .ptab-c{background:rgba(255,255,255,.25);color:#fff}
.ptoolbar{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--slate-100);flex-wrap:wrap}
.psearch{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;border:1px solid var(--slate-300);border-radius:9px;padding:0 10px;color:var(--slate-400)}
.psearch input{flex:1;border:none;outline:none;padding:9px 0;font-size:13.5px;color:var(--slate-800);background:transparent}
.psearch:focus-within{border-color:var(--blue-500);box-shadow:0 0 0 3px var(--blue-100)}
.colchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.colchips-l{font-size:11px;font-weight:700;color:var(--slate-500);text-transform:uppercase;letter-spacing:.05em;margin-right:2px}
.colchip{font-size:12px;font-weight:600;border:1px solid var(--slate-300);background:#fff;color:var(--slate-600);padding:4px 10px;border-radius:20px;cursor:pointer}
.colchip:hover{background:var(--slate-50)}
.colchip.on{background:var(--blue-600);color:#fff;border-color:var(--blue-600)}
.rowact{display:flex;gap:4px;opacity:0;transition:.1s}
table.t tbody tr:hover .rowact{opacity:1}
.iconbtn{border:none;background:transparent;cursor:pointer;color:var(--slate-400);padding:4px;border-radius:5px;line-height:0}
.iconbtn:hover{background:var(--slate-100);color:var(--slate-700)}.iconbtn.del:hover{color:var(--red-700)}
.empty{padding:30px;text-align:center;color:var(--slate-400);font-size:13px}
.pdfbtn{border:1px solid var(--slate-300);background:#fff;color:var(--slate-700);font-size:12px;font-weight:600;padding:5px 10px;border-radius:7px;text-decoration:none;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pdfbtn:hover{background:var(--slate-50)}
/* belge kontrol */
.belgechip{border:1px solid var(--slate-300);background:#fff;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:20px;cursor:pointer;white-space:nowrap;color:var(--slate-600);font-variant-numeric:tabular-nums}
.belgechip:hover{background:var(--slate-50)}
.belgechip.tam{border-color:var(--green-600);background:var(--green-50);color:var(--green-700)}
.belgechip.eksik{border-color:#f3c7c7;background:var(--red-50);color:var(--red-700)}
.belgechip b{font-weight:800}
.belge-list{display:flex;flex-direction:column;gap:0}
.belge-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:8px 4px;border-bottom:1px solid var(--slate-100)}
.belge-row .bl-ad{font-size:12.5px;font-weight:600;color:var(--slate-700)}
.belge-row select{padding:5px 8px;border:1px solid var(--slate-300);border-radius:7px;font-size:12px;min-width:150px}
.bl-var{color:var(--green-700)}.bl-yok{color:var(--red-700)}.bl-diger{color:var(--amber-700)}
.belge-sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.belge-sum .bs-pill{font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:20px}
.bs-var{background:var(--green-100);color:var(--green-700)}.bs-yok{background:var(--red-100);color:var(--red-700)}.bs-diger{background:var(--amber-100);color:var(--amber-700)}
/* template */
.tmpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tmpl{background:#fff;border:1px solid var(--slate-200);border-radius:11px;padding:16px;display:flex;flex-direction:column;gap:9px}
.tmpl .tt{font-size:14px;font-weight:700;color:var(--slate-900)}
.tmpl .tm{font-size:11.5px;color:var(--slate-500);flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tmpl .ta{display:flex;gap:6px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--slate-100);color:var(--slate-600)}
/* placeholder */
.ph{text-align:center;padding:54px 24px;color:var(--slate-500)}
.ph .pic{width:66px;height:66px;border-radius:16px;background:var(--blue-50);color:var(--blue-500);display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.ph .pic svg{width:34px;height:34px}
.ph h2{font-size:19px;font-weight:700;color:var(--slate-800);margin-bottom:8px}
.ph p{font-size:13px;max-width:520px;margin:0 auto 6px;line-height:1.6}
.ph .plist{text-align:left;max-width:460px;margin:14px auto 0;font-size:12.5px;color:var(--slate-600)}
.ph .plist li{margin:5px 0}
.ph .soon{display:inline-block;margin-top:16px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--amber-700);background:var(--amber-100);padding:5px 14px;border-radius:20px}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:34px 18px;overflow-y:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:560px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5)}
.modal.lg{max-width:820px}
.modal-hd{padding:16px 22px;border-bottom:1px solid var(--slate-100);display:flex;align-items:center;justify-content:space-between}
.modal-hd h3{font-size:16px;font-weight:700}
.modal-bd{padding:18px 22px;max-height:70vh;overflow-y:auto}.modal-ft{padding:14px 22px;border-top:1px solid var(--slate-100);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.fld{margin-bottom:14px}.fld label{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--slate-500);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 12px;border:1px solid var(--slate-300);border-radius:8px;font-size:13.5px;color:var(--slate-800)}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--blue-500);box-shadow:0 0 0 3px var(--blue-100)}
/* Para birimli input — sol tarafta ₺ ön eki */
.para{position:relative;display:block}
.para::before{content:'\20BA';position:absolute;left:11px;top:0;bottom:0;display:flex;align-items:center;color:var(--slate-500);font-weight:700;font-size:13px;pointer-events:none;z-index:1}
.para input{padding-left:26px !important;width:100%}
.fld textarea{resize:vertical;min-height:60px;line-height:1.55}
.fld textarea.code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;min-height:300px}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.fld-sec{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--blue-700);margin:6px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--blue-100)}
.ihbar-box{background:var(--amber-50);border:1px solid #f3e2bd;border-radius:10px;padding:14px 16px 2px;margin:6px 0 10px}
.ihbar-box .fld-sec{color:var(--amber-700);border-bottom-color:#f0d79a;margin-top:0}
.ayrilis-box{background:var(--slate-100);border:1px solid var(--slate-200);border-radius:10px;padding:14px 16px 2px;margin:6px 0 10px}
.ayrilis-box .fld-sec{color:var(--slate-600);border-bottom-color:var(--slate-300);margin-top:0}
.xbtn{border:none;background:transparent;font-size:22px;color:var(--slate-400);cursor:pointer}
.mergebar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.mergebar button{font-size:11px;font-weight:600;border:1px solid var(--blue-200);background:var(--blue-50);color:var(--blue-700);padding:4px 9px;border-radius:6px;cursor:pointer}
.mergebar button:hover{background:var(--blue-100)}
.helptext{font-size:11.5px;color:var(--slate-500);margin-top:6px}
/* puantaj */
.brush{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.brush .bl{font-size:11px;font-weight:700;color:var(--slate-500);text-transform:uppercase;letter-spacing:.05em;margin-right:2px}
.brush button{font-size:11.5px;font-weight:700;border:2px solid transparent;border-radius:7px;padding:5px 11px;cursor:pointer}
.brush button.on{border-color:var(--slate-900);box-shadow:0 0 0 2px #fff inset}
.pz-scroll{overflow:auto;max-height:72vh;border:1px solid var(--slate-200);border-radius:10px}
/* Sütun grubu gizleme araç çubuğu (Excel gibi yatay gizleme) */
.colgrp-bar{gap:6px;align-items:center}
/* Puantaj arama + departman filtresi */
.pz-filtre{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.pz-ara{position:relative;display:flex;align-items:center}
.pz-ara svg{position:absolute;left:10px;color:var(--slate-400);pointer-events:none}
.pz-ara input{padding:8px 30px 8px 32px;border:1px solid var(--slate-300);border-radius:9px;font-size:13px;min-width:240px}
.pz-ara input:focus{outline:none;border-color:var(--blue-400);box-shadow:0 0 0 3px rgba(96,165,250,.2)}
.pz-ara-x{position:absolute;right:6px;border:none;background:var(--slate-200);color:var(--slate-600);width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center}
.pz-depsel{padding:8px 10px;border:1px solid var(--slate-300);border-radius:9px;font-size:13px;background:#fff;cursor:pointer}
.pz-filtre-say{font-size:12px;color:var(--slate-500)}.pz-filtre-say b{color:var(--slate-800)}
.colgrp{font-size:11.5px;font-weight:700;border:1px solid var(--slate-300);background:#EFF3F8;color:#334155;border-radius:7px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.colgrp:hover{border-color:var(--blue-400)}
.colgrp.off{background:#F1F5F9;color:#94A3B8;text-decoration:line-through;border-style:dashed}
.colgrp.gunmod{background:#EDE9FE;color:#5B21B6;border-color:#DDD6FE}
.colgrp.gunmod.on{background:#5B21B6;color:#fff;border-color:#5B21B6}
.colgrp-sep{width:1px;height:20px;background:var(--slate-300);margin:0 3px}
/* Puantaj uyarıları — açılır/kapanır başlık (accordion). Varsayılan kapalı, başlığa basınca açılır. */
details.pz-uyari{border-radius:9px;margin:0 0 8px;border:1px solid var(--slate-200);background:#fff}
details.pz-uyari>summary{list-style:none;cursor:pointer;padding:9px 13px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:8px;user-select:none;border-radius:9px}
details.pz-uyari>summary::-webkit-details-marker{display:none}
details.pz-uyari>summary::before{content:'▸';font-size:10px;transition:transform .15s;opacity:.65}
details.pz-uyari[open]>summary::before{transform:rotate(90deg)}
details.pz-uyari[open]>summary{border-bottom:1px solid rgba(0,0,0,.06);border-radius:9px 9px 0 0}
details.pz-uyari .uyari-govde{padding:11px 14px 13px;font-size:12.5px;line-height:1.6}
details.pz-uyari .uyari-say{margin-left:auto;font-size:11px;font-weight:800;padding:1px 8px;border-radius:20px;background:rgba(0,0,0,.08)}
details.uyari-kirmizi{background:#FEF2F2;border-color:#FCA5A5}details.uyari-kirmizi>summary{color:#991B1B}
details.uyari-sari{background:#FFFBEB;border-color:#FCD34D}details.uyari-sari>summary{color:#92400E}
details.uyari-turuncu{background:#FFF7ED;border-color:#FDBA74}details.uyari-turuncu>summary{color:#9A3412}
details.uyari-turuncu .uyari-say{background:#FED7AA;color:#9A3412}
table.pz{border-collapse:separate;border-spacing:0;font-size:11px}
table.pz th,table.pz td{border-right:1px solid var(--slate-200);border-bottom:1px solid var(--slate-200);padding:4px 5px;text-align:center;white-space:nowrap}
table.pz thead th{background:var(--slate-100);font-weight:700;font-size:10px;color:var(--slate-600);position:sticky;top:0;z-index:2;vertical-align:middle}
/* Gün başlığı: numara üstte, gün adı altta — tek hücrede (eski 2. başlık satırı kaldırıldı) */
table.pz th.dgun .dnum{display:block;font-size:11px;line-height:1.3}
table.pz th.dgun .dad{display:block;font-size:8.5px;font-weight:600;color:var(--slate-400);text-transform:uppercase;letter-spacing:.02em}
table.pz td.nm,table.pz th.nm{text-align:left;position:sticky;left:0;background:#fff;z-index:1;font-weight:600;min-width:148px;box-shadow:1px 0 0 var(--slate-200)}
table.pz th.nm{background:var(--slate-100);z-index:4}
table.pz td.nm-link{cursor:pointer}
table.pz td.nm-link .nm-ico{opacity:0;color:var(--blue-600);font-size:11px;margin-left:5px;transition:opacity .12s}
table.pz td.nm-link:hover{background:var(--blue-50)}
table.pz td.nm-link:hover .nm-ad{color:var(--blue-700);text-decoration:underline}
table.pz td.nm-link:hover .nm-ico{opacity:1}
/* Ay içinde işe giren (yeşil) / işten çıkan (kırmızı) — isim hücresi dolgusu */
table.pz td.nm.nm-giris{background:#dcfce7}
table.pz td.nm.nm-cikis{background:#fee2e2}
table.pz td.nm-link.nm-giris:hover{background:#bbf7d0}
table.pz td.nm-link.nm-cikis:hover{background:#fecaca}
.pz-gc-leg{display:inline-flex;align-items:center;gap:12px;font-size:11.5px;color:var(--slate-500);margin-left:14px}
.pz-gc-leg i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:middle;margin-right:4px}
/* Ay gezinme pili (‹ ay-yıl ›) */
.pz-aynav{display:inline-flex;align-items:center;background:#fff;border:1px solid var(--slate-300);border-radius:9px;overflow:hidden;height:34px;vertical-align:middle}
.pz-aynav-ok{border:0;background:none;cursor:pointer;padding:0 8px;height:100%;display:inline-flex;align-items:center;color:var(--slate-500);transition:background .12s,color .12s}
.pz-aynav-ok:hover{background:var(--blue-50);color:var(--blue-600)}
.pz-aynav-in{border:0;background:none;font-weight:700;font-size:13px;color:var(--slate-800);padding:0 2px;text-align:center;cursor:pointer;font-family:inherit;min-width:104px}
.pz-aynav-in:focus{outline:none}
.pz-aynav-in::-webkit-calendar-picker-indicator{opacity:.45;cursor:pointer}
/* Açılır kontrol paneli (Boya · Açıklamalar · Gruplar) */
.pz-pnlbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:2px 0 12px}
.pz-pnltgl{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--slate-300);background:#fff;color:var(--slate-700);border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .12s}
.pz-pnltgl:hover{border-color:var(--blue-400);color:var(--blue-700)}
.pz-pnltgl.on{background:var(--blue-600);border-color:var(--blue-600);color:#fff}
.pz-pnlcur{background:rgba(0,0,0,.07);border-radius:5px;padding:1px 8px;font-weight:700;font-size:11px;color:var(--slate-700)}
.pz-pnltgl.on .pz-pnlcur{background:rgba(255,255,255,.24);color:#fff}
.pz-pnl{animation:pzSlide .14s ease}
@keyframes pzSlide{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
/* Ay Notları (not defteri) */
.pz-not-badge{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 5px;margin-left:6px;background:var(--blue-600);color:#fff;border-radius:9px;font-size:10.5px;font-weight:700;vertical-align:middle}
.pz-not-ekle{display:flex;gap:8px;margin-bottom:6px}
.pz-not-ekle input{flex:1;padding:9px 11px;border:1px solid var(--slate-300);border-radius:8px;font-size:13px;font-family:inherit}
.pz-not-ekle input:focus{outline:none;border-color:var(--blue-400)}
.pz-not-satir{display:flex;align-items:flex-start;gap:8px;padding:9px 2px;border-bottom:1px solid var(--slate-100)}
.pz-not-satir label{flex:1;display:flex;align-items:flex-start;gap:9px;cursor:pointer;margin:0}
.pz-not-satir input[type=checkbox]{width:17px;height:17px;margin-top:1px;flex-shrink:0;cursor:pointer;accent-color:var(--blue-600)}
.pz-not-metin{font-size:13.5px;color:var(--slate-800);line-height:1.45;word-break:break-word}
.pz-not-satir.tamam .pz-not-metin{text-decoration:line-through;color:var(--slate-400)}
.pz-not-sil{border:0;background:none;color:var(--slate-400);font-size:18px;line-height:1;cursor:pointer;padding:0 4px;flex-shrink:0}
.pz-not-sil:hover{color:var(--blue-600)}
.pz-not-ozet{margin-top:12px;font-size:11.5px;color:var(--slate-500);text-align:right}
/* Hafta tatili çoklu seçim (personel kartı) */
.hafta-cek{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.hafta-cek .hcek{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--slate-600);background:#fff;border:1px solid var(--slate-300);border-radius:7px;padding:5px 8px;cursor:pointer;user-select:none;line-height:1}
.hafta-cek .hcek:hover{border-color:var(--blue-400)}
.hafta-cek .hcek input{width:14px;height:14px;margin:0;cursor:pointer;accent-color:var(--blue-600)}
.hafta-cek .hcek:has(input:checked){background:var(--blue-50);border-color:var(--blue-600);color:var(--blue-700)}
table.pz td.sno{position:sticky;left:0;background:#fff}
table.pz td.day{cursor:pointer;font-weight:700;min-width:24px;position:relative}
table.pz td.day:hover{outline:2px solid var(--blue-400);outline-offset:-2px}
/* EKSİK ÇIKIŞ: giriş var, çıkış yok → o periyot sayılamadı. Sağ üst köşede turuncu üçgen. */
table.pz td.day.eks::after{content:'';position:absolute;top:0;right:0;border-style:solid;border-width:0 7px 7px 0;border-color:transparent #EA580C transparent transparent}
table.pz td.day.eks-kritik::after{border-right-color:#DC2626;border-width:0 9px 9px 0}
table.pz td.day.eks-kritik{outline:2px solid #DC2626;outline-offset:-2px}
table.pz td.sum{font-weight:700;background:var(--slate-50)}
table.pz td.sum.sum-eksik{background:#FCA5A5;color:#7F1D1D;font-weight:800}
/* Gün kodu renkleri — palet düğmeleri. X soluk kalır (çoğunluk o); istisnalar dolu ve net. */
.pz-X{background:#E9F8EF;color:#15803D}
.pz-HT{background:#FACC15;color:#422006}
.pz-HC{background:#15803D;color:#fff}
.pz-GT{background:#A78BFA;color:#fff}
.pz-TM{background:#6D28D9;color:#fff}
.pz-D{background:#111827;color:#fff}
.pz-X,.pz-HT,.pz-HC,.pz-GT,.pz-TM,.pz-YI,.pz-UI,.pz-R,.pz-M,.pz-D{font-weight:700}
/* BORDRO sütunları — isimden sonra, gün kutularından önce. bkol-pz = puantajdan otomatik dolan. */
table.pz td.bkol,table.pz th.bkol{min-width:62px;font-size:10px;white-space:nowrap;background:#fff;cursor:pointer;position:relative}
table.pz td.bkol:hover{outline:2px solid var(--blue-400);outline-offset:-2px}
/* NOT işareti — Excel yorumu gibi sağ üst köşede kırmızı üçgen */
table.pz td.bkol.bnot::after{content:'';position:absolute;top:0;right:0;border-style:solid;border-width:0 7px 7px 0;border-color:transparent #DC2626 transparent transparent}
/* Orantılandı (aile/çocuk/prim çalışılan güne göre azaltıldı) — kehribar değer + sol-alt köşe işareti */
table.pz td.bkol.bkol-oran{color:var(--amber-700);font-weight:700}
table.pz td.bkol.bkol-oran::before{content:'';position:absolute;left:0;bottom:0;border-style:solid;border-width:7px 0 0 7px;border-color:transparent transparent transparent #D97706}
/* Renk işaretli hücre metni okunur kalsın */
table.pz td.bkol.brenk{color:#1f2937;font-weight:700}
/* Ayni yardım hakkı olmayan hücre — siyah, uygulanamaz (gün pasifi gibi) */
table.pz td.bkol.bkol-siyah{background:#111827;cursor:default}
table.pz td.bkol.bkol-siyah:hover{outline:none}
/* Devam primi: manuel = turuncu (kontrol), sabit (şoför) = teal, otomatik döngü = mor */
table.pz td.bkol.dp-manuel{background:#FDBA74;color:#7C2D12;font-weight:800}
table.pz td.bkol.dp-sabit{background:#99F6E4;color:#115E59;font-weight:700}
table.pz td.bkol.dp-oto{background:#DDD6FE;color:#4C1D95;font-weight:700}
/* Renk seçici (bordro hücre işaretle penceresi) */
.renk-bar{display:flex;gap:8px;flex-wrap:wrap}
.renk-sw{width:38px;height:30px;border-radius:8px;border:2px solid rgba(0,0,0,.15);cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:800;color:#64748b}
.renk-sw.renk-yok{background:#fff}
.renk-sw.sel{outline:3px solid #111827;outline-offset:2px}
.fld-lbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--slate-500);margin-bottom:5px}
table.pz thead th.bkol{background:#EFF3F8;color:#334155;font-weight:700;position:sticky;top:0;z-index:2}
/* BAŞLIK SARMA — bordro sütunlarının bir kısmında genişliği VERİ değil BAŞLIK belirliyor ("Çocuk Yardımı"
   başlığı, içindeki tutardan geniş). Sarmaya izin verince sütun min-width:62px tabanına iner.
   Veri boyutu, kuruş, tıklama hedefi değişmez — bedeli yalnız başlık satırının bir kerelik uzaması.
   NOT: bu kural, yukarıdaki (satır 314) `th.bkol{white-space:nowrap}` ile AYNI özgüllükte (0,2,2) —
   bu yüzden ondan SONRA gelmek zorunda, yoksa uygulanmaz. Yerini değiştirme. */
table.pz thead th.bkol{white-space:normal;line-height:1.15}
/* Yalnız gövde hücreleri tek satırda kalsın (rakam kırılmasın) */
table.pz td.bkol{white-space:nowrap}
table.pz th.bkol-alt{background:#BDD7EE;color:#1E3A5F;font-weight:700;font-size:9.5px}
table.pz td.bkol-pz{background:#F5F3FF;color:#4C1D95;font-weight:700}
table.pz thead th.bkol-pz{background:#DDD6FE;color:#4C1D95}
table.pz td.bkol:last-of-type{border-right:2px solid #cbd5e1}
table.pz td.dsaat{font-size:9.5px;color:#475569;font-weight:600;min-width:22px;background:#fcfcfd;position:relative;cursor:pointer}
table.pz td.dsaat:hover{outline:2px solid var(--blue-400);outline-offset:-2px}
/* MANUEL saat (dış görev / kart basmayan) — kehribar değer + sol-alt köşe işareti */
table.pz td.dsaat.ds-man{color:var(--amber-700);font-weight:800}
/* VARSAYILAN saat — elle X boyandı, kart kaydı yok → 7,5 sayılıyor. Gerçek kayıttan ayrışsın diye soluk+italik */
table.pz td.dsaat.ds-vars{color:#94a3b8;font-weight:500;font-style:italic}
/* ÇALIŞILAN RAPOR GÜNÜ — gün X/HÇ/TM ama o güne rapor da var. SGK eksik gününe girmez; sol-alt köşe
   işareti (eksik-çıkış işareti sağ-üstte, çakışmaz). Rengi R'nin mavisi — "burada rapor var" demek. */
table.pz td.day.rap-var::before{content:'';position:absolute;left:0;bottom:0;border-style:solid;border-width:7px 0 0 7px;border-color:transparent transparent transparent #2563EB}
table.pz td.dsaat.ds-man::before{content:'';position:absolute;left:0;bottom:0;border-style:solid;border-width:6px 0 0 6px;border-color:transparent transparent transparent #D97706}
table.pz td.dsaat,table.pz th.dgun{border-right:2px solid #cbd5e1}
table.pz td.day{border-right:1px solid #eef1f5}
table.pz td.c-ahs,table.pz th.c-ahs{min-width:36px;font-weight:700;background:#7FCCE8;color:#0B3C50}
table.pz td.c-ahsx,table.pz th.c-ahsx{min-width:42px;font-weight:700;background:#E8B48C;color:#6B3410}
table.pz td.c-ahb,table.pz th.c-ahb{min-width:36px;font-weight:700;background:#E8B48C;color:#6B3410}
table.pz td.c-aht,table.pz th.c-aht{min-width:36px;font-weight:800;background:#E8756B;color:#5C1410;border-right:2px solid #cbd5e1}
table.pz td.hcol,table.pz th.hcol{min-width:32px;font-weight:700;background:#f8fafc}
table.pz td.fmcol,table.pz th.fmcol{background:#E0E7FF;color:#3730A3;font-weight:800}
table.pz thead th.fmcol{background:#C7D2FE;color:#312E81}
table.pz td.hcol.hgreen{background:#DCFCE7;color:#15803D}
table.pz td.hcol.hred{background:#FEE2E2;color:#B91C1C}
table.pz td.c-gs,table.pz th.c-gs{min-width:38px;font-weight:700;background:#CFFAFE;color:#155E75;border-left:2px solid #cbd5e1}
table.pz td.c-cs,table.pz th.c-cs{min-width:38px;font-weight:700;background:#CFFAFE;color:#155E75}
table.pz td.c-fark,table.pz th.c-fark{min-width:44px;font-weight:800;background:#f8fafc;border-right:2px solid #cbd5e1}
table.pz td.c-fark.fgreen{background:#DCFCE7;color:#15803D}
table.pz td.c-fark.fred{background:#FEE2E2;color:#B91C1C}
.pz-YI{background:#E11D48;color:#fff}
.pz-UI{background:#64748B;color:#fff}
.pz-R{background:#2563EB;color:#fff}
.pz-RK{background:#0891B2;color:#fff}
.pz-M{background:#EA580C;color:#fff}
.pz-E{color:#cbd5e1}
table.pz td.wend{background:#fafbfc}
/* Tablo hücreleri: .wend (0,2,2) gün kodu rengini ezmesin diye (0,3,2) özgüllük — HT/HÇ beyaz kalıyordu */
table.pz td.day.pz-X{background:#E9F8EF;color:#15803D}
table.pz td.day.pz-HT{background:#FACC15;color:#422006}
table.pz td.day.pz-HC{background:#15803D;color:#fff}
table.pz td.day.pz-GT{background:#A78BFA;color:#fff}
table.pz td.day.pz-TM{background:#6D28D9;color:#fff}
table.pz td.day.pz-YI{background:#E11D48;color:#fff}
table.pz td.day.pz-UI{background:#64748B;color:#fff}
table.pz td.day.pz-R{background:#2563EB;color:#fff}
/* İş kazası raporu — normal rapordan (mavi) ayrışsın diye camgöbeği. Palette boş olan tek soğuk ton:
   mor GT/TM'de, yeşil HÇ'de, gül Yİ'de, turuncu M'de dolu. */
table.pz td.day.pz-RK{background:#0891B2;color:#fff}
table.pz td.dsaat.ds-RK{background:#CFFAFE;color:#155E75}
table.pz td.day.pz-M{background:#EA580C;color:#fff}
table.pz td.day.pz-D{background:#111827;color:#fff}
/* Saat hücresi, gün rengiyle aynı aileden hafif ton — gün tek blok gibi okunsun */
table.pz td.dsaat.ds-HC{background:#DCFCE7;color:#14532D}
table.pz td.dsaat.ds-TM{background:#EDE9FE;color:#4C1D95}
/* PASİF gün — çalışma dönemi dışı (işe giriş öncesi / ayrılıştan itibaren). Siyah, tıklanamaz.
   Devamsız (D) siyahından ayrışsın diye çapraz taramalı ve harfsiz. */
table.pz td.day.pz-P,table.pz td.dsaat.ds-P{cursor:not-allowed;
  background:repeating-linear-gradient(45deg,#0B1120,#0B1120 3px,#1E293B 3px,#1E293B 6px)}
table.pz td.day.pz-P:hover,table.pz td.dsaat.ds-P:hover{outline:none}
/* Akıllı Arama — canlı kişi önerisi satırları */
.as-on{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 13px;cursor:pointer;font-size:13.5px;border-bottom:1px solid var(--slate-100)}
.as-on:last-child{border-bottom:0}
.as-on:hover{background:var(--blue-50)}
.as-on span{font-size:11.5px;color:var(--slate-400)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--slate-900);color:#fff;padding:10px 18px;border-radius:9px;font-size:13px;z-index:200;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.sb-ov{display:none}
@media(max-width:880px){
  .sidebar{transform:translateX(-100%)}.sidebar.open{transform:none}
  .main{margin-left:0}.hamb{display:inline-flex}

<script>
const LSKEY='rota_ik_v1';
const DEPARTMANLAR=['Üretim','İdari','Pazarlama','Şoför','Diğer'];
const ENGEL=['Engelli Değil','1. Derece Engelli','2. Derece Engelli','3. Derece Engelli'];
// Belge kontrol listesi kalemleri (Excel'deki AB..BG sütunları). personel-data.js'ten gelir; yedek olarak boş dizi.
// Not: Sağlık Raporu + İlkyardım (İSG'ye taşınacak), Ücret Hesap Pusulası ve Hesap Numarası bu listeden çıkarıldı (veri kayıtlarda korunur).
const BELGE_GIZLI=/SAĞLIK RAPORU|İLKYARD|ÜCRET HESAP|HESAP NUMARASI/i;
const BELGE_KALEM=((window.PERSONEL_IMPORT&&window.PERSONEL_IMPORT.belgeCols)||[]).filter(k=>!BELGE_GIZLI.test(k.label||''));
// Belge durumu normalize: "var" sayılan değerler
const BELGE_VAR=['EVET','DOSYADA','ALINMIŞ','VAR','ENGELLİ RAPORU VAR'];
function belgeDurum(v){const s=String(v||'').trim().toUpperCase();if(!s)return 'bos';if(BELGE_VAR.includes(s))return 'var';if(s==='HAYIR'||s==='YOK')return 'yok';return 'diger';}
// "—" (boş) bırakılan evraklar değerlendirme dışıdır: toplama ve eksiğe dahil edilmez.
function belgeOzet(p){const b=p.belgeler||{};let v=0,y=0,d=0,bos=0;BELGE_KALEM.forEach(k=>{const st=belgeDurum(b[k.key]);if(st==='var')v++;else if(st==='yok')y++;else if(st==='diger')d++;else bos++;});return {var:v,yok:y,diger:d,bos:bos,toplam:v+y+d};}
// Listelerde gösterilen belge rozeti (değerlendirilen evrak yoksa nötr "—")
function belgeChip(p){
  if(!BELGE_KALEM.length)return '—';
  const bz=belgeOzet(p);const eksik=bz.yok+bz.diger;
  if(bz.toplam===0)return '<span style="color:var(--slate-400);font-size:11.5px">—</span>';
  return `<button class="belgechip ${eksik?'eksik':'tam'}" title="Belge kontrol listesini aç" onclick="openBelgeKontrol('${p.id}')"><b>${bz.var}</b>/${bz.toplam}${eksik?` · ${eksik} eksik`:' · tam'}</button>`;
}
// Belge kalem başlığı: kullanıcı düzenlediyse onu, yoksa varsayılanı döndürür
function belgeEtiket(k){return (DB&&DB.belgeEtiketleri&&DB.belgeEtiketleri[k.key])||k.label;}
const SABLON_KAT=['İş Sözleşmesi','Muvafakatname','Oryantasyon','Görev Tanımı','KVKK Evrakı','Zimmet','İmha Onamı','İzin Dilekçesi','İhbar Bildirimi','Diğer'];

function sgkKodOpts(sel,filtre){
  let list=SGK_CIKIS_KODLARI;
  if(filtre&&filtre.taraf)list=list.filter(c=>c.taraf===filtre.taraf);
  if(filtre&&filtre.onel)list=list.filter(c=>c.onel);
  if(filtre&&filtre.deneme)list=list.filter(c=>c.deneme);
  return '<option value="">— Kod seçin —</option>'+list.map(c=>`<option value="${c.k}" ${String(sel||'')===c.k?'selected':''}>${c.k} — ${c.l}${c.kidem?' (kıdem ✓)':''}</option>`).join('');
}

function persSortCmp(a,b,key,dir){const m=dir==='desc'?-1:1;
  if(key==='denemeGun'){const ga=(denemeDurum(a)||{}).gun||0,gb=(denemeDurum(b)||{}).gun||0;return m*(ga-gb)||(a.ad||'').localeCompare(b.ad||'','tr');}
  if(key==='belge'){const ea=(()=>{const z=belgeOzet(a);return z.yok+z.diger;})(),eb=(()=>{const z=belgeOzet(b);return z.yok+z.diger;})();return m*(ea-eb)||(a.ad||'').localeCompare(b.ad||'','tr');}return m*persSortVal(a,key).localeCompare(persSortVal(b,key),'tr')||(a.ad||'').localeCompare(b.ad||'','tr');}

// İhbar önelindeki personel son çalışma gününe gelince otomatik "ayrıldı" yapılıp arşive alınır
function otomatikArsivle(){
  const bugun=todayISO();let degisti=false;
  DB.personeller.forEach(p=>{
    if(p.durum!=='ihbar'||!p.iseGiris||!p.ihbarBaslangic)return;
    const h=ihbarHesapla(p.iseGiris,p.ihbarBaslangic,ihbarKesintiGun(p,p.ihbarBaslangic),haftaTatiliGunleri(p));
    const son=p.ihbarToplu?h.sonCalismaToplu:h.bitis;
    if(bugun>=son){p.durum='ayrildi';if(!p.ayrilisTarihi)p.ayrilisTarihi=h.bitis;degisti=true;}
  });
  if(degisti)saveDB();
}
// Tek seferlik: görev/bölümünde şoför/sürücü/tır geçen personeli "Şoför" departmanına taşı
function migrateSoforDept(){
  if(DB.meta.soforDeptV1)return;
  const pat=/ŞOFÖR|SÜRÜCÜ|NAKLİYE|\bTIR\b/i;
  let n=0;
  DB.personeller.forEach(p=>{
    const s=[p.gorev,p.bolum,p.meslekKodu].map(x=>String(x||'')).join(' ').toLocaleUpperCase('tr');

function migrateKidemBaslangic(){
  if(DB.meta.kidemImportV1)return;

// Zirve bordrosu (23.06.2026) — kıdem başlangıç + kalan yıllık izin tek seferlik içe aktarma
function migrateKidemIzin2026(){
  if(DB.meta.kidemIzin2026V1)return;
  const imp=window.KIDEM_IZIN_2026||[];
  if(!imp.length)return; // veri dosyası henüz yüklenmediyse flag'i set etme, sonra dene
  const norm=s=>String(s||'').toLocaleUpperCase('tr').replace(/\s+/g,' ').trim();
  const idx={};DB.personeller.forEach(p=>{idx[norm(p.ad)]=p;});
  DB.izinBakiye=DB.izinBakiye||[];DB.izinler=DB.izinler||[];
  const YIL=2026;let kidemN=0,bakN=0;const atlanan=[];
  imp.forEach(row=>{
    const p=idx[norm(row.ad)];
    if(!p){atlanan.push(row.ad);return;}
    // Kıdem başlangıç: Excel'de ayrı tarih varsa onu yaz; boşsa işe girişe eşitle (Excel'deki gir)
    const yeniKidem=row.kid||row.gir||p.iseGiris||'';
    if(yeniKidem&&p.kidemBaslangic!==yeniKidem){p.kidemBaslangic=yeniKidem;kidemN++;}
    // Kalan yıllık izin → 2026 bakiyesi. kalan = devir + hak − kullanılan; hak=0, devir = kalan + 2026 kullanılan
    if(row.kal!=null){
      const kullanilan=DB.izinler.filter(z=>z.personelId===p.id&&z.tur==='yillik'&&(z.baslangic||'').slice(0,4)===String(YIL)).reduce((s,z)=>s+(+z.gun||0),0);
      let b=DB.izinBakiye.find(x=>x.personelId===p.id&&+x.yil===YIL);
      if(!b){b={personelId:p.id,yil:YIL};DB.izinBakiye.push(b);}
      b.devir=row.kal+kullanilan;b.hakEdilen=0;bakN++;
    }
  });
  DB.meta.kidemIzin2026V1=true;saveDB();
  if(atlanan.length)console.warn('[Kıdem/İzin 2026] eşleşmeyen ('+atlanan.length+'):',atlanan);
  console.log('[Kıdem/İzin 2026] kıdem güncel:'+kidemN+' · bakiye güncel:'+bakN+' · atlanan:'+atlanan.length);
}

function migrateSarkuteri(){
  if(DB.meta.sarkuteriV1)return;
  const imp=window.KIDEM_IZIN_2026;
  if(!imp||!imp.length)return; // veri dosyası gelmediyse flag'i set etme, sonra dene
  const norm=s=>String(s||'').toLocaleUpperCase('tr').replace(/\s+/g,' ').trim();
  const isimler=['İBRAHİM İLHAN','MUSTAFA BALTA','SEZAİ KARACA'];
  const impIdx={};imp.forEach(r=>{impIdx[norm(r.ad)]=r;});
  const persIdx={};DB.personeller.forEach(p=>{persIdx[norm(p.ad)]=p;});
  DB.izinBakiye=DB.izinBakiye||[];let isaret=0,olustur=0;
  isimler.forEach(ad=>{
    const n=norm(ad),row=impIdx[n];let p=persIdx[n];
    if(p){ p.sarkuteri=true;p.departman='Şarküteri';isaret++; }
    else{
      p={id:uid('p'),ad:ad,tc:'',cinsiyet:'Erkek',departman:'Şarküteri',bolum:'',gorev:'',telefon:'',durum:'aktif',sarkuteri:true};
      if(row){p.iseGiris=row.gir||'';p.kidemBaslangic=row.kid||row.gir||'';}
      DB.personeller.push(p);olustur++;
      if(row&&row.kal!=null&&!DB.izinBakiye.some(x=>x.personelId===p.id&&+x.yil===2026))
        DB.izinBakiye.push({personelId:p.id,yil:2026,devir:row.kal,hakEdilen:0});
    }
  });
  DB.meta.sarkuteriV1=true;saveDB();
  console.log('[Şarküteri] işaretlenen:'+isaret+' · oluşturulan:'+olustur);
}

// ARİFE (yarım gün tatil): 28 Ekim + her dini bayramın İLK gününden bir önceki gün. Canlı takvimden türetilir.

const ARIFE=(()=>{const s=new Set();
  const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const oncekiGun=k=>{const d=new Date(k+'T00:00:00');d.setDate(d.getDate()-1);return iso(d);};
  for(let y=TAKVIM_BAS;y<=TAKVIM_SON;y++)s.add(y+'-10-28'); // Cumhuriyet Bayramı arifesi
  // Bayramın İLK günü = bir önceki gün AYNI bayram değilse. (Yılda iki bayram olan 2033'ü de doğru yakalar.)
  Object.keys(RESMI_TATIL).forEach(k=>{const ad=RESMI_TATIL[k];
    if(ad!=='Ramazan Bayramı'&&ad!=='Kurban Bayramı')return;
    const onc=oncekiGun(k);
    if(RESMI_TATIL[onc]!==ad)s.add(onc);});

  // Tam tatil kazanır → primi 7,5, yarım değil.
  s.forEach(d=>{if(RESMI_TATIL[d])s.delete(d);});

function haftaTatiliGunleri(p){const s=(p&&p.haftaTatili||'').toLocaleUpperCase('tr');const set=new Set();
  [['PAZARTESİ',1],['CUMARTESİ',6],['ÇARŞAMBA',3],['PERŞEMBE',4],['SALI',2],['CUMA',5],['PAZAR',0]].forEach(([k,idx])=>{

function izinDonusHesapla(startISO,N,restDays){const start=parseISO(startISO);if(!start||!N||N<1)return null;
  if(restDays&&restDays.size>=7)return null;
  const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  let d=new Date(start),counted=0,last=null,guard=0,htSay=0,rtSay=0;const tatilAd=new Set();
  while(counted<N&&guard<2000){const wd=d.getDay(),is=iso(d),isHol=!!RESMI_TATIL[is],isRest=restDays.has(wd);
    if(isHol){if(last!==null){rtSay++;tatilAd.add(RESMI_TATIL[is]);}}
    else if(isRest){if(last!==null)htSay++;}
    else{counted++;last=new Date(d);}
    if(counted<N)d.setDate(d.getDate()+1);guard++;}
  if(!last)return null;
  let ret=new Date(last);do{ret.setDate(ret.getDate()+1);}while(restDays.has(ret.getDay())||RESMI_TATIL[iso(ret)]);
  return {bitisISO:iso(last),donusISO:iso(ret),haftaTatiliSayi:htSay,resmiTatilSayi:rtSay,tatilAdlari:[...tatilAd]};}
function aylarArasi(a,b){const d1=parseISO(a),d2=parseISO(b);if(!d1||!d2)return 0;let m=(d2.getFullYear()-d1.getFullYear())*12+(d2.getMonth()-d1.getMonth());if(d2.getDate()<d1.getDate())m--;return Math.max(0,m)}

// İhbar süresi içinde fiilen ÇALIŞILAN gün sayısı — personelin hafta tatili + resmi/dini tatiller hariç
// (4857/27: iş arama izni yalnız çalışılan günler için verilir; tatil günlerine iş arama izni yoktur)
function ihbarCalisilanGunSay(fromISO,toISO,rest){
  const d=parseISO(fromISO),e=parseISO(toISO);if(!d||!e)return 0;
  const iso=t=>t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
  let c=0;const x=new Date(d);x.setDate(x.getDate()+1); // bildirim günü hariç, sözleşme sona erme dahil
  while(x<=e){if(!rest.has(x.getDay())&&!RESMI_TATIL[iso(x)])c++;x.setDate(x.getDate()+1);}
  return c;
}
// Toplu iş arama izninde en son çalışma günü: sözleşme sona ermeden geriye doğru topluGun kadar
// ÇALIŞILAN gün izinli sayılır; ondan önceki ilk çalışılan gün = en son çalışma tarihi
function ihbarSonCalismaHesap(bitisISO,topluGun,rest){
  let d=parseISO(bitisISO);if(!d)return bitisISO;
  const iso=t=>t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
  let sayilan=0,guard=0;
  while(guard<1500){const s=iso(d);
    if(!rest.has(d.getDay())&&!RESMI_TATIL[s]){sayilan++;if(sayilan>=(topluGun||0)+1)return s;}
    d.setDate(d.getDate()-1);guard++;}

// 4857/17: <6ay=2hf, 6ay-1.5yıl=4hf, 1.5-3yıl=6hf, 3yıl+=8hf · md.27: çalışılan günde min 2 saat iş arama izni
// İhbar kıdemi HER ZAMAN son girişe göredir (fasıla birleşmez); kesintiGun (ücretsiz/devamsızlık) süreden düşülür.
// restDays: personelin hafta tatili günleri (haftaTatiliGunleri(p)) — iş arama izni yalnız çalışılan günlere işler.
// Deneme süresi: son işe girişten itibaren 2 ay VE DAHA AZ (4857/15). Bu sürede taraflar

function ihbarHesapla(iseGiris,fesihISO,kesintiGun,restDays){
  const ref=fesihISO||todayISO();const m=Math.max(0,aylarArasi(iseGiris,ref)-Math.floor((+kesintiGun||0)/30));

    return {ay:m,kidem:kidemMetin(iseGiris,ref),hafta:0,ihbarGun:0,baslangic:ref,bitis:ref,calisilanGun:0,isAramaSaat:0,topluGun:0,sonCalismaToplu:ref,deneme:true};

  const rest=(restDays&&restDays.size<7)?restDays:haftaTatiliGunleri(null); // varsayılan hafta tatili: Pazar

  {k:'defter',l:'Staj defteri / dosyası teslim edildi'},

  {k:'saglik',l:'İşe giriş sağlık raporu aldırıldı'},
  {k:'portor',l:'Portör / hijyen muayenesi yapıldı (gıda işletmesi — zorunlu)'},

function stajYas(s){return s&&s.dogum?yilFark(s.dogum,todayISO()):null;}
function stajKontrolOzet(s){const kt=s.kontrol||{};let tamam=0,eksik=0;STAJ_KONTROL.forEach(a=>{const v=kt[a.k];if(v==='evet'||v==='yok')tamam++;else eksik++;});return {tamam,eksik,toplam:STAJ_KONTROL.length};}
function renderStajyer(){
  const list=DB.stajyerler||[];
  const aktif=list.filter(s=>s.durum!=='tamamlandi');
  const tamamlanan=list.filter(s=>s.durum==='tamamlandi').length;
  const eksikEvrak=aktif.filter(s=>stajKontrolOzet(s).eksik>0).length;
  let h=`<div class="kpis">
    <div class="kpi"><div class="kl">Aktif Stajyer</div><div class="kv">${aktif.length}</div><div class="ks">${list.length} toplam</div></div>
    <div class="kpi g"><div class="kl">Tamamlanan</div><div class="kv">${tamamlanan}</div><div class="ks">stajı biten</div></div>
    <div class="kpi" style="border-top-color:${eksikEvrak?'#dc2626':'#16a34a'};background:${eksikEvrak?'#fef2f2':'#f0fdf4'}"><div class="kl">Evrak Eksiği</div><div class="kv">${eksikEvrak}</div><div class="ks">kontrol listesi eksik</div></div>
  </div>`;
  h+=`<div class="card"><div class="card-hd"><h3>Stajyerler</h3><span class="hint">${list.length} kayıt · satıra tıkla → düzenle</span></div>`;
  if(!list.length){h+=`<div class="empty">Henüz stajyer yok. Sağ üstten <b>+ Stajyer</b> ile ekleyin.</div></div>`;document.getElementById('content').innerHTML=h;return;}
  h+=`<div class="tbl-scroll"><table class="t"><thead><tr><th>Ad Soyad</th><th>Okul / Sınıf</th><th>Bölüm</th><th>Koordinatör</th><th>Staj Dönemi</th><th>Evrak</th><th>Durum</th><th></th></tr></thead><tbody>`;
  [...list].sort((a,b)=>(a.durum==='tamamlandi'?1:0)-(b.durum==='tamamlandi'?1:0)||(a.ad||'').localeCompare(b.ad||'','tr')).forEach(s=>{
    const oz=stajKontrolOzet(s);const yas=stajYas(s);
    const evrakChip=oz.eksik?`<span class="badge b-ihbar">${oz.tamam}/${oz.toplam}</span>`:`<span class="badge b-on">Tam</span>`;
    h+=`<tr style="cursor:pointer" onclick="openStajyer('${s.id}')">
      <td><b>${esc(s.ad||'—')}</b>${yas!=null&&yas<18?` <span style="font-size:9.5px;font-weight:700;background:#fef3c7;color:#b45309;padding:1px 6px;border-radius:20px">18-</span>`:''}${s.telefon?`<div style="font-size:11px;color:var(--slate-500)">${esc(s.telefon)}</div>`:''}</td>
      <td>${esc(s.okul||'—')}${s.sinif?`<div style="font-size:11px;color:var(--slate-500)">${esc(s.sinif)}</div>`:''}</td>
      <td>${esc(s.bolum||'—')}</td>
      <td>${esc(s.koordinator||'—')}${s.koordinatorTel?`<div style="font-size:11px;color:var(--slate-500)">${esc(s.koordinatorTel)}</div>`:''}</td>
      <td class="num" style="font-size:12px">${s.stajBas?fmtDate(s.stajBas):'—'}${s.stajBit?'<br>'+fmtDate(s.stajBit):''}</td>
      <td>${evrakChip}</td>
      <td>${s.durum==='tamamlandi'?'<span class="badge b-off">Tamamlandı</span>':'<span class="badge b-on">Aktif</span>'}</td>
      <td onclick="event.stopPropagation()"><div class="rowact">
        <button class="iconbtn" title="Düzenle" onclick="openStajyer('${s.id}')"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg></button>
        <button class="iconbtn del" title="Sil" onclick="delStajyer('${s.id}')"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>
      </div></td></tr>`;});
  h+=`</tbody></table></div></div>`;
  document.getElementById('content').innerHTML=h;
}
function openStajyer(id){

      <label style="display:flex;gap:3px;align-items:center;font-size:12px;color:var(--red-700)"><input type="radio" name="sjk_${a.k}" value="hayir" ${val==='hayir'?'checked':''}>Hayır</label>
      ${a.yok?`<label style="display:flex;gap:3px;align-items:center;font-size:12px;color:var(--slate-400)"><input type="radio" name="sjk_${a.k}" value="yok" ${val==='yok'?'checked':''}>Gerekmez</label>`:''}
    </div></div>`;}).join('');
  document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal lg">
    <div class="modal-hd"><h3>${id?'Stajyer Düzenle':'Yeni Stajyer'}</h3><button class="xbtn" onclick="closeModal()">×</button></div>
    <div class="modal-bd">
      <div class="fld-sec">Kimlik & İletişim</div>
      <div class="fld-row3"><div class="fld"><label>Ad Soyad</label><input id="sj_ad" value="${v('ad')}"></div><div class="fld"><label>T.C. Kimlik No</label><input id="sj_tc" value="${v('tc')}"></div><div class="fld"><label>Doğum Tarihi</label><input type="date" id="sj_dogum" value="${v('dogum')}"></div></div>
      <div class="fld-row"><div class="fld"><label>Telefon</label><input id="sj_tel" value="${v('telefon')}" placeholder="05.."></div><div class="fld"><label>İkamet Adresi</label><input id="sj_adres" value="${v('adres')}"></div></div>

      <div class="fld-sec">Okul & Staj</div>
      <div class="fld-row3"><div class="fld"><label>Okulu</label><input id="sj_okul" value="${v('okul')}"></div><div class="fld"><label>Alan / Bölüm (okul)</label><input id="sj_okulBolum" value="${v('okulBolum')}" placeholder="Örn. Gıda Teknolojisi"></div><div class="fld"><label>Sınıfı</label><input id="sj_sinif" value="${v('sinif')}" placeholder="Örn. 11-A / 3. sınıf"></div></div>
      <div class="fld-row3"><div class="fld"><label>Çalıştığı Bölüm (firma)</label><input id="sj_bolum" value="${v('bolum')}"></div><div class="fld"><label>Koordinatör Öğretmen</label><input id="sj_koord" value="${v('koordinator')}"></div><div class="fld"><label>Koordinatör Telefon</label><input id="sj_koordTel" value="${v('koordinatorTel')}"></div></div>
      <div class="fld-row3"><div class="fld"><label>Staj Başlangıç</label><input type="date" id="sj_stajBas" value="${v('stajBas')}"></div><div class="fld"><label>Staj Bitiş</label><input type="date" id="sj_stajBit" value="${v('stajBit')}"></div><div class="fld"><label>Durum</label><select id="sj_durum"><option value="aktif" ${(s.durum||'aktif')==='aktif'?'selected':''}>Aktif</option><option value="tamamlandi" ${s.durum==='tamamlandi'?'selected':''}>Tamamlandı</option></select></div></div>

      <div class="fld-sec">Veli (18 yaşından küçükse)</div>
      <div class="fld-row"><div class="fld"><label>Veli Ad Soyad</label><input id="sj_veliAd" value="${v('veliAd')}"></div><div class="fld"><label>Veli Telefon</label><input id="sj_veliTel" value="${v('veliTel')}"></div></div>

      <div class="fld-sec">Staj Evrak & İşlem Kontrol Listesi</div>
      <div class="helptext" style="margin:-2px 0 8px">Her madde için Evet/Hayır işaretleyin — eksik evraklar listede uyarı olarak görünür.</div>
      ${kontrolRows}
      <div class="fld" style="margin-top:12px"><label>Notlar</label><input id="sj_not" value="${v('not')}"></div>

  </div></div>`;
  setTimeout(()=>{const e=document.getElementById('sj_ad');if(e)e.focus();},30);
}
function saveStajyer(){
  const g=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};
  const kontrol={};STAJ_KONTROL.forEach(a=>{const el=document.querySelector('input[name="sjk_'+a.k+'"]:checked');kontrol[a.k]=el?el.value:'';});
  const o={ad:g('sj_ad'),tc:g('sj_tc'),dogum:g('sj_dogum'),telefon:g('sj_tel'),adres:g('sj_adres'),okul:g('sj_okul'),okulBolum:g('sj_okulBolum'),sinif:g('sj_sinif'),bolum:g('sj_bolum'),koordinator:g('sj_koord'),koordinatorTel:g('sj_koordTel'),veliAd:g('sj_veliAd'),veliTel:g('sj_veliTel'),stajBas:g('sj_stajBas'),stajBit:g('sj_stajBit'),durum:g('sj_durum'),not:g('sj_not'),kontrol};
  if(!o.ad){toast('Ad Soyad gerekli');return;}
  DB.stajyerler=DB.stajyerler||[];
  if(editId){const ex=DB.stajyerler.find(x=>x.id===editId);Object.assign(ex,o);}else DB.stajyerler.push({id:uid('sj'),...o});
  saveDB();closeModal();render();toast(editId?'Stajyer güncellendi':'Stajyer eklendi');
}
function delStajyer(id){const s=DB.stajyerler.find(x=>x.id===id);if(!s)return;if(!confirm((s.ad||'Bu stajyer')+' kaydı silinsin mi?'))return;DB.stajyerler=DB.stajyerler.filter(x=>x.id!==id);saveDB();render();toast('Stajyer silindi');}

// ============ PERSONEL ============
function renderPersonel(){
  const ps=DB.personeller.filter(p=>p.durum!=='ayrildi'&&!p.sarkuteri); // ayrılanlar ve şarküteri fabrika toplamına dahil değil
  const aktif=ps.length;
  const arsivSayi=DB.personeller.filter(p=>p.durum==='ayrildi').length;
  const dep={};ps.forEach(p=>{dep[p.departman]=(dep[p.departman]||0)+1});
  const erkek=ps.filter(p=>(p.cinsiyet||'').toLocaleUpperCase('tr')==='ERKEK').length;
  const kadin=ps.filter(p=>(p.cinsiyet||'').toLocaleUpperCase('tr')==='KADIN').length;
  // 4857/Gebe-Emziren Yön.: 100+ kadın → emzirme odası, 150+ kadın → kreş (95/145 yaklaşma uyarısı)
  let kadinUyari=null;
  if(kadin>=150)kadinUyari={t:'Kreş + emzirme odası zorunlu (150+ kadın)',c:'#dc2626',bg:'#fef2f2'};
  else if(kadin>=145)kadinUyari={t:'Kreş sınırına yaklaşıldı (145+) · emzirme odası zorunlu',c:'#d97706',bg:'#fffbeb'};
  else if(kadin>=100)kadinUyari={t:'Emzirme odası zorunlu (100+ kadın)',c:'#dc2626',bg:'#fef2f2'};
  else if(kadin>=95)kadinUyari={t:'Emzirme odası sınırına yaklaşıldı (95+)',c:'#d97706',bg:'#fffbeb'};
  const engelli=ps.filter(p=>(p.engellilik||'Engelli Değil')!=='Engelli Değil').length;
  const gereken=Math.round((ps.length-engelli)*0.03); // %3, .5 yukarı yuvarlanır
  const engelOk=engelli>=gereken; // gereken < engelli => yeşil, gereken > engelli => kırmızı
  // bir grubun kadın/erkek dağılımı (alt satırda gösterilir)

// ============ DENEME SÜRESİ (4857/15) ============
// CANLI TÜRETİLİR — depolanan durum 'aktif' KALIR, süre dolunca kendiliğinden düşer.
// Böylece "2 ayın sonunda otomatik aktif" için cron/elle çevirme gerekmez, bayat durum oluşmaz.
// FASILA: daha önce çalışmış (geçerli dönem kaydı olan) personel deneme SAYILMAZ — aktif devam eder.
// NOT: 0 geçerli bir değer (özelliği kapatır) — bu yüzden `||2` DEĞİL, null kontrolü.
function denemeAyVars(){const v=DB.puantajAyar?DB.puantajAyar.denemeAy:null;return (v==null||v==='')?2:Math.max(0,+v||0);}
function denemeUyariGunVars(){const v=DB.puantajAyar?DB.puantajAyar.denemeUyariGun:null;return (v==null||v==='')?50:Math.max(1,+v||50);}
// Dönüş: null (deneme değil) | {gun, toplam, kalan, bitis, onay}
function denemeDurum(p,refISO){
  if(!p||!p.iseGiris)return null;
  if((p.durum||'aktif')!=='aktif')return null;        // ihbar/ayrıldı → deneme gösterilmez
  if(gecerliDonemler(p).length)return null;           // çıkıp tekrar giren → AKTİF devam (kullanıcı kuralı)
  const ay=denemeAyVars();if(ay<=0)return null;       // Ayarlar'dan 0 → özellik kapalı
  const g=parseISO(p.iseGiris);if(!g)return null;
  const ref=refISO||todayISO();const r=parseISO(ref);if(!r||r<g)return null;
  const son=new Date(g);son.setMonth(son.getMonth()+ay);
  const bitis=son.getFullYear()+'-'+String(son.getMonth()+1).padStart(2,'0')+'-'+String(son.getDate()).padStart(2,'0');
  if(ref>bitis)return null;                            // süre doldu → otomatik aktif
  const gun=gunFarki(p.iseGiris,ref);                  // işe giriş = 1. gün (gunFarki kapsayıcı sayar)
  const toplam=gunFarki(p.iseGiris,bitis);
  return {gun,toplam,kalan:Math.max(0,toplam-gun),bitis,onay:p.denemeOnay||null};
}
// Performans takibi bekleyenler: deneme süresinde + uyarı gününe gelmiş + kararı girilmemiş
function denemeBekleyen(refISO){
  return DB.personeller.filter(p=>{
    const d=denemeDurum(p,refISO);
    return d && d.gun>=denemeUyariGunVars() && !(d.onay&&d.onay.karar);
  }).map(p=>({p,d:denemeDurum(p,refISO)})).sort((a,b)=>b.d.gun-a.d.gun);
}
function denemeCip(p,uzun){
  const d=denemeDurum(p);if(!d)return '';
  const acil=d.gun>=denemeUyariGunVars();
  const t=`Deneme süresi ${d.toplam} gün · ${fmtDate(d.bitis)} tarihinde otomatik Aktif olacak`;
  return `<span class="badge b-deneme${acil?' b-deneme-acil':''}" title="${esc(t)}">Deneme · ${d.gun}. gün${uzun?` / ${d.toplam}`:''}</span>`;
}
// durumBadge(d) geriye uyumlu; 2. parametre verilirse canlı deneme çipi de eklenir
function durumBadge(d,p){d=d||'aktif';

// İhbar önelindeki personelin son çalışma günü (toplu iş arama izni düşülür)

  return `<td class="num">${fmtDate(s)}<div style="font-size:11px;margin-top:2px">${sayac}</div></td>`;}
function renderPersList(){
  const wrap=document.getElementById('persTableWrap');if(!wrap)return;

  if(!list.length){wrap.innerHTML='<div class="empty">Bu filtreye uyan personel yok.</div>';return;}
  const K=personelSortKey,D=personelSortDir;

// Arşivden geri alma = yeniden işe giriş: eski dönem (giriş–çıkış+kod) otomatik "Önceki Dönemler"e taşınır,
// yeni giriş tarihi verilir. Böylece fasılalı yıllık izin / kıdem hesabı otomatik doğru kurulur.
function arsivGeriAl(id){
  const p=DB.personeller.find(x=>x.id===id);if(!p)return;
  const eskiGiris=p.iseGiris||'',eskiCikis=p.ayrilisTarihi||'';
  document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div class="modal-hd"><h3>Yeniden İşe Giriş — ${esc(p.ad)}</h3><button class="xbtn" onclick="closeModal()">×</button></div>
    <div class="modal-bd">
      ${eskiGiris&&eskiCikis?`<div class="helptext" style="margin-bottom:12px">Önceki dönem (<b>${fmtDate(eskiGiris)} – ${fmtDate(eskiCikis)}</b>) otomatik olarak <b>Önceki Çalışma Dönemleri</b>'ne taşınacak; yıllık izin kıdemi birleşir, kıdem tazminatı için çıkış koduna bakılır.</div>`:''}
      <div class="fld-row">
        <div class="fld"><label>Yeni İşe Giriş Tarihi</label><input type="date" id="yg_giris" value="${todayISO()}"></div>
        <div class="fld"><label>Önceki Dönemin SGK Çıkış Kodu</label><select id="yg_kod">${sgkKodOpts(p.cikisKodu)}</select></div>
      </div>
    </div>
    <div class="modal-ft"><button class="btn" onclick="closeModal()">Vazgeç</button><button class="btn btn-pri" onclick="arsivGeriAlKaydet('${id}')">İşe Al</button></div>
  </div></div>`;
}
function arsivGeriAlKaydet(id){
  const p=DB.personeller.find(x=>x.id===id);if(!p)return;
  const yeniGiris=document.getElementById('yg_giris').value;
  const kod=document.getElementById('yg_kod').value;
  if(!yeniGiris){toast('Yeni işe giriş tarihi girin');return}
  if(p.iseGiris&&p.ayrilisTarihi&&p.ayrilisTarihi>p.iseGiris){
    p.donemler=p.donemler||[];
    // aynı dönem daha önce eklenmişse tekrarlamadan geç
    if(!p.donemler.some(d=>d.giris===p.iseGiris&&d.cikis===p.ayrilisTarihi))
      p.donemler.push({giris:p.iseGiris,cikis:p.ayrilisTarihi,cikisKodu:kod||p.cikisKodu||'',kilit:true}); // çıkış kaydından otomatik — kartta silinemez/düzenlenemez
  }
  // izin manuel tabanı varsa toplam hizmeti koruyarak yeni girişe taşı (izin kıdemi birleşir — Zirve devri dahil)
  if(p.izinBasManuel&&p.ayrilisTarihi){
    const eff=izinBaslangicISO(p,p.ayrilisTarihi); // eski dönem kesintileri de tabana işlenir
    const sure=Math.max(0,Math.round((parseISO(p.ayrilisTarihi)-parseISO(eff))/864e5));
    p.izinBasManuel=sure?isoKaydir(yeniGiris,-sure):'';
  }
  p.kidemBasManuel=''; // eski döneme ait manuel kıdem düzeltmesi geçersiz — dönem + kod kurallarıyla yeniden hesaplanır
  p.iseGiris=yeniGiris;p.durum='aktif';p.ayrilisTarihi='';p.cikisKodu='';p.ihbarBaslangic='';p.ihbarToplu=false;
  saveDB();closeModal();render();toast(p.ad+' yeniden işe alındı — önceki dönem fasılaya taşındı');
}

  if(k==='kidemBasHesap'){const x=kidemBaslangicISO(p);return x?fmtDate(x)+(p.kidemBasManuel?' <span style="font-size:10px;color:var(--amber-700)">(m)</span>':''):'—';}
  if(k==='izinBasHesap'){const x=izinBaslangicISO(p);return x?fmtDate(x)+(p.izinBasManuel?' <span style="font-size:10px;color:var(--amber-700)">(m)</span>':''):'—';}
  if(c.date)return p[k]?fmtDate(p[k]):'—';return esc(p[k]||'—');}
function detayFiltre(){
  let list=DB.personeller.filter(p=>p.durum!=='ayrildi'&&!p.sarkuteri);
  const q=detayQ.trim().toLocaleLowerCase('tr');
  if(q){
    if(detayField==='hepsi')list=list.filter(p=>[p.ad,...PCOLS.map(c=>p[c.k])].map(x=>String(x||'')).join(' ').toLocaleLowerCase('tr').includes(q));
    else list=list.filter(p=>String(p[detayField]||'').toLocaleLowerCase('tr').includes(q));
  }
  const m=detaySortDir==='desc'?-1:1;
  list.sort((a,b)=>m*String(a[detaySortKey]||'').localeCompare(String(b[detaySortKey]||''),'tr',{numeric:true})||(a.ad||'').localeCompare(b.ad||'','tr'));
  return list;
}

// Detaylı liste — tüm sütunlarla Excel (.xls) çıktısı; ekrandaki filtre/sıralamaya uyar
function detayExcelIndir(){
  const list=detayFiltre();
  if(!list.length){toast('İndirilecek kayıt yok');return;}
  const durumLbl={aktif:'Aktif',ihbar:'İhbar Süresinde',ayrildi:'Ayrıldı'};
  const ex=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const xcols=detayPcols();
  const head=['Ad Soyad',...xcols.map(c=>c.l)];
  const deger=(p,c)=>{if(c.k==='durum'){const dn=denemeDurum(p);
      return dn?`Deneme Süresinde (${dn.gun}/${dn.toplam}. gün)`:(durumLbl[p.durum||'aktif']||p.durum||'');}
    if(c.k==='kidemBasHesap'){const x=kidemBaslangicISO(p);return x?fmtDate(x)+(p.kidemBasManuel?' (manuel)':''):'';}
    if(c.k==='izinBasHesap'){const x=izinBaslangicISO(p);return x?fmtDate(x)+(p.izinBasManuel?' (manuel)':''):'';}
    if(c.date)return p[c.k]?fmtDate(p[c.k]):'';return p[c.k]||'';};
  const rows=list.map(p=>'<tr><td>'+ex(p.ad)+'</td>'+xcols.map(c=>`<td>${ex(deger(p,c))}</td>`).join('')+'</tr>').join('');
  const html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head><body><table border="1"><thead><tr>'+head.map(h=>`<th>${ex(h)}</th>`).join('')+'</tr></thead><tbody>'+rows+'</tbody></table></body></html>';
  const blob=new Blob(['﻿'+html],{type:'application/vnd.ms-excel;charset=utf-8'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Detayli-Personel-Listesi-'+todayISO()+'.xls';a.click();URL.revokeObjectURL(url);
  toast(list.length+' kayıt Excel olarak indirildi');
}

// ============ KIYAFET / EKİPMAN ZİMMET YÖNETİMİ ============
function seedKiyafet(){
  if(DB.meta.kiyafetSeedV1)return;
  if(!DB.kiyafetUrunler.length)DB.kiyafetUrunler=[
    {id:uid('ku'),ad:'İş Önlüğü / Tulum',ortalamaSureGun:365,iadeMi:false},
    {id:uid('ku'),ad:'İş Botu / Ayakkabı',ortalamaSureGun:365,iadeMi:false},
    {id:uid('ku'),ad:'Bone / Saç Bonesi',ortalamaSureGun:30,iadeMi:false},
    {id:uid('ku'),ad:'Eldiven',ortalamaSureGun:15,iadeMi:false},
    {id:uid('ku'),ad:'Kaban',ortalamaSureGun:730,iadeMi:true},
    {id:uid('ku'),ad:'Mont',ortalamaSureGun:730,iadeMi:true},
    {id:uid('ku'),ad:'Yağmurluk',ortalamaSureGun:730,iadeMi:true},
  ];
  DB.meta.kiyafetSeedV1=true;saveDB();
}
function kUrun(id){return DB.kiyafetUrunler.find(u=>u.id===id);}
function kPers(id){return DB.personeller.find(p=>p.id===id);}
function gunGecti(iso){const d=parseISO(iso);if(!d)return 0;const t=new Date();t.setHours(0,0,0,0);return Math.floor((t-d)/864e5);}
function zimmetSureDoldu(z){const u=kUrun(z.urunId);return z.durum==='zimmetli'&&u&&u.ortalamaSureGun>0&&gunGecti(z.tarih)>=u.ortalamaSureGun;}
function zimmetIadeBekler(z){const u=kUrun(z.urunId);return z.durum==='zimmetli'&&u&&u.iadeMi;}
// Verilmesi gereken (yenileme) tarihi = veriliş + ortalama süre
function zimmetDueISO(z){const u=kUrun(z.urunId);const d=parseISO(z.tarih);if(!u||!d||!u.ortalamaSureGun)return null;d.setDate(d.getDate()+u.ortalamaSureGun);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function zimmetKalanGun(z){const due=zimmetDueISO(z);if(!due)return null;const t=new Date();t.setHours(0,0,0,0);return Math.round((parseISO(due)-t)/864e5);}
// Bu kayıt, aynı personel+ürünün bir önceki verilişinden ort. süreden önce mi verilmiş?
function zimmetErkenMi(z){const u=kUrun(z.urunId);const d=parseISO(z.tarih);if(!u||!d)return false;
  const onceki=DB.kiyafetZimmet.filter(x=>x!==z&&x.personelId===z.personelId&&x.urunId===z.urunId&&parseISO(x.tarih)&&parseISO(x.tarih)<d).sort((a,b)=>String(b.tarih).localeCompare(String(a.tarih)))[0];
  if(!onceki)return false;return Math.round((d-parseISO(onceki.tarih))/864e5)<u.ortalamaSureGun;}
// son aktif zimmet kaydı (aynı personel+ürün)
function sonZimmet(pid,uid_,haricId){return DB.kiyafetZimmet.filter(z=>z.personelId===pid&&z.urunId===uid_&&z.durum==='zimmetli'&&z.id!==haricId).sort((a,b)=>String(b.tarih).localeCompare(String(a.tarih)))[0];}

// ---- Kıyafet stok hesapları ----
function urunStokGiren(urunId){return (DB.kiyafetStok||[]).filter(s=>s.urunId===urunId).reduce((n,s)=>n+(s.tip==='cikis'?-(+s.miktar||0):(+s.miktar||0)),0);}
function urunDagitilan(urunId){const u=kUrun(urunId);return DB.kiyafetZimmet.filter(z=>z.urunId===urunId).reduce((n,z)=>{const adet=+z.adet||1;if(u&&u.iadeMi)return n+(z.durum==='zimmetli'?adet:0);return n+((z.durum==='zimmetli'||z.durum==='yenilendi')?adet:0);},0);}
function urunMevcutStok(urunId){return urunStokGiren(urunId)-urunDagitilan(urunId);}
function renderKiyafet(){

  if(kiyafetTab==='stok'){

    h+=`<div class="card"><div class="card-hd"><h3>Stok Durumu</h3><span class="hint">başlangıç + giriş − dağıtılan = mevcut</span></div>${tabsHtmlTop}<div class="intro" style="padding:12px 18px 0">Her ürün için <b>başlangıç stoğu</b> girin; ürün geldikçe <b>+ Stok Girişi</b> ile ekleyin. <b>Dağıtılan</b> = zimmet olarak verilen (iade edilince geri döner). <b>Mevcut</b> = elde kalan.</div>`;
    if(!urunler.length)h+=`<div class="empty">Önce <b>Ürün Tanımları</b> sekmesinden ürün ekleyin.</div></div>`;
    else{
      h+=`<div class="tbl-scroll"><table class="t"><thead><tr><th>Ürün</th><th class="num">Başlangıç</th><th class="num">Toplam Giriş</th><th class="num">Dağıtılan</th><th class="num">Mevcut Stok</th><th></th></tr></thead><tbody>`;
      urunler.forEach(u=>{const bas=(DB.kiyafetStok||[]).filter(s=>s.urunId===u.id&&s.tip==='baslangic').reduce((n,s)=>n+(+s.miktar||0),0);
        const giris=(DB.kiyafetStok||[]).filter(s=>s.urunId===u.id&&s.tip==='giris').reduce((n,s)=>n+(+s.miktar||0),0);
        const cikis=(DB.kiyafetStok||[]).filter(s=>s.urunId===u.id&&s.tip==='cikis').reduce((n,s)=>n+(+s.miktar||0),0);
        const dag=urunDagitilan(u.id);const mev=urunMevcutStok(u.id);
        h+=`<tr><td><b>${esc(u.ad)}</b></td><td class="num">${bas}</td><td class="num">${giris}${cikis?` <span style="color:var(--red-700)">(−${cikis})</span>`:''}</td><td class="num">${dag}</td><td class="num"><b style="color:${mev<=0?'var(--red-700)':mev<5?'var(--amber-700)':'var(--green-700)'}">${mev}</b></td>
          <td><div class="rowact"><button class="btn btn-sm" onclick="openStokGiris('${u.id}')">+ Giriş</button><button class="iconbtn" title="Stok geçmişi" onclick="stokGecmis('${u.id}')"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></button></div></td></tr>`;});
      h+=`</tbody></table></div></div>`;
    }
    document.getElementById('content').innerHTML=h;return;
  }
  if(kiyafetTab==='zimmet'){
    const zl=DB.kiyafetZimmet, zimmetli=zl.filter(z=>z.durum==='zimmetli');
    const sureDolan=zimmetli.filter(zimmetSureDoldu).length;
    const iadeBek=zimmetli.filter(zimmetIadeBekler).length;
    const erken=zl.filter(z=>z.aciklama&&z.aciklama.trim()).length;
    h+=`<div class="kpis">
      <div class="kpi"><div class="kl">Aktif Zimmet</div><div class="kv">${zimmetli.length}</div><div class="ks">teslim edilmiş</div></div>
      <div class="kpi a"><div class="kl">Yenileme Zamanı</div><div class="kv">${sureDolan}</div><div class="ks">kullanım süresi doldu</div></div>
      <div class="kpi" style="border-top-color:#0891b2"><div class="kl">İade Bekleyen</div><div class="kv">${iadeBek}</div><div class="ks">çıkışta iade edilecek</div></div>
      <div class="kpi" style="border-top-color:#ef4444"><div class="kl">Erken Veriliş</div><div class="kv">${erken}</div><div class="ks">açıklamalı kayıt</div></div>
    </div>`;
  }
  const tabsHtml=`<div class="ptabs">${tabs.map(([k,l])=>`<button class="ptab${kiyafetTab===k?' on':''}" onclick="kiyafetTab='${k}';render()">${l}</button>`).join('')}</div>`;
  if(kiyafetTab==='urun'){
    h+=`<div class="card"><div class="card-hd"><h3>Ürün Tanımları</h3><span class="hint">${DB.kiyafetUrunler.length} ürün</span></div>${tabsHtml}<div class="intro" style="padding:12px 18px 0">Her ürünün ortalama kullanım süresini ve çıkışta iade gerekip gerekmediğini buradan belirleyin. Zimmet verirken erken veriliş bu sürelere göre tespit edilir.</div>`;
    if(!DB.kiyafetUrunler.length)h+=`<div class="empty">Henüz ürün yok. Sağ üstten <b>+ Ürün Tanımı</b> ekleyin.</div></div>`;
    else{
      h+=`<div class="tbl-scroll"><table class="t"><thead><tr><th>Ürün</th><th>Ort. Kullanım Süresi</th><th>Çıkışta İade</th><th></th></tr></thead><tbody>`;
      DB.kiyafetUrunler.forEach(u=>{h+=`<tr><td><b>${esc(u.ad)}</b></td><td class="num">${u.ortalamaSureGun} gün</td><td>${u.iadeMi?'<span class="badge b-ihbar">İade gerekli</span>':'<span class="badge b-off">Hayır</span>'}</td>
        <td><div class="rowact">
          <button class="iconbtn" title="Düzenle" onclick="openKiyafetUrun('${u.id}')"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg></button>
          <button class="iconbtn del" title="Sil" onclick="silKiyafetUrun('${u.id}')"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>
        </div></td></tr>`;});
      h+=`</tbody></table></div></div>`;
    }
    document.getElementById('content').innerHTML=h;return;
  }
  // zimmet kayıtları
  h+=`<div class="card"><div class="card-hd"><h3>Zimmet Kayıtları</h3><span class="hint" id="kzSayi"></span></div>${tabsHtml}
    <div class="ptoolbar">

        <option value="iade" ${kzFiltre==='iade'?'selected':''}>İade bekleyenler</option>
        <option value="erken" ${kzFiltre==='erken'?'selected':''}>Erken verilenler</option>
      </select>
    </div><div id="kzWrap"></div></div>`;
  document.getElementById('content').innerHTML=h;
  renderKzList();
  setTimeout(()=>{const q=document.getElementById('kzQ');if(q&&kzQ){q.focus();q.setSelectionRange(q.value.length,q.value.length);}},0);
