    <div class="kpi g"><div class="kl">Genel Toplam (Net)</div><div class="kv">${fmtTL(genelNet)}</div><div class="ks">ödenecek tahmini</div></div>
    <div class="kpi"><div class="kl">Kıdem Tavanı</div><div class="kv" style="font-size:15px">${fmtTL2(DB.tazminatAyar.kidemTavan)}</div><div class="ks">GV %${(DB.tazminatAyar.gelirVergisiOran*100)} · damga ‰${(DB.tazminatAyar.damgaOran*1000).toFixed(2)}</div></div>
  </div>`;
  // Kıdem tavanı dönem uyarısı: yeni dönemde (Ocak/Temmuz) güncellenmediyse
  if(!kidemTavanGuncelMi()){
    const donemAd=kidemDonem().endsWith('H2')?'Temmuz':'Ocak';const yil=kidemDonem().slice(0,4);
    h+=`<div style="background:var(--amber-50);border:1px solid #f3c969;border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <div style="flex:1;min-width:240px;font-size:13px;color:var(--amber-700)"><b>Kıdem tavanı güncellemesi:</b> ${yil} ${donemAd} dönemi geldi. Yeni kıdem tazminatı tavanını girdin mi? Güncel değeri girene kadar bu uyarı kalır.</div>
      <button class="btn btn-pri" style="background:var(--amber-500);border-color:var(--amber-500)" onclick="openTazminatAyar()">Kıdem Tavanını Güncelle</button>
    </div>`;
  }
  if(eksikUcret)h+=`<div class="helptext" style="background:var(--amber-50);border:1px solid #fde68a;border-radius:8px;padding:9px 12px;margin-bottom:14px;color:var(--amber-700)">${eksikUcret} personelin çıplak (temel) brütü hesaplanamıyor (maaş net/girilmemiş) — tazminatları 0 görünür. Satırdaki ✎ ile çıplak brüt ücreti girin (her yıl başı güncelleyin).</div>`;
  h+=`<div class="card"><div class="card-hd"><h3>Personel Bazında Tazminat · ${fmtDate(ref)}</h3><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><span class="hint">satıra tıkla → detay & ödeme</span><div class="pz-ara" style="margin:0;max-width:240px"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="tazAra" type="text" placeholder="Personel ara…" value="${esc(tazminatQ)}" oninput="tazminatFiltre(this.value)">${tazminatQ?`<button class="pz-ara-x" onclick="tazminatFiltre('');var e=document.getElementById('tazAra');if(e){e.value='';e.focus();}" title="Temizle">×</button>`:''}</div><span id="tazFiltreSay" style="font-size:11.5px;color:var(--slate-500)"></span></div></div>`;
  if(!aktif.length){h+=`<div class="empty">Aktif personel yok. Önce <b>Personeller</b> bölümünden ekleyin.</div></div>`;document.getElementById('content').innerHTML=h;return;}
  h+=`<div class="tbl-scroll"><table class="t"><thead><tr><th>Personel</th><th>İşe Giriş / Kıdem</th><th class="num" title="Giydirilmiş aylık brüt = çıplak + sürekli menfaatler (aile/çocuk/prim/kıdem primi/devam primi/ayni/yol). Kıdem & ihbar bunun üzerinden.">Giydirilmiş Brüt</th><th class="num">Kıdem Tazminatı</th><th class="num">İhbar Tazminatı</th><th class="num" title="Kullanılmamış yıllık izin × ÇIPLAK günlük brüt (giydirilmiş değil)">Yıllık İzin</th><th class="num">Toplam (Net)</th><th></th></tr></thead><tbody>`;
  rows.sort((a,b)=>b.h.toplamNet-a.h.toplamNet).forEach(({p,h:x,od})=>{
    h+=`<tr data-ad="${esc(pzAsciiUp(p.ad))}" style="cursor:pointer" onclick="tazminatDetay('${p.id}')">
      <td><b>${esc(p.ad)}</b>${od.kidem||od.ihbar?`<div style="font-size:10px;color:var(--green-700)">ödenen: ${fmtTL(od.kidem+od.ihbar)}</div>`:''}</td>
      <td>${p.iseGiris?fmtDate(p.iseGiris):'<span style="color:var(--red-700)">giriş yok</span>'}<div style="font-size:10.5px;color:var(--slate-400)">${x.kidemMetin}${x.ks.oncekiGun?` <span style="color:var(--blue-700);font-weight:600" title="Kıdemde sayılan önceki dönem: ${sureMetni(x.ks.oncekiGun)}">+fasıla</span>`:''}${x.ks.kesinti?` <span style="color:var(--amber-700)" title="Ücretsiz izin/devamsızlık kesintisi">−${x.ks.kesinti}g</span>`:''}</div>${x.ks.basISO&&x.ks.basISO!==p.iseGiris?`<div style="font-size:10px;color:var(--blue-700)">kıdem başl. ${fmtDate(x.ks.basISO)}${x.ks.manuel?' <span style="color:var(--amber-700)">(manuel)</span>':''}</div>`:''}</td>
      <td class="num">${x.giyAylik>0?`${fmtTL(x.giyAylik)}<div style="font-size:10px;color:var(--slate-400)">çıplak ${fmtTL(x.ciplakBrut)}${x.gunlukMenfaat>0?' + menfaat':''}</div>`:'<span style="color:var(--amber-700)">—</span>'}</td>
      <td class="num">${x.kidemHak?`<b>${fmtTL(x.kidemNet)}</b><div style="font-size:10px;color:var(--slate-400)">brüt ${fmtTL(x.kidemBrut)}${x.tavanU?' · tavan':''}</div>`:'<span style="color:var(--slate-400)">1 yıl yok</span>'}</td>
      <td class="num"><b>${fmtTL(x.ihbarNet)}</b><div style="font-size:10px;color:var(--slate-400)">${x.ihbarHafta} hf · brüt ${fmtTL(x.ihbarBrut)}</div></td>
      <td class="num">${x.izinGun>0?`<b>${fmtTL(x.izinNet)}</b><div style="font-size:10px;color:var(--slate-400)">${x.izinGun} gün · brüt ${fmtTL(x.izinBrut)}</div>`:'<span style="color:var(--slate-400)">—</span>'}</td>
      <td class="num" style="font-weight:700;color:var(--blue-800)">${fmtTL(x.toplamNet)}</td>
      <td onclick="event.stopPropagation()"><div class="rowact">
        <button class="iconbtn" title="Brüt ücret güncelle" onclick="tazBrut('${p.id}')"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg></button>
      </div></td></tr>`;
  });
  h+=`</tbody></table></div></div>`;
  document.getElementById('content').innerHTML=h;
  if(tazminatQ)tazminatFiltre(tazminatQ);   // yeniden çizimden sonra aktif aramayı koru
}
// Tazminat listesi — isme göre süz (yeniden çizmeden satır gizle, odak korunur; Türkçe/ASCII duyarsız)
function tazminatFiltre(q){
  tazminatQ=q;const nq=pzAsciiUp(q);let gorunen=0;
  document.querySelectorAll('#content table.t tbody tr[data-ad]').forEach(tr=>{
    const ok=!nq||tr.getAttribute('data-ad').includes(nq);tr.style.display=ok?'':'none';if(ok)gorunen++;});
  const say=document.getElementById('tazFiltreSay');if(say)say.textContent=q?gorunen+' sonuç':'';
}
function tazBrut(pid){const p=DB.personeller.find(x=>x.id===pid);if(!p)return;const cur=+p.tazminatBrut>0?p.tazminatBrut:(tazAylikBrut(p)||'');const v=prompt('ÇIPLAK (temel) aylık BRÜT ücret (TL) — '+p.ad+'\n(Yalnız maaş; menfaatler [aile/çocuk/prim/yol/kıdem-devam primi/ayni] OTOMATİK eklenip giydirilmiş bulunur.\nKarttaki ücret net/günlük/saatlikse buraya çıplak brütü elle gir. Boş bırakılırsa karttan türetilir.)',cur);if(v==null)return;const s=String(v).trim();p.tazminatBrut=s===''?'':(parseFloat(s.replace(/\./g,'').replace(',','.'))||0);saveDB();render();toast('Çıplak (temel) brüt güncellendi');}
function tazminatDetay(pid){
  const p=DB.personeller.find(x=>x.id===pid);if(!p)return;
  const ref=tazminatTarih||todayISO();const x=tazminatHesap(p,ref);const od=tazOdenen(pid);
  const odemeler=DB.tazminatOdeme.filter(o=>o.personelId===pid).sort((a,b)=>(b.tarih||'').localeCompare(a.tarih||''));
  const sat=(l,v,c)=>`<tr><td style="color:var(--slate-600)">${l}</td><td class="num" style="${c||''}">${v}</td></tr>`;
  const odSat=odemeler.map(o=>`<tr><td>${fmtDate(o.tarih)}</td><td class="num">${fmtTL(o.kidem)}</td><td class="num">${fmtTL(o.ihbar)}</td><td style="color:var(--slate-500)">${esc(o.aciklama||'')}</td><td><button class="iconbtn del" onclick="delTazOdeme('${o.id}')"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button></td></tr>`).join('');
  document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal lg">
    <div class="modal-hd"><h3>${esc(p.ad)} — Tazminat Detayı · ${fmtDate(ref)}</h3><button class="xbtn" onclick="closeModal()">×</button></div>
    <div class="modal-bd">
      <div style="background:var(--slate-50);border:1px solid var(--slate-200);border-radius:10px;padding:11px 14px;margin-bottom:14px">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--slate-500);margin-bottom:6px">Giydirilmiş Brüt Hesabı <span style="font-weight:400;text-transform:none">(kıdem & ihbar matrahı)</span></div>
        <table class="t" style="min-width:0"><tbody>
          ${sat('Çıplak (temel) aylık brüt',fmtTL(x.ciplakBrut))}
          ${sat('Aylık sürekli menfaatler <span style="color:var(--slate-400)">(aile+çocuk+prim+yol+ayni+kıdem primi)</span>',fmtTL(x.mf.aylik))}
          ${x.mf.yillikDevam?sat('Yıllık devam primi <span style="color:var(--slate-400)">(döngü/sabit)</span>',fmtTL(x.mf.yillikDevam)):''}
          ${sat('Menfaatlerin yıllık toplamı ÷ 365 = günlük menfaat','+ '+fmtTL2(x.gunlukMenfaat))}
          ${sat('<b>Giydirilmiş günlük brüt</b>','<b>'+fmtTL2(x.giyGunluk)+'</b> <span style="color:var(--slate-400)">(çıplak '+fmtTL2(x.ciplakGunluk)+' + menfaat '+fmtTL2(x.gunlukMenfaat)+')</span>')}
          ${sat('<b>Giydirilmiş aylık brüt (30 gün)</b>','<b>'+fmtTL(x.giyAylik)+'</b>')}
        </tbody></table></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div><div style="font-size:12px;font-weight:700;color:var(--blue-800);margin-bottom:6px">KIDEM TAZMİNATI</div>
          <table class="t" style="min-width:0"><tbody>
            ${x.ks.manuel?sat('Kıdem hakediş başlangıcı <span style="color:var(--amber-700)">(manuel — rapor düzeltmesi)</span>','<b>'+fmtDate(x.ks.basISO)+'</b>'):
              x.ks.parcalar.map(pc=>sat('Önceki dönem '+fmtDate(pc.giris)+' – '+fmtDate(pc.cikis)+' <span style="color:var(--slate-400)">(kod '+(pc.cikisKodu||'—')+')</span>',pc.sayilir?'<span style="color:var(--blue-700)">+ '+sureMetni(pc.gun)+'</span>':'<span style="color:var(--slate-400)" title="'+pc.sebep+'">sayılmaz</span>')).join('')
              +sat('Son dönem — giriş '+fmtDate(p.iseGiris)+(x.ks.kesinti?' <span style="color:var(--amber-700)">(−'+x.ks.kesinti+' gün kesinti)</span>':''),sureMetni(x.ks.guncelGun))
              +sat('Kıdem hakediş başlangıcı','<b>'+fmtDate(x.ks.basISO)+'</b> <span style="color:var(--slate-400)">(her yıl bu tarihte hakediş)</span>')}
            ${sat('<b>Toplam kıdem süresi</b>','<b>'+x.kidemMetin+' ('+x.toplamGun+' gün)</b>')}
            ${sat('Giydirilmiş aylık brüt',fmtTL(x.giyAylik))}
            ${x.tavanU?sat('Kıdem tavanı','<span style=\"color:var(--amber-700)\">'+fmtTL2(DB.tazminatAyar.kidemTavan)+' uygulandı</span>'):''}
            ${sat('Kıdem tazminatı (brüt)',x.kidemHak?fmtTL(x.kidemBrut):'1 yıl dolmadı — yok')}
            ${sat('− Damga vergisi (‰'+(DB.tazminatAyar.damgaOran*1000).toFixed(2)+')','−'+fmtTL(x.kidemDamga))}
            ${sat('<b>Net kıdem tazminatı</b>','<b style=\"color:var(--green-700)\">'+fmtTL(x.kidemNet)+'</b>')}
          </tbody></table></div>
        <div><div style="font-size:12px;font-weight:700;color:var(--amber-700);margin-bottom:6px">İHBAR TAZMİNATI</div>
          <table class="t" style="min-width:0"><tbody>
            ${sat('İhbar süresi <span style="color:var(--slate-400)">(son girişe göre)</span>',x.ihbarHafta+' hafta ('+x.ihbarGun+' gün)')}
            ${x.ks.kesinti?sat('Kıdemden düşülen kesinti','−'+x.ks.kesinti+' gün (ücretsiz/devamsızlık)'):''}
            ${sat('Giydirilmiş günlük brüt',fmtTL2(x.giyGunluk))}
            ${sat('İhbar tazminatı (brüt)',fmtTL(x.ihbarBrut))}
            ${sat('− Gelir vergisi (%'+(DB.tazminatAyar.gelirVergisiOran*100)+')','−'+fmtTL(x.ihbarGelir))}
            ${sat('− Damga vergisi','−'+fmtTL(x.ihbarDamga))}
            ${sat('<b>Net ihbar tazminatı</b>','<b style=\"color:var(--green-700)\">'+fmtTL(x.ihbarNet)+'</b>')}
          </tbody></table></div>
      </div>
      <div style="background:var(--green-50);border:1px solid #bbf7d0;border-radius:10px;padding:11px 14px;margin-top:14px">
        <div style="font-size:12px;font-weight:700;color:var(--green-700);margin-bottom:6px">KULLANILMAMIŞ YILLIK İZİN <span style="font-weight:400;color:var(--slate-500)">(ÇIPLAK brüt üzerinden — prim/menfaat dahil değil)</span></div>
        <table class="t" style="min-width:0"><tbody>
          ${sat('Kalan yıllık izin <span style="color:var(--slate-400)">(devir + hak − kullanılan)</span>',x.izinGun+' gün')}
          ${sat('Çıplak günlük brüt',fmtTL2(x.ciplakGunluk))}
          ${sat('İzin ücreti (brüt)',fmtTL(x.izinBrut))}
          ${x.izinBrut>0?sat('− Gelir + damga vergisi','−'+fmtTL(x.izinGelir+x.izinDamga)):''}
          ${sat('<b>Net izin ücreti</b>','<b style="color:var(--green-700)">'+fmtTL(x.izinNet)+'</b>')}
        </tbody></table></div>
      <div style="background:var(--blue-50);border:1px solid var(--blue-200);border-radius:10px;padding:13px 16px;margin:14px 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <div><div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--slate-500)">Toplam Net Tazminat</div><div style="font-size:22px;font-weight:800;color:var(--blue-900)">${fmtTL(x.toplamNet)}</div><div style="font-size:11px;color:var(--slate-500)">Brüt: ${fmtTL(x.toplamBrut)}${od.kidem||od.ihbar?` · Ödenen: ${fmtTL(od.kidem+od.ihbar)}`:''}</div></div>
        <button class="btn btn-pri" onclick="openTazOdeme('${pid}')">Ödeme Kaydet</button>
      </div>
      ${odemeler.length?`<div style="font-size:13px;font-weight:700;margin-bottom:6px">Ödeme Geçmişi</div><div class="tbl-scroll"><table class="t" style="min-width:0"><thead><tr><th>Tarih</th><th class="num">Kıdem</th><th class="num">İhbar</th><th>Açıklama</th><th></th></tr></thead><tbody>${odSat}</tbody></table></div>`:''}
    </div>
    <div class="modal-ft"><button class="btn btn-pri" onclick="closeModal()">Kapat</button></div>
  </div></div>`;
}
function openTazOdeme(pid){
  const p=DB.personeller.find(x=>x.id===pid);if(!p)return;
  const x=tazminatHesap(p,tazminatTarih||todayISO());
  document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div class="modal-hd"><h3>Tazminat Ödemesi — ${esc(p.ad)}</h3><button class="xbtn" onclick="closeModal()">×</button></div>
    <div class="modal-bd">
      <div class="fld"><label>Ödeme Tarihi</label><input type="date" id="to_tarih" value="${todayISO()}"></div>
      <div class="fld-row"><div class="fld"><label>Kıdem Tazminatı (net)</label><div class="para"><input type="number" id="to_kidem" value="${Math.round(x.kidemNet)}"></div></div><div class="fld"><label>İhbar Tazminatı (net)</label><div class="para"><input type="number" id="to_ihbar" value="${Math.round(x.ihbarNet)}"></div></div></div>
      <div class="fld"><label>Açıklama</label><input id="to_acik" placeholder="İsteğe bağlı"></div>
    </div>
    <div class="modal-ft"><button class="btn" onclick="closeModal()">Vazgeç</button><button class="btn btn-pri" onclick="saveTazOdeme('${pid}')">Kaydet</button></div>
  </div></div>`;
}
function saveTazOdeme(pid){
  const o={id:uid('to'),personelId:pid,tarih:document.getElementById('to_tarih').value,kidem:+document.getElementById('to_kidem').value||0,ihbar:+document.getElementById('to_ihbar').value||0,aciklama:document.getElementById('to_acik').value.trim()};
  DB.tazminatOdeme.push(o);saveDB();closeModal();tazminatDetay(pid);render();toast('Ödeme kaydedildi');
}
function delTazOdeme(id){const o=DB.tazminatOdeme.find(x=>x.id===id);if(!o)return;if(!confirm('Bu ödeme kaydı silinsin mi?'))return;DB.tazminatOdeme=DB.tazminatOdeme.filter(x=>x.id!==id);saveDB();tazminatDetay(o.personelId);render();toast('Silindi');}
function openTazminatAyar(){
  const a=DB.tazminatAyar;
  document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div class="modal-hd"><h3>Tazminat Hesaplama Ayarları</h3><button class="xbtn" onclick="closeModal()">×</button></div>
    <div class="modal-bd">
      <div class="fld"><label>Kıdem Tazminatı Tavanı (TL / yıl)</label><input type="number" id="ay_tavan" value="${a.kidemTavan}"><div class="helptext">Her yıl 1 Ocak ve 1 Temmuz'da güncellenir. Güncel tavanı buraya girin.</div></div>
      <div class="fld-row"><div class="fld"><label>İhbar — Gelir Vergisi (%)</label><input type="number" id="ay_gv" value="${+(a.gelirVergisiOran*100).toFixed(2)}" step="0.01"></div><div class="fld"><label>Damga Vergisi (‰)</label><input type="number" id="ay_damga" value="${+(a.damgaOran*1000).toFixed(2)}" step="0.01"></div></div>
      <div class="helptext">Kıdem tazminatından yalnızca damga vergisi kesilir; SGK ve gelir vergisi kesilmez. İhbar tazminatı ücret sayılır: gelir vergisi (kümülatif dilime göre değişir; buradaki oran tahminidir) + damga vergisi kesilir.</div>
    </div>
    <div class="modal-ft"><button class="btn" onclick="closeModal()">Vazgeç</button><button class="btn btn-pri" onclick="saveTazminatAyar()">Kaydet</button></div>
  </div></div>`;
}
function saveTazminatAyar(){
  DB.tazminatAyar={kidemTavan:+document.getElementById('ay_tavan').value||0,gelirVergisiOran:(+document.getElementById('ay_gv').value||0)/100,damgaOran:(+document.getElementById('ay_damga').value||0)/1000,tavanDonem:kidemDonem()};
  saveDB();closeModal();render();toast('Kıdem tavanı güncellendi');
}
// Kıdem tavanı dönemi: yılda 2 kez (1 Ocak → H1, 1 Temmuz → H2)
function kidemDonem(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()>=6?'H2':'H1');}
function kidemTavanGuncelMi(){return (DB.tazminatAyar.tavanDonem||'')===kidemDonem();}

// ============ PUANTAJ ============
function pzCls(k){if(k===PZ_PASIF)return 'P';const s=PZ_STATUS.find(x=>x.k===k);return s?s.cls:'E'}
// ===== ÇALIŞMA DÖNEMİ (işe giriş / işten ayrılış) =====
// Çalışma dönemi = [iseGiris , ayrilisTarihi]  → HER İKİ UÇ DÂHİL.
// Personel ayrıldığı gün de çalışır; siyah olan, ayrılış tarihinden SONRAKİ günlerdir.
// Dönem dışındaki günler PASİF: siyah, yazılamaz, hiçbir hesaba (H/FM/GS/ÇS/sayım) girmez.
const PZ_PASIF='¤'; // iç kod — hiçbir fırçada yok, kullanıcı seçemez
function pzISO(y,m,d){return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
// O günü kapsayan rapor kaydı (çalışılan rapor gününü işaretlemek için — gün X ama rapor duruyor)
function pzRaporKaydi(pid,info,d){const iso=pzISO(info.y,info.m,d);
  return (DB.izinler||[]).find(z=>z.tur==='raporlu'&&z.personelId===pid&&z.baslangic
    &&z.baslangic<=iso&&(z.bitis||z.baslangic)>=iso)||null;}
function pzPasifSet(p,info){
  const s=new Set();if(!p)return s;
  const gir=String(p.iseGiris||'').slice(0,10), cik=String(p.ayrilisTarihi||'').slice(0,10);
  if(!gir&&!cik)return s;
  for(let d=1;d<=info.gun;d++){const iso=pzISO(info.y,info.m,d);
    if((gir&&iso<gir)||(cik&&iso>cik))s.add(d);}   // ayrılış günü çalışılır → '>' (>=değil)
  return s;
}
// O AYIN puantajına giren personel:
//  · İşe girişi ay sonunu geçenler HENÜZ yok (ay içinde girenler otomatik eklenir).
//  · Ayrılanlar, ayrıldıkları AY listede KALIR (o ayın maaşı yapılacak); sonraki aya GEÇMEZ.
function pzAyPersonel(info){
  const ayBas=pzISO(info.y,info.m,1), aySon=pzISO(info.y,info.m,info.gun);
  return (DB.personeller||[]).filter(p=>{
    const gir=String(p.iseGiris||'').slice(0,10), cik=String(p.ayrilisTarihi||'').slice(0,10);
    if(gir&&gir>aySon)return false;                    // bu ay henüz işe girmemiş
    if(cik)return cik>=ayBas;                          // ayrılış ayın 1'i ise o gün çalıştı → listede kalır
    return p.durum!=='ayrildi';                        // ayrılmış ama tarih yok → gösterme
  }).sort((a,b)=>(a.ad||'').localeCompare(b.ad||'','tr'));  // puantaj alfabetik (ad'a göre)
}
function pzAyBilgi(ym){const a=String(ym).split('-').map(Number);return {y:a[0],m:a[1],gun:new Date(a[0],a[1],0).getDate(),adi:AY_ADLARI[a[1]-1]}}
function pzGunAdi(y,m,d){return ['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'][new Date(y,m-1,d).getDay()]}
function pzWeekend(y,m,d){const g=new Date(y,m-1,d).getDay();return g===0||g===6}
// Genel tatil mi: önce yıl-özel RESMI_TATIL (sabit + DİNİ bayram: Ramazan/Kurban), yoksa sabit PZ_RESMI
function pzResmi(y,m,d){const md=String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');const iso=y+'-'+md;return RESMI_TATIL[iso]||PZ_RESMI[md]||(ARIFE.has(iso)?'Arife (yarım gün tatil)':undefined)}
function pzData(){DB.puantaj=DB.puantaj||{};if(!DB.puantaj[puantajAy])DB.puantaj[puantajAy]={rows:{}};return DB.puantaj[puantajAy]}
function pzInitRow(info,p){const rest=p?haftaTatiliGunleri(p):null;const g={};for(let d=1;d<=info.gun;d++){const wd=new Date(info.y,info.m-1,d).getDay();g[d]=pzResmi(info.y,info.m,d)?'GT':((rest?rest.has(wd):pzWeekend(info.y,info.m,d))?'HT':'X');}return {gunler:g,fin:{}}}
function pzRow(pid,info){const data=pzData();if(!data.rows[pid])data.rows[pid]=pzInitRow(info,DB.personeller.find(x=>x.id===pid));const r=data.rows[pid];r.gunler=r.gunler||{};r.fin=r.fin||{};r.manuel=r.manuel||{};r.msaat=r.msaat||{};r.msaatNot=r.msaatNot||{};return r}
function pzAvansAy(pid,ym){return DB.avanslar.filter(a=>a.personelId===pid).reduce((s,a)=>s+avansKesintiList(a).filter(k=>String(k.ay)===ym).reduce((ss,k)=>ss+(+k.tutar||0),0),0)}
// O ay bordroya yansıyacak trafik cezası kesintisi = o aya denk gelen taksitlerin toplamı (plan bitince 0)
function pzTrafikAy(pid,ym){return (DB.trafikCezalari||[]).filter(t=>t.personelId===pid).reduce((s,t)=>s+trafikKesintiList(t).filter(k=>String(k.ay)===ym).reduce((ss,k)=>ss+(+k.tutar||0),0),0)}
// Elle boyama: r.manuel[d] ayrı katmanda tutulur. Otomatik türetmeyi EZER ve PDKS yeniden
// içe aktarıldığında SİLİNMEZ. "Boş" fırçası (·) elle işareti kaldırıp günü otomatiğe geri döndürür.
// Bordro hücresi işaret renkleri — maaş yaparken kontrol edilecek hatalı kayıtları vurgulamak için.
const PZ_RENK={kirmizi:{bg:'#F87171',ad:'Kırmızı — hata'},sari:{bg:'#FCD34D',ad:'Sarı — kontrol et'},
  yesil:{bg:'#6EE7B7',ad:'Yeşil — kontrol edildi'},mavi:{bg:'#93C5FD',ad:'Mavi — bilgi'},turuncu:{bg:'#FDBA74',ad:'Turuncu — eksik'}};
// Bordro hücresine RENK işareti + NOT (aya özel). Tek pencerede ikisi birden.
function pzBordroHucre(pid,key){
  const info=pzAyBilgi(puantajAy);const r=pzRow(pid,info);const p=DB.personeller.find(x=>x.id===pid);
  const kol=BORDRO_KOL.find(b=>b.k===key);const kolAd=kol?kol.l:key;
  r.bordroRenk=r.bordroRenk||{};r.bordroNot=r.bordroNot||{};
  window.__pzRenkSel=r.bordroRenk[key]||'';
  const sw=(k,bg,ad)=>`<button type="button" class="renk-sw" data-renk="${k}" onclick="pzRenkSec('${k}')" title="${ad}" style="background:${bg}"></button>`;
  const swYok=`<button type="button" class="renk-sw renk-yok" data-renk="" onclick="pzRenkSec('')" title="İşaret yok">✕</button>`;
  document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:400px">
    <div class="modal-hd"><h3>${esc(p?p.ad:'')} · ${esc(kolAd)}</h3><button class="xbtn" onclick="closeModal()">×</button></div>
    <div class="modal-bd">
      <div class="helptext" style="margin:-2px 0 10px">${info.adi} ${info.y} — maaş kontrolünde hatalı kayıtları işaretle / not al</div>
      <label class="fld-lbl">İşaret rengi</label>
      <div id="pzRenkBar" class="renk-bar">${swYok}${Object.entries(PZ_RENK).map(([k,v])=>sw(k,v.bg,v.ad)).join('')}</div>
      <label class="fld-lbl" style="margin-top:12px">Not <span style="font-weight:400;text-transform:none;letter-spacing:0">(örn: geçici prim, maaş hatalı, kontrol edilecek)</span></label>
      <textarea id="pzHucreNot" rows="3" style="width:100%;border:1px solid var(--slate-300);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;resize:vertical">${esc(r.bordroNot[key]||'')}</textarea>
    </div>
    <div class="modal-ft"><button class="btn" onclick="closeModal()">Vazgeç</button><button class="btn btn-pri" onclick="pzHucreKaydet('${pid}','${key}')">Kaydet</button></div>
  </div></div>`;
  pzRenkSec(window.__pzRenkSel);
}
function pzRenkSec(k){window.__pzRenkSel=k;document.querySelectorAll('#pzRenkBar .renk-sw').forEach(b=>b.classList.toggle('sel',(b.getAttribute('data-renk')||'')===k));}
// Devam primi MANUEL ekleme — tutar + ZORUNLU not (kontrol için). Manuel girilen hücre turuncu görünür.
function pzDevamHucre(pid){
  const info=pzAyBilgi(puantajAy);const r=pzRow(pid,info);const p=DB.personeller.find(x=>x.id===pid);
  const m=r.devamManuel||{};const sabit=+((p&&p.sabitDevamPrim))||0;
  document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:420px">
    <div class="modal-hd"><h3>Devam Primi — ${esc(p?p.ad:'')}</h3><button class="xbtn" onclick="closeModal()">×</button></div>
    <div class="modal-bd">
      <div class="helptext" style="margin:-2px 0 10px">${info.adi} ${info.y} — devam primini <b>manuel</b> giriyorsun (ör. iş kazası raporu, istisna). Girersen <b>not zorunlu</b>, hücre <b>turuncu</b> görünür.${sabit>0?`<br><b>Not:</b> bu personelin kartında sabit aylık prim (${fmtTL2(sabit)}) var; manuel girersen onu ezer.`:''}</div>
      <label class="fld-lbl">Tutar (TL)</label>
      <input id="pzDevamTutar" type="number" step="0.01" value="${m.tutar!=null?m.tutar:''}" placeholder="0" style="width:100%;border:1px solid var(--slate-300);border-radius:8px;padding:8px 10px;font-size:13px">
      <label class="fld-lbl" style="margin-top:12px">Not <span style="color:#DC2626">*zorunlu</span></label>
      <textarea id="pzDevamNot" rows="3" placeholder="Neden manuel girildi? (ör. iş kazası raporu — devamsızlık sayılmaz)" style="width:100%;border:1px solid var(--slate-300);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;resize:vertical">${esc(m.not||'')}</textarea>
    </div>
    <div class="modal-ft"><button class="btn" onclick="closeModal()">Vazgeç</button>${m.tutar!=null?`<button class="btn" style="color:#B91C1C" onclick="pzDevamTemizle('${pid}')">Manueli kaldır</button>`:''}<button class="btn btn-pri" onclick="pzDevamKaydet('${pid}')">Kaydet</button></div>
  </div></div>`;
}
function pzDevamKaydet(pid){
  const info=pzAyBilgi(puantajAy);const r=pzRow(pid,info);
  const tRaw=(document.getElementById('pzDevamTutar').value||'').trim();
  const not=(document.getElementById('pzDevamNot').value||'').trim();
  const tutar=parseFloat(String(tRaw).replace(',','.'))||0;
  if(tutar<=0){toast('Tutar girin (kaldırmak için "Manueli kaldır")');return;}
  if(!not){toast('Manuel devam primi için NOT zorunlu');return;}
  r.devamManuel={tutar,not};
  saveDB();closeModal();renderPuantaj();toast('Manuel devam primi kaydedildi');
}
function pzDevamTemizle(pid){
  const info=pzAyBilgi(puantajAy);const r=pzRow(pid,info);
  delete r.devamManuel;saveDB();closeModal();renderPuantaj();toast('Manuel devam primi kaldırıldı');
}
function pzHucreKaydet(pid,key){
  const info=pzAyBilgi(puantajAy);const r=pzRow(pid,info);
  r.bordroRenk=r.bordroRenk||{};r.bordroNot=r.bordroNot||{};
  const renk=window.__pzRenkSel||'';const not=(document.getElementById('pzHucreNot').value||'').trim();
  if(renk)r.bordroRenk[key]=renk; else delete r.bordroRenk[key];
  if(not)r.bordroNot[key]=not; else delete r.bordroNot[key];
  saveDB();closeModal();renderPuantaj();toast('Hücre işareti kaydedildi');
}
// ——— MANUEL SAAT (dış görev / kart basmayan personel) ———
// r.msaat[d] = elle girilen ondalık saat. PDKS içe aktarımı yalnız r.saat'i yeniden yazar, bu katmana
// DOKUNMAZ → içe aktarma manuel düzeltmeleri silmez (r.manuel ile aynı mantık).
// Öncelik (bir günün saati): manuel saat > PDKS saati > elle "X" boyandıysa varsayılan günlük (7,5) > 0.
function pzMSaat(r,d){const v=r&&r.msaat?+r.msaat[d]:0;return (v>0&&isFinite(v))?v:0;}
// "9:30" · "9,5" · "9.5" · "9" → ondalık saat. Geçersiz/0 → null.
function pzSaatParse(s){s=String(s==null?'':s).trim().replace(',','.');if(!s)return null;
  let v;
  if(s.indexOf(':')>=0){const [a,b]=s.split(':');const h=parseFloat(a)||0,m=parseFloat(b)||0;
    if(m<0||m>=60)return NaN; v=h+m/60;}
  else v=parseFloat(s);
  if(!isFinite(v)||v<0)return NaN;
  v=Math.round(v*100)/100;
  if(v>24)return NaN;
  return v>0?v:null;}
// Saat hücresine tıklama → o gün için elle saat gir/düzelt/temizle
function pzSaatGir(pid,d){
  const info=pzAyBilgi(puantajAy);const p=DB.personeller.find(x=>x.id===pid);if(!p)return;
  if(pzPasifSet(p,info).has(d)){toast('Bu gün personelin çalışma dönemi dışında — saat girilemez');return;}
  const r=pzRow(p.id,info);
  const restSet=haftaTatiliGunleri(p),izinMap=pzIzinGunleri(p.id,info),pasif=pzPasifSet(p,info);
  const kod=pzGunKod(restSet,d,info,r,izinMap,pasif);
  const ms=pzMSaat(r,d), pdks=(r.saat&&+r.saat[d])||0, gc=(r.gc&&r.gc[d])||'';
  const GUN=pzGunlukVars();
  const stat=PZ_STATUS.find(s=>s.k===kod);
  // Bu günün saati hesaba giriyor mu? Yalnız X ve TM günleri haftalık saate (H) katılır.
  const sayilir=(kod==='X'||kod==='TM');
  let uyari='';
  if(kod==='HÇ')uyari='Hafta tatili çalışması (HÇ) fazla mesaiye <b>sabit '+pzSaatFmt(GUN)+'</b> olarak yazılır — bu günde saat girmek mesaiyi değiştirmez, yalnız kayıt amaçlıdır.';
  // RAPOR GÜNÜ — saat girilirse gün ÇALIŞILMIŞ sayılır (pzGunKod: worked > rapor).
  else if(kod==='R'||kod==='RK'){
    const rest=haftaTatiliGunleri(p);const wd=new Date(info.y,info.m-1,d).getDay();
    const olur=pzResmi(info.y,info.m,d)?'<b>TM</b> (genel tatilde mesai)':(rest.has(wd)?'<b>HÇ</b> (hafta tatili çalışması)':'<b>X</b> (çalıştı)');
    uyari='Bu gün <b>'+(kod==='RK'?'iş kazası raporu':'raporlu')+'</b>. Saat girersen gün '+olur+' olur — personel işe gelip <b>sonradan rapor almışsa</b> doğrusu budur: maaş ve prim <b>tam</b> ödenir, saat haftalık hesaba normal girer.<br>Rapor kaydı <b>silinmez</b>, durur — yalnız bu gün <b>SGK eksik gününe girmez</b> (o gün için kazanç bildirilir).';
  }
  else if(kod==='HT'||kod==='GT')uyari='Bu gün <b>'+(kod==='HT'?'hafta tatili':'genel tatil')+'</b>. Saat girersen gün otomatik <b>'+(kod==='HT'?'HÇ (hafta tatili çalışması)':'TM (tatilde mesai)')+'</b> olur.';
  else if(!sayilir&&kod&&kod!=='')uyari='Bu gün <b>'+esc(stat?stat.l:kod)+'</b> olarak işaretli. İzinli günlerin saati mesaiye girmez — önce Boya ile günü <b>X</b> yapman gerekir.';
  else if(kod==='')uyari='Bu gün <b>boş</b> (kart kaydı yok). Saat girersen gün otomatik <b>X (çalıştı)</b> olur.';
  document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div class="modal-hd"><h3>Çalışma Saati — ${d} ${info.adi} ${info.y}</h3><button class="xbtn" onclick="closeModal()">×</button></div>
    <div class="modal-bd">
      <div class="helptext" style="margin:-2px 0 12px"><b>${esc(p.ad)}</b> · ${esc(p.bolum||p.departman||'—')} · gün durumu: <b>${esc(kod||'boş')}</b>${pdks>0?` · PDKS kaydı: <b>${pzSaatFmt(pdks)}</b>${gc?` (${esc(gc)})`:''}`:' · <b>PDKS kaydı yok</b>'}</div>
      ${uyari?`<div class="helptext" style="background:var(--amber-50,#FFFBEB);border:1px solid #FDE68A;border-radius:8px;padding:8px 10px;margin:0 0 12px;color:#92400E">${uyari}</div>`:''}
      <div class="fld"><label>Çalışılan saat</label>
        <input id="pzMSaatIn" value="${ms>0?pzSaatFmt(ms):''}" placeholder="ör. 9:30 · 9,5 · 8" autocomplete="off" style="width:100%">
        <div class="helptext" style="margin-top:4px">Dış görev, sahada çalışma, kart basılmayan gün vb. için <b>gerçek çalışma saatini</b> yaz. Girilen saat PDKS kaydını <b>ezer</b> ve fazla mesai bu saatten hesaplanır. Boş bırakıp kaydedersen otomatik hesaba dönülür${pdks>0?` (PDKS: ${pzSaatFmt(pdks)})`:(r.manuel&&r.manuel[d]?` (elle X → varsayılan ${pzSaatFmt(GUN)})`:'')}.</div>
      </div>
      <div class="fld"><label>Not <span style="font-weight:400;color:var(--slate-400)">(neden elle girildi?)</span></label>
        <textarea id="pzMSaatNot" rows="2" placeholder="ör. Ankara dış görev — kart basılmadı" style="width:100%;border:1px solid var(--slate-300);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;resize:vertical">${esc((r.msaatNot&&r.msaatNot[d])||'')}</textarea>
      </div>
    </div>
    <div class="modal-ft">
      ${ms>0?`<button class="btn" onclick="pzSaatSil('${p.id}',${d})">Temizle</button>`:''}
      <button class="btn" onclick="closeModal()">Vazgeç</button>
      <button class="btn btn-pri" onclick="pzSaatKaydet('${p.id}',${d})">Kaydet</button>
    </div>
  </div></div>`;
  setTimeout(()=>{const el=document.getElementById('pzMSaatIn');if(el){el.focus();el.select();}},30);
}
function pzSaatKaydet(pid,d){
  const info=pzAyBilgi(puantajAy);const r=pzRow(pid,info);
  const v=pzSaatParse(document.getElementById('pzMSaatIn').value);
  if(Number.isNaN(v)){toast('Saat okunamadı — "9:30", "9,5" veya "8" gibi yaz (en fazla 24)');return;}
  const not=(document.getElementById('pzMSaatNot').value||'').trim();
  if(v==null){delete r.msaat[d];delete r.msaatNot[d];}
  else {r.msaat[d]=v;if(not)r.msaatNot[d]=not;else delete r.msaatNot[d];}
  saveDB();closeModal();renderPuantaj();toast(v==null?'Manuel saat kaldırıldı — otomatik hesaba dönüldü':'Saat kaydedildi: '+pzSaatFmt(v));
}
function pzSaatSil(pid,d){const info=pzAyBilgi(puantajAy);const r=pzRow(pid,info);
  delete r.msaat[d];delete r.msaatNot[d];saveDB();closeModal();renderPuantaj();toast('Manuel saat kaldırıldı — otomatik hesaba dönüldü');}
function pzSet(pid,d){const info=pzAyBilgi(puantajAy);const p=DB.personeller.find(x=>x.id===pid);
  // Çalışma dönemi dışı gün YAZILAMAZ (işe giriş öncesi / ayrılıştan itibaren)
  if(p&&pzPasifSet(p,info).has(d)){toast('Bu gün personelin çalışma dönemi dışında — işaretlenemez');return;}
  const r=pzRow(pid,info);
  r.manuel=r.manuel||{};
  if(pzBrush==='')delete r.manuel[d]; else r.manuel[d]=pzBrush;
  saveDB();renderPuantaj();}
function pzSayim(r,info,restSet,izinMap,pasif){const c={};PZ_STATUS.forEach(s=>c[s.k]=0);for(let d=1;d<=info.gun;d++){const k=pzGunKod(restSet,d,info,r,izinMap,pasif);c[k]=(c[k]||0)+1;}return c}

// Devam primi — yıl satırı (Ayarlar tablosu)
function dpYilRow(y,v){v=v||{};const inp=(tip,val)=>`<input type="number" step="0.01" data-dp="${y}:${tip}" value="${val!=null?val:''}" style="width:120px;padding:5px 8px;border:1px solid var(--slate-300);border-radius:6px;text-align:right">`;
  return `<tr data-dpyil="${y}"><td style="white-space:nowrap;font-weight:700">${y}</td><td>${inp('ay',v.ay)}</td><td>${inp('blok',v.blok)}</td><td><button type="button" class="iconbtn del" title="Yılı sil" onclick="dpYilSil(${y})"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button></td></tr>`;}
function dpYilEkle(){const body=document.getElementById('pa_dpBody');if(!body)return;
  const mevcut=[...body.querySelectorAll('tr[data-dpyil]')].map(tr=>+tr.getAttribute('data-dpyil'));
  const v=prompt('Eklenecek yıl:',String((mevcut.length?Math.max(...mevcut):new Date().getFullYear())+1));
  if(v==null)return;const y=parseInt(v,10);if(!y||y<2020||y>2100){toast('Geçerli bir yıl girin');return;}
  if(mevcut.includes(y)){toast(y+' zaten var');return;}
  body.insertAdjacentHTML('beforeend',dpYilRow(y,{}));
  // yıl sırasını koru
  const rows=[...body.querySelectorAll('tr')].sort((a,b)=>(+a.getAttribute('data-dpyil'))-(+b.getAttribute('data-dpyil')));rows.forEach(r=>body.appendChild(r));}
function dpYilSil(y){const tr=document.querySelector(`#pa_dpBody tr[data-dpyil="${y}"]`);if(tr)tr.remove();}

// Sütun gizleme grupları — araç çubuğu düğmeleri (günler ayrı, 3 modlu)
const PZ_GRUP=[['bilgi','Bilgi'],['yardim','Yardım/Kesinti'],['bordroOzet','Bordro Özet'],
               ['analiz','Analiz'],['karsilastirma','Karşılaştırma'],['sayim','Sayımlar']];
// Personel kartından çekilen etiketler
const PZ_UCRET_TIPI={aylik:'Aylık',gunluk:'Günlük',saatlik:'Saatlik'};
const PZ_NETBRUT={brut:'Brüt',net:'Net'};
// Devam primi tutarı — YIL BAZLI. tip: 'ay' (temiz ay primi) | 'blok' (3 ay blok primi).
// Her ay kendi takvim yılının tutarını kullanır; o yıl tanımlı değilse en yakın küçük-eşit yıl (yoksa eski tek değer).
function devamPrimTutar(yil,tip){const t=(DB.puantajAyar&&DB.puantajAyar.devamPrimYil)||{};
  if(t[yil]&&t[yil][tip]!=null&&t[yil][tip]!=='')return +t[yil][tip];
  const alt=Object.keys(t).map(Number).filter(y=>y<=yil).sort((a,b)=>b-a);
  for(const y of alt){if(t[y]&&t[y][tip]!=null&&t[y][tip]!=='')return +t[y][tip];}
  return tip==='blok'?(+(DB.puantajAyar&&DB.puantajAyar.devamBlok)||6000):(+(DB.puantajAyar&&DB.puantajAyar.devamAy)||1500);
}
// Sabit aylık devam primi — TARİHLİ liste [{ay:'YYYY-MM', tutar}]. Eski tek değer → tek dönem (hep geçerli).
function sabitDevamList(p){
  if(!p)return [];
  const s=p.sabitDevamPrim;
  if(Array.isArray(s))return s.filter(e=>e&&e.ay).map(e=>({ay:String(e.ay),tutar:+e.tutar||0})).sort((a,b)=>a.ay.localeCompare(b.ay));
  const n=parseFloat(String(s==null?'':s).replace(',','.'))||0;
  return n>0?[{ay:'2000-01',tutar:n}]:[];   // geriye uyum: eski tek değer başından beri geçerli
}
// Bir ay için geçerli sabit tutar = o aya kadarki EN SON dönemin tutarı (değişiklikten önceki aylar korunur)
function sabitDevamAy(p,ym){const list=sabitDevamList(p);let val=0;for(const e of list){if(e.ay<=ym)val=e.tutar;else break;}return val;}
// ===== DEVAM PRİMİ OTOMATİK DÖNGÜ MOTORU =====
function pzYmAbs(ym){const a=String(ym).split('-').map(Number);return a[0]*12+(a[1]-1);}
function pzAbsYm(abs){return Math.floor(abs/12)+'-'+String(abs%12+1).padStart(2,'0');}
// Orijinal (ilk) başlangıç — EN ERKEN bilinen tarih (dönemler girişi, işe giriş, kıdem/izin manuel bazı).
// Böylece kıdemi hesaplanan herkeste (Zirve devri, işe giriş boş olsa da) devam primi döngüsü de hesaplanır.
function pzOrijinalGiris(p){if(!p)return '';let en='';
  const ekle=v=>{v=String(v||'').slice(0,7);if(/^\d{4}-\d{2}$/.test(v)&&(!en||v<en))en=v;};
  ekle(p.iseGiris);ekle(p.kidemBaslangic);ekle(p.kidemBasManuel);ekle(p.izinBasManuel);
  (p.donemler||[]).forEach(d=>ekle(d.giris));
  return en;}
// Blok başı (month-1) mutlak ay indeksi. Kişiye özel 'devamBlokBasi' varsa o; yoksa orijinal girişten türet.
function pzDevamAnchorAbs(p){
  if(p&&p.devamBlokBasi){const s=String(p.devamBlokBasi).slice(0,7);if(/^\d{4}-\d{2}$/.test(s))return pzYmAbs(s);}
  const og=pzOrijinalGiris(p);if(!og)return null;
  const a=og.split('-').map(Number),oy=a[0],om=a[1];
  if(oy<2025)return 2025*12+0;                    // 2025 öncesi → takvim çeyreği (Ocak 2025 referans, faz 0)
  let am=om+1,ay=oy;if(am>12){am=1;ay++;}          // 2025+ → giriş ayı + 1
  return ay*12+(am-1);
}
// Bir ayın TEMİZ olup olmadığı — o ay D (devamsız), R (rapor), Üİ (ücretsiz izin) YOKSA temiz. Veri yoksa temiz say.
function pzDevamAyTemiz(p,ym){const data=DB.puantaj&&DB.puantaj[ym];if(!data||!data.rows||!data.rows[p.id])return true;
  const info=pzAyBilgi(ym);const r=data.rows[p.id];
  const c=pzSayim(r,info,haftaTatiliGunleri(p),pzIzinGunleri(p.id,info),pzPasifSet(p,info));
  // RK (iş kazası raporu) BİLEREK yok — iş kazası devam primini düşürmez (kullanıcı kuralı 17 Tem 2026).
  return !((c['D']||0)+(c['R']||0)+(c['Üİ']||0));}
// Otomatik devam primi (döngü + devamsızlık). Her ay kendi takvim yılının tutarını kullanır.
function pzDevamOto(p,info){
  const a=pzDevamAnchorAbs(p);if(a==null)return {tutar:0,kaynak:''};
  const ya=info.y*12+(info.m-1);
  if(ya<a)return {tutar:0,kaynak:''};              // döngü henüz başlamadı (giriş öncesi / 2025 öncesi)
  const ym=info.y+'-'+String(info.m).padStart(2,'0');
  if(!pzDevamAyTemiz(p,ym))return {tutar:0,kaynak:'oto'};   // kirli ay → prim yok
  const pos=((ya-a)%3+3)%3;                         // 0=1.ay 1=2.ay 2=3.ay
  const ayPrim=devamPrimTutar(info.y,'ay'), blokPrim=devamPrimTutar(info.y,'blok');
  if(pos<2)return {tutar:ayPrim,kaynak:'oto'};      // 1. veya 2. ay temiz → temiz ay primi
  const blokTemiz=pzDevamAyTemiz(p,pzAbsYm(ya-1))&&pzDevamAyTemiz(p,pzAbsYm(ya-2));  // 3. ay: blok tamamen temiz mi
  return {tutar:blokTemiz?blokPrim:ayPrim,kaynak:'oto'};
}
// İŞTEN ÇIKANLARA devam primi VERİLMEZ — tek istisna: ayın SON günü çıkan ve ayı EKSİKSİZ tamamlayan.
// Eksiksiz = ay temiz (D/R/Üİ yok) VE boş (statüsü belirsiz) gün yok. true → çıkışa rağmen prim alabilir.
function pzDevamCikisIstisna(p,info){
  const cik=String((p&&p.ayrilisTarihi)||'').slice(0,10);if(!cik)return true;               // çıkış yok → normal
  const ayBas=pzISO(info.y,info.m,1),aySon=pzISO(info.y,info.m,info.gun);
  if(cik<ayBas||cik>aySon)return true;                                                        // bu ay çıkmadı → normal
  if(cik!==aySon)return false;                                                                // ay içinde çıktı (son gün değil) → prim yok
  const ym=info.y+'-'+String(info.m).padStart(2,'0');const data=DB.puantaj&&DB.puantaj[ym];
  if(!data||!data.rows||!data.rows[p.id])return false;                                        // veri yok → eksiksiz sayılmaz
  const c=pzSayim(data.rows[p.id],info,haftaTatiliGunleri(p),pzIzinGunleri(p.id,info),pzPasifSet(p,info));
  return !((c['D']||0)+(c['R']||0)+(c['Üİ']||0))&&(c['']||0)===0;                             // son gün çıkış + temiz + boş gün yok → prim alabilir (RK bilerek yok — iş kazası kirletmez)
}
// Devam primi hücre değeri — öncelik: MANUEL (bu ay) > [ÇIKIŞ ENGELİ] > SABİT aylık (tarihli) > OTOMATİK döngü
function pzDevamPrim(p,info,r){
  if(r&&r.devamManuel&&(+r.devamManuel.tutar||0)>0)return {tutar:+r.devamManuel.tutar,kaynak:'manuel',not:r.devamManuel.not||''};
  if(p&&info&&!pzDevamCikisIstisna(p,info))return {tutar:0,kaynak:'cikis'};                   // ay içinde çıkan → devam primi yok
  const ym=info?(info.y+'-'+String(info.m).padStart(2,'0')):'';
  const sab=p?sabitDevamAy(p,ym):0;
  if(sab>0)return {tutar:sab,kaynak:'sabit'};
  return p&&info?pzDevamOto(p,info):{tutar:0,kaynak:''};
}
// Ayni yardım (Kelemençe) — adı Ayarlar'dan değiştirilebilir; hak kişi bazında (varsayılan şarküteri)
function pzAyniAd(){return (DB.puantajAyar&&DB.puantajAyar.ayniYardimAd&&String(DB.puantajAyar.ayniYardimAd).trim())||'Kelemençe';}
function pzAyniHak(p){return p?(p.ayniYardimHak===undefined?!!p.sarkuteri:!!p.ayniYardimHak):false;}
// Kıdem yılı = yıllık izin hakediş başlangıcından bordro ayı SONUNA kadar TAM yıl (Ayarlar'daki tanım).
function pzKidemYil(p,info){
  const ref=pzISO(info.y,info.m,info.gun);
  const bas=izinBaslangicISO(p,ref);
  if(!bas)return '';
  const y=yilFark(bas,ref);
  return y<0?0:y;
}
// Kıdem primi = kıdem yılına göre Ayarlar'daki tablodan (10 yıl ve üzeri = tavan)
function pzKidemPrim(yil){
  if(yil===''||yil==null)return '';
  const tbl=(DB.puantajAyar&&DB.puantajAyar.kidemPrim)||{};
  const y=Math.min(+yil,10);
  const v=(tbl[y]!=null)?tbl[y]:tbl[String(y)];
  return v!=null?+v:0;
}
// Otomatik dolan bordro değerleri: FM1/FM2/izin sayıları PUANTAJDAN, ücret tipi/ödeme şekli/kıdem PERSONEL KARTINDAN.
// AİLE/ÇOCUK/PRİM ORANTILAMA — kart tutarı 30 günlüktür; KESEN her gün (ücretsiz izin + rapor + devamsızlık + pasif/çalışma-dışı)

function pzOranli(base,c){
  base=+base||0;if(!(base>0))return {tutar:null,not:''};

  // RK'nın tek istisnası devam primidir (pzDevamAyTemiz), orantılama değil.
  const d=(c&&c['D'])||0,r=((c&&c['R'])||0)+((c&&c['RK'])||0),ui=(c&&c['Üİ'])||0,pf=(c&&c[PZ_PASIF])||0,kesen=d+r+ui+pf;

        const stip=ms?mtip:(varsay?`Elle "${k}" işaretlendi, kart kaydı yok → varsayılan ${pzSaatFmt(varsay)} sayıldı`:(tip||''));
        const dtip=[rtip,(ms?mtip:tip)].filter(Boolean).join('\n\n');

  });
  h+=`<div class="card" style="padding:0;border:none;background:none"><div class="pz-scroll"><table class="pz"><thead><tr>${head1}</tr></thead><tbody>${body}</tbody></table></div></div>`;

}

function pzExcel(){
  if(typeof XLSX==='undefined'){toast('Excel kütüphanesi yüklenemedi');return;}
  const info=pzAyBilgi(puantajAy);const aktif=pzAyPersonel(info);
  const aoa=[];
  aoa.push(['ROTA SMI TARIM — '+info.adi.toUpperCase()+' '+info.y+' AYI PUANTAJ']);
  // 1) Kimlik  2) BORDRO_KOL (ekranla aynı sıra)  3) Günler  4) Analiz (yönetici raporu)
  const h1=['S.No','Bölüm','Adı Soyadı'];
  const h2=['','',''];
  BORDRO_KOL.forEach(b=>{h1.push(b.k==='kelemence'?pzAyniAd():b.l);h2.push(b.alt||'');});
  for(let d=1;d<=info.gun;d++){h1.push(d);h2.push(pzGunAdi(info.y,info.m,d).toUpperCase());}
  h1.push('Çalışılan','Yıllık İzin','Raporlu','Ücretsiz','Hafta Tatili','Genel Tatil','Devamsız','Toplam Gün');
  h2.push('','','','','','','','');
  const EK=['AHS','AHSX','AHB','AHT','H1','H2','H3','H4','GS (Gereken Saat)','ÇS (Çalışılan Saat)','FARK'];
  EK.forEach(k=>{h1.push(k);h2.push('');});
  aoa.push(h1);aoa.push(h2);
  const dec=v=>(+v>0)?Math.round(v*100)/100:'';   // ondalık saat (45,5) — Excel'de hesaplanabilsin
  const notlar=[];   // {r,c,text} — bordro hücre notları, Excel yorumu olarak eklenecek
  aktif.forEach((p,i)=>{
    const r=pzRow(p.id,info);const restSet=haftaTatiliGunleri(p);const izinMap=pzIzinGunleri(p.id,info);
    const pasif=pzPasifSet(p,info);
    const c=pzSayim(r,info,restSet,izinMap,pasif);
    const fm=pzFM(p,restSet,info,r,izinMap,pasif);const varMi=fm.calGun>0||fm.cs>0;
    const row=[i+1,p.bolum||'',p.ad];
    // Bordro sütunları — yalnız pz:true olanlar dolu, kalanların kaynağı henüz tanımlanmadı (boş)
    const bd=pzBordroDeger(fm,c,p,info);const bnotlar=r.bordroNot||{};
    BORDRO_KOL.forEach((b,j)=>{const v=bd[b.k];
      let out;
      if(b.k==='fm1'||b.k==='fm2')out=dec(v);
      else if(b.k==='kidemPrimi'&&p.kidemPrimYok)out='—';                         // kıdem primi verilmez
      else if(b.k==='kidemYili'||b.k==='kidemPrimi')out=(v===''||v==null)?'':+v;  // ham sayı (0 dahil)
      else if(b.k==='avans'||b.k==='trafikCezasi')out=(+v>0)?+v:'';               // taksit varsa ham sayı, yoksa boş
      else if(b.k==='kelemence')out=(v===null)?'—':((+v>0)?+v:'');                // hak yoksa —, varsa ham tutar
      else if(b.k==='devamPrimi'){if(p.devamPrimYok)out='—';                      // devam primi verilmez
        else{const dp=pzDevamPrim(p,info,r);out=dp.tutar>0?dp.tutar:'';
        if(dp.kaynak==='manuel'&&dp.not)notlar.push({r:3+i,c:3+j,text:'MANUEL: '+dp.not});}}
      else out=(v==null?'':(v||''));
      row.push(out);
      const cellNot=[bnotlar[b.k],(bd._oranNot&&bd._oranNot[b.k])?('ORANTILANDI — '+bd._oranNot[b.k]):''].filter(Boolean).join(' | ');
      if(cellNot)notlar.push({r:3+i,c:3+j,text:cellNot});});
    // Pasif gün Excel'de "—" (çalışma dönemi dışı; Excel'de dolgu rengi yazılamıyor)
    for(let d=1;d<=info.gun;d++){const k=pzGunKod(restSet,d,info,r,izinMap,pasif);row.push(k===PZ_PASIF?'—':k);
      // Elle girilen saat → gün hücresine Excel yorumu (neden/ne kadar)
      const ms=pzMSaat(r,d);
      if(ms>0)notlar.push({r:3+i,c:3+BORDRO_KOL.length+(d-1),
        text:'ELLE GİRİLEN SAAT: '+pzSaatFmt(ms)+((r.msaatNot&&r.msaatNot[d])?' — '+r.msaatNot[d]:'')});}
    row.push(c['X']||0,c['Yİ']||0,(c['R']||0)+(c['RK']||0),c['Üİ']||0,(c['HT']||0)+(c['HÇ']||0),(c['GT']||0)+(c['TM']||0),(c['D']||0)+(c['M']||0),info.gun-(c['']||0)-(c[PZ_PASIF]||0));  // HT+HÇ, GT+TM, D+M, Toplam=ay−boş−pasif
    row.push(dec(fm.AHS),dec(fm.AHSX),dec(fm.AHB),dec(fm.AHT),
      dec(fm.H[0]),dec(fm.H[1]),dec(fm.H[2]),dec(fm.H[3]),
      varMi?dec(fm.gs):'',varMi?dec(fm.cs):'',varMi?Math.round(fm.fark*100)/100:'');
    aoa.push(row);
  });
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:5},{wch:10},{wch:24}]
    .concat(BORDRO_KOL.map(b=>({wch:Math.max(9,b.l.length+2)})))
    .concat(Array.from({length:info.gun},()=>({wch:4})))
    .concat([{wch:9},{wch:8},{wch:7},{wch:8},{wch:10},{wch:10},{wch:9},{wch:9}])
    .concat(EK.map(k=>({wch:k.length>4?17:7})));
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:2+BORDRO_KOL.length}}];
  // Bordro notlarını Excel hücre yorumu olarak ekle (kırmızı üçgen + hover)
  notlar.forEach(n=>{const ref=XLSX.utils.encode_cell({r:n.r,c:n.c});
    if(!ws[ref])ws[ref]={t:'s',v:''};
    ws[ref].c=[{a:'İK',t:n.text}];ws[ref].c.hidden=true;});
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,info.adi+' '+info.y);
  XLSX.writeFile(wb,'ROTA SMI '+info.adi.toUpperCase()+' '+info.y+' PUANTAJ.xlsx');
  toast('Excel indiriliyor');
}

// ===================== PDKS PUANTAJ İÇE AKTARMA (Faz 1b) =====================
function pzTnorm(s){return String(s||'').toLocaleUpperCase('tr').replace(/\s+/g,' ').trim();}
function pzAsciiUp(s){return String(s||'').toLocaleUpperCase('tr').replace(/İ/g,'I').replace(/Ş/g,'S').replace(/Ğ/g,'G').replace(/Ü/g,'U').replace(/Ö/g,'O').replace(/Ç/g,'C').replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}
function pzHH(min){min=((Math.round(min)%1440)+1440)%1440;return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0');}
// Saat hücresi → dakika. Ham seri (SSF, TZ-bağımsız) öncelikli; Date ise YEREL saat.
function pzCellMin(v){ if(v==null||v==='')return null;
  if(typeof v==='number'){ if(XLSX.SSF){const d=XLSX.SSF.parse_date_code(v);if(d)return d.H*60+d.M;} return Math.round((v%1)*1440); }
  if(v instanceof Date)return v.getHours()*60+v.getMinutes();
  const m=String(v).match(/(\d{1,2}):(\d{2})/);return m?(+m[1]*60+ +m[2]):null; }
// Tarih hücresi → 'YYYY-MM-DD'. Ham seri → SSF.parse_date_code (TZ kaymasını önler); Date ise YEREL.
function pzCellISO(v){ if(typeof v==='number'&&XLSX.SSF){const d=XLSX.SSF.parse_date_code(v);if(d&&d.y)return d.y+'-'+String(d.m).padStart(2,'0')+'-'+String(d.d).padStart(2,'0');}
  if(v instanceof Date)return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
  const s=String(v); let m=s.match(/(\d{4})-(\d{2})-(\d{2})/); if(m)return m[0];
  m=s.match(/(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})/); if(m)return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`; return null; }
function pzWeekKeyISO(iso){const dt=new Date(iso+'T00:00:00');const wd=(dt.getDay()+6)%7;dt.setDate(dt.getDate()-wd);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
function pzIzinKod(tur){if(tur==='yillik')return 'Yİ';if(tur==='ucretsiz')return 'Üİ';if(tur==='raporlu')return 'R';if(tur==='ucretsiz_saat')return null;return 'M';}
// Bir kişinin o aydaki izin günleri {gün:kod} — DB.izinler'den canlı türetilir
function pzIzinGunleri(pid,info){const map={};
  (DB.izinler||[]).filter(z=>z.personelId===pid).forEach(z=>{let kod=pzIzinKod(z.tur);if(!kod)return;
    if(kod==='R'&&z.isKazasi)kod='RK';   // iş kazası kaynaklı rapor — ayrı kod, ayrı renk, devam primini düşürmez
    const b=z.baslangic,e=z.bitis||z.baslangic;if(!b)return;
    for(let dt=new Date(b+'T00:00:00'),end=new Date(e+'T00:00:00');dt<=end;dt.setDate(dt.getDate()+1)){
      if(dt.getFullYear()===info.y&&dt.getMonth()+1===info.m)map[dt.getDate()]=kod;}});
  return map;}
// Depolanan gün kodu + o günkü izin → GÖRÜNEN kod. İzin YALNIZ devamsız/boş VEYA saatsiz(kart basmayan
// varsayılan) X gününü doldurur; çalışılan(X saatli)/HÇ/HT/GT korunur → izindeki tatiller izinden düşmez,
// fiili çalışma silinmez (4857/56).
function pzGoster(stored,izinKod,hasSaat){stored=stored||'';
  if(!izinKod)return stored;
  if(stored==='D'||stored==='')return izinKod;
  if(stored==='X'&&!hasSaat)return izinKod;
  return stored;}
// Bir günün GÖRÜNEN kodunu CANLI türetir. Öncelik: Genel Tatil(GT/TM) > Hafta Tatili(HT/HÇ, KARTTAN)
// > Çalıştı(X, import saati) > İzin(canlı) > Devamsız(D) > iş günü(X). Böylece hafta tatili & genel
// tatil import beklemeden karttan/takvimden otomatik gelir (yıllık izin gibi), bayat satırları da düzeltir.
function pzGunKod(restSet,d,info,r,izinMap,pasif){
  // ÇALIŞMA DÖNEMİ DIŞI (işe girişten önce / ayrılıştan itibaren) → PASİF. Elle boyama bile ezemez.
  if(pasif&&pasif.has(d))return PZ_PASIF;
  // ELLE boyanan gün her şeyi ezer — insan düzeltmesi otomatik türetmeden üstündür.
  const man=r.manuel&&r.manuel[d];
  if(man)return man;
  // ÇALIŞMA = PDKS saati VEYA elle girilen saat (dış görev — kart basılmamış).
  const worked=!!(r.saat&&r.saat[d])||pzMSaat(r,d)>0;
  const wd=new Date(info.y,info.m-1,d).getDay();
  const resmi=pzResmi(info.y,info.m,d), htg=!!(restSet&&restSet.has(wd));
  // ÇALIŞILDIYSA NORMAL İŞLEM — rapor bile olsa (17 Tem 2026 kullanıcı düzeltmesi).
  // Personel işe gelip gün içinde/mesai sonrası rapor aldıysa O GÜN ÇALIŞILMIŞ GÜNDÜR:
  // maaş + prim tam, saat haftalık 45 hesabına normal girer, SGK eksik gününe GİRMEZ
  // (MUHSGK'da o gün için kazanç bildirilir → 01-İstirahat eksik günü yalnız sonraki günler).
  // Rapor kaydı SİLİNMEZ, durur — yalnız bu gün rapor günü SAYILMAZ. Sonraki günler R/RK devam eder.
  if(worked)return resmi?'TM':(htg?'HÇ':'X');
  // ÇALIŞILMADIYSA rapor TATİLİ EZER — rapor takvim günüdür, HT/GT onu yemez.
  // (Yıllık izinde kural TERSİ: 4857/56 — izindeki tatiller izinden düşmez, o yüzden Yİ aşağıda kalır.)
  const izk=izinMap&&izinMap[d];
  if(izk==='R'||izk==='RK')return izk;
  if(resmi)return 'GT';
  if(htg)return 'HT';
  if(izk)return izk;
  const stored=(r.gunler&&r.gunler[d])||'';
  if(stored==='D')return 'D';
  // İş günü ama çalışma (giriş-çıkış/saat) yok → BOŞ; otomatik X gösterilmez. Otomatik/bayat kodlar (X/HT/GT/HÇ/TM) yok sayılır.
  if(stored===''||stored==='X'||stored==='HT'||stored==='GT'||stored==='HÇ'||stored==='TM')return '';
  return stored; // manuel özel kod (M vb.) korunur
}
// Kişinin o aydaki HAFTA yapısı — hafta tatiline çapalı (HT'den HT'ye 6 gün).
// H'ye katkı: X ve TM'nin GERÇEK saati. Yİ/Üİ/R/D/GT → 0. HÇ günü hafta SINIRIDIR (H'ye girmez).
// Baş/son blok 6 günse TAM hafta sayılır; 6'dan azsa artık hafta (AHB / AHS).
function pzGunlukVars(){return (DB.puantajAyar&&+DB.puantajAyar.gunlukSaat)||7.5;}
function pzHaftaEsik(){return (DB.puantajAyar&&+DB.puantajAyar.fmHaftalik)||45;}
function pzGunFmEsik(){return (DB.puantajAyar&&+DB.puantajAyar.gunFmEsik)||11;}   // gündüz günlük FM eşiği
// Kişinin günlük FM eşiği: gece işçisi → günlük normal (7,5) · gündüz → gunFmEsik (11)
function pzGunFmEsikKisi(p){return (p&&p.vardiyaTipi==='gece')?pzGunlukVars():pzGunFmEsik();}
// NOT: Hafta yapısı (HT'den HT'ye 6 gün) ve 45 eşiği AYNEN korunur. Pasif (çalışma dönemi dışı)
// günler sadece 0 saat sayılır — haftayı bölmez, eşiği düşürmez. (Yİ/R/GT ile aynı davranış.)
// capGun = kişinin GÜNLÜK FM eşiği (gündüz 11 / gece 7,5). Bir günün saati bu eşiği aşarsa,
// (saat − günlük normal) o haftanın "günlük zorlaması"na (Hf/AHBf/AHSf) eklenir — haftalık 45 altında kalsa bile.
function pzHaftalar(restSet,info,r,izinMap,pasif,capGun){
  const GUN=pzGunlukVars();
  const CAP=(capGun!=null&&isFinite(capGun))?capGun:Infinity;
  const gunSaat=d=>{const k=pzGunKod(restSet,d,info,r,izinMap,pasif);
    if(k!=='X'&&k!=='TM')return 0;
    // Elle girilen saat (dış görev) her şeyi EZER — insan düzeltmesi PDKS'nin de üstündedir.
    const ms=pzMSaat(r,d);
    if(ms)return ms;
    const s=(r.saat&&r.saat[d])||0;
    if(s)return s;
    // Kart basmayan (idari/pazarlama) personel: gün ELLE işaretlendi ama saat kaydı yok
    // → varsayılan günlük saat (Ayarlar: gunlukSaat, vars. 7,5) sayılır.
    return (r.manuel&&r.manuel[d])?GUN:0;};
  const gunForce=d=>{const s=gunSaat(d);return s>CAP?Math.max(0,s-GUN):0;};   // günlük eşik aşımı → FM
  const N=info.gun,ht=[];
  for(let d=1;d<=N;d++){if(restSet.has(new Date(info.y,info.m-1,d).getDay()))ht.push(d);}
  const topla=g=>Math.round(g.reduce((a,d)=>a+gunSaat(d),0)*100)/100;
  const toplaF=g=>Math.round(g.reduce((a,d)=>a+gunForce(d),0)*100)/100;
  const H=[],Hf=[];let AHB=0,AHS=0,AHBf=0,AHSf=0;
  if(!ht.length){const g=[];for(let d=1;d<=N;d++)g.push(d);H.push(topla(g));Hf.push(toplaF(g));return {H,AHB,AHS,Hf,AHBf,AHSf};}
  const bas=[];for(let d=1;d<ht[0];d++)bas.push(d);
  if(bas.length===6){H.push(topla(bas));Hf.push(toplaF(bas));}else if(bas.length){AHB=topla(bas);AHBf=toplaF(bas);}
  for(let i=0;i<ht.length-1;i++){const g=[];for(let d=ht[i]+1;d<ht[i+1];d++)g.push(d);if(g.length){H.push(topla(g));Hf.push(toplaF(g));}}
  const son=[];for(let d=ht[ht.length-1]+1;d<=N;d++)son.push(d);
  if(son.length===6){H.push(topla(son));Hf.push(toplaF(son));}else if(son.length){AHS=topla(son);AHSf=toplaF(son);}
  return {H,AHB,AHS,Hf,AHBf,AHSf};
}
// AHSX = ÖNCEKİ ayın AHS'si (+ o haftanın günlük FM zorlaması) — önceki ayın puantajından canlı hesaplanır
function pzOncekiAHS(p,info){
  let y=info.y,m=info.m-1;if(m<1){m=12;y--;}
  const ay=`${y}-${String(m).padStart(2,'0')}`;
  const data=DB.puantaj&&DB.puantaj[ay];
  if(!data||!data.rows||!data.rows[p.id])return {v:0,f:0};
  const oInfo=pzAyBilgi(ay);
  const w=pzHaftalar(haftaTatiliGunleri(p),oInfo,data.rows[p.id],pzIzinGunleri(p.id,oInfo),pzPasifSet(p,oInfo),pzGunFmEsikKisi(p));
  return {v:w.AHS,f:w.AHSf};
}
// Aylık FM: FM1 = Σmaks(0, Hn−45, günlük zorlama_n) + maks(0, AHT−45, sınır günlük zorlama) + HÇ×7,5
//   Günlük zorlama: bir gün eşiği (gündüz 11 / gece 7,5) aşarsa (saat−7,5) — haftalık 45 altında olsa bile.
//   maks(...) ile haftalık aşımıyla ÇİFT SAYILMAZ. | FM2 = tamUBGT×7,5 + arife×3,75
function pzFM(p,restSet,info,r,izinMap,pasif){
  pasif=pasif||pzPasifSet(p,info);
  const cap=pzGunFmEsikKisi(p);   // günlük FM eşiği: gündüz 11 · gece 7,5
  const {H,AHB,AHS,Hf,AHBf,AHSf}=pzHaftalar(restSet,info,r,izinMap,pasif,cap);
  const ahsx=pzOncekiAHS(p,info);const AHSX=ahsx.v;
  const AHT=Math.round((AHSX+AHB)*100)/100;
  const AHTf=Math.round(((ahsx.f||0)+AHBf)*100)/100;   // sınır haftasının günlük FM zorlaması (önceki ay AHS + bu ay AHB)
  let hc=0,tmTam=0,tmArife=0,calGun=0;
  for(let d=1;d<=info.gun;d++){const k=pzGunKod(restSet,d,info,r,izinMap,pasif);
    if(k==='HÇ')hc++;else if(k==='TM'){pzArifeMi(info.y,info.m,d)?tmArife++:tmTam++;}
    // Çalışılan gün = giriş-çıkış yapılan gün. HT/HÇ, Yİ, Üİ, R, GT, D sayılmaz → yalnız X ve TM.
    if(k==='X'||k==='TM')calGun++;}
  // Eşik ve günlük saat Ayarlar'dan gelir (vars. 45 / 7,5). Arife primi günlüğün YARISI.
  const ESIK=pzHaftaEsik(), GUN=pzGunlukVars();
  const fmVerilmez=!!p.fmYok;   // personel kartı: "Fazla mesai verilmez"
  const fm1=fmVerilmez?0:Math.round((H.reduce((a,h,i)=>a+Math.max(0,h-ESIK,Hf[i]||0),0)+Math.max(0,AHT-ESIK,AHTf)+hc*GUN)*100)/100;
  const fm2=fmVerilmez?0:Math.round((tmTam*GUN+tmArife*(GUN/2))*100)/100;
  // Aylık karşılaştırma: GS = çalışılan gün × günlük saat | ÇS = H1..Hn + AHB + AHS | FARK = ÇS − GS
  const gs=Math.round(calGun*GUN*100)/100;
  const cs=Math.round((H.reduce((a,h)=>a+h,0)+AHB+AHS)*100)/100;
  const fark=Math.round((cs-gs)*100)/100;
  return {H,AHB,AHS,AHSX,AHT,fm1,fm2,hc,tmTam,tmArife,calGun,gs,cs,fark};
}
// İmzalı saat biçimi: +3:20 / −5:10
function pzSaatFmtImza(v){const t=Math.round(Math.abs(+v||0)*60);if(t===0)return '0:00';
  return (v<0?'−':'+')+Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
// Span: gece'yi O GÜNÜN saatlerinden anlar (son giriş > son çıkış → vardiya gece yarısını aşıyor →
// öğleden önceki saatler +1 gün). Kendi kendini düzeltir: gündüzcü yanlış 'gece' işaretlense de bozulmaz.
// Yalnız GÖSTERİM içindir (giriş-çıkış aralığı, gc). Çalışma saati pzGunNet'ten gelir — buraya BAĞLI DEĞİL.
function pzGunSpan(daySegs){const gs=daySegs.filter(s=>s.gir!=null);if(!gs.length)return null;
  // Gece günü = KAPALI bir periyot gece yarısını aşıyor (çıkış<giriş). Kapanmamış giriş yanıltmasın.
  const geceGun=gs.some(s=>s.cik!=null&&s.cik<s.gir);
  // Çapa = en geç giriş (vardiya başlangıcı). Ondan önceki saatler ertesi güne aittir.
  // (Eski sabit 12:00 eşiği, öğleden sonra biten gece vardiyasını kaybediyordu.)
  const capa=Math.max(...gs.map(s=>s.gir));
  const wrap=t=>(geceGun&&t<capa)?t+1440:t;
  let firstIn=Infinity,lastOut=-Infinity,hasOut=false;
  gs.forEach(s=>{const g=wrap(s.gir);if(g<firstIn)firstIn=g;
    if(s.cik!=null){const c=wrap(s.cik);if(c>lastOut){lastOut=c;hasOut=true;}}});
  if(!hasOut||lastOut<=firstIn)return null;return {firstIn,lastOut,span:lastOut-firstIn};}
// Günlük NET çalışma (dk) = İÇERİDE bulunulan süre = her TAM periyodun (çıkış−giriş) TOPLAMI.
// Periyot gece yarısını aşarsa (çıkış<giriş) +1 gün. Aradaki boşluklar (yemek/mola/dışarı) SAYILMAZ.
function pzGunNet(daySegs){let top=0;daySegs.forEach(s=>{if(s.gir==null||s.cik==null)return;let d=s.cik-s.gir;if(d<0)d+=1440;top+=d;});return top;}
// Ondalık saat → "S:DD" (ör. 7.68 → "7:41"). Grid'de günlük çalışma saati bu biçimde gösterilir.
function pzSaatFmt(saat){const t=Math.round((+saat||0)*60);if(t<=0)return '';return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}

// XLSX workbook → {segments, aylar}
function pzPdksParse(wb){
  const ws=wb.Sheets[wb.SheetNames[0]];
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  if(!aoa.length)return {segments:[],aylar:{}};
  const hdr=aoa[0].map(pzAsciiUp);
  const col=(...keys)=>{for(const k of keys){const i=hdr.findIndex(h=>h===k);if(i>=0)return i;}for(const k of keys){const i=hdr.findIndex(h=>h.includes(k));if(i>=0)return i;}return -1;};
  const ci={ad:col('ADI'),soyad:col('SOYADI','SOYAD'),tarih:col('TARIH'),gir:col('GIRIS','GIRI','GIR'),cik:col('CIKIS','CIKI','CIK'),model:col('GUN MODELI','MODEL'),maz:col('MAZERET','MAZ'),sicil:col('SICIL NO','SICIL')};
  const segments=[],aylar={};
  for(let r=1;r<aoa.length;r++){const row=aoa[r];if(!row||!row.length)continue;
    const iso=pzCellISO(row[ci.tarih]);if(!iso)continue;
    const ad=`${String(row[ci.ad]||'').trim()} ${ci.soyad>=0?String(row[ci.soyad]||'').trim():''}`.trim();if(!ad)continue;
    segments.push({sicil:row[ci.sicil],ad,tarih:iso,gir:pzCellMin(row[ci.gir]),cik:pzCellMin(row[ci.cik]),model:String(row[ci.model]||'').trim(),maz:String(row[ci.maz]||'').trim()});
    const ay=iso.slice(0,7);aylar[ay]=(aylar[ay]||0)+1;}
  return {segments,aylar,ci};
}

// Segmentler + ay → içe aktarma planı (yazmadan hesaplar)
function pzPdksHesap(segments,ay){
  const ayar=DB.puantajAyar;const [yy,mm]=ay.split('-').map(Number);
  const molaTop=(ayar.mola.sabah||0)+(ayar.mola.ogle||0)+(ayar.mola.aksam||0);
  const aktif=pzAyPersonel(pzAyBilgi(ay));   // o AYIN personeli (ay içinde giren/çıkan dahil)
  const appByName=new Map();aktif.forEach(p=>{const k=pzTnorm(p.ad);if(!appByName.has(k))appByName.set(k,p);});
  const byName=new Map();
  segments.forEach(s=>{if(String(s.tarih).slice(0,7)!==ay)return;const k=pzTnorm(s.ad);
    if(!byName.has(k))byName.set(k,{ad:s.ad,days:new Map()});
    const d=+s.tarih.slice(8,10);const days=byName.get(k).days;if(!days.has(d))days.set(d,[]);days.get(d).push(s);});
  const kisiler=[],eslesmeyenPdks=[];
  byName.forEach((rec,k)=>{
    const p=appByName.get(k);if(!p){eslesmeyenPdks.push(rec.ad);return;}
    const appGece=p.vardiyaTipi==='gece',molaDus=!!p.molaDus;
    const izinGun={};
    DB.izinler.filter(z=>z.personelId===p.id).forEach(z=>{const kod=pzIzinKod(z.tur);if(!kod)return;
      const b=z.baslangic,e=z.bitis||z.baslangic;if(!b)return;
      for(let dt=new Date(b+'T00:00:00'),end=new Date(e+'T00:00:00');dt<=end;dt.setDate(dt.getDate()+1)){
        if(dt.getFullYear()===yy&&dt.getMonth()+1===mm)izinGun[dt.getDate()]=kod;}});
    // 1. geçiş: her günün span/net + workedDays + GECE YARISINI AŞAN gün sayısı (çıkış ertesi güne sarıyor)
    const gunBilgi={};let workedDays=0,geceGunCount=0,kartGun=0;
    rec.days.forEach((segs,d)=>{
      const sp=pzGunSpan(segs);const net=pzGunNet(segs)||null; // NET = periyot toplamı (içeride bulunulan süre), span DEĞİL
      if(net){workedDays++;if(sp&&sp.lastOut>=1440)geceGunCount++;}
      if(segs.some(s=>s.gir!=null))kartGun++;  // HERHANGİ bir giriş basılan gün (çıkışı unutulsa da kart basmış)
      // EKSİK ÇIKIŞ: giriş basılmış, çıkış basılmamış periyotlar. Süresi bilinemez → saat UYDURULMAZ, 0 sayılır.
      const acik=segs.filter(s=>s.gir!=null&&s.cik==null).map(s=>pzHH(s.gir));
      gunBilgi[d]={segs,sp,net,acik};});
    const badger=kartGun>=5;   // kart basan = 5+ gün giriş basmış (tam gün değil; çıkış unutan da sayılır)
    // GECE İŞÇİSİ (yalnız boş-gün→boş/D ayrımı için): çalışılan günlerin çoğu GECE YARISINI AŞIYORSA
    // (16→01, 22→07, 23:30→06 hepsi aşar; gündüzcü aşmaz). Giriş saati eşiği YOK — ÖZCAN gibi erken
    // (16:00) başlayıp gece çıkanı da yakalar. Kart 'gece' / eski 22-8 modeli EK güvence. Span zaten
    // kendini düzeltir; bu bayrak yalnız boş günün 'boş' mu 'D' mi olacağını belirler.
    const patternGece=workedDays>=4&&geceGunCount>workedDays*0.5;
    const geceWorker=patternGece||((appGece||[...rec.days.values()].some(segs=>segs.some(s=>/^22/.test(s.model))))&&workedDays>0&&geceGunCount>=workedDays*0.3);
    const gunSay=pzAyBilgi(ay).gun;
    // PDKS cihazının bu kişiye tatil (HTAT2/P) işaretlediği hafta günleri (zayıf; kişi tutmayabilir)
    const deviceRest=new Set();
    rec.days.forEach((segs,d)=>{if(segs.some(s=>/P$/.test(s.model)||s.maz==='HTAT2'))deviceRest.add(new Date(yy,mm-1,d).getDay());});
    // FİİLİ tatil: hafta günü bazında çalışma oranı; en az çalışılan gün = fiili tatil adayı
    const wdW=[0,0,0,0,0,0,0],wdT=[0,0,0,0,0,0,0];
    for(let d=1;d<=gunSay;d++){const wd=new Date(yy,mm-1,d).getDay();wdT[wd]++;const gi=gunBilgi[d];if(gi&&gi.net>0)wdW[wd]++;}
    let inferred=-1,minRate=2;for(let w=0;w<7;w++){if(!wdT[w])continue;const r2=wdW[w]/wdT[w];if(r2<minRate){minRate=r2;inferred=w;}}
    // hafta tatili: KART öncelik; kart boşsa FİİLİ desen; belirsizse cihaz işareti; son çare Pazar
    const kartDolu=!!(p.haftaTatili&&String(p.haftaTatili).trim());
    const restSet=kartDolu?haftaTatiliGunleri(p):((inferred>=0&&minRate<0.34)?new Set([inferred]):(deviceRest.size?deviceRest:new Set([0])));
    const gunler={},saat={},gc={};
    const pasifSet=pzPasifSet(p,pzAyBilgi(ay));   // işe giriş öncesi / ayrılıştan itibaren
    for(let d=1;d<=gunSay;d++){
      if(pasifSet.has(d))continue;                // çalışma dönemi dışı — hiçbir şey yazma
      // ÇALIŞTI = net (periyot toplamı) > 0. span'e BAĞLAMA — span yalnız gösterim içindir ve
      // kapanmamış bir giriş / geç biten gece vardiyası yüzünden null dönebilir; o zaman gün haksız yere D olurdu.
      const gi=gunBilgi[d];const worked=!!(gi&&gi.net>0);
      const wd=new Date(yy,mm-1,d).getDay();
      const isRest=restSet.has(wd);const isGT=!!pzResmi(yy,mm,d);let kod;
      // İzin BURADA depolanmaz — grid saf devam tutar; izinler gösterimde canlı bindirilir (pzGoster).
      if(isGT)kod=worked?'TM':'GT';                    // genel tatil: çalıştıysa TM (tatil mesaisi), değilse GT
      else if(isRest)kod=worked?'HÇ':'HT';             // kart hafta tatili günü: çalıştıysa HÇ, değilse HT
      else if(worked)kod='X';                          // normal iş günü çalışıldı
      else if(gi&&gi.acik&&gi.acik.length)kod='';      // EKSİK ÇIKIŞ (geldi, çıkış yok) → D DEĞİL; kırmızı üçgen işaretler, sen düzeltirsin
      else kod=badger?'D':'X';                         // hiç kart yok: kart basan→D, kart basmayan(idari/pazarlama)→boş
      gunler[d]=kod;
      if(worked&&(kod==='X'||kod==='HÇ'||kod==='TM')){saat[d]=Math.round(gi.net/60*100)/100;
        if(gi.sp)gc[d]=pzHH(gi.sp.firstIn)+'-'+pzHH(gi.sp.lastOut);}}   // gc yoksa saat yine yazılır
    const GUNn=ayar.gunlukSaat||7.5, capN=(p.vardiyaTipi==='gece')?GUNn:(ayar.gunFmEsik||11);   // günlük FM eşiği (gündüz 11 / gece 7,5)
    const haftaNet={},haftaF={};Object.keys(saat).forEach(d=>{if(gunler[d]!=='X')return;const wk=pzWeekKeyISO(`${ay}-${String(d).padStart(2,'0')}`);haftaNet[wk]=(haftaNet[wk]||0)+saat[d];const s=saat[d];haftaF[wk]=(haftaF[wk]||0)+(s>capN?Math.max(0,s-GUNn):0);});
    let fmOto=0;Object.keys(haftaNet).forEach(wk=>fmOto+=Math.max(0,haftaNet[wk]-(ayar.fmHaftalik||45),haftaF[wk]||0));fmOto=Math.round(fmOto*100)/100;
    const htcSaat=Math.round(Object.keys(saat).filter(d=>gunler[d]==='HÇ').reduce((a,d)=>a+saat[d],0)*100)/100;
    const tmSaat=Math.round(Object.keys(saat).filter(d=>gunler[d]==='TM').reduce((a,d)=>a+saat[d],0)*100)/100; // genel tatil çalışma saati
    // Özet için izinleri canlı bindir (grid saf devam tutar; izin yalnız boş/devamsız günü doldurur)
    const dispGun={};for(let d=1;d<=gunSay;d++){if(pasifSet.has(d))continue;dispGun[d]=pzGoster(gunler[d]||'',izinGun[d],!!saat[d]);}
    const say=k2=>Object.values(dispGun).filter(x=>x===k2).length;
    const toplamSaat=Math.round(Object.values(saat).reduce((a,b)=>a+b,0)*100)/100;
    const cardRestRate=[...restSet].reduce((m,w)=>Math.max(m,wdT[w]?wdW[w]/wdT[w]:0),0);
    // Uyarı: kart DOLU badger'da fiili tatil kart tatilinden farklı VE kart tatilinde çoğunlukla çalışıyorsa.
    // Gece: yalnız düzenli çalışanda (ayın çoğunu çalışan) — rotasyoncularda desen güvenilmez.
    const uyariUygun=!geceWorker||workedDays>=gunSay*0.55;
    const tatilUyari=kartDolu&&badger&&uyariUygun&&inferred>=0&&minRate<0.34&&!restSet.has(inferred)&&cardRestRate>0.5;
    // EKSİK ÇIKIŞ günleri: {gün: {saatler, sayilan, kritik}}
    // kritik = o günde HİÇ kapalı periyot yok → saat 0 → gün D/HT görünüyor ama kişi aslında çalışmış olabilir.
    const eksik={};let eksikKritik=0;
    for(let d=1;d<=gunSay;d++){const gi=gunBilgi[d];
      if(pasifSet.has(d))continue;                 // çalışma dönemi dışı
      if(!gi||!gi.acik||!gi.acik.length)continue;
      const kritik=!(gi.net>0);
      if(kritik)eksikKritik++;
      eksik[d]={saatler:gi.acik,sayilan:gi.net?Math.round(gi.net/60*100)/100:0,kritik,kod:gunler[d]};}
    const PZ_GUNADI=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
    kisiler.push({pid:p.id,ad:p.ad,dep:p.bolum,badger,geceWorker,workedDays,gunler,saat,gc,fmOto,htcSaat,tmSaat,eksik,eksikKritik,
      restGun:[...restSet].map(w=>PZ_GUNADI[w]).join(','),kartDolu,inferredGun:inferred>=0?PZ_GUNADI[inferred]:'',tatilUyari,
      ozet:{X:say('X'),'HÇ':say('HÇ'),HT:say('HT'),GT:say('GT'),D:say('D'),bos:say(''),izin:say('Yİ')+say('Üİ')+say('R')+say('M'),toplamSaat}});});
  const pdksNames=new Set([...byName.keys()]);
  const eslesmeyenApp=aktif.filter(p=>!pdksNames.has(pzTnorm(p.ad))).map(p=>p.ad);
  return {ay,kisiler,eslesmeyenPdks,eslesmeyenApp};
}

function pzPdksDosya(input){
  const file=input.files&&input.files[0];if(!file)return;
  if(typeof XLSX==='undefined'){toast('Excel kütüphanesi yüklenemedi');return;}
  toast('PDKS dosyası okunuyor…');
  const rd=new FileReader();
  rd.onload=e=>{try{
    const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
    const {segments,aylar}=pzPdksParse(wb);input.value='';
    if(!segments.length){toast('Dosyada okunabilir kayıt bulunamadı');return;}
    const ay=Object.keys(aylar).sort((a,b)=>aylar[b]-aylar[a])[0];
    const sonuc=pzPdksHesap(segments,ay);sonuc._segCount=segments.length;sonuc._aylar=aylar;
    pzPdksOnizle(sonuc);
  }catch(err){input.value='';toast('Dosya okunamadı: '+err.message);console.error(err);}};
  rd.readAsArrayBuffer(file);
}

function pzPdksUygula(){
  const s=window.__pzImport;if(!s){toast('İçe aktarma verisi yok');return;}
  const info=pzAyBilgi(s.ay);
  DB.puantaj=DB.puantaj||{};if(!DB.puantaj[s.ay])DB.puantaj[s.ay]={rows:{}};
  const data=DB.puantaj[s.ay];
  s.kisiler.forEach(k=>{
    const r=data.rows[k.pid]||pzInitRow(info,DB.personeller.find(x=>x.id===k.pid));
    r.gunler=r.gunler||{};Object.assign(r.gunler,k.gunler); // yalnız PDKS raporlanan günler ezilir
    r.saat=k.saat;r.gc=k.gc; // aylık saat/giriş-çıkış
    r.eksik=k.eksik;         // EKSİK ÇIKIŞ günleri — gridde işaretlenir, saat uydurulmaz
    r.fin=r.fin||{};r.fin.fmOto=k.fmOto; // manuel fazlaMesai korunur, oto ayrı
    data.rows[k.pid]=r;
  });
  puantajAy=s.ay;window.__pzImport=null;
  saveDB();closeModal();render();
  toast(`PDKS içe aktarıldı — ${s.kisiler.length} personel · ${info.adi} ${info.y}`);
}

// ===== METROPOL DEVAM LİSTESİ İÇE AKTARMA (blok başı + sabit tutar) =====
// Kaynak: kullanıcının Metropol Excel'i (Sayfa1: Ad + aylık ödemeler). 6000/5000 = blok 3. ayı → blok başı = -2 ay.
function pzDevamListeParse(wb){
  const ws=wb.Sheets[wb.SheetNames[0]];const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
  const std=new Set([1000,1500,5000,6000]);const AY_YIL=2026;   // liste 2026 ayları
  const out=[];
  for(let i=1;i<aoa.length;i++){const row=aoa[i];if(!row||!row[1])continue;const ad=String(row[1]).trim();if(!ad)continue;
    const numAy=[];for(let M=1;M<=12;M++){const v=row[2+M];if(typeof v==='number')numAy.push({m:M,v});}
    if(!numAy.length){out.push({ad,durum:'veriYok'});continue;}
    const vals=numAy.map(x=>x.v);const nonStd=vals.filter(v=>!std.has(v));
    const alti=numAy.filter(x=>x.v>=5000).map(x=>x.m);
    // SABİT: >=2 standart-dışı (şoför) veya 4+ ay 6000/5000 (flat) → tarihli sabit tutar üret
    if(nonStd.length>=2||alti.length>=4){
      const sab=[];let prev=null;numAy.forEach(x=>{if(x.v!==prev){sab.push({ay:AY_YIL+'-'+String(x.m).padStart(2,'0'),tutar:x.v});prev=x.v;}});
      out.push({ad,durum:'sabit',sabit:sab});continue;}
    if(!alti.length){out.push({ad,durum:'okunamadi'});continue;}   // 6000 yok → türetmeye bırak
    if([...new Set(alti.map(m=>m%3))].length>1){out.push({ad,durum:'tutarsiz',aylar:alti});continue;}
    let am=alti[0]-2,ay=AY_YIL;if(am<1){am+=12;ay--;}
    out.push({ad,durum:'blok',anchor:ay+'-'+String(am).padStart(2,'0')});
  }
  // App personeli ile eşleştir (Türkçe normalize)
  const appByName=new Map();(DB.personeller||[]).filter(p=>p.durum!=='ayrildi').forEach(p=>{const k=pzTnorm(p.ad);if(!appByName.has(k))appByName.set(k,p);});
  out.forEach(o=>{const p=appByName.get(pzTnorm(o.ad));o.pid=p?p.id:null;});
  return out;
}
function pzDevamListeDosya(input){
  const file=input.files&&input.files[0];if(!file)return;
  if(typeof XLSX==='undefined'){toast('Excel kütüphanesi yüklenemedi');return;}
  toast('Devam listesi okunuyor…');
  const rd=new FileReader();
  rd.onload=e=>{try{const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
    const kisiler=pzDevamListeParse(wb);input.value='';
    if(!kisiler.length){toast('Dosyada okunabilir kayıt bulunamadı');return;}
    pzDevamListeOnizle(kisiler);
  }catch(err){input.value='';toast('Dosya okunamadı: '+err.message);console.error(err);}};
  rd.readAsArrayBuffer(file);
}
function pzDevamListeOnizle(kisiler){

const PZ_MAAS_KAT={'BEYAZ PEYNİR PAKETLEME':'Üretim','BEYAZ PEYNİR ÜRETİM':'Üretim','KAŞAR PEYNİRİ ÜRETİM':'Üretim','KAŞAR PEYNİRİ PAKETLEME':'Üretim','TEREYAĞI ÜRETİM':'Üretim','LOR ÜRETİM':'Üretim','ŞARKÜTERİ':'Üretim','KALİTE BÖLÜMÜ':'Üretim','GECE VARDİYASI':'Üretim','TOPLAYICI':'Üretim','TEMİZLİK':'Üretim','AŞÇI':'Üretim','ÇAYCI':'Üretim','KAZANCI':'Üretim','BAKIMCI':'Üretim','VETERİNER':'Üretim','İŞLETME MÜHENDİSİ':'Üretim','MUHASEBE':'İdari','AVUKAT':'İdari','GÜVENLİK':'İdari','PAZARLAMA':'Pazarlama','SEVKİYAT':'Diğer','DEPO/SEVKİYAT':'Diğer','SEVKİYAT/SÜT':'Diğer'};
const PZ_MAAS_US={'GÜNLÜK':'gunluk','AYLIK':'aylik','SAATLİK':'saatlik'};

function pzTrTitle(s){return String(s||'').toLocaleLowerCase('tr').replace(/(^|[\s\/\-])([a-zçğıöşü])/g,(m,p,c)=>p+c.toLocaleUpperCase('tr'));}
function pzMaasParse(wb){
  const ws=wb.Sheets[wb.SheetNames[0]];const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
  const upT=s=>String(s||'').toLocaleUpperCase('tr').replace(/\s+/g,' ').trim();
  const numP=v=>(typeof v==='number'&&v>0)?v:null;
  const appByName=new Map();(DB.personeller||[]).filter(p=>p.durum!=='ayrildi').forEach(p=>{const k=pzTnorm(p.ad);if(!appByName.has(k))appByName.set(k,p);});
  const out=[];
  for(let i=2;i<aoa.length;i++){const r=aoa[i];if(!r||!r[1]||!String(r[1]).trim())continue;
    const bolUp=upT(r[5]);
    const us=PZ_MAAS_US[upT(r[7])]||'', nb=PZ_MAAS_NB[upT(r[8])]||'';
    let uc=null; if(us==='gunluk')uc=numP(r[12]); else if(us==='aylik')uc=numP(r[9]);   // sadece temiz
    const cins=(upT(r[4])==='ERKEK'||upT(r[4])==='KADIN')?upT(r[4]):'';
    const sgk=(upT(r[6])==='EMEKLİ')?'Emekli':(upT(r[6])==='NORMAL'?'Normal':'');
    const o={ad:String(r[1]).trim(), iseGiris:pzCellISO(r[2])||'', kidem:pzCellISO(r[3])||'',
      cins, bolum:pzTrTitle(r[5]), bolUp, kat:PZ_MAAS_KAT[bolUp]||'Diğer', sgk, us, nb, ucret:uc,
      aile:numP(r[13]), cocuk:numP(r[14]), prim:numP(r[15]), kel:numP(r[16]), yol:numP(r[17]),
      anomali:[9,10,11,12,13,14,15].some(c=>typeof r[c]==='number'&&r[c]<0)};
    o.eksik=(o.ucret==null);
    const p=appByName.get(pzTnorm(o.ad)); o.pid=p?p.id:null;
    const eskiGir=String((p&&p.iseGiris)||'').slice(0,10);
    o.girisDiff=(p&&o.iseGiris&&eskiGir&&eskiGir!==o.iseGiris)?eskiGir:null;
    out.push(o);
  }
  return out;
}
function pzMaasDosya(input){
  const file=input.files&&input.files[0];if(!file)return;
  if(typeof XLSX==='undefined'){toast('Excel kütüphanesi yüklenemedi');return;}
  toast('Maaş listesi okunuyor…');
  const rd=new FileReader();
  rd.onload=e=>{try{const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
    const kisiler=pzMaasParse(wb);input.value='';

}

function pzMaasUygula(){

      if(o.sgk)p.sgkDurum=o.sgk;

      if(o.nb)p.netBrut=o.nb;

      if(o.kidem)p.kidemBaslangic=o.kidem;
      if(o.aile!=null)p.aileYardim=String(o.aile);         // yardımlar: sadece dolu olana yaz
      if(o.cocuk!=null)p.cocukYardim=String(o.cocuk);
      if(o.prim!=null)p.prim=String(o.prim);
      if(o.yol!=null)p.yolYardim=String(o.yol);
      if(o.kel!=null){p.ayniYardim=String(o.kel);p.ayniYardimHak=true;}
      guncel++;
    } else {
      const np={id:uid('p'),ad:o.ad,tc:'',telefon:'',durum:'aktif',belgeler:{},donemler:[],
        cinsiyet:o.cins||'',bolum:o.bolum||'',departman:o.kat||'Diğer',gorev:'',
        sgkDurum:o.sgk||'',iseGiris:o.iseGiris||'',kidemBaslangic:o.kidem||'',
        ucretTipi:o.us||'aylik',netBrut:o.nb||'brut',ucret:o.ucret!=null?String(o.ucret):'',
        aileYardim:o.aile!=null?String(o.aile):'',cocukYardim:o.cocuk!=null?String(o.cocuk):'',
        prim:o.prim!=null?String(o.prim):'',yolYardim:o.yol!=null?String(o.yol):'',

let dotEl=null;function fbDot(c,t){if(!dotEl){dotEl=document.createElement('div');dotEl.style.cssText='position:fixed;bottom:12px;left:12px;z-index:999;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:4px 10px;font:600 11px Inter,system-ui,sans-serif;color:#475569;box-shadow:0 2px 8px rgba(0,0,0,.1)';document.body.appendChild(dotEl);}dotEl.innerHTML=`<span style="width:8px;height:8px;border-radius:50%;background:${c}"></span> ${t}`;}
(async function(){

    if(snap.exists()&&snap.data().data){applyRemote(snap.data().data);lastUpdated=snap.data().updated||0;hydrated=true;if(window.__reloadIK)window.__reloadIK();fbDot('#16A34A','Senkron');}
    else{hydrated=true;await push();}
  }catch(e){console.warn('ik init',e);fbDot('#EF4444','Çevrimdışı');}
  try{onSnapshot(dref,(snap)=>{if(!snap.exists())return;const d=snap.data();if(!d||(d.updated&&d.updated===lastUpdated))return;lastUpdated=d.updated||0;hydrated=true;applyRemote(d.data);if(window.__reloadIK)window.__reloadIK();fbDot('#16A34A','Güncellendi');});}catch(e){}
})();
