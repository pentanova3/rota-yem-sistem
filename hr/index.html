function kzFiltrele(){
  let list=DB.kiyafetZimmet.slice();
  if(kzFiltre==='aktif')list=list.filter(z=>z.durum==='zimmetli');
  else if(kzFiltre==='sure')list=list.filter(zimmetSureDoldu);
  else if(kzFiltre==='iade')list=list.filter(zimmetIadeBekler);
  else if(kzFiltre==='erken')list=list.filter(z=>z.aciklama&&z.aciklama.trim());
  const q=kzQ.trim().toLocaleLowerCase('tr');
  if(q)list=list.filter(z=>{const p=kPers(z.personelId),u=kUrun(z.urunId);return ((p&&p.ad||'')+' '+(u&&u.ad||'')).toLocaleLowerCase('tr').includes(q);});
  list.sort((a,b)=>String(b.tarih).localeCompare(String(a.tarih)));
  return list;
}
function renderKzList(){
  const wrap=document.getElementById('kzWrap');if(!wrap)return;
  const list=kzFiltrele();
  const sn=document.getElementById('kzSayi');if(sn)sn.textContent=list.length+' kayıt';
  if(!DB.kiyafetUrunler.length){wrap.innerHTML='<div class="empty">Önce <b>Ürün Tanımları</b> sekmesinden ürün ekleyin.</div>';return;}
  if(!list.length){wrap.innerHTML='<div class="empty">Kayıt yok. Sağ üstten <b>+ Zimmet Ver</b> ile başlayın.</div>';return;}
  let h=`<div class="tbl-scroll"><table class="t"><thead><tr><th>Personel</th><th>Ürün</th><th>Veriliş</th><th>Verilmesi Gereken</th><th>Beden / Adet</th><th>Durum</th><th>Açıklama</th><th></th></tr></thead><tbody>`;
  list.forEach(z=>{const p=kPers(z.personelId),u=kUrun(z.urunId);const sd=zimmetSureDoldu(z);const erken=zimmetErkenMi(z);
    let durumB=z.durum==='iade'?'<span class="badge b-off">İade alındı</span>':z.durum==='yenilendi'?'<span class="badge b-off">Yenilendi</span>':(sd?'<span class="badge b-ihbar">Süresi doldu</span>':'<span class="badge b-on">Zimmetli</span>');
    if(z.durum==='zimmetli'&&zimmetIadeBekler(z))durumB+=' <span class="badge" style="background:#cffafe;color:#0e7490">çıkışta iade</span>';
    if(erken)durumB+=' <span class="badge" style="background:#fde68a;color:#92400e">Erken verildi</span>';
    // verilmesi gereken tarih + sayaç (yalnızca aktif zimmetlerde)
    let dueCell='—';
    if(z.durum==='zimmetli'){const due=zimmetDueISO(z),kalan=zimmetKalanGun(z);
      const sayac=kalan>0?`<span style="color:var(--green-700)"><b>${kalan}</b> gün kaldı</span>`:kalan===0?`<span style="color:var(--amber-700)"><b>bugün</b></span>`:`<span style="color:var(--red-700)"><b>${Math.abs(kalan)}</b> gün gecikti</span>`;
      dueCell=`${due?fmtDate(due):'—'}<div style="font-size:11px;margin-top:2px">${sayac}</div>`;}
    h+=`<tr>
      <td><b>${esc(p?p.ad:'(silinmiş)')}</b>${p&&p.durum==='ayrildi'?'<div style="font-size:11px;color:var(--red-700)">ayrıldı — iade kontrol</div>':''}</td>
      <td>${esc(u?u.ad:'(silinmiş ürün)')}${u?`<div style="font-size:11px;color:var(--slate-500)">ort. ${u.ortalamaSureGun} gün</div>`:''}</td>
      <td class="num">${fmtDate(z.tarih)}${z.durum==='zimmetli'?`<div style="font-size:11px;color:var(--slate-500)">${gunGecti(z.tarih)} gün önce</div>`:''}</td>
      <td class="num">${dueCell}</td>
      <td>${esc(z.beden||'—')}${z.adet&&z.adet!=1?` · ${esc(z.adet)} adet`:''}</td>
      <td>${durumB}</td>
      <td style="max-width:220px;font-size:12px;color:var(--slate-600)">${z.aciklama?esc(z.aciklama):'—'}</td>
      <td><div class="rowact">
        ${z.durum==='zimmetli'?`<button class="iconbtn" title="İade Al" onclick="zimmetIadeAl('${z.id}')"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3 13a9 9 0 1 0 3-7.7L3 8"/></svg></button>`:''}
        <button class="iconbtn del" title="Sil" onclick="silZimmet('${z.id}')"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>
      </div></td></tr>`;});
  h+=`</tbody></table></div>`;
  wrap.innerHTML=h;
}
function openKiyafetUrun(id){
  const u=id?kUrun(id):{ad:'',ortalamaSureGun:365,iadeMi:false};if(!u)return;editId=id||null;
  document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div class="modal-hd"><h3>${id?'Ürün Düzenle':'Yeni Ürün Tanımı'}</h3><button class="xbtn" onclick="closeModal()">×</button></div>
    <div class="modal-bd">
      <div class="fld"><label>Ürün Adı</label><input id="u_ad" value="${esc(u.ad)}" placeholder="örn. Kaban, İş Botu, Önlük"></div>
      <div class="fld-row"><div class="fld"><label>Ortalama Kullanım Süresi (gün)</label><input id="u_sure" type="number" min="1" value="${esc(u.ortalamaSureGun||365)}"></div>
      <div class="fld"><label>Çıkışta İade Gerekli mi?</label><select id="u_iade"><option value="0" ${!u.iadeMi?'selected':''}>Hayır</option><option value="1" ${u.iadeMi?'selected':''}>Evet (kaban, mont vb.)</option></select></div></div>
      <div class="helptext">Süre, aynı ürünün erken (süresinden önce) tekrar verilip verilmediğini belirler. İade gerekli ürünler işten çıkışta geri alınmalıdır.</div>
    </div>
    <div class="modal-ft"><button class="btn" onclick="closeModal()">Vazgeç</button><button class="btn btn-pri" onclick="saveKiyafetUrun()">Kaydet</button></div>
  </div></div>`;
  setTimeout(()=>document.getElementById('u_ad').focus(),30);
}
function saveKiyafetUrun(){
  const ad=document.getElementById('u_ad').value.trim();if(!ad){toast('Ürün adı gerekli');return;}
  const o={ad,ortalamaSureGun:Math.max(1,parseInt(document.getElementById('u_sure').value)||365),iadeMi:document.getElementById('u_iade').value==='1'};
  if(editId)Object.assign(kUrun(editId),o);else DB.kiyafetUrunler.push({id:uid('ku'),...o});
  saveDB();closeModal();render();toast(editId?'Ürün güncellendi':'Ürün eklendi');
}
function silKiyafetUrun(id){const u=kUrun(id);if(!u)return;if(!confirm('"'+u.ad+'" ürün tanımı silinsin mi? (Mevcut zimmet kayıtları kalır)'))return;DB.kiyafetUrunler=DB.kiyafetUrunler.filter(x=>x.id!==id);saveDB();render();toast('Silindi');}
// ---- Kıyafet stok girişi ----
function openStokGiris(urunId){
  if(!DB.kiyafetUrunler.length){toast('Önce ürün tanımı ekleyin');kiyafetTab='urun';render();return;}
  const basVar=urunId&&(DB.kiyafetStok||[]).some(s=>s.urunId===urunId&&s.tip==='baslangic');
  const varTip=basVar?'giris':(urunId?'baslangic':'giris');
  const pOpts=DB.kiyafetUrunler.map(u=>`<option value="${u.id}" ${urunId===u.id?'selected':''}>${esc(u.ad)}</option>`).join('');
  const tipOpts=[['baslangic','Başlangıç Stoğu'],['giris','Stok Girişi (ürün geldi)'],['cikis','Stok Çıkışı (fire/düzeltme)']].map(([k,l])=>`<option value="${k}" ${varTip===k?'selected':''}>${l}</option>`).join('');
  document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div class="modal-hd"><h3>Stok Girişi</h3><button class="xbtn" onclick="closeModal()">×</button></div>
    <div class="modal-bd">

// Erken veriliş kontrolü + uyarı
function zimmetVerHesap(){
  const pid=document.getElementById('z_pers').value, uid_=document.getElementById('z_urun').value, tarih=document.getElementById('z_tarih').value;
  const box=document.getElementById('z_uyari'), aclbl=document.getElementById('z_aclbl');
  if(!box)return; box.innerHTML='';if(aclbl)aclbl.textContent='';
  if(!pid||!uid_||!tarih)return null;
  const u=kUrun(uid_); const onceki=sonZimmet(pid,uid_,editId);
  if(onceki){
    const gun=Math.max(0,Math.round((parseISO(tarih)-parseISO(onceki.tarih))/864e5));
    if(gun<u.ortalamaSureGun){
      box.innerHTML=`<div style="background:var(--amber-50);border:1px solid #f3e2bd;border-radius:9px;padding:10px 12px;font-size:12.5px;color:var(--amber-700);margin-bottom:6px"><b>Erken veriliş.</b> Bu ürün ${fmtDate(onceki.tarih)} tarihinde verilmiş; üzerinden <b>${gun} gün</b> geçmiş. Ortalama kullanım süresi <b>${u.ortalamaSureGun} gün</b>. Lütfen aşağıya gerekçe yazın.</div>`;
      if(aclbl)aclbl.textContent='(erken veriliş — zorunlu)';
      return {erken:true,onceki};
    }
  }
  return {erken:false,onceki};
}
function saveZimmetVer(){
  const pid=document.getElementById('z_pers').value, uid_=document.getElementById('z_urun').value, tarih=document.getElementById('z_tarih').value;
  if(!pid){toast('Personel seçin');return;} if(!uid_){toast('Ürün seçin');return;} if(!tarih){toast('Veriliş tarihi girin');return;}
  const aciklama=document.getElementById('z_aciklama').value.trim();
  const durum=zimmetVerHesap();
  if(durum&&durum.erken&&!aciklama){toast('Erken veriliş için açıklama zorunlu');document.getElementById('z_aciklama').focus();return;}
  const o={personelId:pid,urunId:uid_,tarih,beden:document.getElementById('z_beden').value.trim(),adet:Math.max(1,parseInt(document.getElementById('z_adet').value)||1),aciklama};
  if(editId){Object.assign(DB.kiyafetZimmet.find(x=>x.id===editId),o);}
  else{
    // aynı üründen aktif zimmet varsa onu 'yenilendi' yap
    if(durum&&durum.onceki)durum.onceki.durum='yenilendi';
    DB.kiyafetZimmet.push({id:uid('z'),durum:'zimmetli',...o});
  }
  saveDB();closeModal();render();toast(editId?'Zimmet güncellendi':'Zimmet verildi');
}

// Ücret alanının etiketini seçilen tip + net/brüt kombinasyonuna göre günceller (ör. "Günlük Brüt Ücret (TL)")
function ucretEtiketGuncelle(){
  const t=document.getElementById('p_ucretTipi'),n=document.getElementById('p_netBrut'),l=document.getElementById('p_ucretLbl');
  if(!t||!n||!l)return;
  const tip={aylik:'Aylık',gunluk:'Günlük',saatlik:'Saatlik'}[t.value]||'Aylık';
  const nb=n.value==='net'?'Net':'Brüt';
  l.textContent=`${tip} ${nb} Ücret (TL)`;
}
// ---- Önceki çalışma dönemleri (fasıla) editörü ----
function donemRender(){
  const box=document.getElementById('donemList');if(!box)return;
  box.innerHTML=donemEdit.length?donemEdit.map((d,i)=>d.kilit
    ?`<div style="display:grid;grid-template-columns:150px 150px 1fr 34px;gap:8px;margin-bottom:8px;align-items:end;background:var(--slate-50);border:1px solid var(--slate-200);border-radius:8px;padding:6px 8px">
      <div class="fld" style="margin:0"><label>Giriş</label><input type="date" value="${esc(d.giris)}" disabled style="background:var(--slate-100)"></div>
      <div class="fld" style="margin:0"><label>Çıkış</label><input type="date" value="${esc(d.cikis)}" disabled style="background:var(--slate-100)"></div>
      <div class="fld" style="margin:0"><label>SGK Çıkış Kodu</label><input value="${esc(d.cikisKodu?d.cikisKodu+' — '+((sgkKod(d.cikisKodu)||{}).l||''):'—')}" disabled style="background:var(--slate-100)"></div>
      <span title="Çıkış kaydından otomatik oluştu — buradan silinemez/düzenlenemez" style="font-size:15px;margin-bottom:8px"></span>
    </div>`
    :`<div style="display:grid;grid-template-columns:150px 150px 1fr 34px;gap:8px;margin-bottom:8px;align-items:end">
    <div class="fld" style="margin:0"><label>Giriş</label><input type="date" value="${esc(d.giris)}" onchange="donemSet(${i},'giris',this.value)"></div>
    <div class="fld" style="margin:0"><label>Çıkış</label><input type="date" value="${esc(d.cikis)}" onchange="donemSet(${i},'cikis',this.value)"></div>
    <div class="fld" style="margin:0"><label>SGK Çıkış Kodu</label><select onchange="donemSet(${i},'cikisKodu',this.value)">${sgkKodOpts(d.cikisKodu)}</select></div>
    <button class="iconbtn del" type="button" title="Dönemi sil" onclick="donemSil(${i})" style="margin-bottom:2px"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>
  </div>`).join(''):'<div style="font-size:12px;color:var(--slate-400);margin-bottom:8px">Önceki dönem kaydı yok — tek girişli personelde bu bölüm boş kalır.</div>';
  donemOzetGuncelle();
}
function donemEkle(){donemEdit.push({giris:'',cikis:'',cikisKodu:''});donemRender();}
function donemSil(i){if(donemEdit[i]&&donemEdit[i].kilit){toast('Bu dönem çıkış kaydından otomatik oluştu — silinemez');return;}donemEdit.splice(i,1);donemRender();}
function donemSet(i,alan,val){if(!donemEdit[i]||donemEdit[i].kilit)return;donemEdit[i][alan]=val;donemOzetGuncelle();}
// Modal içi geçici personel objesi (henüz kaydedilmemiş değerlerle hesap için)
function donemTempP(){
  const g=id=>{const e=document.getElementById(id);return e?e.value:'';};
  return {id:editId||'',iseGiris:g('p_giris'),kidemBaslangic:modalKidemLegacy,izinBasManuel:g('p_izinBasManuel'),kidemBasManuel:g('p_kidemBasManuel'),dogum:g('p_dogum'),donemler:donemEdit};
}
function donemOzetGuncelle(){
  const kb=document.getElementById('p_kidemBasGoster');if(!kb)return;
  const tp=donemTempP();
  const kEff=kidemBaslangicISO(tp),iEff=izinBaslangicISO(tp);
  kb.value=kEff?fmtDate(kEff):'—';
  const ib=document.getElementById('p_izinBasGoster');if(ib)ib.value=iEff?fmtDate(iEff):'—';
  const oz=document.getElementById('donemOzet');if(!oz)return;
  const dn=gecerliDonemler(tp);const ks=kidemSureBilgi(tp);
  let t='';
  if(dn.length){
    t+='Önceki dönem toplamı: <b>'+sureMetni(dn.reduce((s,d)=>s+donemGun(d),0))+'</b>. ';
    t+=ks.manuel?'':(ks.oncekiGun?'Kıdemde sayılan önceki süre: <b style="color:var(--blue-700)">'+sureMetni(ks.oncekiGun)+'</b>. ':'Kıdemde sayılan önceki süre: <b>yok</b> (1 yıldan kısa + kıdem hakkı doğuran kod şartı). ');
  }
  if(ks.kesinti)t+='Kesinti (ücretsiz/devamsızlık): <b style="color:var(--amber-700)">'+ks.kesinti+' gün</b> — başlangıçları ileri kaydırır. ';
  const yd=kEff?sonrakiHakEdis(kEff,null):null;
  t+='Kıdem hakedişi: <b>'+(kEff?fmtDate(kEff):'—')+'</b>'+(tp.kidemBasManuel?' <span style="color:var(--amber-700)">(manuel)</span>':'')+(yd?' · sonraki kıdem yıldönümü: <b>'+fmtDate(yd.tarih)+'</b>':'')+'. ';
  t+='Yıllık izin hakedişi: <b>'+(iEff?fmtDate(iEff):'—')+'</b>'+(tp.izinBasManuel?' <span style="color:var(--amber-700)">(manuel)</span>':'')+'.';
  oz.innerHTML=t;
}
// ✎/✕ — hakediş başlangıcını manuel tarihe çevir / otomatiğe döndür (uzun süreli rapor düzeltmesi)
function hakedisManuel(tip){
  const inp=document.getElementById(tip==='kidem'?'p_kidemBasManuel':'p_izinBasManuel');
  const gos=document.getElementById(tip==='kidem'?'p_kidemBasGoster':'p_izinBasGoster');
  const btn=document.getElementById(tip==='kidem'?'p_kidemBasBtn':'p_izinBasBtn');
  if(!inp||!gos||!btn)return;
  const manuelAcik=inp.style.display!=='none';
  if(manuelAcik){ inp.value='';inp.style.display='none';gos.style.display='';btn.textContent='✎';btn.title='Uzun süreli raporlarda hesaplanarak manuel tarih girilir'; }
  else{ const tp=donemTempP();tp.kidemBasManuel='';tp.izinBasManuel='';
    if(!inp.value)inp.value=(tip==='kidem'?kidemBaslangicBaz(tp):izinBaslangicBaz(tp))||'';
    inp.style.display='';gos.style.display='none';btn.textContent='✕';btn.title='Otomatik hesaba dön'; }
  donemOzetGuncelle();
}
// Ayrılış bölümünde seçilen SGK koduna göre kıdem/ihbar hakkı bilgisi
function cikisKodBilgi(){
  const sel=document.getElementById('p_cikisKodu');const info=document.getElementById('cikisKodInfo');if(!sel||!info)return;
  const kod=sgkKod(sel.value);
  info.innerHTML=kod?(kod.kidem?'<span style="color:var(--green-700)">✓ Bu kod kıdem tazminatı hakkı doğurur'+(kod.ihbar?' (+ ihbar)':'')+'. 1 yıldan kısa çalışmada, tekrar işe girişte önceki süre kıdemde birleşir.</span>':'<span style="color:var(--red-700)">✗ Bu kod kıdem tazminatı hakkı doğurmaz — dönem tekrar girişte kıdemde sayılmaz.</span>'):'';
}
// İhbar süreci bölümünü göster/hesapla (durum=ihbar olduğunda)
function ihbarHesaplaGoster(){
  const durEl=document.getElementById('p_durum');if(!durEl)return;
  const ihbar=durEl.value==='ihbar';
  const box=document.getElementById('ihbarBolum');if(box)box.classList.toggle('hidden',!ihbar);
  const ab=document.getElementById('ayrilisBolum');if(ab)ab.classList.toggle('hidden',durEl.value!=='ayrildi');
  if(!ihbar)return;
  const giris=document.getElementById('p_giris').value, bas=document.getElementById('p_ihbarBaslangic').value;
  const toplu=document.getElementById('p_ihbarToplu').checked;
  document.getElementById('ihbarTopluBolum').classList.toggle('hidden',!toplu);
  const set=(id,val)=>{const e=document.getElementById(id);if(e)e.value=val;};
  if(!giris||!bas){set('p_ihbarSure','');set('p_ihbarBitis','');set('p_ihbarTopluSure','');set('p_ihbarSonCalisma','');return;}
  const h=ihbarHesapla(giris,bas,editId?kesintiGunAralik(editId,giris,bas):0,haftaTatiliGunleri({haftaTatili:p_haftaTatiliDeger()}));
  set('p_ihbarSure',h.ihbarGun+' gün ('+h.hafta+' hafta)');
  set('p_ihbarBitis',fmtDate(h.bitis));

  for(const d of o.donemler){

    Object.assign(ex,o);

}

// Firma sabit bilgileri (sözleşme antetinde kullanılır)
const FIRMA={
  FIRMA_TICARI_UNVAN:'Rota SMI Tarım',
  FIRMA_KISA_AD:'Rota SMI',
  FIRMA_ADRES:'',
  FIRMA_ILCE:'',
  FIRMA_SEHIR:'Balıkesir',

};
// Oryantasyon sorumlusu yardımcıları: ada göre personel kaydı bul, pozisyonu görev + meslek koduyla üret
function oryKisi(ad){const n=String(ad||'').toLocaleUpperCase('tr').replace(/\s+/g,' ').trim();if(!n)return null;return DB.personeller.find(x=>String(x.ad||'').toLocaleUpperCase('tr').replace(/\s+/g,' ').trim()===n)||null;}
function oryPoz(ad){const k=oryKisi(ad);if(!k)return '';const g=String(k.gorev||k.bolum||'').toLocaleUpperCase('tr');return g+(k.meslekKodu?' — Meslek Kodu: '+k.meslekKodu:'');}
function mergeVal(p,k,extra){if(extra&&extra[k]!=null&&extra[k]!=='')return extra[k];
  if(FIRMA[k]!=null)return FIRMA[k];
  // Oryantasyon formu sorumluları: personelde seçilen ad; boşsa varsayılanlar (işbaşı → departman sorumlusu)
  if(k.indexOf('ORY_')===0){
    const genel=p.oryGenel||'SEMA ÇAPKIN', teknik=p.oryTeknik||'ÇİĞDEM ALTINÖZ YILMAZ', isbasi=p.departmanSorumlusu||p.oryIsbasi||'';
    const o={ORY_GENEL_AD:genel,ORY_GENEL_POZ:oryPoz(genel),ORY_TEKNIK_AD:teknik,ORY_TEKNIK_POZ:oryPoz(teknik),ORY_ISBASI_AD:isbasi,ORY_ISBASI_POZ:oryPoz(isbasi)};
    if(o[k]!=null)return o[k];
  }
  const m={
    // panelin klasik küçük harfli alanları
    ad_soyad:p.ad,tc:p.tc,departman:p.departman,gorev:p.gorev,ise_giris:fmtDate(p.iseGiris),telefon:p.telefon,adres:p.adres,dogum:fmtDate(p.dogum),ucret:p.ucret,iban:p.iban,bugun:fmtDate(todayISO()),
    // matbu sözleşmelerdeki {{PERSONEL_*}} alanları
    PERSONEL_AD_SOYAD:p.ad,PERSONEL_TC:p.tc,PERSONEL_DOGUM_YERI:p.dogumYeri,PERSONEL_DOGUM:fmtDate(p.dogum),PERSONEL_DOGUM_TARIHI:fmtDate(p.dogum),PERSONEL_ADRES:p.adres,PERSONEL_TEL:p.telefon,PERSONEL_ISE_GIRIS:fmtDate(p.iseGiris),PERSONEL_GUNLUK_UCRET:p.ucret,PERSONEL_UCRET_TUTAR:ucretTutarMetin(p),PERSONEL_UCRET_TIPI:ucretTipiEtiket(p),PERSONEL_UCRET_TIPI_BUYUK:ucretTipiEtiket(p).toLocaleUpperCase('tr-TR'),PERSONEL_POZISYON:p.gorev||p.bolum,PERSONEL_GOREV:p.gorev,PERSONEL_BOLUM:p.bolum,PERSONEL_MESLEK_KODU:p.meslekKodu,PERSONEL_DEPARTMAN_SORUMLUSU:p.departmanSorumlusu,PERSONEL_DOLAP:p.dolapNo,PERSONEL_KART_NO:p.kartNo,PERSONEL_KART_ID:p.kartId
  };return m[k]!=null?m[k]:'';}
function fillTemplate(icerik,p,extra){return String(icerik||'').replace(/\{\{(\w+)\}\}/g,(m,k)=>esc(mergeVal(p,k,extra)||'__________'));}

// Sözleşme gövdesini HTML'e çevir: "Etiket : Değer" blokları tabloya, gerisi <pre> olarak.
// Not: metin fillTemplate'ten geçtiği için değerler zaten kaçışlı; tekrar esc UYGULANMAZ.
function sozGovde(text){
  const ham=String(text).split('\n');
  // Ön-birleştirme: docx tablolarından gelen "Etiket / : / Değer" (2-3 satır) → "Etiket : Değer"
  const lines=[];let ppTbl=false;
  for(let i=0;i<ham.length;i++){
    const cur=ham[i], prev=lines.length?lines[lines.length-1]:null;
    if(cur.trim()==='@@TBL@@')ppTbl=true; else if(cur.trim()==='@@/TBL@@')ppTbl=false;
    const etiketMi=s=>s!=null&&s.trim()&&s.indexOf(':')<0&&s.trim().length<=42;
    if(!ppTbl&&/^\s*:\s*\S/.test(cur)&&etiketMi(prev)){            // "Etiket" + sonraki "​: Değer"
      lines[lines.length-1]=prev.trim()+' '+cur.trim();
    } else if(!ppTbl&&/^\s*:\s*$/.test(cur)&&etiketMi(prev)&&ham[i+1]!=null&&ham[i+1].trim()){ // "Etiket"/":"/"Değer"
      lines[lines.length-1]=prev.trim()+' : '+ham[i+1].trim(); i++;
    } else lines.push(cur);
  }
  let html='',preBuf=[],kvBuf=[],sigBuf=[],tblBuf=[],inTbl=false;
  const sonColon=l=>/:\s*$/.test(l);
  // Etiket : Değer satırı. Şablonlardaki gerçek etiketlerin en uzunu 42 karakter; 45+ karakterlik "etiket"
  // aslında içinde ':' geçen madde cümlesidir (örn. "24.6-İşçi, ... (RG : ...)") → kv değil, paragraf akar.
  // Aksi halde td.k'nin nowrap'i sayfayı yatay taşırıp tüm belgeyi bozuyordu.
  const kvMatch=l=>{ if(sonColon(l))return null; const m=l.match(/^\s*(.+?)\s*:\s+(\S.*?)\s*$/); if(!m)return null; const k=m[1].trim(); if(k.length>45)return null; return {t:'kv',k,v:m[2].trim()}; };
  // 2 sütunlu (imza vb.) satır: kv değil, çift+ boşluk/sekme/nbsp ile ayrılmış tam 2 parça
  const col2Match=l=>{ const p=l.split(/[\s ]{2,}/).map(x=>x.trim()).filter(Boolean); return p.length===2?{l:p[0],r:p[1]}:null; };
  const isSub=l=>{const t=l.trim();return t&&t.length<=26&&t.indexOf(':')<0&&/[A-ZÇĞİÖŞÜ]/.test(t)&&t===t.toLocaleUpperCase('tr');};
  // Boş satırları at, her paragrafı küçük aralıklı blok yap; MADDE başlıklarına ufak üst boşluk.
  // Tamamı BÜYÜK HARF kısa satırlar (AYDINLATMA BEYANI, İŞÇİNİN, 1. ÇOCUK İŞÇİLİĞİ...) ara başlıktır:
  // koyu + üstünde boşluk + sayfa sonunda yalnız kalmaz.
  // parantez içleri caps kontrolünde yok sayılır: "VIII. İLGİLİ KİŞİNİN HAKLARI (KVKK m.11)" da başlıktır
  const capsBaslik=t=>{const c=t.replace(/\([^)]*\)/g,'').trim();return c.length>0&&c.length<=60&&t.indexOf(':')<0&&/[A-ZÇĞİÖŞÜ]{2}/.test(c)&&c===c.toLocaleUpperCase('tr');};
  const flushPre=()=>{if(preBuf.length){html+=preBuf.map(l=>{const t=l.trim();if(!t)return '';const md=/^MADDE\b/i.test(t)||/^\d+\s*[-—)]\s*[A-ZÇĞİÖŞÜ]/.test(t)&&t.length<40;const ab=!md&&capsBaslik(t);return `<div class="par${md?' madde':''}${ab?' altbaslik':''}">${t}</div>`;}).join('');preBuf=[];}};
  const flushKV=()=>{
    if(!kvBuf.length)return;
    if(kvBuf.filter(x=>x.t==='kv').length>=2){
      flushPre();
      html+='<table class="kv'+(kvBuf.length<=6?' kisa':'')+'">'+kvBuf.map(x=>x.t==='kv'
        ?`<tr><td class="k">${x.k}</td><td class="s">:</td><td class="v">${x.v}</td></tr>`
        :`<tr><td class="sub" colspan="3">${x.text}</td></tr>`).join('')+'</table>';
    } else { preBuf.push(...kvBuf.map(x=>x.t==='kv'?(x.k+' : '+x.v):x.text)); }
    kvBuf=[];
  };
  const flushSig=()=>{
    if(!sigBuf.length)return;
    if(sigBuf.length>=2&&sigBuf.some(r=>r.l.length<=30&&r.r.length<=30)){
      flushPre();
      // İmza/taraf bloğu mu, yoksa etiket-değer bilgi bloğu mu?
      const imza=sigBuf.some(r=>/(İmza|İŞÇİ|İŞVEREN|İşçi|İşveren)/.test(r.l+' '+r.r));
      if(imza){
        html+='<table class="sig"><tbody>'+sigBuf.map((r,i)=>`<tr${i===0?' class="rol"':''}><td>${r.l}</td><td>${r.r}</td></tr>`).join('')+'</tbody></table>';
      } else {
        html+='<table class="kv">'+sigBuf.map(r=>`<tr><td class="k">${r.l}</td><td class="v">${r.r}</td></tr>`).join('')+'</table>';
      }
    } else { preBuf.push(...sigBuf.map(r=>r.l+'  '+r.r)); }
    sigBuf=[];
  };
  // ızgara (bordered) tablo: docx tablolarından gelen @@TBL@@ blokları
  const flushTbl=()=>{
    if(!tblBuf.length){return;}
    flushPre();
    // ':' ile biten/başlayan hücre = etiket-değer tipi tablo → başlık satırı boyanmaz.
    const etiketTipi=tblBuf.some(r=>r.some(c=>{const t=String(c||'').trim();return t.endsWith(':')||t.startsWith(':');}));
    // Hücre başı/sonundaki ':' silinir (tabloda gereksiz); sonra TAMAMEN boşalan sütunlar atılır
    // (eski "Etiket | : | Değer" yapısındaki ':' sütunu boş hücre olarak kalmasın).
    const temizle=c=>String(c==null?'':c).trim().replace(/\s*:\s*$/,'').replace(/^:\s*/,'');
    let maxc=Math.max(...tblBuf.map(r=>r.length));
    let rows=tblBuf.map(r=>{const c=r.map(temizle);while(c.length<maxc)c.push('');return c;});
    if(maxc>1){
      const dolu=[];for(let ci=0;ci<maxc;ci++)if(rows.some(r=>r[ci]!==''))dolu.push(ci);
      if(dolu.length&&dolu.length<maxc){rows=rows.map(r=>dolu.map(ci=>r[ci]));maxc=dolu.length;}
    }
    // 2 sütunlular etiket-değer varsayılır; başlık yalnız ≥3 satır ve ≥3 sütunlu gerçek tablolarda
    const baslikVar=!etiketTipi&&rows.length>=3&&maxc>=3;
    // İlk satırda yalnız ilk hücre doluysa: birleşik (colspan) ortalı tablo başlığı (örn. UBGT tablosu)
    const spanBaslik=maxc>1&&rows.length>1&&rows[0][0]!==''&&rows[0].slice(1).every(c=>c==='');
    // '☐' onay kutusu içeren sütunlar dar ve ortalı (oryantasyon Yeterli/Yeterli Değil vb.)
    const cbKolon=new Set();rows.forEach(r=>r.forEach((c,ci)=>{if(c==='☐')cbKolon.add(ci);}));
    html+=`<table class="grid${maxc===2?' g2':''}">`+rows.map((r,ri)=>{
      if(ri===0&&spanBaslik)return `<tr class="hd"><td colspan="${maxc}">${r[0]}</td></tr>`;
      return `<tr${baslikVar&&ri===0?' class="hd"':''}>`+r.map((c,ci)=>`<td${cbKolon.has(ci)?' class="cb"':''}>${c||'&nbsp;'}</td>`).join('')+'</tr>';
    }).join('')+'</table>';
    tblBuf=[];
  };
  lines.forEach(l=>{
    if(l.trim()==='@@SAYFA@@'){ flushKV(); flushSig(); flushPre(); html+='<div class="pb"></div>'; return; } // zorunlu sayfa geçişi
    if(l.trim()==='@@TBL@@'){ flushKV(); flushSig(); flushPre(); inTbl=true; tblBuf=[]; return; }
    if(l.trim()==='@@/TBL@@'){ inTbl=false; flushTbl(); return; }
    if(inTbl){ tblBuf.push(l.split('\t')); return; }
    const kv=kvMatch(l);
    if(kv){ flushSig();
      if(!kvBuf.length&&preBuf.length&&isSub(preBuf[preBuf.length-1])) kvBuf.push({t:'sub',text:preBuf.pop().trim()});
      kvBuf.push(kv); return; }
    const c2=col2Match(l);
    if(c2){ flushKV(); sigBuf.push(c2); return; }
    if(kvBuf.length&&isSub(l)){ kvBuf.push({t:'sub',text:l.trim()}); return; }
    flushKV(); flushSig(); preBuf.push(l);
  });
  flushKV(); flushSig(); flushTbl(); flushPre();
  return html;
}
function printFilled(pairs){
  // Antetli kağıt düzeni:
  //  • Üst bant: thead içinde → her sayfanın tepesinde tekrarlar (tam genişlik).
  //  • Alt bant: tfoot'ta GÖRÜNMEZ eş-boyut yer tutucu (içerik alta taşmasın diye her sayfada yer ayırır)
  //    + body sonunda position:fixed gerçek görsel → her sayfanın FİZİKSEL dibine oturur (yarım sayfada bile).
  //  • Yan marjlar @page yerine içerik hücresinde: bantlar kenardan kenara, metin 14mm içeride.
  const hdr=window.ANTET_HEADER||'', ftr=window.ANTET_FOOTER||'';
  const headCell=hdr?`<thead><tr><td><img class="antet-h" src="${hdr}"></td></tr></thead>`:'';
  const footCell=ftr?`<tfoot><tr><td><img class="antet-f-yer" src="${ftr}"></td></tr></tfoot>`:'';
  const sheets=pairs.filter(x=>x.p&&x.s).map(({p,s,extra},i)=>{
    let dolu=fillTemplate(s.icerik,p,extra);
    // @@COMPACT@@ işaretli şablonlar sıkışık dizgiyle basılır (tek sayfaya sığdırma — zimmet tutanağı vb.)
    const compact=/^@@COMPACT@@$/m.test(dolu);
    if(compact)dolu=dolu.replace(/^@@COMPACT@@\n?/m,'');
    let lines=dolu.split('\n');
    const bos=()=>{while(lines.length&&!lines[0].trim())lines.shift();};
    bos();
    // antet bandında firma adı zaten var; baştaki firma-adı satır(lar)ını at
    // (ROTA SMI ... ŞTİ. ile biten satır firma adıdır; "...İŞ SÖZLEŞMESİ" gibi başlıklar korunur)
    const sirketAdiMi=str=>{const u=String(str).toLocaleUpperCase('tr').trim();return u.indexOf('ROTA SMI')>=0&&/ŞT[İI]\.?$/.test(u);};
    while(lines.length&&(lines[0].trim()===String(FIRMA.FIRMA_TICARI_UNVAN).trim()||sirketAdiMi(lines[0]))){lines.shift();bos();}
    const baslik=(lines.shift()||'').trim();
    const govde=lines.join('\n').replace(/^\n+/,'');
    return `<table class="sheet${compact?' compact':''}"${i?' style="page-break-before:always"':''}>${headCell}${footCell}<tbody><tr><td class="icerik">${baslik?`<div class="sozbaslik">${baslik}</div>`:''}${sozGovde(govde)}</td></tr></tbody></table>`;
  }).join('');
  const w=window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><title>Belge</title><style>
    @page{size:A4;margin:0}
    *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    html,body{margin:0;padding:0}
    body{font-family:Calibri,Carlito,'Segoe UI',Candara,sans-serif;color:#111;font-size:11pt;line-height:1.45;background:#fff}
    img{max-width:100%}
    table.sheet{width:100%;border-collapse:collapse}
    table.sheet>thead td,table.sheet>tfoot td{padding:0}
    td.icerik{padding:1mm 14mm 2mm;vertical-align:top}
    .antet-h{display:block;width:100%;margin:0 0 4mm}
    /* tfoot yer tutucusu: ekranda önizleme olarak görünür; baskıda gizlenir (yer ayırmaya devam eder) */
    .antet-f-yer{display:block;width:100%;margin:5mm 0 0}
    .antet-alt{display:none}
    @media print{
      .noprint{display:none}
      .antet-f-yer{visibility:hidden}
      .antet-alt{display:block;position:fixed;bottom:0;left:0;width:100%;margin:0}
    }
    .sozbaslik{text-align:center;font-weight:700;font-size:15pt;letter-spacing:.01em;margin:2mm 0 5mm;color:#111}
    pre{white-space:pre-wrap;font-family:inherit;font-size:11pt;margin:0;padding:0 1mm}
    .par{font-size:11pt;line-height:1.4;margin:0 0 2px;padding:0 1mm;text-align:justify}
    .par.madde{margin-top:6px;page-break-after:avoid;break-after:avoid-page}
    .par.altbaslik{font-weight:700;margin-top:10px;page-break-after:avoid;break-after:avoid-page}
    table.kv{border-collapse:collapse;width:100%;margin:1mm 0 2mm}
    table.kv td{padding:1.5px 0;vertical-align:top;font-size:11pt;line-height:1.4}
    table.kv td.k{white-space:nowrap;width:1%;padding-right:2mm}
    table.kv td.s{width:5mm;padding-right:2mm}
    table.kv td.v{width:100%;overflow-wrap:break-word}
    table.kv td.sub{font-weight:700;padding-top:3px}
    table.kv tr{page-break-inside:avoid}
    table.kv.kisa{page-break-inside:avoid} /* kısa bilgi/imza blokları sayfa geçişinde bölünmez */
    table.sig{width:100%;border-collapse:collapse;margin-top:12mm;page-break-inside:avoid}
    table.sig td{width:50%;vertical-align:top;font-size:11pt;line-height:1.5;padding:0 4mm 0 0}
    table.sig tr.rol td{font-weight:700;padding-bottom:12mm}
    /* ızgara tablolar: tutarlı ince çerçeve, başlık satırı, satırlar sayfa sonunda bölünmez, asla yatay taşmaz */
    table.grid{border-collapse:collapse;width:100%;margin:2mm 0 3mm;font-size:10pt;table-layout:auto}
    table.grid td{border:1px solid #555;padding:4px 7px;vertical-align:top;line-height:1.35;overflow-wrap:break-word}
    table.grid tr{page-break-inside:avoid}
    table.grid tr.hd td{background:#f2f2f2;font-weight:700;text-align:center;vertical-align:middle}
    table.grid.g2 td:first-child{width:40%} /* 2 sütunlu etiket-değer tablolarında dengeli genişlik */
    table.grid td.cb{width:26mm;text-align:center;vertical-align:middle;font-size:12pt} /* ☐ onay sütunları eşit ve ortalı */
    .pb{page-break-before:always;break-before:page;height:0} /* @@SAYFA@@ — zorunlu sayfa geçişi */
    /* @@COMPACT@@ — tek sayfaya sığdırma dizgisi */
    .sheet.compact .sozbaslik{font-size:13pt;margin:1mm 0 3mm}
    .sheet.compact .par{font-size:10pt;line-height:1.3;margin-bottom:1px}
    .sheet.compact .par.altbaslik{margin-top:6px}
    .sheet.compact table.kv td{font-size:10pt;padding:1px 0}
    .sheet.compact table.grid{margin:1.5mm 0 2mm}
    .sheet.compact table.grid td{font-size:9.5pt;padding:3px 6px}
    .sheet.compact table.sig{margin-top:8mm}
    .sheet.compact table.sig tr.rol td{padding-bottom:9mm}
    .sheet.compact .antet-h{margin-bottom:2.5mm}
    .noprint{position:fixed;top:10px;right:10px;z-index:9}.noprint button{padding:8px 16px;font:600 13px sans-serif;background:#1E3E90;color:#fff;border:none;border-radius:7px;cursor:pointer}
  </style></head><body><div class="noprint"><button onclick="window.print()">Yazdır / PDF</button></div>${sheets}${ftr?`<img class="antet-alt" src="${ftr}">`:''}<scr`+`ipt>window.onload=function(){setTimeout(function(){window.print()},400)}</scr`+`ipt></body></html>`);
  w.document.close();
}

function cikisAdimlari(kodStr){

  const iscide=['02','03'].includes(kod.k), isverenFesih=['04','15','17','18','31','32','34'].includes(kod.k);

// Koda göre önerilen çıkış evrakları (şablon id'leri)
function cikisEvrakOner(kodStr){
  const kod=sgkKod(kodStr);if(!kod)return [];
  const k=kod.k;const m25=+k>=42&&+k<=50&&k!=='48';
  if(k==='03'||k==='02')return ['cx_istifa','cx_calisma_belgesi','cx_iade_tutanak','cx_ibraname'];
  if(k==='48')return ['cx_devamsizlik_tutanak','cx_ise_davet','cx_savunma','cx_fesih_hakli','cx_calisma_belgesi','cx_iade_tutanak'];
  if(m25)return ['cx_savunma','cx_fesih_hakli','cx_calisma_belgesi','cx_iade_tutanak'];
  if(k==='22')return ['cx_ikale','cx_calisma_belgesi','cx_iade_tutanak','cx_ibraname'];
  if(['04','15','17','18','31','32','34'].includes(k))return ['cx_fesih_onelli','cx_calisma_belgesi','cx_iade_tutanak','cx_ibraname'];
  return ['cx_calisma_belgesi','cx_iade_tutanak','cx_ibraname'];
}
// Anlık hakediş özeti: kod + tarih değişince yeniden hesaplanır
function cikisHakOzet(p,kodStr,tarihISO){
  const kod=sgkKod(kodStr);const ref=tarihISO||todayISO();
  const x=tazminatHesap(p,ref);
  const kalan=izinStat(p,+String(ref).slice(0,4)).kalan;
  const izinUcret=kalan>0?(x.brut/30)*kalan:0;
  const avans=DB.avanslar.filter(a=>a.personelId===p.id).reduce((s,a)=>s+avansKalan(a),0);
  const trafik=DB.trafikCezalari.filter(t=>t.personelId===p.id).reduce((s,t)=>s+trafikTahsilKalan(t),0);
  return {kod,x,kalan,izinUcret,avans,trafik};
}
// Efektif tazminat/izin: bordro programının KESİN tutarı elle girildiyse (c.elleKidem/elleIhbar/elleIzin) onu,
// yoksa hesaplananı döndürür. Kümülatif vergi matrahı yüzünden bordro tutarı hesaplanandan farklı olabilir.
function cikisEfektif(c,o){
  const hesK=(o.kod.kidem&&o.x.kidemHak)?Math.round(o.x.kidemNet):0;
  const hesI=o.kod.ihbar?Math.round(o.x.ihbarNet):0;
  const hesZ=Math.round(o.izinUcret||0);
  const elleK=+c.elleKidem>0,elleI=+c.elleIhbar>0,elleZ=+c.elleIzin>0;
  return {kidem:elleK?Math.round(+c.elleKidem):hesK, ihbar:elleI?Math.round(+c.elleIhbar):hesI, izin:elleZ?Math.round(+c.elleIzin):hesZ,
    hesK,hesI,hesZ,elleK,elleI,elleZ, elleVar:elleK||elleI||elleZ};
}

function cikisAdimSet(id,k,v){const c=DB.cikisSurec.find(x=>x.id===id);if(!c)return;c.adimlar=c.adimlar||{};c.adimlar[k]=v;saveDB();}
function cikisImzaSet(id,k,v){const c=DB.cikisSurec.find(x=>x.id===id);if(!c)return;c.imzalar=c.imzalar||{};c.imzalar[k]=v;saveDB();}
function cikisEvrakBas(surecId,sablonId){
  const c=DB.cikisSurec.find(x=>x.id===surecId);const s=DB.sablonlar.find(x=>x.id===sablonId);
  const p=c&&DB.personeller.find(x=>x.id===c.personelId);
  if(!c||!s||!p){toast('Kayıt bulunamadı');return;}
  const o=c.cikisKodu?cikisHakOzet(p,c.cikisKodu,c.tarih):null;
  // İhbar tarihleri: önelli süreçte snapshot'tan (ihbarBilgi), yoksa boş (ihbarsız çıkışta öneli yok)
  const ib=c.ihbarBilgi;
  const ihExtra=ib?{ihbar_hafta:ib.hafta,ihbar_gun:ib.ihbarGun,ihbar_baslangic:fmtDate(ib.baslangic),ihbar_bitis:fmtDate(ib.bitis),calisilan_gun:ib.calisilanGun,is_arama_saat:ib.isAramaSaat,is_arama_gun:ib.topluGun,son_calisma:fmtDate(ib.sonCalisma),fesih_eden:ib.fesihEden==='isveren'?'İşveren':'İşçi'}
    :{ihbar_hafta:'—',ihbar_gun:'—',ihbar_baslangic:'—',ihbar_bitis:'—',calisilan_gun:'—',is_arama_saat:'—',is_arama_gun:'—',son_calisma:'—',fesih_eden:'—'};
  const para=v=>o&&v>0?fmtTL(Math.round(v)):'____________';
  // İbraname imza tarihi: TBK m.420 gereği fesihten en az 1 ay sonra — otomatik +1 ay +1 gün
  const ibraD=parseISO(c.tarih||todayISO());ibraD.setMonth(ibraD.getMonth()+1);ibraD.setDate(ibraD.getDate()+1);
  const ibraISO=ibraD.getFullYear()+'-'+String(ibraD.getMonth()+1).padStart(2,'0')+'-'+String(ibraD.getDate()).padStart(2,'0');
  // İmza tarihi ({{bugun}} override):
  //  • Fesih bildirimi (cx_fesih_onelli) → ihbar önelinin BAŞLADIĞI gün tebliğ edilir (ib.baslangic).
  //  • Diğer çıkış evrakları → önelli çıkışta SON ÇALIŞMA GÜNÜ imzalanır; ihbarsız/immediate çıkışta ayrılış günü.
  //  • İbraname bundan etkilenmez (kendi ibra_tarihi'ni kullanır: ayrılış + 1 ay).
  const fesihBildirimMi=sablonId==='cx_fesih_onelli';
  const imzaISO=(fesihBildirimMi&&ib&&ib.baslangic)?ib.baslangic:((ib&&ib.sonCalisma)?ib.sonCalisma:(c.tarih||todayISO()));
  const extra={bugun:fmtDate(imzaISO),cikis_tarihi:fmtDate(c.tarih||todayISO()),cikis_kodu:c.cikisKodu||'____',cikis_kodu_adi:o?o.kod.l:'',ibra_tarihi:fmtDate(ibraISO),
    fesih_sebep:(c.sebep||'').trim()||'______________________________________________',
    devamsiz_gunler:(c.sebep||'').trim()||'____________________',
    kidem_net:o?(c.elleKidem>0?fmtTL(Math.round(c.elleKidem)):(o.kod.kidem&&o.x.kidemHak?para(o.x.kidemNet):'—')):'—',
    ihbar_net:o?(c.elleIhbar>0?fmtTL(Math.round(c.elleIhbar)):(o.kod.ihbar?para(o.x.ihbarNet):'—')):'—',
    izin_ucret:o?(c.elleIzin>0?fmtTL(Math.round(c.elleIzin)):para(o.izinUcret)):'____________',kalan_izin:o?Math.max(0,o.kalan):'____',
    kidem_suresi:o?o.x.kidemMetin:kidemMetin(p.iseGiris,c.tarih||todayISO()),
    ...ihExtra};
  printFilled([{p,s,extra}]);
}
function cikisTamamla(id){
  const c=DB.cikisSurec.find(x=>x.id===id);if(!c)return;
  const p=DB.personeller.find(x=>x.id===c.personelId);if(!p)return;
  if(!c.cikisKodu){toast('Önce SGK çıkış kodunu seçin');return;}
  // Kontrol listeleri TAM işaretlenmeden çıkış tamamlanamaz (Hayır da bir cevaptır — boş bırakılamaz)
  const eksikA=cikisAdimlari(c.cikisKodu).filter(a=>!(c.adimlar&&c.adimlar[a.k]));
  const eksikI=CIKIS_IMZA.filter(a=>!(c.imzalar&&c.imzalar[a.k]));
  if(eksikA.length||eksikI.length){
    toast('Kontrol listesi tamamlanmadı — işaretlenmemiş '+(eksikA.length+eksikI.length)+' madde var (Yapılacaklar: '+eksikA.length+', İmza & Teslim: '+eksikI.length+')');
    return;
  }
  const o=c.cikisKodu?cikisHakOzet(p,c.cikisKodu,c.tarih):null;
  const ef=o?cikisEfektif(c,o):null;
  const zatenVar=ef&&DB.tazminatOdeme.some(x=>x.personelId===p.id&&x.tarih===(c.tarih||todayISO()));
  const odeNot=ef&&(ef.kidem>0||ef.ihbar>0||ef.izin>0)?`<div class="ihbar-box" style="margin-bottom:12px">${zatenVar?'<b style="color:var(--amber-700)">Bu personel ve tarih için tazminat ödemesi zaten var</b> — yenisi eklenmeyecek (mükerrer olmasın). Tazminat ekranından düzenleyebilirsiniz.':`<b>Rapora işlenecek tazminat ödemesi:</b><br>Kıdem <b>${ef.kidem>0?fmtTL(ef.kidem):'—'}</b> · İhbar <b>${ef.ihbar>0?fmtTL(ef.ihbar):'—'}</b>${ef.izin>0?` · Yıllık İzin <b>${fmtTL(ef.izin)}</b>`:''}<br><span style="font-size:11.5px;color:${ef.elleVar?'var(--green-700)':'var(--amber-700)'}">${ef.elleVar?'Bordro programı (kesin) tutarı kullanılıyor.':'Kesin tutar girilmedi — hesaplanan (tahmini) tutar kaydedilecek.'}</span>`}</div>`:'';
  document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div class="modal-hd"><h3>Çıkışı Tamamla — ${esc(p.ad)}</h3><button class="xbtn" onclick="closeModal()">×</button></div>
    <div class="modal-bd">
      <div class="helptext" style="margin-bottom:12px">${esc(p.ad)}, <b>${fmtDate(c.tarih||todayISO())}</b> tarihi ve <b>${esc(c.cikisKodu)}</b> koduyla işten çıkarılıp <b>arşive</b> taşınacak. Bu işlem süreç kaydına tamamlayan bilgisiyle birlikte yazılır.</div>
      ${odeNot}
      <div class="fld"><label>Süreci Tamamlayan (Ad Soyad)</label><input id="cs_tamamlayan" placeholder="Örn. İsmail İzbudak" value="${esc(c.tamamlayan||'')}"></div>
    </div>
    <div class="modal-ft"><button class="btn" onclick="closeModal()">Vazgeç</button><button class="btn btn-pri" onclick="cikisTamamlaKaydet('${id}')">✓ Onayla ve Arşivle</button></div></div></div>`;
  setTimeout(()=>{const e=document.getElementById('cs_tamamlayan');if(e)e.focus();},30);
}
function cikisTamamlaKaydet(id){
  const c=DB.cikisSurec.find(x=>x.id===id);if(!c)return;
  const p=DB.personeller.find(x=>x.id===c.personelId);if(!p)return;
  const kim=document.getElementById('cs_tamamlayan').value.trim();
  if(!kim){toast('Tamamlayan ad soyad girin');return;}
  p.durum='ayrildi';p.ayrilisTarihi=c.tarih||todayISO();p.cikisKodu=c.cikisKodu;
  c.durum='tamam';c.tamamTarihi=todayISO();c.tamamlayan=kim;cikisAktifId=null;
  // Tazminat ödemesini raporlara işle: elle (bordro) tutar varsa o, yoksa hesaplanan. Mükerrer koruması: aynı personel+tarih varsa ekleme.
  if(c.cikisKodu&&!c.tazminatOdemeId){
    const o=cikisHakOzet(p,c.cikisKodu,c.tarih);const ef=cikisEfektif(c,o);const tr=p.ayrilisTarihi;
    if((ef.kidem>0||ef.ihbar>0||ef.izin>0)&&!DB.tazminatOdeme.some(x=>x.personelId===p.id&&x.tarih===tr)){
      const od={id:uid('to'),personelId:p.id,tarih:tr,kidem:ef.kidem,ihbar:ef.ihbar,izin:ef.izin,kaynak:'cikis',aciklama:'Çıkış sürecinden'+(ef.elleVar?' (bordro tutarı elle girildi)':' (hesaplanan)')};
      DB.tazminatOdeme.push(od);c.tazminatOdemeId=od.id;
    }
  }
  saveDB();closeModal();render();toast(p.ad+' arşive taşındı — çıkış süreci tamamlandı');
}
// Arşivden: tamamlanmış çıkış sürecini salt-okunur görüntüle (ne zaman, kim, hangi işaretlerle)

  const ikon=v=>v==='evet'?'<span style="color:var(--green-700)">✓ Evet</span>':v==='hayir'?'<span style="color:var(--red-700)">✗ Hayır</span>':v==='yok'?'<span style="color:var(--slate-400)">— Yok</span>':'<span style="color:var(--slate-300)">?</span>';
  const satir=(l,v)=>`<div style="display:flex;gap:10px;padding:4px 0;border-bottom:1px solid var(--slate-100);font-size:12.5px"><div style="flex:1">${l}</div><div style="white-space:nowrap">${ikon(v)}</div></div>`;

    <div class="modal-bd">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px">
        <div style="background:var(--slate-50);border:1px solid var(--slate-200);border-radius:9px;padding:9px 12px"><div style="font-size:10px;font-weight:700;color:var(--slate-500)">ÇIKIŞ TARİHİ</div><div style="font-weight:700">${fmtDate(c.tarih)}</div></div>
        <div style="background:var(--slate-50);border:1px solid var(--slate-200);border-radius:9px;padding:9px 12px"><div style="font-size:10px;font-weight:700;color:var(--slate-500)">SGK KODU</div><div style="font-weight:700">${esc(c.cikisKodu)} <span style="font-weight:400;font-size:11px">${esc((sgkKod(c.cikisKodu)||{}).l||'')}</span></div></div>
        <div style="background:var(--slate-50);border:1px solid var(--slate-200);border-radius:9px;padding:9px 12px"><div style="font-size:10px;font-weight:700;color:var(--slate-500)">TAMAMLANMA</div><div style="font-weight:700">${fmtDate(c.tamamTarihi)}</div></div>
        <div style="background:var(--slate-50);border:1px solid var(--slate-200);border-radius:9px;padding:9px 12px"><div style="font-size:10px;font-weight:700;color:var(--slate-500)">TAMAMLAYAN</div><div style="font-weight:700">${esc(c.tamamlayan||'—')}</div></div>
      </div>
      ${c.sebep?`<div class="helptext" style="margin-bottom:12px"><b>Sebep:</b> ${esc(c.sebep)}</div>`:''}
      <div style="font-size:12.5px;font-weight:700;color:var(--red-700);margin:6px 0">YAPILACAKLAR — KOD ${esc(c.cikisKodu)}</div>
      ${cikisAdimlari(c.cikisKodu).map(a=>satir(a.l,(c.adimlar||{})[a.k])).join('')}
      <div style="font-size:12.5px;font-weight:700;color:var(--red-700);margin:14px 0 6px">İMZA & TESLİM</div>
      ${CIKIS_IMZA.map(a=>satir(a.l,(c.imzalar||{})[a.k])).join('')}
    </div>
    <div class="modal-ft"><button class="btn btn-pri" onclick="closeModal()">Kapat</button></div></div></div>`;
}
function cikisSurecSil(id){
  const c=DB.cikisSurec.find(x=>x.id===id);if(!c)return;
  if(!confirm('Bu çıkış süreci kaydı silinecek (personele dokunulmaz). Emin misiniz?'))return;
  DB.cikisSurec=DB.cikisSurec.filter(x=>x.id!==id);if(cikisAktifId===id)cikisAktifId=null;
  saveDB();render();toast('Süreç kaydı silindi');
}

function pdfBtn(link){const u=safeLink(link);return u?`<a class="pdfbtn" href="${esc(u)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>Aç</a>`:'<span style="color:var(--slate-400);font-size:11px">link yok</span>'}
function renderBelge(bolum){
  const cfg=BELGE_BOLUM[bolum];const list=DB.belgeler.filter(b=>b.bolum===bolum);
  let h=`<p class="intro">${cfg.intro}</p>`;
  if(bolum==='kabul')h+=waPanel(list);
  if(bolum==='cikis'){ // olay akışı: önce ihbar öneli (varsa), sonra çıkış süreci
    h+=ihbarPanel()+cikisSurecPanel();
    document.getElementById('content').innerHTML=h;return;
  }
  h+=`<div class="card"><div class="card-hd"><h3>${cfg.title}</h3><span class="hint">${list.length} belge</span></div>`;
  if(!list.length){h+=`<div class="empty">Henüz belge yok. Sağ üstten <b>+ Belge / Şablon</b> ekleyin.<br><span style="font-size:11.5px">Şablonu Drive'a yükleyip paylaşım linkini yapıştırın.</span></div></div>`;document.getElementById('content').innerHTML=h;return;}
  h+=`<div class="tbl-scroll"><table class="t"><thead><tr><th>Başlık</th><th>Açıklama</th><th>Tarih</th><th>PDF</th><th></th></tr></thead><tbody>`;
  [...list].sort((a,b)=>(b.tarih||'').localeCompare(a.tarih||'')).forEach(b=>{h+=`<tr>
    <td><b>${esc(b.baslik||'—')}</b></td><td style="color:var(--slate-600)">${esc(b.aciklama||'')}</td>
    <td class="num">${b.tarih?fmtDate(b.tarih):'—'}</td><td>${pdfBtn(b.link)}</td>
    <td><div class="rowact"><button class="iconbtn" onclick="openBelge('${bolum}','${b.id}')" title="Düzenle"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg></button><button class="iconbtn del" onclick="delBelge('${b.id}')" title="Sil"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button></div></td></tr>`;});
  h+=`</tbody></table></div></div>`;
  document.getElementById('content').innerHTML=h;
}
function openBelge(bolum,id){
  const b=id?DB.belgeler.find(x=>x.id===id):{bolum,baslik:'',aciklama:'',link:'',tarih:todayISO()};
  if(!b)return;editId=id||null;
  document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div class="modal-hd"><h3>${id?'Belge Düzenle':'Yeni Belge / Şablon'}</h3><button class="xbtn" onclick="closeModal()">×</button></div>
    <div class="modal-bd">
      <div class="fld"><label>Başlık</label><input id="b_baslik" value="${esc(b.baslik||'')}" placeholder="Örn. İş Başvuru Formu"></div>
      <div class="fld"><label>Açıklama</label><input id="b_aciklama" value="${esc(b.aciklama||'')}" placeholder="İsteğe bağlı"></div>
      <div class="fld-row"><div class="fld"><label>PDF Linki (Drive vb.)</label><input id="b_link" value="${esc(b.link||'')}" placeholder="https://drive.google.com/..."></div><div class="fld"><label>Tarih</label><input type="date" id="b_tarih" value="${esc(b.tarih||todayISO())}"></div></div>
    </div>
    <div class="modal-ft"><button class="btn" onclick="closeModal()">Vazgeç</button><button class="btn btn-pri" onclick="saveBelge('${bolum}')">Kaydet</button></div>
  </div></div>`;
  setTimeout(()=>document.getElementById('b_baslik').focus(),30);
}
function saveBelge(bolum){
  const g=id=>document.getElementById(id).value.trim();
  const o={bolum,baslik:g('b_baslik'),aciklama:g('b_aciklama'),link:safeLink(g('b_link')),tarih:g('b_tarih')};
  if(!o.baslik&&!o.link){toast('Başlık veya link girin');return}
  if(editId)Object.assign(DB.belgeler.find(x=>x.id===editId),o);else DB.belgeler.push({id:uid('b'),...o});
  saveDB();closeModal();render();toast('Belge kaydedildi');
}
function delBelge(id){const b=DB.belgeler.find(x=>x.id===id);if(!b)return;if(!confirm('"'+(b.baslik||'')+'" silinsin mi?'))return;DB.belgeler=DB.belgeler.filter(x=>x.id!==id);saveDB();render();toast('Silindi');}

}
function openIhbarHesap(pid){

  document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">

      <div class="fld-row3">

        <div class="fld"><label>SGK Çıkış Kodu</label><select id="ihbar_kod">${sgkKodOpts('04',{taraf:'isveren',onel:true})}</select></div>

function ihbarHesapGoster(){
  ihbarKodGuncelle(); // kod listesini (deneme/taraf) senkronla
  const p=DB.personeller.find(x=>x.id===document.getElementById('ihbar_pers').value);
  const box=document.getElementById('ihbar_sonuc');if(!p)return;
  const btn=document.getElementById('ihbar_baslatBtn');
  if(!p.iseGiris){box.innerHTML=`<div style="background:var(--red-50);border:1px solid #fecaca;color:var(--red-700);border-radius:9px;padding:12px;font-size:12.5px">Bu personelin <b>işe giriş tarihi</b> girilmemiş. Personeller bölümünden ekleyin; ihbar süresi kıdemden hesaplanır.</div>`;return;}
  const r=ihbarHesapla(p.iseGiris,document.getElementById('ihbar_tarih').value,ihbarKesintiGun(p,document.getElementById('ihbar_tarih').value),haftaTatiliGunleri(p));
  if(r.deneme){
    if(btn)btn.textContent='Deneme Çıkışı Başlat →';
    box.innerHTML=`<div style="background:var(--amber-50);border:1px solid #f3c969;border-radius:9px;padding:12px 14px;font-size:12.5px;color:var(--amber-700)"><b>Deneme süresi (≤2 ay · kıdem ${r.kidem})</b> — 4857 sayılı Kanun m.15: taraflar iş sözleşmesini <b>bildirimsiz (ihbarsız) ve tazminatsız</b> feshedebilir. İhbar süresi ve ihbar tazminatı <b>yoktur</b>; çıkış aynı gün yapılır (ertesi gün gelinmeyebilir). SGK kodu: işveren <b>01</b> / işçi <b>02</b>.</div>`;
    return;
  }
  if(btn)btn.textContent='İhbar Öneli Başlat →';
  const toplu=((document.getElementById('ihbar_arama')||{}).value||'toplu')!=='gunluk';
  const sonCalisma=toplu?r.sonCalismaToplu:r.bitis; // günlük kullanımda süre sonuna kadar çalışır
  const cell=(l,v,c)=>`<div style="background:var(--slate-50);border:1px solid var(--slate-200);border-radius:9px;padding:11px 13px"><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--slate-500)">${l}</div><div style="font-size:16px;font-weight:700;margin-top:3px;${c||''}">${v}</div></div>`;
  box.innerHTML=`<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">
    ${cell('Kıdem',r.kidem+' <span style=\"font-size:11px;color:var(--slate-400)\">('+r.ay+' ay)</span>')}
    ${cell('İhbar Süresi',r.hafta+' hafta <span style=\"font-size:11px;color:var(--slate-400)\">('+r.ihbarGun+' gün)</span>','color:var(--blue-700)')}
    ${cell('Ayrılış / Sözleşme Sona Erme',fmtDate(r.bitis),'color:var(--red-700)')}
    ${cell('İş Arama İzni',toplu?(r.topluGun+' gün toplu <span style=\"font-size:11px;color:var(--slate-400)\">('+r.calisilanGun+' gün × 2 = '+r.isAramaSaat+' saat ÷ 7,5)</span>'):(r.isAramaSaat+' saat <span style=\"font-size:11px;color:var(--slate-400)\">(günlük 2 saat)</span>'),'color:var(--green-700)')}
    ${cell('En Son Çalışma Günü',fmtDate(sonCalisma)+' <span style=\"font-size:11px;color:var(--slate-400)\">(evrak imza + checklist bu gün)</span>','color:var(--green-700)')}
  </div>`;
}

// SGK kod listesini fesih eden + deneme durumuna göre YENİDEN KUR.
// Deneme (≤2 ay): işveren→01, işçi→02 (deneme feshi). Normal: işçi→03, işveren→geçerli fesih kodları.
// Mevcut seçim yeni listede varsa korunur, yoksa varsayılana döner.
function ihbarKodGuncelle(){
  const persEl=document.getElementById('ihbar_pers'),edenEl=document.getElementById('ihbar_eden'),kod=document.getElementById('ihbar_kod'),tarihEl=document.getElementById('ihbar_tarih');
  if(!edenEl||!kod)return;
  const t=edenEl.value;
  const p=persEl&&DB.personeller.find(x=>x.id===persEl.value);
  const deneme=!!(p&&p.iseGiris&&denemeMi(p.iseGiris,(tarihEl&&tarihEl.value)||todayISO()));
  const eski=kod.value;
  const def=deneme?(t==='isci'?'02':'01'):(t==='isci'?'03':'04');
  kod.innerHTML=sgkKodOpts(def,deneme?{taraf:t,deneme:true}:{taraf:t,onel:true});
  kod.value=[...kod.options].some(o=>o.value&&o.value===eski)?eski:def;
}
function ihbarEdenChange(){ihbarHesapGoster();}
// İhbar önelini başlat: personeli "İhbar Süresinde" yap + çıkış sürecini ayrılış/kod ile otomatik hazırla
function ihbarOnelBaslat(){
  const p=DB.personeller.find(x=>x.id===document.getElementById('ihbar_pers').value);
  if(!p){toast('Personel seçin');return;}
  if(!p.iseGiris){toast('İşe giriş tarihi yok — ihbar süresi hesaplanamaz');return;}
  const fesihTarih=document.getElementById('ihbar_tarih').value;
  if(!fesihTarih){toast('Fesih bildirim tarihi girin');return;}
  const eden=document.getElementById('ihbar_eden').value;
  const toplu=(document.getElementById('ihbar_arama').value||'toplu')!=='gunluk';
  const kod=document.getElementById('ihbar_kod').value;
  if(!kod){toast('SGK çıkış kodunu seçin');return;}
  const kodObj=sgkKod(kod);
  if(!kodObj||kodObj.taraf!==eden){toast('SGK kodu fesih eden ile uyumsuz — '+(eden==='isci'?'işçi':'işveren')+' feshine ait bir kod seçin');return;}
  const r=ihbarHesapla(p.iseGiris,fesihTarih,ihbarKesintiGun(p,fesihTarih),haftaTatiliGunleri(p));
  const deneme=!!r.deneme;
  if(deneme&&!kodObj.deneme){toast('Deneme süresinde SGK kodu 01 (işveren) / 02 (işçi) olmalı');return;}
  if(!deneme&&!kodObj.onel){toast('İhbar önelinde süreli/bildirimli fesih kodu seçilmeli');return;}
  const ayrilis=deneme?fesihTarih:r.bitis;const sonCalisma=deneme?fesihTarih:(toplu?r.sonCalismaToplu:r.bitis);
  const ozet=deneme
    ?p.ad+' — DENEME SÜRESİ ÇIKIŞI:\n\n• Bildirimsiz/tazminatsız fesih (4857/15)\n• Ayrılış (SGK çıkış): '+fmtDate(ayrilis)+'\n• SGK kodu: '+kod+'\n\nÇıkış süreci hazırlanacak. Onaylıyor musunuz?'
    :p.ad+' — İHBAR ÖNELİ BAŞLATILACAK:\n\n• Fesih bildirim: '+fmtDate(fesihTarih)+'\n• Ayrılış (SGK çıkış): '+fmtDate(ayrilis)+'\n• Son çalışma günü: '+fmtDate(sonCalisma)+'\n• SGK kodu: '+kod+'\n\nPersonel "İhbar Süresinde" olacak ve çıkış süreci hazırlanacak. Onaylıyor musunuz?';
  if(!confirm(ozet))return;
  // 1) Personel kartı — deneme bildirimsiz olduğu için "İhbar Süresinde" olmaz (aktif kalır, çıkış tamamlanınca ayrılır)
  if(!deneme){p.durum='ihbar';p.ihbarBaslangic=fesihTarih;p.ihbarToplu=toplu;}
  // 2) Çıkış süreci — bu personel için devam eden süreç varsa GÜNCELLE (mükerrer oluşturma)
  let c=DB.cikisSurec.find(x=>x.personelId===p.id&&x.durum==='devam');
  if(!c){c={id:uid('cs'),personelId:p.id,adimlar:{},imzalar:{},durum:'devam',olusturma:todayISO()};DB.cikisSurec.push(c);}
  c.tarih=ayrilis;c.cikisKodu=kod;
  c.ihbarBilgi={fesihEden:eden,baslangic:fesihTarih,bitis:ayrilis,sonCalisma,toplu,deneme,hafta:r.hafta,ihbarGun:r.ihbarGun,isAramaSaat:r.isAramaSaat,topluGun:r.topluGun,calisilanGun:r.calisilanGun};
  cikisAktifId=c.id;
  saveDB();closeModal();go('cikis');toast(p.ad+(deneme?' — deneme çıkışı hazırlandı':' — ihbar öneli başlatıldı, çıkış süreci hazır'));
}
// İhbar önelini iptal et: personeli aktife döndür, çıkış sürecindeki ihbar bağını kaldır (checklist korunur)
function ihbarOnelIptal(surecId){
  const c=DB.cikisSurec.find(x=>x.id===surecId);if(!c)return;
  const p=DB.personeller.find(x=>x.id===c.personelId);
  if(!confirm((p?p.ad+' — ':'')+'İhbar öneli İPTAL edilecek: personel "Aktif"e dönecek, çıkış sürecindeki ihbar bağı kaldırılacak (kontrol listesi işaretleri korunur). Onaylıyor musunuz?'))return;
  if(p){p.durum='aktif';p.ihbarBaslangic='';p.ihbarToplu=false;}
  delete c.ihbarBilgi;
  saveDB();render();toast('İhbar öneli iptal edildi');
}

// ============ İZİN & AVANS (iskelet) ============
function yilSecenekleri(sel){sel=sel||izinYil;const c=new Date().getFullYear();let o='';for(let y=c+1;y>=c-4;y--)o+=`<option value="${y}" ${y===sel?'selected':''}>${y}</option>`;return o;}
function getBakiye(pid,yil){const b=(DB.izinBakiye||[]).find(x=>x.personelId===pid&&+x.yil===+yil);return b||{personelId:pid,yil,devir:0,hakEdilen:''};}
function izinKayitlari(pid,yil){return DB.izinler.filter(z=>z.personelId===pid&&(yil==null||(z.baslangic||'').slice(0,4)===String(yil)));}
function izinStat(p,yil){
  const kayit=izinKayitlari(p.id,yil);
  const sum=(pred,birim)=>kayit.filter(pred).reduce((s,z)=>s+(+(birim==='saat'?z.saat:z.gun)||0),0);
  const yillikKullanilan=sum(z=>z.tur==='yillik','gün');
  const ucretsizGun=sum(z=>z.tur==='ucretsiz','gün');
  const ucretsizSaat=sum(z=>z.tur==='ucretsiz_saat','saat');
  const devamsizlikGun=sum(z=>z.tur==='devamsizlik','gün');
  const mazeretGun=sum(z=>izinTur(z.tur).mazeret,'gün');
  const serbestSaat=sum(z=>z.tur==='serbest_zaman','saat');
  const raporGun=sum(z=>z.tur==='raporlu','gün');
  const bk=getBakiye(p.id,yil);
  const devir=+bk.devir||0;
  const hak=(bk.hakEdilen!==''&&bk.hakEdilen!=null)?+bk.hakEdilen:yillikHakGun(izinBaslangicISO(p,yil+'-12-31'),p.dogum,yil+'-12-31');
  const hakOto=(bk.hakEdilen===''||bk.hakEdilen==null);
  const kalan=devir+hak-yillikKullanilan;
  return {yillikKullanilan,ucretsizGun,ucretsizSaat,devamsizlikGun,mazeretGun,serbestSaat,raporGun,devir,hak,hakOto,kalan,kayit};
}
function renderIzin(){

// ============ RAPOR TAKİBİ (istirahat raporları) ============
// İzin DEĞİL — ayrı ekran. Depoda DB.izinler içinde tur:'raporlu' olarak durur ki puantajdaki R,
// devam primi temiz-ay kontrolü ve prim orantılaması olduğu gibi çalışsın. İmzalatılacak belge yok.
// ---- SGK bildirim takibi ----
// İş günü ekle (hafta sonu + resmi tatil hariç; arife yarım gün SAYILIR). İş kazası: olayı izleyen günden 3 iş günü.
function isGunuSonra(iso,n){const d=parseISO(iso);if(!d)return iso;let c=0;
  while(c<n){d.setDate(d.getDate()+1);const wd=d.getDay();if(wd===0||wd===6)continue;
    const rt=pzResmi(d.getFullYear(),d.getMonth()+1,d.getDate());if(rt&&!/Arife/.test(rt))continue;c++;}
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
// Rapor (çalışmadığına dair bildirim): istirahatin bittiği ayı izleyen ayın APHB/MUHSGK son günü (26'sı).
function raporSgkSonTarih(z){const b=(z.bitis||z.baslangic||'').slice(0,7);if(!/^\d{4}-\d{2}$/.test(b))return null;
  let [y,m]=b.split('-').map(Number);m++;if(m>12){m=1;y++;}return y+'-'+String(m).padStart(2,'0')+'-26';}
// SGK bildirimi bekleyenler: iş kazaları (hemen) + BİTMİŞ istirahat raporları. Bildirilenler (sgkBildirim dolu) hariç.
function sgkBekleyen(){const bugun=todayISO();const out=[];
  (DB.isKazalari||[]).forEach(k=>{if(k.sgkBildirim)return;out.push({tip:'kaza',id:k.id,ad:rpAd(k.personelId),donem:k.tarih?fmtDate(k.tarih):'—',son:k.tarih?isGunuSonra(k.tarih,3):null,turEt:'İş Kazası Bildirimi'});});
  (DB.izinler||[]).forEach(z=>{if(z.tur!=='raporlu'||z.sgkBildirim)return;const bit=z.bitis||z.baslangic;if(!bit||bugun<=bit)return;

function raporOnizleme(){
  const box=document.getElementById('r_onizleme');if(!box)return;
  const b=document.getElementById('r_bas').value,e=document.getElementById('r_bit').value||b;
  const p=DB.personeller.find(x=>x.id===document.getElementById('r_pers').value);

  const aylar={};
  for(let dt=new Date(b+'T00:00:00'),son=new Date(e+'T00:00:00');dt<=son;dt.setDate(dt.getDate()+1)){
    const ym=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');
    (aylar[ym]=aylar[ym]||[]).push(dt.getDate());
  }
  const kaza=!!(document.getElementById('r_kaza')&&document.getElementById('r_kaza').checked);
  const KOD=kaza?'RK':'R';
  const rest=haftaTatiliGunleri(p);
  // Puantaj önceliği: ÇALIŞILDIYSA normal işlem (X/HÇ/TM) — rapor günü sayılmaz, SGK eksik gününe girmez.
  // Çalışılmadıysa rapor tatili EZER. R'yi ayrıca ezen: pasif gün + elle boyama.
  const gs0=Object.values(aylar).reduce((a,g)=>a+g.length,0);
  let tatil=0,ezilen=0,calisilan=0;
  const par=Object.entries(aylar).map(([ym,gs])=>{
    const info=pzAyBilgi(ym);
    const pasAy=pzPasifSet(p,info);
    const r=((DB.puantaj&&DB.puantaj[ym]&&DB.puantaj[ym].rows)||{})[p.id];
    gs.forEach(d=>{
      const wd=new Date(info.y,info.m-1,d).getDay();
      if(rest.has(wd)||pzResmi(info.y,info.m,d))tatil++;
      if(pasAy.has(d)||(r&&r.manuel&&r.manuel[d]))ezilen++;
      else if(r&&((r.saat&&r.saat[d])||pzMSaat(r,d)>0))calisilan++;
    });
    return `<b>${fmtYM(ym)}</b>: ${gs.length} gün (${gs[0]}–${gs[gs.length-1]})`;
  });
  let ek='';

function ymAdd(ym,n){let a=String(ym).split('-').map(Number);let y=a[0],m=a[1]-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+String(m+1).padStart(2,'0')}
function fmtYM(ym){if(!ym)return '';const a=String(ym).split('-').map(Number);return (AY_ADLARI[a[1]-1]||'')+' '+a[0]}
function avansAylik(a){const t=Math.max(1,+a.taksit||1);return Math.round((+a.tutar||0)/t)}
function avansAylar(a){const t=Math.max(1,+a.taksit||1);const out=[];if(!a.baslangicAy)return out;for(let i=0;i<t;i++)out.push(ymAdd(a.baslangicAy,i));return out}
// Eşit taksit planı — toplam tam avans tutarına eşit (son taksit yuvarlama farkını alır)
function esitTaksitPlani(tutar,taksit,basay){tutar=Math.round(+tutar||0);taksit=Math.max(1,+taksit||1);basay=basay||ymAdd(curYM(),1);const aylik=Math.floor(tutar/taksit);let kalan=tutar;const out=[];for(let i=0;i<taksit;i++){const t=(i===taksit-1)?kalan:aylik;out.push({ay:ymAdd(basay,i),tutar:t});kalan-=t;}return out;}
// Kesinti planı: elle girilmiş plan (a.kesintiler) varsa onu, yoksa eşit taksit planını döndürür
function avansKesintiList(a){if(Array.isArray(a.kesintiler))return a.kesintiler.filter(k=>k&&k.ay).map(k=>({ay:k.ay,tutar:+k.tutar||0})).sort((x,y)=>String(x.ay).localeCompare(String(y.ay)));return esitTaksitPlani(a.tutar,a.taksit,a.baslangicAy);}
function avansKesilen(a,ref){ref=ref||curYM();return avansKesintiList(a).filter(k=>String(k.ay)<=ref).reduce((s,k)=>s+(+k.tutar||0),0)}
function avansKalan(a){return Math.max(0,(+a.tutar||0)-avansKesilen(a))}
function avansBuAy(a){return avansKesintiList(a).filter(k=>String(k.ay)===curYM()).reduce((s,k)=>s+(+k.tutar||0),0)}
// ============ MAAŞ ARTIŞI — net manuel zam kaydı (talep→karar); aylık rapora yansır ============
// Kayıt: {id,personelId,tarih,oncekiNet,yeniNet,not,olusturma}. Maaşlar depoda BRÜT olduğu için burada NET elle girilir.
function maasArtisHesap(m){const o=+m.oncekiNet||0,y=+m.yeniNet||0,a=y-o;return {onceki:o,yeni:y,artim:a,yuzde:o>0?Math.round(a/o*1000)/10:0};}
function maasArtisFormLink(){return (DB.meta&&DB.meta.maasArtisFormLink)||'';}
function maasArtisFormKaydet(){const v=(document.getElementById('ma_form').value||'').trim();DB.meta=DB.meta||{};if(v)DB.meta.maasArtisFormLink=v;else delete DB.meta.maasArtisFormLink;saveDB();toast('Form bağlantısı kaydedildi');render();}
function renderMaasArtis(){
  const yil=DB.maasArtis.filter(m=>(m.tarih||'').slice(0,4)===String(maasArtisYil)).sort((a,b)=>(b.tarih||'').localeCompare(a.tarih||''));
  const toplamArtim=yil.reduce((s,m)=>s+maasArtisHesap(m).artim,0);
  const ortYuzde=yil.length?Math.round(yil.reduce((s,m)=>s+maasArtisHesap(m).yuzde,0)/yil.length*10)/10:0;
  const kisiSay=new Set(yil.map(m=>m.personelId)).size;
  const flink=maasArtisFormLink();
  let h=`<p class="intro">Personel maaş artış taleplerini ve kararlarını burada tutun. Maaşlar sistemde <b>brüt</b> tutulduğu için önceki ve yeni maaşı <b>net</b> olarak elle girin; <b>artım tutarı</b> ve <b>artış yüzdesi</b> otomatik hesaplanır. Bu kayıtlar <b>aylık rapora</b> yansır.</p>`;
  // Talep formu kartı
  h+=`<div class="card" style="margin-bottom:14px"><div class="card-hd"><h3>Maaş Artış Talep Formu</h3><span class="hint">personel doldurur, ilgiliye teslim edilir</span></div>
    <div style="padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <input id="ma_form" value="${esc(flink)}" placeholder="Form bağlantısı (Drive/PDF linki) — yapıştırın" style="flex:1;min-width:240px;padding:9px 11px;border:1px solid var(--slate-300);border-radius:9px;font-size:13px">
      <button class="btn btn-sm" onclick="maasArtisFormKaydet()">Kaydet</button>
      ${flink?`<a class="btn btn-sm btn-pri" href="${esc(safeLink(flink))}" target="_blank" rel="noopener" style="text-decoration:none">Formu Aç</a>`:''}
      <div style="flex-basis:100%;font-size:11px;color:var(--slate-500)">Antetli/yazdırılabilir talep formunu ilettiğinizde buraya doğrudan gömebiliriz.</div>
    </div></div>`;
  h+=`<div class="kpis">
    <div class="kpi"><div class="kl">${maasArtisYil} Artış Sayısı</div><div class="kv">${yil.length}</div><div class="ks">${kisiSay} personel</div></div>
    <div class="kpi g"><div class="kl">Toplam Artım</div><div class="kv" style="font-size:20px">${fmtTL(toplamArtim)}</div><div class="ks">net · yıl içi</div></div>
    <div class="kpi a"><div class="kl">Ortalama Artış</div><div class="kv">%${ortYuzde}</div><div class="ks">yıl içi kayıtlar</div></div>
  </div>`;
  h+=`<div class="card"><div class="card-hd"><h3>${maasArtisYil} — Maaş Artışları</h3><span class="hint">satıra tıkla → düzenle</span></div>
    <div class="tbl-scroll"><table class="t"><thead><tr><th>Personel</th><th>Bölüm</th><th class="num">Önceki (net)</th><th class="num">Yeni (net)</th><th class="num">Artım</th><th class="num">Artış %</th><th>Tarih</th><th></th></tr></thead><tbody>
    ${yil.map(m=>{const c=maasArtisHesap(m);const p=DB.personeller.find(x=>x.id===m.personelId);
      return `<tr style="cursor:pointer" onclick="openMaasArtis('${m.id}')">
        <td><b>${esc(p?p.ad:'—')}</b></td><td>${p?bolTag(p):'—'}</td>
        <td class="num">${fmtTL(c.onceki)}</td><td class="num"><b>${fmtTL(c.yeni)}</b></td>
        <td class="num" style="color:var(--green-700);font-weight:700">+${fmtTL(c.artim)}</td>
        <td class="num" style="color:var(--green-700)">%${c.yuzde}</td>
        <td>${fmtDate(m.tarih)}${m.not?` <span style="font-size:10px;color:var(--slate-400)" title="${esc(m.not)}">not</span>`:''}</td>
        <td class="num"><button class="iconbtn del" onclick="event.stopPropagation();delMaasArtis('${m.id}')"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button></td></tr>`;}).join('')||'<tr><td colspan="8" style="text-align:center;color:var(--slate-400);padding:18px">Bu yıl maaş artışı kaydı yok</td></tr>'}
  </tbody></table></div></div>`;
  document.getElementById('content').innerHTML=h;
}
function openMaasArtis(id){
  const m=id?DB.maasArtis.find(x=>x.id===id):{personelId:'',tarih:todayISO(),oncekiNet:'',yeniNet:'',not:''};
  if(!m)return;editId=id||null;
  const pOpts='<option value="">— Personel seçin —</option>'+DB.personeller.filter(p=>p.durum!=='ayrildi').sort((a,b)=>(a.ad||'').localeCompare(b.ad||'','tr')).map(p=>`<option value="${p.id}" ${m.personelId===p.id?'selected':''}>${esc(p.ad)}</option>`).join('');
  document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div class="modal-hd"><h3>${id?'Maaş Artışı Düzenle':'Yeni Maaş Artışı'}</h3><button class="xbtn" onclick="closeModal()">×</button></div>
    <div class="modal-bd">
      <div class="fld-row"><div class="fld"><label>Personel</label><select id="ma_pers">${pOpts}</select></div><div class="fld"><label>Karar / Yürürlük Tarihi</label><input type="date" id="ma_tarih" value="${esc(m.tarih||todayISO())}"></div></div>
      <div class="fld-row"><div class="fld"><label>Önceki Maaş — NET (₺)</label><div class="para"><input type="number" step="0.01" id="ma_onceki" value="${m.oncekiNet||''}" oninput="maasArtisOnizle()"></div></div><div class="fld"><label>Yeni Maaş — NET (₺)</label><div class="para"><input type="number" step="0.01" id="ma_yeni" value="${m.yeniNet||''}" oninput="maasArtisOnizle()"></div></div></div>
      <div class="ihbar-box" id="ma_onizle" style="margin:2px 0 12px"></div>
      <div class="fld"><label>Not <span style="font-weight:400;color:var(--slate-400);font-size:11px">(isteğe bağlı — talep gerekçesi, onaylayan vb.)</span></label><textarea id="ma_not" rows="2" placeholder="İsteğe bağlı">${esc(m.not||'')}</textarea></div>
    </div>
    <div class="modal-ft"><button class="btn" onclick="closeModal()">Vazgeç</button><button class="btn btn-pri" onclick="saveMaasArtis()">Kaydet</button></div>
  </div></div>`;
  maasArtisOnizle();
}
function maasArtisOnizle(){const o=parseFloat(String(document.getElementById('ma_onceki').value).replace(',','.'))||0,y=parseFloat(String(document.getElementById('ma_yeni').value).replace(',','.'))||0;
  const a=y-o,yuz=o>0?Math.round(a/o*1000)/10:0;const el=document.getElementById('ma_onizle');if(!el)return;
  if(!o&&!y){el.innerHTML='Önceki ve yeni net maaşı girin — artım tutarı ve yüzdesi burada görünecek.';return;}
  const renk=a>0?'var(--green-700)':a<0?'var(--red-700)':'var(--slate-600)';
  el.innerHTML=`Artım tutarı: <b style="color:${renk}">${a>0?'+':''}${fmtTL(a)}</b> &nbsp;·&nbsp; Artış oranı: <b style="color:${renk}">${a>0?'+':''}%${yuz}</b>`;}
function saveMaasArtis(){
  const g=id=>document.getElementById(id).value;
  const o={personelId:g('ma_pers'),tarih:g('ma_tarih'),oncekiNet:parseFloat(String(g('ma_onceki')).replace(',','.'))||0,yeniNet:parseFloat(String(g('ma_yeni')).replace(',','.'))||0,not:g('ma_not').trim()};
  if(!o.personelId){toast('Personel seçin');return}
  if(!o.yeniNet){toast('Yeni net maaşı girin');return}
  if(editId)Object.assign(DB.maasArtis.find(x=>x.id===editId),o);else DB.maasArtis.push({id:uid('ma'),olusturma:todayISO(),...o});
  saveDB();closeModal();render();toast('Maaş artışı kaydedildi');
}
function delMaasArtis(id){if(!confirm('Bu maaş artışı kaydı silinsin mi?'))return;DB.maasArtis=DB.maasArtis.filter(x=>x.id!==id);saveDB();render();toast('Silindi');}

function renderAvans(){
  const aktif=DB.personeller.filter(p=>p.durum!=='ayrildi');
  const yilAvans=DB.avanslar.filter(a=>(a.tarih||'').slice(0,4)===String(avansYil));
  const yilToplam=yilAvans.reduce((s,a)=>s+(+a.tutar||0),0);
  const acikBakiye=DB.avanslar.reduce((s,a)=>s+avansKalan(a),0);
  const buAyKesinti=DB.avanslar.reduce((s,a)=>s+avansBuAy(a),0);
  const avanslıPersonel=new Set(DB.avanslar.filter(a=>avansKalan(a)>0).map(a=>a.personelId)).size;
  let h=`<p class="intro">Personel avans taleplerini girin; tutarı kaç ayda ve hangi aydan itibaren kesileceğini belirtin. Kesilen/kalan ve aylık kesinti planı otomatik hesaplanır. Aşağıda yıl içi toplam ve tüm personel özeti yer alır.</p>`;
  h+=`<div class="kpis">
    <div class="kpi"><div class="kl">${avansYil} Verilen Avans</div><div class="kv">${fmtTL(yilToplam)}</div><div class="ks">${yilAvans.length} talep</div></div>
    <div class="kpi a"><div class="kl">Açık Bakiye (Kalan)</div><div class="kv">${fmtTL(acikBakiye)}</div><div class="ks">tüm avanslar</div></div>
    <div class="kpi g"><div class="kl">Bu Ay Kesilecek</div><div class="kv">${fmtTL(buAyKesinti)}</div><div class="ks">${fmtYM(curYM())}</div></div>
    <div class="kpi p"><div class="kl">Avanslı Personel</div><div class="kv">${avanslıPersonel}</div><div class="ks">açık borcu olan</div></div>
  </div>`;
  h+=`<div class="card"><div class="card-hd"><h3>Personel Bazında Avans Özeti · ${avansYil}</h3><span class="hint">satıra tıkla → detay & kesinti planı</span></div>`;
  // sadece avansı olan veya tüm aktif personel
  const rows=aktif.map(p=>{
    const ay=DB.avanslar.filter(a=>a.personelId===p.id);
    const yil=ay.filter(a=>(a.tarih||'').slice(0,4)===String(avansYil)).reduce((s,a)=>s+(+a.tutar||0),0);
    const kalan=ay.reduce((s,a)=>s+avansKalan(a),0);
    const buAy=ay.reduce((s,a)=>s+avansBuAy(a),0);
    return {p,yil,kalan,buAy,adet:ay.length};
  }).filter(r=>r.adet>0);
  if(!rows.length){h+=`<div class="empty">${aktif.length?'Henüz avans kaydı yok. Sağ üstten <b>+ Avans</b> ile ekleyin.':'Önce <b>Personeller</b> bölümünden personel ekleyin.'}</div></div>`;document.getElementById('content').innerHTML=h;return;}
  h+=`<div class="tbl-scroll"><table class="t"><thead><tr><th>Personel</th><th>Çalıştığı Bölüm</th><th class="num">Yıl İçi Avans</th><th class="num">Kalan Borç</th><th class="num">Bu Ay Kesinti</th><th class="num">Kayıt</th><th></th></tr></thead><tbody>`;
  rows.sort((a,b)=>b.kalan-a.kalan).forEach(r=>{h+=`<tr style="cursor:pointer" onclick="avansDetay('${r.p.id}')">
    <td><b>${esc(r.p.ad)}</b></td><td>${bolTag(r.p)}</td>
    <td class="num">${fmtTL(r.yil)}</td>
    <td class="num" style="font-weight:700;${r.kalan>0?'color:var(--amber-700)':'color:var(--green-700)'}">${fmtTL(r.kalan)}</td>
    <td class="num">${r.buAy?fmtTL(r.buAy):'—'}</td>
    <td class="num">${r.adet}</td>
    <td onclick="event.stopPropagation()"><div class="rowact"><button class="iconbtn" title="Avans ekle" onclick="openAvans('${r.p.id}')"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5v14"/></svg></button></div></td></tr>`;});
  h+=`</tbody></table></div></div>`;
  document.getElementById('content').innerHTML=h;
}
function openAvans(pid,id){
  const a=id?DB.avanslar.find(x=>x.id===id):{personelId:pid||'',tarih:todayISO(),tutar:'',taksit:1,baslangicAy:ymAdd(curYM(),1),aciklama:''};
  if(!a)return;editId=id||null;
  const pOpts=DB.personeller.filter(p=>p.durum!=='ayrildi').map(p=>`<option value="${p.id}" ${a.personelId===p.id?'selected':''}>${esc(p.ad)}</option>`).join('');
  let ayOpts='';for(let i=0;i<18;i++){const ym=ymAdd(curYM(),i);ayOpts+=`<option value="${ym}" ${a.baslangicAy===ym?'selected':''}>${fmtYM(ym)}</option>`;}
  document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div class="modal-hd"><h3>${id?'Avans Düzenle':'Yeni Avans'}</h3><button class="xbtn" onclick="closeModal()">×</button></div>
    <div class="modal-bd">
      <div class="fld-row"><div class="fld"><label>Personel</label><select id="a_pers">${pOpts}</select></div><div class="fld"><label>Talep Tarihi</label><input type="date" id="a_tarih" value="${esc(a.tarih||todayISO())}"></div></div>
      <div class="fld-row3">
        <div class="fld"><label>Avans Tutarı (TL)</label><div class="para"><input type="number" id="a_tutar" value="${a.tutar||''}" oninput="avansOnizle()"></div></div>
        <div class="fld"><label>Taksit (ay)</label><input type="number" id="a_taksit" value="${a.taksit||1}" min="1" oninput="avansOnizle()"></div>
        <div class="fld"><label>İlk Kesinti Ayı</label><select id="a_basay" onchange="avansOnizle()">${ayOpts}</select></div>
      </div>
      <div class="helptext" id="a_onizle"></div>
      <div class="fld" style="margin-top:12px"><label>Açıklama</label><input id="a_acik" value="${esc(a.aciklama||'')}" placeholder="İsteğe bağlı"></div>
    </div>
    <div class="modal-ft"><button class="btn" onclick="closeModal()">Vazgeç</button><button class="btn btn-pri" onclick="saveAvans()">Kaydet</button></div>
  </div></div>`;
  avansOnizle();
}
function avansOnizle(){
  const tutar=+document.getElementById('a_tutar').value||0;
  const taksit=Math.max(1,+document.getElementById('a_taksit').value||1);
  const basay=document.getElementById('a_basay').value;
  const aylik=Math.round(tutar/taksit);
  const aylar=[];for(let i=0;i<taksit;i++)aylar.push(fmtYM(ymAdd(basay,i)));
  document.getElementById('a_onizle').innerHTML=tutar?`Aylık kesinti <b>${fmtTL(aylik)}</b> · ${taksit} taksit · <b>${aylar[0]}</b>${taksit>1?` – <b>${aylar[aylar.length-1]}</b>`:''}`:'Tutar girin, kesinti planı burada görünecek.';
}
function saveAvans(){
  const g=id=>document.getElementById(id).value;
  const o={personelId:g('a_pers'),tarih:g('a_tarih'),tutar:+g('a_tutar')||0,taksit:Math.max(1,+g('a_taksit')||1),baslangicAy:g('a_basay'),aciklama:g('a_acik').trim()};
  if(!o.personelId){toast('Personel seçin');return}
  if(!o.tutar){toast('Tutar girin');return}
  if(editId)Object.assign(DB.avanslar.find(x=>x.id===editId),o);else DB.avanslar.push({id:uid('a'),...o});
  saveDB();closeModal();render();toast('Avans kaydedildi');
}
function delAvans(id){if(!confirm('Bu avans kaydı silinsin mi?'))return;const a=DB.avanslar.find(x=>x.id===id);DB.avanslar=DB.avanslar.filter(x=>x.id!==id);saveDB();if(a)avansDetay(a.personelId);render();toast('Silindi');}
function avansDetay(pid){
  const p=DB.personeller.find(x=>x.id===pid);if(!p)return;
  const list=[...DB.avanslar.filter(a=>a.personelId===pid)].sort((a,b)=>(b.tarih||'').localeCompare(a.tarih||''));
  const yilToplam=list.filter(a=>(a.tarih||'').slice(0,4)===String(avansYil)).reduce((s,a)=>s+(+a.tutar||0),0);
  const kalan=list.reduce((s,a)=>s+avansKalan(a),0);
  const cards=list.map(a=>{
    const plan=avansKesintiList(a),kes=avansKesilen(a),kal=avansKalan(a);
    const elle=Array.isArray(a.kesintiler);
    const planTop=plan.reduce((s,k)=>s+(+k.tutar||0),0);const fark=planTop-(+a.tutar||0);
    const chips=plan.length?plan.map(k=>{const odendi=String(k.ay)<=curYM();return `<span class="chip" style="${odendi?'background:var(--green-100);color:var(--green-700)':''}">${fmtYM(k.ay)} · ${fmtTL(k.tutar)}${odendi?' ✓':''}</span>`;}).join(''):'<span style="font-size:11.5px;color:var(--slate-400)">Kesinti planı boş</span>';
    return `<div style="border:1px solid var(--slate-200);border-radius:10px;padding:13px 15px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:start;gap:8px">
        <div><div style="font-size:15px;font-weight:700">${fmtTL(a.tutar)}</div><div style="font-size:11.5px;color:var(--slate-500)">Talep: ${fmtDate(a.tarih)} · ${a.taksit} taksit${a.aciklama?' · '+esc(a.aciklama):''}</div></div>
        <div style="display:flex;gap:4px">
          <button class="iconbtn" title="Düzenle" onclick="closeModal();openAvans(null,'${a.id}')"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg></button>
          <button class="iconbtn del" title="Sil" onclick="delAvans('${a.id}')"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>
        </div>
      </div>
      <div style="display:flex;gap:14px;font-size:12px;margin:9px 0;color:var(--slate-600)"><span>Kesilen: <b style="color:var(--green-700)">${fmtTL(kes)}</b></span><span>Kalan: <b style="color:${kal>0?'var(--amber-700)':'var(--green-700)'}">${fmtTL(kal)}</b></span></div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px">
        <span style="font-size:11px;color:var(--slate-500)">Kesinti Planı · ${elle?'<b style="color:var(--blue-700)">elle düzenlendi</b>':'eşit taksit'}${fark?` · <b style="color:var(--red-700)">plan ${fmtTL(planTop)} ≠ avans</b>`:''}</span>
        <button class="btn btn-sm" onclick="avansPlanDuzenle('${a.id}')">Planı Düzenle</button>
      </div>
      <div class="chips">${chips}</div>
    </div>`;
  }).join('');
  document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal lg">
